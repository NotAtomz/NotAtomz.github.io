// ── Skybox — inverted box, 6 MeshBasicMaterial faces, always works ────────────
// ── Skybox — manually selected pixel region ─────────────────────────────────

// Skybox-only exposure/brightness.
// 1.0 = original texture brightness
// 0.8 = slightly darker
// 0.6 = noticeably darker
const SKYBOX_BRIGHTNESS = 0.94;
let classicDefaultSkyBox = null;

function makeSkyFaceMat(
    img,
    point1,
    point2,
    point3,
    point4,
    rotation = 0
) {
    // Calculate crop bounds from the four points
    const left   = Math.min(point1.x, point2.x, point3.x, point4.x);
    const right  = Math.max(point1.x, point2.x, point3.x, point4.x);
    const top    = Math.min(point1.y, point2.y, point3.y, point4.y);
    const bottom = Math.max(point1.y, point2.y, point3.y, point4.y);

    const width = right - left;
    const height = bottom - top;

    const c = document.createElement("canvas");

    // Swap canvas dimensions for 90 / 270 rotations
    if (rotation === 90 || rotation === 270) {
        c.width = height;
        c.height = width;
    } else {
        c.width = width;
        c.height = height;
    }

    const ctx = c.getContext("2d");

    ctx.save();

    // Move origin to center
    ctx.translate(c.width / 2, c.height / 2);

    // Rotation
    ctx.rotate(THREE.MathUtils.degToRad(rotation));

    // Draw selected region
    ctx.drawImage(
        img,

        // Source rectangle
        left,
        top,
        width,
        height,

        // Destination rectangle
        -width / 2,
        -height / 2,
        width,
        height
    );

    ctx.restore();

    const tex = new THREE.CanvasTexture(c);

    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    return new THREE.MeshBasicMaterial({
        map: tex,

        // Multiply the sky texture by this value to simulate lower exposure
        // without changing the brightness of Parts, the player, or lighting.
        color: new THREE.Color().setScalar(SKYBOX_BRIGHTNESS),

        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        fog: false
    });
}

// ─── Classic always-visible moon ───────────────────────────────────────────────
//
// moon.jpg contains the actual moon image.
// moon-alpha.jpg is used as a luminance mask so the black square background is
// removed even though the custom raw-WebGL sprite renderer does not implement
// Three.js alphaMap.
//
// The moon is intentionally NOT faded by TimeOfDay/daylight. It remains visible
// during the day and night, like the requested classic sky decoration.
const CLASSIC_MOON_IMAGE_PATH =
    "Textures/Skybox/moon.jpg";

const CLASSIC_MOON_ALPHA_PATH =
    "Textures/Skybox/moon-alpha.jpg";

// The moon follows the camera's position so it always behaves like part of the
// infinitely distant sky, but its direction remains fixed in world space.
const CLASSIC_MOON_DISTANCE = 30000;

// Apparent angular size. At 30,000 studs this is roughly a 5-degree disc.
const CLASSIC_MOON_SIZE = 2600;

const CLASSIC_MOON_DIRECTION =
    new THREE.Vector3(
        -0.72,
         0.52,
        -0.45
    ).normalize();

let classicMoonSprite =
    null;

function loadClassicMoonSprite() {
    const moonImage =
        new Image();

    const moonAlphaImage =
        new Image();

    let moonReady =
        false;

    let alphaReady =
        false;

    const finish =
        () => {
            if (
                !moonReady ||
                !alphaReady ||
                classicMoonSprite
            ) {
                return;
            }

            const width =
                Math.max(
                    1,
                    moonImage.naturalWidth ||
                        moonImage.width ||
                        128
                );

            const height =
                Math.max(
                    1,
                    moonImage.naturalHeight ||
                        moonImage.height ||
                        128
                );

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                width;

            canvas.height =
                height;

            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );

            if (!ctx) {
                console.error(
                    "[Sky] Could not create moon mask canvas."
                );
                return;
            }

            // Draw the visible moon RGB first.
            ctx.clearRect(
                0,
                0,
                width,
                height
            );

            ctx.drawImage(
                moonImage,
                0,
                0,
                width,
                height
            );

            const moonPixels =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                );

            // Read the white-circle alpha mask separately.
            const maskCanvas =
                document.createElement(
                    "canvas"
                );

            maskCanvas.width =
                width;

            maskCanvas.height =
                height;

            const maskCtx =
                maskCanvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );

            if (!maskCtx) {
                console.error(
                    "[Sky] Could not create moon alpha canvas."
                );
                return;
            }

            maskCtx.drawImage(
                moonAlphaImage,
                0,
                0,
                width,
                height
            );

            const maskPixels =
                maskCtx.getImageData(
                    0,
                    0,
                    width,
                    height
                ).data;

            const pixels =
                moonPixels.data;

            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {
                // moon-alpha.jpg is grayscale. Average its channels, then remove
                // tiny JPEG-black noise while preserving the anti-aliased edge.
                const luminance =
                    (
                        maskPixels[i] +
                        maskPixels[i + 1] +
                        maskPixels[i + 2]
                    ) /
                    3;

                const normalized =
                    THREE.MathUtils.clamp(
                        (
                            luminance -
                            8
                        ) /
                        247,
                        0,
                        1
                    );

                pixels[i + 3] =
                    Math.round(
                        normalized *
                        255
                    );
            }

            ctx.putImageData(
                moonPixels,
                0,
                0
            );

            const texture =
                new THREE.CanvasTexture(
                    canvas
                );

            texture.colorSpace =
                THREE.SRGBColorSpace;

            texture.wrapS =
                THREE.ClampToEdgeWrapping;

            texture.wrapT =
                THREE.ClampToEdgeWrapping;

            texture.minFilter =
                THREE.LinearFilter;

            texture.magFilter =
                THREE.LinearFilter;

            texture.generateMipmaps =
                false;

            texture.needsUpdate =
                true;

            const material =
                new THREE.SpriteMaterial({
                    map:
                        texture,

                    color:
                        0xffffff,

                    transparent:
                        true,

                    opacity:
                        1,

                    depthTest:
                        false,

                    depthWrite:
                        false,

                    fog:
                        false
                });

            classicMoonSprite =
                new THREE.Sprite(
                    material
                );

            classicMoonSprite.name =
                "ClassicMoon";

            classicMoonSprite.scale.set(
                CLASSIC_MOON_SIZE,
                CLASSIC_MOON_SIZE,
                1
            );

            // Draw after either skybox (-2/-1) but before ordinary world geometry
            // (normally renderOrder 0), so world Parts can still cover the moon.
            classicMoonSprite.renderOrder =
                -0.5;

            classicMoonSprite.frustumCulled =
                false;

            scene.add(
                classicMoonSprite
            );

            updateClassicMoonPosition();

            console.log(
                "[Sky] Loaded always-visible classic moon."
            );
        };

    moonImage.onload =
        () => {
            moonReady =
                true;

            finish();
        };

    moonAlphaImage.onload =
        () => {
            alphaReady =
                true;

            finish();
        };

    moonImage.onerror =
        () =>
            console.error(
                "[Sky] Moon image failed:",
                CLASSIC_MOON_IMAGE_PATH
            );

    moonAlphaImage.onerror =
        () =>
            console.error(
                "[Sky] Moon alpha failed:",
                CLASSIC_MOON_ALPHA_PATH
            );

    moonImage.src =
        CLASSIC_MOON_IMAGE_PATH;

    moonAlphaImage.src =
        CLASSIC_MOON_ALPHA_PATH;
}

function updateClassicMoonPosition() {
    if (
        !classicMoonSprite
    ) {
        return;
    }

    classicMoonSprite.position
        .copy(
            camera.position
        )
        .addScaledVector(
            CLASSIC_MOON_DIRECTION,
            CLASSIC_MOON_DISTANCE
        );
}

scene.add(hemi);

// These Three light objects are compatibility/state containers for the existing
// Lighting service. They are NOT used to draw the scene; BloxClassicWebGLRenderer
// performs the actual dynamic lighting and player-only shadow pass.
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.castShadow = true;

sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 0;

// Shadow region follows the player, so these bounds are local to them.
// Slightly larger than before to keep long character shadows away from edges.
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

// Explicit clipping range for the directional-light shadow camera.
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 400;
sun.shadow.camera.updateProjectionMatrix();

sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.02;

scene.add(sun);

// DirectionalLight.target must be in the scene if we move it.
scene.add(sun.target);

// Editable sun angles — change these then call applySunAngles()
const sunConfig = {
    azimuth:   45,  // degrees, horizontal (0=+Z, 90=+X, 180=-Z, 270=-X)
    elevation: 50,  // degrees above horizon (0=horizon, 90=overhead)
};

// Keep the sun direction as a reusable normalized vector.
// The light and target will move together around the player, so lighting
// direction stays identical while the shadow camera follows gameplay.
const sunDirection =
    new THREE.Vector3();

function applySunAngles() {
    const az = THREE.MathUtils.degToRad(sunConfig.azimuth);
    const el = THREE.MathUtils.degToRad(sunConfig.elevation);

    sunDirection.set(
        Math.cos(el) * Math.sin(az),
        Math.sin(el),
        Math.cos(el) * Math.cos(az)
    ).normalize();

    // Initial position. updateShadowCameraTarget() will keep this centered
    // around the player afterward.
    sun.target.position.set(0, 0, 0);

    sun.position.copy(
        sunDirection.clone()
            .multiplyScalar(150)
    );

    sun.target.updateMatrixWorld();
}
applySunAngles();

function updateShadowCameraTarget() {
    // Follow the actual player physics position when available.
    // This changes ONLY shadow rendering; it never touches physics/colliders.
    let focusX = 0;
    let focusY = 0;
    let focusZ = 0;

    if (
        typeof playerBody !== "undefined" &&
        playerBody
    ) {
        const p =
            playerBody.translation();

        focusX = p.x;
        focusY = p.y;
        focusZ = p.z;
    } else if (
        typeof playerRoot !== "undefined" &&
        playerRoot
    ) {
        focusX = playerRoot.position.x;
        focusY = playerRoot.position.y;
        focusZ = playerRoot.position.z;
    }

    sun.target.position.set(
        focusX,
        focusY,
        focusZ
    );

    // Move the light by the exact same offset, preserving the sun angle.
    sun.position.set(
        focusX + sunDirection.x * 150,
        focusY + sunDirection.y * 150,
        focusZ + sunDirection.z * 150
    );

    sun.target.updateMatrixWorld();
    sun.updateMatrixWorld();
}

// Baseplate
const BASE_SIZE = 200;
const STUD_H = 1.2;

// ─── Texture loader helper ────────────────────────────────────────────────────
const texLoader = new THREE.TextureLoader();
function loadTex(path, repeatX, repeatY) {
    const t = texLoader.load(path);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);

    // Metadata only: BloxClassicWebGLRenderer performs the actual WebGL upload.
    // Keep anisotropy at one and use a simple mip transition for the old-client
    // softness visible in the supplied stud/reference images.
    t.anisotropy = 1;
    t.minFilter = THREE.LinearMipmapNearestFilter;
    t.magFilter = THREE.LinearFilter;

    return t;
}

// ─── Classic Part.Shape / collider helpers ────────────────────────────────────
// 2008-era Part supports the Block, Ball, and Cylinder shapes. WedgePart is a
// separate BasePart class. Keep the Three.js render geometry and Rapier collider
// shape in lock-step so the visible Part and its physical body always agree.
function normalizeClassicPartShape(value, fallback = "Block") {
    const raw =
        value && typeof value === "object"
            ? (value.Name ?? value.name ?? value.Value ?? value.value)
            : value;

    const name =
        String(raw ?? fallback)
            .replace(/^Enum\.PartType\./i, "")
            .trim();

    if (/^ball$/i.test(name))
        return "Ball";

    if (/^cylinder$/i.test(name))
        return "Cylinder";

    if (/^wedge$/i.test(name))
        return "Wedge";

    return "Block";
}

function createClassicWedgeGeometry(w, h, d) {
    const hx = Math.max(0.0005, Number(w) || 1) / 2;
    const hy = Math.max(0.0005, Number(h) || 1) / 2;
    const hz = Math.max(0.0005, Number(d) || 1) / 2;

    // Roblox-style wedge prism:
    //
    // side view (Z/Y):
    //
    //       +Y
    //        |
    //        |      ______ +Z
    //        |     /|
    //        |    / |
    //        |   /  |
    //        |__/___|
    //          -Z
    //
    // X is the prism width.
    const positions = new Float32Array([
        -hx, -hy, -hz, // 0 left/front/bottom
         hx, -hy, -hz, // 1 right/front/bottom
        -hx, -hy,  hz, // 2 left/back/bottom
         hx, -hy,  hz, // 3 right/back/bottom
        -hx,  hy,  hz, // 4 left/back/top
         hx,  hy,  hz  // 5 right/back/top
    ]);

    const indices = [
        // Bottom.
        0, 3, 2,
        0, 1, 3,

        // Vertical back.
        2, 3, 5,
        2, 5, 4,

        // Left triangular end.
        0, 2, 4,

        // Right triangular end.
        1, 5, 3,

        // Sloped face.
        0, 4, 5,
        0, 5, 1
    ];

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setIndex(
        indices
    );

    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();

    // Wedge rendering currently uses the normal side material. The physics
    // shape is still exact; surface-specific stud texturing can be layered on
    // later without changing the geometry/collider abstraction.
    geometry.clearGroups();
    geometry.addGroup(
        0,
        geometry.index.count,
        0
    );

    return geometry;
}

function createClassicPartGeometry(shape, w, h, d) {
    const normalized =
        normalizeClassicPartShape(
            shape
        );

    if (normalized === "Ball") {
        const radius =
            Math.max(
                0.0005,
                Math.min(
                    Number(w) || 1,
                    Number(h) || 1,
                    Number(d) || 1
                ) / 2
            );

        const geometry =
            new THREE.SphereGeometry(
                radius,
                16,
                10
            );

        geometry.clearGroups();
        geometry.addGroup(
            0,
            geometry.index
                ? geometry.index.count
                : geometry.attributes.position.count,
            0
        );

        return geometry;
    }

    if (normalized === "Cylinder") {
        // Classic Roblox cylinders run along the local X axis. Three.js and
        // Rapier cylinders are Y-axis primitives, so rotate the geometry/collider
        // 90 degrees around local Z.
        const radius =
            Math.max(
                0.0005,
                Math.min(
                    Number(h) || 1,
                    Number(d) || 1
                ) / 2
            );

        const geometry =
            new THREE.CylinderGeometry(
                radius,
                radius,
                Math.max(
                    0.001,
                    Number(w) || 1
                ),
                16,
                1,
                false
            );

        geometry.rotateZ(
            Math.PI / 2
        );

        geometry.clearGroups();
        geometry.addGroup(
            0,
            geometry.index
                ? geometry.index.count
                : geometry.attributes.position.count,
            0
        );

        return geometry;
    }

    if (normalized === "Wedge") {
        return createClassicWedgeGeometry(
            w,
            h,
            d
        );
    }

    // Gouraud lighting needs intermediate vertices across very large flat
    // surfaces. The old fixed-function look was vertex-lit, but the original
    // client geometry was not effectively a single four-corner lighting quad
    // for a giant baseplate. Subdivide only large faces so the broad sun
    // highlight can actually travel across them while small bricks stay cheap.
    const gouraudSegments =
        size =>
            THREE.MathUtils.clamp(
                Math.ceil(
                    Math.max(
                        1,
                        Number(size) || 1
                    ) /
                    1.5
                ),
                1,
                128
            );

    return new THREE.BoxGeometry(
        w,
        h,
        d,
        gouraudSegments(w),
        gouraudSegments(h),
        gouraudSegments(d)
    );
}

function createClassicPartColliderDesc(shape, w, h, d) {
    const normalized =
        normalizeClassicPartShape(
            shape
        );

    if (normalized === "Ball") {
        const radius =
            Math.max(
                0.0005,
                Math.min(
                    Number(w) || 1,
                    Number(h) || 1,
                    Number(d) || 1
                ) / 2
            );

        return RAPIER.ColliderDesc.ball(
            radius
        );
    }

    if (normalized === "Cylinder") {
        const halfHeight =
            Math.max(
                0.0005,
                (Number(w) || 1) / 2
            );

        const radius =
            Math.max(
                0.0005,
                Math.min(
                    Number(h) || 1,
                    Number(d) || 1
                ) / 2
            );

        const desc =
            RAPIER.ColliderDesc.cylinder(
                halfHeight,
                radius
            );

        const halfAngle =
            Math.PI / 4;

        desc.setRotation({
            x: 0,
            y: 0,
            z: Math.sin(halfAngle),
            w: Math.cos(halfAngle)
        });

        return desc;
    }

    if (normalized === "Wedge") {
        const hx =
            Math.max(
                0.0005,
                (Number(w) || 1) / 2
            );

        const hy =
            Math.max(
                0.0005,
                (Number(h) || 1) / 2
            );

        const hz =
            Math.max(
                0.0005,
                (Number(d) || 1) / 2
            );

        const vertices =
            new Float32Array([
                -hx, -hy, -hz,
                 hx, -hy, -hz,
                -hx, -hy,  hz,
                 hx, -hy,  hz,
                -hx,  hy,  hz,
                 hx,  hy,  hz
            ]);

        const desc =
            RAPIER.ColliderDesc.convexHull(
                vertices
            );

        // convexHull() may return null for a degenerate point set. A cuboid
        // fallback is preferable to leaving a Part without collision.
        return (
            desc ||
            RAPIER.ColliderDesc.cuboid(
                hx,
                hy,
                hz
            )
        );
    }

    return RAPIER.ColliderDesc.cuboid(
        Math.max(
            0.0005,
            (Number(w) || 1) / 2
        ),
        Math.max(
            0.0005,
            (Number(h) || 1) / 2
        ),
        Math.max(
            0.0005,
            (Number(d) || 1) / 2
        )
    );
}

function configureClassicPartColliderDesc(
    desc,
    {
        mass = 1,
        friction = 0.7,
        restitution = 0.1,
        canCollide = true
    } = {}
) {
    return desc
        .setMass(
            Math.max(
                0.0001,
                Number(mass) || 1
            )
        )
        .setFriction(
            Number(friction) || 0
        )
        .setRestitution(
            Number(restitution) || 0
        )
        .setSensor(
            !canCollide
        );
}

function updateClassicBlockTextureTiling(
    part,
    w,
    d
) {
    if (
        !part ||
        normalizeClassicPartShape(
            part.shape
        ) !==
            "Block"
    ) {
        return;
    }

    const materials =
        Array.isArray(
            part.mesh?.material
        )
            ? part.mesh.material
            : [];

    const topMaterial =
        materials[2];

    const bottomMaterial =
        materials[3];

    if (topMaterial?.map) {
        topMaterial.map.repeat.set(
            w,
            d
        );
        topMaterial.map.needsUpdate =
            true;
    }

    if (bottomMaterial?.map) {
        bottomMaterial.map.repeat.set(
            w,
            d
        );
        bottomMaterial.map.needsUpdate =
            true;
    }
}

function rebuildClassicPartShapeAndCollider(
    part,
    shape,
    w,
    h,
    d
) {
    if (
        !part ||
        !part.body ||
        !part.mesh
    ) {
        return;
    }

    const normalized =
        normalizeClassicPartShape(
            shape
        );

    part.mesh.geometry?.dispose?.();

    part.mesh.geometry =
        createClassicPartGeometry(
            normalized,
            w,
            h,
            d
        );

    const oldCollider =
        part.collider ||
        (
            part.body.numColliders() >
                0
                ? part.body.collider(0)
                : null
        );

    if (oldCollider) {
        unregisterRapierColliderOwner(
            oldCollider
        );

        // Remove only the old shape. Keeping the rigid body preserves its
        // position, rotation, linear velocity, and angular velocity.
        world.removeCollider(
            oldCollider,
            true
        );
    }

    const colliderDesc =
        configureClassicPartColliderDesc(
            createClassicPartColliderDesc(
                normalized,
                w,
                h,
                d
            ),
            {
                mass:
                    part.mass,
                friction:
                    part.friction,
                restitution:
                    part.restitution,
                canCollide:
                    part.canCollide
            }
        );

    part.collider =
        world.createCollider(
            colliderDesc,
            part.body
        );

    registerRapierColliderOwner(
        part.luaInstance,
        part.collider
    );

    part.w = w;
    part.h = h;
    part.d = d;
    part.shape = normalized;

    updateClassicBlockTextureTiling(
        part,
        w,
        d
    );
}


/**
 * createPart(w, h, d, x, y, z, color, dynamic)
 *   w, h, d — full dimensions
 *   x, y, z   — world centre
 *   options   — property object (see defaults below)
 *
 * Options:
 *   color        hex        0x4d7845   base colour
 *   anchored     bool       true       anchored = never moves (like Roblox Anchored)
 *   canCollide   bool       true       whether other bodies collide with it
 *   friction     number     0.7
 *   restitution  number     0.1        bounciness
 *   mass         number     1.0        only used when anchored=false
 *   castShadow   bool       true
 *   visible      bool       true
 */
// IMPORTANT: x/y/z are CENTER coordinates, matching Roblox Part.Position.
// The visual BoxGeometry and Rapier cuboid use the same center; do not add
// a global +/-0.5 correction here. Half-stud coordinates are expected whenever
// an odd-sized part needs to sit exactly on an integer grid surface.
function createPart(w, h, d, x, y, z, options = {}) {
    const {
        color       = 0xc8a97a,
        anchored    = true,
        canCollide  = true,
        friction    = 0.7,
        restitution = 0.1,
        mass        = 1.0,
        castShadow  = false,
        visible     = true,
        shape       = "Block",
    } = options;

    const partShape =
        normalizeClassicPartShape(
            shape
        );
    const max = renderer.capabilities.getMaxAnisotropy();
    const sideMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
    const topMat  = new THREE.MeshStandardMaterial({
        map: loadTex("Textures/top-stud.jpg", w, d),
        color, roughness: 0.3, metalness: 0.0, transparent: false, alphaTest: 0,
    });

    if (topMat.map) {
        topMat.map.anisotropy = max;
    }
    const botMat  = new THREE.MeshStandardMaterial({
        map: loadTex("Textures/bottom-stud.jpg", w, d),
        color, roughness: 0.3, metalness: 0.0, transparent: false, alphaTest: 0,
    });
    if (botMat.map) {
        botMat.map.anisotropy = max;
    }
    const mesh = new THREE.Mesh(
        createClassicPartGeometry(
            partShape,
            w,
            h,
            d
        ),
        [sideMat, sideMat, topMat, botMat, sideMat, sideMat]
    );
    mesh.position.set(x, y, z);
    // Custom classic renderer rule: Workspace/map Parts RECEIVE the local
    // player's shadow but NEVER enter the shadow-caster pass themselves.
    mesh.castShadow  = false;
    mesh.receiveShadow = true;
    mesh.visible     = visible;
    scene.add(mesh);

    // Rapier rigid body
    const bodyDesc = anchored
    ? RAPIER.RigidBodyDesc.fixed()
    : RAPIER.RigidBodyDesc.dynamic();
bodyDesc.setTranslation(x, y, z);
    const body = world.createRigidBody(bodyDesc);

    const colDesc =
        configureClassicPartColliderDesc(
            createClassicPartColliderDesc(
                partShape,
                w,
                h,
                d
            ),
            {
                mass,
                friction,
                restitution,
                canCollide
            }
        );
    const collider =
        world.createCollider(
            colDesc,
            body
        );

    const part = {
        mesh,
        body,
        collider,
        w,
        h,
        d,
        anchored,
        canCollide,
        friction,
        restitution,
        mass,
        shape: partShape
    };

    updateClassicBlockTextureTiling(
        part,
        w,
        d
    );
    if (!anchored) physObjects.push(part);
    return part;
}

/**
 * editPart(part, options)
 *   part     — the object returned by createPart
 *   options  — any subset of the properties you want to change:
 *     color, anchored, canCollide, friction, restitution, visible, castShadow
 *
 * Example:
 *   const brick = createPart(4,4,4, 10,2,0, { anchored: false, color: 0xff0000 });
 *   editPart(brick, { anchored: true, color: 0x00ff00, canCollide: false });
 */
function editPart(part, options = {}) {
    const { mesh, body, w, h, d } = part;

    // Color
    if (options.color !== undefined) {
        mesh.material.forEach(m => {
            if (m.color) m.color.setHex(options.color);
        });
    }

    // Visible
    if (options.visible !== undefined) mesh.visible = options.visible;

    // Only the player is allowed to cast shadows. World Parts always remain
    // receivers only, regardless of their Lua-facing CastShadow value.
    if (options.castShadow !== undefined) mesh.castShadow = false;

    // Anchored — swap body type
    if (options.anchored !== undefined && options.anchored !== part.anchored) {
        const pos = body.translation();
        const newDesc = options.anchored
            ? RAPIER.RigidBodyDesc.fixed()
            : RAPIER.RigidBodyDesc.dynamic().setAdditionalMass(1.0);
        newDesc.setTranslation(pos.x, pos.y, pos.z);
        if (!options.anchored) newDesc.lockRotations();

        // Remove old body and recreate. Keep the collider-owner lookup in sync
        // because Rapier may recycle collider handles after deletion.
        const oldCollider =
            part.collider ||
            (
                body.numColliders() > 0
                    ? body.collider(0)
                    : null
            );

        unregisterRapierColliderOwner(
            oldCollider
        );

        world.removeRigidBody(body);

        part.body = world.createRigidBody(newDesc);

        // Re-add the correct collider shape with existing or new settings.
        const nextCanCollide =
            options.canCollide !== undefined
                ? Boolean(options.canCollide)
                : part.canCollide;

        const nextFriction =
            options.friction !== undefined
                ? Number(options.friction) || 0
                : part.friction;

        const nextRestitution =
            options.restitution !== undefined
                ? Number(options.restitution) || 0
                : part.restitution;

        const colDesc =
            configureClassicPartColliderDesc(
                createClassicPartColliderDesc(
                    part.shape,
                    w,
                    h,
                    d
                ),
                {
                    mass:
                        part.mass,
                    friction:
                        nextFriction,
                    restitution:
                        nextRestitution,
                    canCollide:
                        nextCanCollide
                }
            );

        part.collider =
            world.createCollider(
                colDesc,
                part.body
            );

        part.canCollide =
            nextCanCollide;

        part.friction =
            nextFriction;

        part.restitution =
            nextRestitution;

        registerRapierColliderOwner(
            part.luaInstance,
            part.collider
        );

        part.anchored = options.anchored;

        // Add to / remove from sync list
        const idx = physObjects.indexOf(part);
        if (!options.anchored && idx === -1) physObjects.push(part);
        if (options.anchored  && idx !== -1) physObjects.splice(idx, 1);
    }

    // CanCollide (sensor toggle) — only if body wasn't just recreated
    if (options.canCollide !== undefined && options.canCollide !== part.canCollide
        && options.anchored === undefined) {
        for (let i = 0; i < part.body.numColliders(); i++) {
            part.body.collider(i).setSensor(!options.canCollide);
        }
        part.canCollide = options.canCollide;
    }

    // Friction / restitution on existing colliders
    if ((options.friction !== undefined || options.restitution !== undefined)
        && options.anchored === undefined) {
        for (let i = 0; i < part.body.numColliders(); i++) {
            const c = part.body.collider(i);
            if (options.friction    !== undefined) c.setFriction(options.friction);
            if (options.restitution !== undefined) c.setRestitution(options.restitution);
        }

        if (options.friction !== undefined) {
            part.friction =
                Number(options.friction) || 0;
        }

        if (options.restitution !== undefined) {
            part.restitution =
                Number(options.restitution) || 0;
        }
    }

    return part;
}


// ─────────────────────────────────────────────────────────────────────────────
// Roblox Luau API
// ─────────────────────────────────────────────────────────────────────────────


const luaInstances = new Set();

// ─── Classic Roblox signal/event system ─────────────────────────────────────
const luaInstanceIds = new WeakMap();
let nextLuaInstanceId = 1;

function getLuaInstanceId(instance) {
    if (!instance || (typeof instance !== "object" && typeof instance !== "function"))
        return "unknown";

    if (!luaInstanceIds.has(instance)) {
        luaInstanceIds.set(instance, nextLuaInstanceId++);
    }

    return luaInstanceIds.get(instance);
}

const luaSignalInternals = new WeakMap();

// Per-instance property signals used by GetPropertyChangedSignal().
// Kept outside Mutable() so luau-web never sees engine bookkeeping as fields.
const luaPropertySignals = new WeakMap();

function getPropertySignal(instance, propertyName, create = true) {
    if (!instance || !propertyName)
        return null;

    let map =
        luaPropertySignals.get(instance);

    if (!map && create) {
        map = new Map();
        luaPropertySignals.set(
            instance,
            map
        );
    }

    if (!map)
        return null;

    let signal =
        map.get(propertyName);

    if (!signal && create) {
        signal =
            createLuaSignal(
                `${instance.ClassName || "Instance"}.${propertyName}Changed`,
                instance
            );

        map.set(
            propertyName,
            signal
        );
    }

    return signal || null;
}

function getLastFunctionArgument(args) {
    // Lua's ":" syntax passes the object itself as the first argument to a
    // JavaScript host function. Search from the end so both of these work:
    //
    // part.Touched:connect(function(hit) end)
    // part.Touched.connect(function(hit) end)
    for (let i = args.length - 1; i >= 0; i--) {
        if (typeof args[i] === "function") {
            return args[i];
        }
    }

    return null;
}

function createLuaSignal(name, owner = null) {
    let signal = null;

    const connectImpl = (...args) => {
        const callback = getLastFunctionArgument(args);

        if (!callback) {
            throw new Error(name + ":connect expected a function");
        }

        const state = luaSignalInternals.get(signal);

        if (!state) {
            throw new Error(name + " signal is no longer valid");
        }

        const entry = {
            callback,
            connected: true,

            // JS-VM callbacks may yield independently. Keep per-listener state so high-frequency events do not create unbounded overlapping work.
            running: false,
            queued: false,

            // Frame events use this to retain only the newest arguments while
            // the single global Luau callback queue is busy.
            pendingArgs: null
        };

        const disconnectImpl = () => {
            if (!entry.connected)
                return;

            entry.connected = false;
            state.listeners.delete(entry);
        };

        const connection = Mutable({
            Connected: true,

            Disconnect: (...disconnectArgs) => {
                disconnectImpl();
                connection.Connected = false;
            },

            disconnect: (...disconnectArgs) => {
                disconnectImpl();
                connection.Connected = false;
            }
        });

        entry.connection = connection;
        state.listeners.add(entry);

        return connection;
    };

    const waitImpl = (...args) => {
        // Legacy host-signal Wait fallback. RunService signals no longer use this:
        // they have a pure-Luau Wait implementation in CLASSIC_DATATYPE_BOOTSTRAP.
        // Other host signals still use the Promise bridge until they receive the
        // same native-Luau signal treatment.
        return new Promise(resolve => {
            const state = luaSignalInternals.get(signal);

            if (!state) {
                resolve(null);
                return;
            }

            const entry = {
                connected: true,
                callback: (...fireArgs) => {
                    if (!entry.connected)
                        return;

                    entry.connected = false;
                    state.listeners.delete(entry);

                    // Match Roblox Signal:Wait(): return the arguments supplied
                    // by the event. A single argument is returned directly.
                    if (fireArgs.length <= 1) {
                        resolve(fireArgs[0]);
                    } else {
                        resolve(fireArgs);
                    }
                }
            };

            state.listeners.add(entry);
        });
    };

    signal = Mutable({
        Connect: connectImpl,
        connect: connectImpl,
        Wait: waitImpl,
        wait: waitImpl
    });

    // IMPORTANT:
    // Keep internal engine functions OUTSIDE Mutable().
    //
    // Mutable() is a Proxy around a Map. luau-web binds function properties
    // returned through that Proxy. A non-configurable __fire function on the
    // proxy therefore violates JavaScript Proxy invariants.
    luaSignalInternals.set(signal, {
        name,
        owner,
        listeners: new Set()
    });

    return signal;
}

function isFatalLuauWasmError(error) {
    const message =
        String(
            error?.message ||
            error ||
            ""
        ).toLowerCase();

    return (
        message.includes(
            "memory access out of bounds"
        ) ||
        message.includes(
            "unreachable"
        )
    );
}

function reportLuaSignalError(
    state,
    entry,
    error
) {
    console.error(
        `[Lua] Error in ${state.name}:`,
        error
    );

    if (
        isFatalLuauWasmError(
            error
        )
    ) {
        entry.connected =
            false;

        entry.pendingArgs =
            null;

        state.listeners.delete(
            entry
        );

        if (
            entry.connection
        ) {
            entry.connection.Connected =
                false;
        }

        console.warn(
            `[Lua] Disconnected ${state.name} listener after fatal WASM error.`
        );
    }
}


// -----------------------------------------------------------------------------
// GLOBAL LUA CALLBACK SERIALIZER
//
// Preserve deterministic callback ordering for classic event behavior. The new
// Luau runtime is pure JavaScript, so this queue is no longer a WASM re-entry gate.
// Frame-style events are coalesced per listener while busy so Heartbeat,
// Stepped, and RenderStepped cannot build an unlimited queue.
// -----------------------------------------------------------------------------

const luaCallbackQueue = [];
let luaCallbackQueueRunning = false;

// Conservative memory guard for the stable JS -> Luau serializer.
// RunService callbacks are already coalesced per listener, so this mainly
// protects against accidental storms of ordinary events.
const MAX_LUA_CALLBACK_QUEUE = 2048;
let luaCallbackQueueHead = 0;
let luaCallbackQueueDropWarningAt = 0;

function getLuaCallbackQueueLength() {
    return Math.max(
        0,
        luaCallbackQueue.length -
        luaCallbackQueueHead
    );
}

function compactLuaCallbackQueue() {
    if (
        luaCallbackQueueHead > 512 &&
        luaCallbackQueueHead >
            luaCallbackQueue.length / 2
    ) {
        luaCallbackQueue.splice(
            0,
            luaCallbackQueueHead
        );

        luaCallbackQueueHead = 0;
    }

    if (
        luaCallbackQueueHead >=
        luaCallbackQueue.length
    ) {
        luaCallbackQueue.length = 0;
        luaCallbackQueueHead = 0;
    }
}

function warnLuaCallbackQueueDrop() {
    const now = performance.now();

    if (
        now -
        luaCallbackQueueDropWarningAt <
        1500
    ) {
        return;
    }

    luaCallbackQueueDropWarningAt = now;

    console.warn(
        `[Lua] Callback queue capped at ${MAX_LUA_CALLBACK_QUEUE}; ` +
        "dropping the oldest pending callback to prevent memory growth."
    );
}

function dropOldestLuaCallbackQueueEntry() {
    while (
        luaCallbackQueueHead <
        luaCallbackQueue.length
    ) {
        const dropped =
            luaCallbackQueue[
                luaCallbackQueueHead++
            ];

        if (!dropped)
            continue;

        if (dropped.entry) {
            dropped.entry.queued = false;

            if (
                isCoalescedFrameSignalName(
                    dropped.state?.name
                )
            ) {
                dropped.entry.pendingArgs =
                    null;
            }
        }

        warnLuaCallbackQueueDrop();
        break;
    }

    compactLuaCallbackQueue();
}

// -----------------------------------------------------------------------------
// LUA VM EXECUTION GATE
//
// JS-VM callback ordering gate. Yielding threads are owned by luau-lib.js and do
// not keep a browser/WASM stack suspended. This Promise chain now exists only to
// keep host event callbacks deterministic.
// -----------------------------------------------------------------------------
let luaVmExecutionTail = Promise.resolve();
let luaVmExecutionSequence = 0;

function runLuaVmSerialized(
    label,
    callback
) {
    const sequence =
        ++luaVmExecutionSequence;

    const execute =
        async () => {
            try {
                const result =
                    callback();

                if (
                    result &&
                    typeof result.then ===
                        "function"
                ) {
                    return await result;
                }

                return result;
            } catch (error) {
                throw error;
            }
        };

    const job =
        luaVmExecutionTail.then(
            execute,
            execute
        );

    // Always leave the tail fulfilled so one failed callback cannot poison all
    // later Lua work. The caller still receives the rejecting job itself.
    luaVmExecutionTail =
        job.catch(
            () => undefined
        );

    return job;
}

function isCoalescedFrameSignalName(name) {
    return (
        name === "RunService.Stepped" ||
        name === "RunService.Heartbeat" ||
        name === "RunService.RenderStepped"
    );
}

function queueLuaSignalEntry(
    state,
    entry,
    args
) {
    if (!entry.connected)
        return;

    // For high-frequency frame events, keep only one queued invocation for
    // this listener. Newer frame arguments replace older ones.
    if (
        isCoalescedFrameSignalName(
            state.name
        ) &&
        entry.queued
    ) {
        entry.pendingArgs =
            args;

        return;
    }

    entry.queued =
        true;

    if (
        getLuaCallbackQueueLength() >=
        MAX_LUA_CALLBACK_QUEUE
    ) {
        dropOldestLuaCallbackQueueEntry();
    }

    luaCallbackQueue.push({
        state,
        entry,
        args
    });

    drainLuaCallbackQueue();
}

async function drainLuaCallbackQueue() {
    if (luaCallbackQueueRunning)
        return;

    luaCallbackQueueRunning =
        true;

    try {
        while (
            getLuaCallbackQueueLength() >
            0
        ) {
            const job =
                luaCallbackQueue[
                    luaCallbackQueueHead++
                ];

            compactLuaCallbackQueue();

            if (!job)
                continue;

            const {
                state,
                entry
            } = job;

            if (
                !entry.connected
            ) {
                entry.queued =
                    false;

                entry.pendingArgs =
                    null;

                continue;
            }

            let args =
                job.args;

            // If this was a coalesced frame event, use the newest arguments
            // that arrived while it was waiting in the global queue.
            if (
                entry.pendingArgs
            ) {
                args =
                    entry.pendingArgs;

                entry.pendingArgs =
                    null;
            }

            entry.queued =
                false;
            entry.running =
                true;

            const mouseSnapshot =
                args?.__bloxMouseSnapshot ||
                null;

            const liveMouseState =
                mouseSnapshot
                    ? {
                        Target:
                            MouseApi.Target,
                        Hit:
                            MouseApi.Hit,
                        TargetSurface:
                            MouseApi.TargetSurface
                    }
                    : null;

            if (mouseSnapshot) {
                MouseApi.Target =
                    mouseSnapshot.Target;

                MouseApi.Hit =
                    mouseSnapshot.Hit;

                MouseApi.TargetSurface =
                    mouseSnapshot.TargetSurface;
            }

            try {
                await runLuaVmSerialized(
                    state.name,
                    () =>
                        dispatchLuaCallbackThroughScheduler(
                            entry.callback,
                            args
                        )
                );
            } catch (error) {
                reportLuaSignalError(
                    state,
                    entry,
                    error
                );
            } finally {
                // Restore the current/live mouse state after this one Lua click
                // callback finishes. The snapshot never becomes permanent state.
                if (
                    mouseSnapshot &&
                    liveMouseState
                ) {
                    MouseApi.Target =
                        liveMouseState.Target;

                    MouseApi.Hit =
                        liveMouseState.Hit;

                    MouseApi.TargetSurface =
                        liveMouseState.TargetSurface;
                }

                entry.running =
                    false;
            }

            // A frame may have arrived while this callback itself was running.
            // Schedule exactly one newest frame rather than every missed frame.
            if (
                entry.connected &&
                entry.pendingArgs &&
                isCoalescedFrameSignalName(
                    state.name
                )
            ) {
                const newestArgs =
                    entry.pendingArgs;

                entry.pendingArgs =
                    null;

                queueLuaSignalEntry(
                    state,
                    entry,
                    newestArgs
                );
            }
        }
    } finally {
        luaCallbackQueueRunning =
            false;

        // A job can be added between the final loop check and this finally.
        if (
            getLuaCallbackQueueLength() >
            0
        ) {
            queueMicrotask(
                drainLuaCallbackQueue
            );
        }
    }
}

function fireLuaSignal(signal, ...args) {
    if (!signal)
        return;

    const state =
        luaSignalInternals.get(
            signal
        );

    if (!state)
        return;

    for (
        const entry of
        state.listeners
    ) {
        if (!entry.connected)
            continue;

        queueLuaSignalEntry(
            state,
            entry,
            args
        );
    }
}

// Mouse.Button1Down is queued through the same serialized Luau VM as every
// other signal. That means the callback may execute a little later than the DOM
// mousedown itself. Preserve the exact click-time Mouse.Target/Hit/TargetSurface
// so scripts reading `mouse.Target` inside the callback always see the Part that
// was under the cursor when the user clicked.
function fireMouseButton1DownWithSnapshot() {
    const signal =
        MouseApi?.Button1Down;

    if (!signal)
        return;

    const state =
        luaSignalInternals.get(
            signal
        );

    if (!state)
        return;

    const snapshot = {
        Target:
            MouseApi.Target,
        Hit:
            MouseApi.Hit,
        TargetSurface:
            MouseApi.TargetSurface
    };

    for (
        const entry of
        state.listeners
    ) {
        if (!entry.connected)
            continue;

        const args = [];

        Object.defineProperty(
            args,
            "__bloxMouseSnapshot",
            {
                value:
                    snapshot,
                enumerable:
                    false
            }
        );

        queueLuaSignalEntry(
            state,
            entry,
            args
        );
    }
}

function disconnectLuaSignal(signal) {
    if (!signal)
        return;

    const state = luaSignalInternals.get(signal);

    if (!state)
        return;

    for (const entry of state.listeners) {
        entry.connected = false;
        entry.queued = false;
        entry.pendingArgs = null;

        if (entry.connection) {
            entry.connection.Connected = false;
        }
    }

    state.listeners.clear();
}

function addInstanceSignals(instance) {
    if (!instance.Changed)
        instance.Changed = createLuaSignal("Changed", instance);

    if (!instance.ChildAdded)
        instance.ChildAdded = createLuaSignal("ChildAdded", instance);

    if (!instance.ChildRemoved)
        instance.ChildRemoved = createLuaSignal("ChildRemoved", instance);

    if (!instance.AncestryChanged)
        instance.AncestryChanged = createLuaSignal("AncestryChanged", instance);

    return instance;
}

function fireChanged(instance, propertyName) {
    if (!instance)
        return;

    // GetPropertyChangedSignal("X") is independent from Changed and never
    // receives the property name as an argument.
    const propertySignal =
        getPropertySignal(
            instance,
            propertyName,
            false
        );

    if (propertySignal) {
        fireLuaSignal(
            propertySignal
        );
    }

    // Classic ValueBase.Changed is special: only Value changes fire the generic
    // Changed event, and the NEW value is passed instead of the property name.
    if (
        isA?.(instance, "ValueBase")
    ) {
        if (propertyName !== "Value")
            return;

        fireLuaSignal(
            instance.Changed,
            instance.Value
        );

        return;
    }

    fireLuaSignal(
        instance.Changed,
        propertyName
    );
}

function disconnectInstanceSignals(instance) {
    disconnectLuaSignal(instance?.Changed);
    disconnectLuaSignal(instance?.ChildAdded);
    disconnectLuaSignal(instance?.ChildRemoved);
    disconnectLuaSignal(instance?.AncestryChanged);
    disconnectLuaSignal(instance?.Touched);
    disconnectLuaSignal(instance?.TouchEnded);

    const propertySignals =
        luaPropertySignals.get(instance);

    if (propertySignals) {
        for (
            const signal of
            propertySignals.values()
        ) {
            disconnectLuaSignal(signal);
        }

        propertySignals.clear();
        luaPropertySignals.delete(instance);
    }
}

const activeTouchPairs = new Set();


function createVector3(x = 0, y = 0, z = 0) {
    const vx = Number(x) || 0;
    const vy = Number(y) || 0;
    const vz = Number(z) || 0;

    const magnitude =
        Math.hypot(
            vx,
            vy,
            vz
        );

    let vector = null;

    const dotImpl =
        (...args) => {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== vector &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            if (!other)
                return 0;

            return (
                vx * (Number(other.X) || 0) +
                vy * (Number(other.Y) || 0) +
                vz * (Number(other.Z) || 0)
            );
        };

    const crossImpl =
        (...args) => {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== vector &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            if (!other)
                return createVector3();

            const ox = Number(other.X) || 0;
            const oy = Number(other.Y) || 0;
            const oz = Number(other.Z) || 0;

            return createVector3(
                vy * oz - vz * oy,
                vz * ox - vx * oz,
                vx * oy - vy * ox
            );
        };

    const lerpImpl =
        (...args) => {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== vector &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            const alphaArg =
                [...args]
                    .reverse()
                    .find(arg =>
                        typeof arg === "number"
                    );

            const alpha =
                Number(alphaArg) || 0;

            if (!other)
                return vector;

            return createVector3(
                vx + ((Number(other.X) || 0) - vx) * alpha,
                vy + ((Number(other.Y) || 0) - vy) * alpha,
                vz + ((Number(other.Z) || 0) - vz) * alpha
            );
        };

    // IMPORTANT:
    // Do NOT build Unit by calling createVector3() inside the object literal.
    // That recursively tries to build Unit.Unit.Unit... forever.
    vector =
        Mutable({
            X: vx,
            Y: vy,
            Z: vz,

            Magnitude:
                magnitude,

            magnitude:
                magnitude,

            Unit:
                null,

            unit:
                null,

            Dot:
                dotImpl,

            dot:
                dotImpl,

            Cross:
                crossImpl,

            cross:
                crossImpl,

            Lerp:
                lerpImpl,

            lerp:
                lerpImpl
        });

    if (
        magnitude >
        1e-12
    ) {
        // Build a normalized value without asking that value to recursively
        // create another normalized value of itself.
        const ux =
            vx / magnitude;

        const uy =
            vy / magnitude;

        const uz =
            vz / magnitude;

        const unitVector =
            Mutable({
                X: ux,
                Y: uy,
                Z: uz,

                Magnitude: 1,
                magnitude: 1,

                Unit: null,
                unit: null,

                Dot:
                    (...args) => {
                        const other =
                            args.find(arg =>
                                arg &&
                                typeof arg === "object" &&
                                arg !== unitVector &&
                                "X" in arg &&
                                "Y" in arg &&
                                "Z" in arg
                            );

                        if (!other)
                            return 0;

                        return (
                            ux * (Number(other.X) || 0) +
                            uy * (Number(other.Y) || 0) +
                            uz * (Number(other.Z) || 0)
                        );
                    },

                Cross:
                    (...args) => {
                        const other =
                            args.find(arg =>
                                arg &&
                                typeof arg === "object" &&
                                arg !== unitVector &&
                                "X" in arg &&
                                "Y" in arg &&
                                "Z" in arg
                            );

                        if (!other)
                            return createVector3();

                        const ox = Number(other.X) || 0;
                        const oy = Number(other.Y) || 0;
                        const oz = Number(other.Z) || 0;

                        return createVector3(
                            uy * oz - uz * oy,
                            uz * ox - ux * oz,
                            ux * oy - uy * ox
                        );
                    },

                Lerp:
                    (...args) => {
                        const other =
                            args.find(arg =>
                                arg &&
                                typeof arg === "object" &&
                                arg !== unitVector &&
                                "X" in arg &&
                                "Y" in arg &&
                                "Z" in arg
                            );

                        const alphaArg =
                            [...args]
                                .reverse()
                                .find(arg =>
                                    typeof arg === "number"
                                );

                        const alpha =
                            Number(alphaArg) || 0;

                        if (!other)
                            return unitVector;

                        return createVector3(
                            ux + ((Number(other.X) || 0) - ux) * alpha,
                            uy + ((Number(other.Y) || 0) - uy) * alpha,
                            uz + ((Number(other.Z) || 0) - uz) * alpha
                        );
                    }
            });

        unitVector.dot =
            unitVector.Dot;

        unitVector.cross =
            unitVector.Cross;

        unitVector.lerp =
            unitVector.Lerp;

        // A normalized vector's Unit is itself.
        unitVector.Unit =
            unitVector;

        unitVector.unit =
            unitVector;

        vector.Unit =
            unitVector;

        vector.unit =
            unitVector;
    } else {
        // Roblox-style zero-vector behavior: Unit stays a zero vector rather
        // than triggering recursive construction.
        vector.Unit =
            vector;

        vector.unit =
            vector;
    }

    return vector;
}

const Vector3Api = Mutable({

function createRay(origin=createVector3(), direction=createVector3()) {
    const ray = Mutable({
        Origin: createVector3(
            Number(origin?.X)||0,
            Number(origin?.Y)||0,
            Number(origin?.Z)||0
        ),

        Direction: createVector3(
            Number(direction?.X)||0,
            Number(direction?.Y)||0,
            Number(direction?.Z)||0
        )
    });

    ray.ClosestPoint = (...args) => {
        const point = args.find(v =>
            v && typeof v === "object" &&
            "X" in v && "Y" in v && "Z" in v &&
            v !== ray
        );

        if (!point)
            return createVector3();

        const o = new THREE.Vector3(
            ray.Origin.X, ray.Origin.Y, ray.Origin.Z
        );

        const d = new THREE.Vector3(
            ray.Direction.X, ray.Direction.Y, ray.Direction.Z
        );

        const p = new THREE.Vector3(
            point.X, point.Y, point.Z
        );

        const lenSq = d.lengthSq();

        if (lenSq <= 1e-12)
            return createVector3(o.x, o.y, o.z);

        const t = Math.max(
            0,
            p.clone().sub(o).dot(d) / lenSq
        );

        const result = o.add(d.multiplyScalar(t));

        return createVector3(
            result.x,
            result.y,
            result.z
        );
    };

    ray.Distance = (...args) => {
        const point = args.find(v =>
            v && typeof v === "object" &&
            "X" in v && "Y" in v && "Z" in v &&
            v !== ray
        );

        if (!point)
            return 0;

        const closest = ray.ClosestPoint(point);

        return Math.hypot(
            (Number(point.X)||0) - closest.X,
            (Number(point.Y)||0) - closest.Y,
            (Number(point.Z)||0) - closest.Z
        );
    };

    return ray;
}

            values[1] || createVector3()

    }
});

function createRegion3(min, max) {

    const low = new THREE.Vector3(
        Math.min(a.x,b.x),
        Math.min(a.y,b.y),
        Math.min(a.z,b.z)
    );

    const high = new THREE.Vector3(
        Math.max(a.x,b.x),
        Math.max(a.y,b.y),
        Math.max(a.z,b.z)
    );

    const center = low.clone().add(high).multiplyScalar(0.5);
    const size = high.clone().sub(low);

    let region = null;

    region = Mutable({
        CFrame: createCFrame(
            center.x,
            center.y,
            center.z
        ),

        Size: createVector3(
            size.x,
            size.y,
            size.z
        ),

        ExpandToGrid(...args) {
            const resolution =
                Math.max(
                    0.001,
                    getNumberArg(args, 4) || 4
                );

            const minGrid = new THREE.Vector3(
                Math.floor(low.x / resolution) * resolution,
                Math.floor(low.y / resolution) * resolution,
                Math.floor(low.z / resolution) * resolution
            );

            const maxGrid = new THREE.Vector3(
                Math.ceil(high.x / resolution) * resolution,
                Math.ceil(high.y / resolution) * resolution,
                Math.ceil(high.z / resolution) * resolution
            );

            return createRegion3(
                createVector3(
                    minGrid.x,
                    minGrid.y,
                    minGrid.z
                ),
                createVector3(
                    maxGrid.x,
                    maxGrid.y,
                    maxGrid.z
                )
            );
        }
    });

    Object.defineProperty(region, "__min", {
        value: low, enumerable: false
    });

    Object.defineProperty(region, "__max", {
        value: high, enumerable: false
    });

    return region;
}

const Region3Api = Mutable({
    new(...args) {
        const values = args.filter(v =>
            v && typeof v === "object" &&
            "X" in v && "Y" in v && "Z" in v
        );

        return createRegion3(
            values[0] || createVector3(),
            values[1] || createVector3()
        );
    }
});

function createAxes(...values) {
    const names = new Set(
        values
            .flatMap(value => {
                if (typeof value === "string")
                    return [value];

                if (value && typeof value === "object")
                    return Object.keys(value).filter(k => value[k]);

                return [];
            })
    );

    return Mutable({
        X: names.has("X"),
        Y: names.has("Y"),
        Z: names.has("Z")
    });
}

const AxesApi = Mutable({
    new(...args) {
        return createAxes(...args);
    }
});

function createFaces(...values) {
    const names = new Set(
        values
            .flatMap(value => {
                if (typeof value === "string")
                    return [value];

                if (value && typeof value === "object")
                    return Object.keys(value).filter(k => value[k]);

                return [];
            })
    );

    return Mutable({
        Top: names.has("Top"),
        Bottom: names.has("Bottom"),
        Left: names.has("Left"),
        Right: names.has("Right"),
        Front: names.has("Front"),
        Back: names.has("Back")
    });
}

const FacesApi = Mutable({

function createNumberRange(min=0, max=min) {
    const a = Number(min) || 0;
    const b = Number(max);

    return Mutable({
        Min: Math.min(a, Number.isFinite(b) ? b : a),
        Max: Math.max(a, Number.isFinite(b) ? b : a)
    });
}

const NumberRangeApi = Mutable({
    new(...args) {
        const n = args.filter(x => typeof x === "number");
        return createNumberRange(
            n[0] || 0,
            n.length > 1 ? n[1] : (n[0] || 0)
        );
    }
});

function createSequenceKeypoint(time, value, envelope=0) {
    return Mutable({
        Time: THREE.MathUtils.clamp(Number(time)||0,0,1),
        Value: Number(value)||0,
        Envelope: Math.max(0, Number(envelope)||0)

}

const NumberSequenceKeypointApi = Mutable({
    new(...args) {
        const n = args.filter(x => typeof x === "number");
        return createSequenceKeypoint(
            n[0]||0, n[1]||0, n[2]||0

    }
});

function createNumberSequence(value) {
    let keypoints;

    if (Array.isArray(value)) {
        keypoints = value;
    } else {
        const v = Number(value)||0;
        keypoints = [
            createSequenceKeypoint(0,v,0),
            createSequenceKeypoint(1,v,0)
        ];
    }

    return Mutable({
        Keypoints: keypoints
    });
}

const NumberSequenceApi = Mutable({
    new(...args) {
        const value =
            args.find(v => Array.isArray(v)) ??
            args.find(v => typeof v === "number") ??

        return createNumberSequence(value);
    }

function createColorSequenceKeypoint(time, color) {
    return Mutable({
        Time: THREE.MathUtils.clamp(Number(time)||0,0,1),
        Value: color || createColor3()
    });
}

const ColorSequenceKeypointApi = Mutable({
    new(...args) {
        const time = getNumberArg(args,0) || 0;
        const color = args.find(v =>
            v && typeof v === "object" &&
            "R" in v && "G" in v && "B" in v

        return createColorSequenceKeypoint(

    }
