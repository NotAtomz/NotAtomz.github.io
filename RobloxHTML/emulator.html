function createColorSequence(value) {
    let keypoints;

    if (Array.isArray(value)) {
        keypoints = value;
    } else {
        const c = value || createColor3();

        keypoints = [
            createColorSequenceKeypoint(0,c),
            createColorSequenceKeypoint(1,c)
        ];
    }

    return Mutable({
        Keypoints: keypoints
    });
}

const ColorSequenceApi = Mutable({
    new(...args) {
        const array = args.find(v => Array.isArray(v));

        if (array)
            return createColorSequence(array);

        const colors = args.filter(v =>
            v && typeof v === "object" &&
            "R" in v && "G" in v && "B" in v
        );

        if (colors.length >= 2) {
            return createColorSequence([
                createColorSequenceKeypoint(0, colors[0]),
                createColorSequenceKeypoint(1, colors[1])
            ]);
        }

        return createColorSequence(
            colors[0] || createColor3()
        );
    }
});

// ─── Phase 2: CFrame math ────────────────────────────────────────────────────

function quaternionFromCFrameValue(cf) {
    if (
        cf &&
        Number.isFinite(Number(cf._qx)) &&
        Number.isFinite(Number(cf._qy)) &&
        Number.isFinite(Number(cf._qz)) &&
        Number.isFinite(Number(cf._qw))
    ) {
        return new THREE.Quaternion(
            Number(cf._qx),
            Number(cf._qy),
            Number(cf._qz),
            Number(cf._qw)
        ).normalize();
    }

    return new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
            Number(cf?._rx) || 0,
            Number(cf?._ry) || 0,
            Number(cf?._rz) || 0,
            "XYZ"
        )
    );
}

function makeCFrameFromQuaternion(
    x = 0,
    y = 0,
    z = 0,
    quaternion = new THREE.Quaternion()
) {
    const q =
        quaternion.clone().normalize();

    const euler =
        new THREE.Euler()
            .setFromQuaternion(
                q,
                "XYZ"
            );

    const position =
        createVector3(
            Number(x) || 0,
            Number(y) || 0,
            Number(z) || 0
        );

    const right =
        new THREE.Vector3(1, 0, 0)
            .applyQuaternion(q);

    const up =
        new THREE.Vector3(0, 1, 0)
            .applyQuaternion(q);

    // Roblox's LookVector points along local -Z.
    const look =
        new THREE.Vector3(0, 0, -1)
            .applyQuaternion(q);

    let cf = null;

    const multiplyImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    (
                        "X" in arg &&
                        "Y" in arg &&
                        "Z" in arg
                    )
                )
            );

        if (!other)
            return cf;

        // CFrame * Vector3 style through :Multiply/:mul.
        if (
            !("_qx" in other) &&
            !("_rx" in other)
        ) {
            const p =
                new THREE.Vector3(
                    Number(other.X) || 0,
                    Number(other.Y) || 0,
                    Number(other.Z) || 0
                )
                    .applyQuaternion(q)
                    .add(
                        new THREE.Vector3(
                            position.X,
                            position.Y,
                            position.Z
                        )
                    );

            return createVector3(
                p.x,
                p.y,
                p.z
            );
        }

        const bq =
            quaternionFromCFrameValue(
                other
            );

        const bp =
            new THREE.Vector3(
                Number(other.X) || 0,
                Number(other.Y) || 0,
                Number(other.Z) || 0
            );

        const p =
            bp.applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            q.clone().multiply(bq)
        );
    };

    const inverseImpl = () => {
        const qi =
            q.clone().invert();

        const p =
            new THREE.Vector3(
                -position.X,
                -position.Y,
                -position.Z
            ).applyQuaternion(qi);

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            qi
        );
    };

    const lerpImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    "_rx" in arg
                )
            );

        const alphaArg =
            [...args]
                .reverse()
                .find(arg =>
                    typeof arg === "number"
                );

        const alpha =
            THREE.MathUtils.clamp(
                Number(alphaArg) || 0,
                0,
                1
            );

        if (!other)
            return cf;

        const oq =
            quaternionFromCFrameValue(
                other
            );

        const blendedQ =
            q.clone().slerp(
                oq,
                alpha
            );

        return makeCFrameFromQuaternion(
            THREE.MathUtils.lerp(
                position.X,
                Number(other.X) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Y,
                Number(other.Y) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Z,
                Number(other.Z) || 0,
                alpha
            ),
            blendedQ
        );
    };

    const pointToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const pointToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .sub(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                )
                .applyQuaternion(
                    q.clone().invert()
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(q);

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(
                q.clone().invert()
            );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    cf = Mutable({
        X: position.X,
        Y: position.Y,
        Z: position.Z,

        _rx: euler.x,
        _ry: euler.y,
        _rz: euler.z,

        _qx: q.x,
        _qy: q.y,
        _qz: q.z,
        _qw: q.w,

        Position: position,
        p: position,

        Orientation:
            createVector3(
                THREE.MathUtils.radToDeg(
                    euler.x
                ),
                THREE.MathUtils.radToDeg(
                    euler.y
                ),
                THREE.MathUtils.radToDeg(
                    euler.z
                )
            ),

        LookVector:
            createVector3(
                look.x,
                look.y,
                look.z
            ),

        RightVector:
            createVector3(
                right.x,
                right.y,
                right.z
            ),

        UpVector:
            createVector3(
                up.x,
                up.y,
                up.z
            ),

        inverse: inverseImpl,
        Inverse: inverseImpl,

        lerp: lerpImpl,
        Lerp: lerpImpl,

        mul: multiplyImpl,
        Multiply: multiplyImpl,
        ToWorldSpace: multiplyImpl,

        ToObjectSpace(...args) {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (!other)
                return cf;

            return inverseImpl()
                .Multiply(other);
        },

        pointToWorldSpace: pointToWorldImpl,
        PointToWorldSpace: pointToWorldImpl,

        pointToObjectSpace: pointToObjectImpl,
        PointToObjectSpace: pointToObjectImpl,

        vectorToWorldSpace: vectorToWorldImpl,
        VectorToWorldSpace: vectorToWorldImpl,

        vectorToObjectSpace: vectorToObjectImpl,
        VectorToObjectSpace: vectorToObjectImpl,

        components() {
            // Position + 3x3 rotation matrix, matching classic CFrame components.
            const m =
                new THREE.Matrix4()
                    .makeRotationFromQuaternion(q);

            const e = m.elements;

            return [
                position.X,
                position.Y,
                position.Z,

                e[0], e[4], e[8],
                e[1], e[5], e[9],
                e[2], e[6], e[10]
            ];
        },

        GetComponents() {
            return this.components();
        }
    });

    return cf;
}

function createCFrame(
    x = 0,
    y = 0,
    z = 0,
    rx = 0,
    ry = 0,
    rz = 0
) {
    const q =
        new THREE.Quaternion()
            .setFromEuler(
                new THREE.Euler(
                    Number(rx) || 0,
                    Number(ry) || 0,
                    Number(rz) || 0,
                    "XYZ"
                )
            );

    return makeCFrameFromQuaternion(
        Number(x) || 0,
        Number(y) || 0,
        Number(z) || 0,
        q
    );
}

function cframeLookAt(
    px,
    py,
    pz,
    tx,
    ty,
    tz
) {
    const position =
        new THREE.Vector3(
            px,
            py,
            pz
        );

    const target =
        new THREE.Vector3(
            tx,
            ty,
            tz
        );

    const direction =
        target.clone()
            .sub(position);

    if (direction.lengthSq() < 1e-12) {
        return makeCFrameFromQuaternion(
            px,
            py,
            pz,
            new THREE.Quaternion()
        );
    }

    direction.normalize();

    // Three cameras/objects look down -Z, matching Roblox LookVector.
    const q =
        new THREE.Quaternion()
            .setFromUnitVectors(
                new THREE.Vector3(
                    0,
                    0,
                    -1
                ),
                direction
            );

    return makeCFrameFromQuaternion(
        px,
        py,
        pz,
        q
    );
}

const CFrameApi = Mutable({
    new(...args) {
        // Ignore a possible API receiver from colon-style invocation.
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        // CFrame.new(Vector3)
        if (
            values.length >= 1 &&
            typeof values[0] === "object" &&
            values[0] !== null &&
            "X" in values[0] &&
            "Y" in values[0] &&
            "Z" in values[0]
        ) {
            const from =
                values[0];

            // Classic CFrame.new(position, lookAtPosition)
            if (
                values.length >= 2 &&
                typeof values[1] === "object" &&
                values[1] !== null &&
                "X" in values[1] &&
                "Y" in values[1] &&
                "Z" in values[1]
            ) {
                return cframeLookAt(
                    Number(from.X) || 0,
                    Number(from.Y) || 0,
                    Number(from.Z) || 0,
                    Number(values[1].X) || 0,
                    Number(values[1].Y) || 0,
                    Number(values[1].Z) || 0
                );
            }

            return createCFrame(
                from.X,
                from.Y,
                from.Z
            );
        }

        return createCFrame(
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    Angles(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        return createCFrame(
            0,
            0,
            0,
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    fromEulerAnglesXYZ(...args) {
        return CFrameApi.Angles(
            ...args
        );
    },

    fromEulerAnglesYXZ(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const e =
            new THREE.Euler(
                Number(values[0]) || 0,
                Number(values[1]) || 0,
                Number(values[2]) || 0,
                "YXZ"
            );

        const q =
            new THREE.Quaternion()
                .setFromEuler(e);

        return makeCFrameFromQuaternion(
            0,
            0,
            0,
            q
        );
    },

    lookAt(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const from =
            values[0];

        const to =
            values[1];

        if (
            !from ||
            !to
        ) {
            return createCFrame();
        }

        return cframeLookAt(
            Number(from.X) || 0,
            Number(from.Y) || 0,
            Number(from.Z) || 0,
            Number(to.X) || 0,
            Number(to.Y) || 0,
            Number(to.Z) || 0
        );
    }
});
