function createLuaEventClass(className) {
    const eventSignalName =
        className === "RemoteEvent"
            ? "RemoteEvent.OnClientEvent"
            : "BindableEvent.Event";

    const instance =
        finalizeLuaInstance(
            Mutable({
                Name: className,
                ClassName: className,
                Parent: null,
                Archivable: true
            })
        );

    if (className === "BindableEvent") {
        instance.Event =
            createLuaSignal(
                eventSignalName,
                instance
            );

        instance.Fire =
            (...args) => {
                const values =
                    args.filter(arg =>
                        arg !== instance
                    );

                fireLuaSignal(
                    instance.Event,
                    ...values
                );
            };
    } else {
        instance.OnClientEvent =
            createLuaSignal(
                eventSignalName,
                instance
            );

        instance.OnServerEvent =
            createLuaSignal(
                "RemoteEvent.OnServerEvent",
                instance
            );

        instance.FireClient =
            (...args) => {
                const values =
                    args.filter(arg =>
                        arg !== instance &&
                        arg !== localPlayerApi
                    );

                fireLuaSignal(
                    instance.OnClientEvent,
                    ...values
                );
            };

        instance.FireAllClients =
            (...args) => {
                const values =
                    args.filter(arg =>
                        arg !== instance
                    );

                fireLuaSignal(
                    instance.OnClientEvent,
                    ...values
                );
            };

        instance.FireServer =
            (...args) => {
                const values =
                    args.filter(arg =>
                        arg !== instance
                    );

                fireLuaSignal(
                    instance.OnServerEvent,
                    localPlayerApi,
                    ...values
                );
            };
    }

    return instance;
}

function createLuaFunctionClass(className) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name: className,
                ClassName: className,
                Parent: null,
                Archivable: true,
                OnInvoke: null,
                OnServerInvoke: null,
                OnClientInvoke: null
            })
        );

    if (className === "BindableFunction") {
        instance.Invoke =
            (...args) => {
                const callback =
                    instance.OnInvoke;

                if (typeof callback !== "function")
                    return null;

                const values =
                    args.filter(arg =>
                        arg !== instance
                    );

                return callback(
                    ...values
                );
            };
    } else {
        instance.InvokeServer =
            (...args) => {
                if (
                    typeof instance.OnServerInvoke !==
                    "function"
                ) {
                    return null;
                }

                const values =
                    args.filter(arg =>
                        arg !== instance
                    );

                return instance.OnServerInvoke(
                    localPlayerApi,
                    ...values
                );
            };

        instance.InvokeClient =
            (...args) => {
                if (
                    typeof instance.OnClientInvoke !==
                    "function"
                ) {
                    return null;
                }

                const values =
                    args.filter(arg =>
                        arg !== instance &&
                        arg !== localPlayerApi
                    );

                return instance.OnClientInvoke(
                    ...values
                );
            };
    }

    return instance;
}

function syncSelectionBoxes() {
    for (
        const box of
        [...selectionBoxes]
    ) {
        if (
            !box ||
            box.__destroyed
        ) {
            continue;
        }

        const visual =
            box.__selectionVisual;

        const part =
            box.Adornee;

        if (
            !visual ||
            !box.Visible ||
            !part ||
            !isA(part, "BasePart") ||
            !part.__internal?.mesh
        ) {
            if (visual)
                visual.visible = false;

            continue;
        }

        const mesh =
            part.__internal.mesh;

        mesh.updateWorldMatrix(
            true,
            false
        );

        const p =
            new THREE.Vector3();

        const q =
            new THREE.Quaternion();

        mesh.getWorldPosition(p);
        mesh.getWorldQuaternion(q);

        visual.visible = true;
        visual.position.copy(p);
        visual.quaternion.copy(q);
        visual.scale.set(
            Number(part.Size?.X)||1,
            Number(part.Size?.Y)||1,
            Number(part.Size?.Z)||1
        );

        visual.material.color.setRGB(
            THREE.MathUtils.clamp(Number(box.Color3?.R)||0,0,1),
            THREE.MathUtils.clamp(Number(box.Color3?.G)||0,0,1),
            THREE.MathUtils.clamp(Number(box.Color3?.B)||0,0,1)
        );
    }
}

const InstanceApi = Mutable({
    new(...args) {
        const className =
            getStringArg(
                args,
                ""
            );

        // Parent can be supplied as the final object argument.
        const parent =
            [...args]
                .reverse()
                .find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== InstanceApi &&
                    arg.ClassName
                ) ||
            null;

        let instance;

        if (className === "Part") {
            instance =
                createLuaPart();
        } else if (
            className === "Seat"
        ) {
            instance =
                createLuaSeat();
        } else if (
            className === "Model"
        ) {
            instance =
                createLuaModel();
        } else if (
            className === "Folder"
        ) {
            instance =
                createLuaFolder();
        } else if (
            className === "Humanoid"
        ) {
            instance =
                createLuaHumanoid();
        } else if (
            className === "Terrain"
        ) {
            instance =
                createLuaTerrain();
        } else if (
            className === "SelectionBox"
        ) {
            instance =
                createLuaSelectionBox();
        } else if (
            className === "RemoteEvent" ||
            className === "BindableEvent"
        ) {
            instance =
                createLuaEventClass(
                    className
                );
        } else if (
            className === "RemoteFunction" ||
            className === "BindableFunction"
        ) {
            instance =
                createLuaFunctionClass(
                    className
                );
        } else if (
            [
                "Weld",
                "Motor",
                "Rotate",
                "Snap",
                "Glue",
                "ManualWeld"
            ].includes(
                className
            )
        ) {
            instance =
                createLuaJoint(
                    className
                );
        } else if (
            [
                "BodyVelocity",
                "BodyPosition",
                "BodyGyro",
                "BodyForce",
                "BodyAngularVelocity",
                "BodyThrust"
            ].includes(
                className
            )
        ) {
            instance =
                createLuaBodyMover(
                    className
                );
        } else if (
            [
                "StringValue",
                "BoolValue",
                "IntValue",
                "NumberValue",
                "ObjectValue"
            ].includes(
                className
            )
        ) {
            instance =
                createLuaValue(
                    className
                );
        } else {
            throw new Error(
                `Unsupported 2010 Instance class: ${className}`
            );
        }

        if (
            parent !== null &&
            parent !== undefined
        ) {
            instance.Parent =
                parent;

            refreshChildAliases(
                parent
            );
        }

        return instance;
    }
});

function getPartAABB(instance) {
    if (
        !instance ||
        !isA(instance, "BasePart") ||
        !instance.Position ||
        !instance.Size
    ) {
        return null;
    }

    const center = new THREE.Vector3(
        Number(instance.Position.X)||0,
        Number(instance.Position.Y)||0,
        Number(instance.Position.Z)||0
    );

    const half = new THREE.Vector3(
        Math.max(0.001, Number(instance.Size.X)||1) / 2,
        Math.max(0.001, Number(instance.Size.Y)||1) / 2,
        Math.max(0.001, Number(instance.Size.Z)||1) / 2
    );

    return new THREE.Box3(
        center.clone().sub(half),
        center.clone().add(half)
    );
}

function shouldIgnoreInstance(instance, ignore) {
    if (!ignore)
        return false;

    const ignored =
        Array.isArray(ignore)
            ? ignore
            : [ignore];

    for (const item of ignored) {
        if (!item)
            continue;

        if (instance === item)
            return true;

        let p = instance.Parent;

        while (p) {
            if (p === item)
                return true;

            p = p.Parent;
        }
    }

    return false;
}

function raycastLuaParts(
    origin,
    direction,
    ignore = null,
    maxDistance = null
) {
    const o =
        new THREE.Vector3(
            Number(origin?.X)||0,
            Number(origin?.Y)||0,
            Number(origin?.Z)||0
        );

    const rawDir =
        new THREE.Vector3(
            Number(direction?.X)||0,
            Number(direction?.Y)||0,
            Number(direction?.Z)||0
        );

    const rawLength =
        rawDir.length();

    if (rawLength <= 1e-9)
        return null;

    const distance =
        maxDistance === null
            ? rawLength
            : Math.max(0, Number(maxDistance)||0);

    const dir =
        rawDir.clone().normalize();

    const ray =
        new THREE.Ray(
            o,
            dir
        );

    let best = null;

    for (const instance of luaInstances) {
        if (
            !instance ||
            instance.__destroyed ||
            !isA(instance, "BasePart") ||
            !isInWorkspace(instance) ||
            shouldIgnoreInstance(
                instance,
                ignore
            )
        ) {
            continue;
        }

        const box =
            getPartAABB(
                instance
            );

        if (!box)
            continue;

        const hitPoint =
            ray.intersectBox(
                box,
                new THREE.Vector3()
            );

        if (!hitPoint)
            continue;

        const hitDistance =
            hitPoint.distanceTo(o);

        if (
            hitDistance >
            distance + 1e-6
        ) {
            continue;
        }

        if (
            !best ||
            hitDistance <
            best.distance
        ) {
            const epsilon =
                1e-4;

            const normal =
                new THREE.Vector3();

            if (
                Math.abs(
                    hitPoint.x -
                    box.min.x
                ) < epsilon
            ) {
                normal.set(-1,0,0);
            } else if (
                Math.abs(
                    hitPoint.x -
                    box.max.x
                ) < epsilon
            ) {
                normal.set(1,0,0);
            } else if (
                Math.abs(
                    hitPoint.y -
                    box.min.y
                ) < epsilon
            ) {
                normal.set(0,-1,0);
            } else if (
                Math.abs(
                    hitPoint.y -
                    box.max.y
                ) < epsilon
            ) {
                normal.set(0,1,0);
            } else if (
                Math.abs(
                    hitPoint.z -
                    box.min.z
                ) < epsilon
            ) {
                normal.set(0,0,-1);
            } else {
                normal.set(0,0,1);
            }

            best = {
                instance,
                point:
                    hitPoint.clone(),
                normal,
                distance:
                    hitDistance
            };
        }
    }

    return best;
}

// ─── Luau host collection compatibility ─────────────────────────────────────
//
// Raw JavaScript arrays exposed through luau-web don't behave exactly like
// native Luau arrays with #/ipairs. Query APIs therefore expose a small
// compatibility object:
//     result.Count
//     result.Length
//     result:Get(1)
//     result[1] ... result[n]
//
// This is an API compatibility fix, NOT one of the reverted performance
// optimizations.
function makeLuaCollection(items = []) {
    const values =
        Array.from(
            items || []
        );

    const table = {
        Count:
            values.length,

        Length:
            values.length,

        Get(...args) {
            const index =
                Math.trunc(
                    getNumberArg(
                        args,
                        1
                    ) || 1
                );

            if (
                index < 1 ||
                index > values.length
            ) {
                return null;
            }

            return values[
                index - 1
            ];
        },

        ToArray(...args) {
            return values.slice();
        }
    };

    for (
        let i = 0;
        i < values.length;
        i++
    ) {
        table[
            i + 1
        ] = values[i];
    }

    return Mutable(table);
}

workspaceApi.Raycast =
    (...args) => {
        const vectors =
            args.filter(v =>
                v &&
                typeof v === "object" &&
                "X" in v &&
                "Y" in v &&
                "Z" in v
            );

        const origin =
            vectors[0];

        const direction =
            vectors[1];

        const ignore =
            args.find(v =>
                Array.isArray(v) ||
                (
                    v &&
                    typeof v === "object" &&
                    v.ClassName
                )
            );

        const hit =
            raycastLuaParts(
                origin,
                direction,
                ignore
            );

        if (!hit)
            return null;

        return Mutable({
            Instance:

workspaceApi.FindPartsInRegion3 =
    (...args) => {
        const region =
            args.find(v =>
                v &&
                typeof v === "object" &&
                v.CFrame &&
                v.Size
            );

        const ignore =
            args.find(v =>
                v &&
                typeof v === "object" &&
                v !== region &&
                v.ClassName
            );

        const maxParts =
            getNumberArg(
                args,
                20
            );

        if (!region)
            return makeLuaCollection();

        const center =
            new THREE.Vector3(
                Number(region.CFrame?.X) || 0,
                Number(region.CFrame?.Y) || 0,
                Number(region.CFrame?.Z) || 0
            );

        const half =
            new THREE.Vector3(
                Math.abs(
                    Number(region.Size?.X) || 0
                ) / 2,

                Math.abs(
                    Number(region.Size?.Y) || 0
                ) / 2,

                Math.abs(
                    Number(region.Size?.Z) || 0
                ) / 2
            );

        const query =
            new THREE.Box3(
                center.clone().sub(half),
                center.clone().add(half)
            );

        const results = [];

        for (
            const instance of
            luaInstances
        ) {
            if (
                !isA(instance, "BasePart") ||
                !isInWorkspace(instance) ||
                shouldIgnoreInstance(
                    instance,
                    ignore
                )
            ) {
                continue;
            }

            const box =
                getPartAABB(
                    instance
                );

            if (
                box &&
                query.intersectsBox(box)
            ) {
                results.push(instance);

                if (
                    maxParts > 0 &&
                    results.length >= maxParts
                ) {
                    break;
                }
            }
        }

        return makeLuaCollection(
            results
        );
    };

        const query =

// ─── Phase 1: classic Roblox scripting runtime ────────────────────────────────
//
// The Luau VM already supplies the language itself:
//   if / elseif / else
//   while / repeat / for
//   functions / closures
//   coroutine
//   math / string / table
//
// This section supplies the Roblox host/runtime pieces those scripts expect:
//   wait(), spawn(), delay(), tick(), time()
//   task.wait/spawn/delay/defer
//   RunService.Stepped / Heartbeat / RenderStepped
//   Signal:Wait()
//
// Default legacy wait quantum. Old Roblox wait() generally yielded rather than
// busy-spinning the VM; keeping a small floor also prevents accidental
// `while true do wait() end` loops from monopolizing the browser.
const CLASSIC_WAIT_QUANTUM = 1 / 30;

// Timestamp used by time()/elapsedTime().
const SCRIPT_RUNTIME_START_MS = performance.now();

function normalizeWaitSeconds(value, defaultSeconds = CLASSIC_WAIT_QUANTUM) {
    const n = Number(value);

    if (!Number.isFinite(n))
        return defaultSeconds;

    return Math.max(0, n);
}

function sleepSeconds(seconds = CLASSIC_WAIT_QUANTUM) {
    const duration =
        normalizeWaitSeconds(
            seconds,
            CLASSIC_WAIT_QUANTUM
        );

    const started =
        performance.now();

    return new Promise(resolve => {
        // Even wait(0) yields to the browser instead of becoming a busy loop.
        const ms =
            Math.max(
                0,
                duration * 1000
            );

        setTimeout(
            () => {
                resolve(
                    (performance.now() - started) /
                    1000
                );
            },
            ms
        );
    });
}

// Legacy global wait(seconds).
// Returns actual elapsed seconds, matching classic Roblox's useful behavior.
async function classicWait(seconds = CLASSIC_WAIT_QUANTUM) {
    return await sleepSeconds(seconds);
}

function getLastCallableArgument(args) {
    for (let i = args.length - 1; i >= 0; i--) {
        if (typeof args[i] === "function")
            return args[i];
    }

    return null;
}
function getLastStringArgument(args, fallback = "") {
    for (let i = args.length - 1; i >= 0; i--) {
        if (typeof args[i] === "string")
            return args[i];
    }

    return fallback;
}


function getFirstNumericArgument(args, fallback = 0) {
    for (const arg of args) {
        if (typeof arg === "number" && Number.isFinite(arg))
            return arg;
    }

    return fallback;
}

function reportScheduledLuaError(label, error) {
    console.error(
        `[Lua] ${label}:`,
        error
    );
}

function invokeScheduledLuaFunction(callback, label, ...args) {
    try {
        const result =
            callback(...args);

        if (
            result &&
            typeof result.catch === "function"
        ) {
            result.catch(error =>
                reportScheduledLuaError(
                    label,
                    error
                )
            );
        }

        return result;
    } catch (error) {
        reportScheduledLuaError(
            label,
            error
        );

        return null;
    }
}

// Classic spawn(function).
// Schedules instead of running inline so the caller can continue.
function classicSpawn(...args) {
    const callback =
        getLastCallableArgument(args);

    if (!callback)
        throw new Error(
            "spawn expected a function"
        );

    setTimeout(
        () =>
            invokeScheduledLuaFunction(
                callback,
                "spawn callback"
            ),
        0
    );
}

// Classic delay(seconds, function).
function classicDelay(...args) {
    const callback =
        getLastCallableArgument(args);

    if (!callback)
        throw new Error(
            "delay expected a function"
        );

    const seconds =
        getFirstNumericArgument(
            args,
            0
        );

    setTimeout(
        () =>
            invokeScheduledLuaFunction(
                callback,
                "delay callback"
            ),
        Math.max(
            0,
            seconds * 1000
        )
    );
}

// Modern-style task table is included as a convenience while keeping the
// classic globals above. It is useful for emulator scripts even though the
// legacy globals remain the 2010-oriented API.
const TaskApi = Mutable({
    wait: classicWait,

    spawn(...args) {
        return classicSpawn(...args);
    },

    defer(...args) {
        const callback =
            getLastCallableArgument(args);

        if (!callback)
            throw new Error(
                "task.defer expected a function"
            );

        queueMicrotask(
            () =>
                invokeScheduledLuaFunction(
                    callback,
                    "task.defer callback"
                )
        );
    },

    delay(...args) {
        return classicDelay(...args);
    }
});

function updateMouseRay() {
    const rect =
        canvas.getBoundingClientRect();

    const ndc =
        new THREE.Vector2(
            (
                (
                    MouseApi.X -
                    rect.left
                ) /
                Math.max(
                    1,
                    rect.width
                )
            ) *
            2 -
            1,
            -(
                (
                    MouseApi.Y -
                    rect.top
                ) /
                Math.max(
                    1,
                    rect.height
                )
            ) *
            2 +
            1
        );

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        ndc,
        camera
    );

    const origin =
        createVector3(
            raycaster.ray.origin.x,
            raycaster.ray.origin.y,
            raycaster.ray.origin.z
        );

    const direction =
        createVector3(
            raycaster.ray.direction.x * 1000,
            raycaster.ray.direction.y * 1000,
            raycaster.ray.direction.z * 1000
        );

    const hit =
        raycastLuaParts(
            origin,
            direction,
            currentCharacterModel
        );

    if (hit) {
        MouseApi.Target =
            hit.instance;

        MouseApi.Hit =
            createCFrame(
                hit.point.x,
                hit.point.y,
                hit.point.z
            );

        if (Math.abs(hit.normal.y) > 0.5) {
            MouseApi.TargetSurface =
                hit.normal.y > 0
                    ? "Top"
                    : "Bottom";
        } else if (
            Math.abs(hit.normal.x) > 0.5
        ) {
            MouseApi.TargetSurface =
                hit.normal.x > 0
                    ? "Right"
                    : "Left";
        } else {
            MouseApi.TargetSurface =
                hit.normal.z > 0
                    ? "Back"
                    : "Front";
        }
    } else {
        MouseApi.Target = null;

        const p =
            raycaster.ray.origin
                .clone()
                .add(
                    raycaster.ray.direction
                        .clone()
                        .multiplyScalar(
                            1000
                        )
                );

        MouseApi.Hit =
            createCFrame(
                p.x,
                p.y,
                p.z
            );
    }
}

function fireContextActions(
    keyCode,
    state,
    inputObject
) {
    for (
        const [name, binding] of
        contextBindings
    ) {
        if (
            !binding.keyCodes.length ||
            binding.keyCodes.includes(
                keyCode
            )
        ) {
            try {
                binding.callback(
                    name,
                    state,
                    inputObject
                );
            } catch (error) {
                console.error(
                    "[ContextActionService]",
                    error
                );
            }
        }
    }
}

        CLASSIC_BRICK_COLOR_LIST.map(

                entry.Name,

            ]
        )
    );

const CLASSIC_BRICK_COLOR_BY_NAME =
    new Map(
        CLASSIC_BRICK_COLOR_LIST.map(
            entry => [
                entry.Name.toLowerCase(),
                entry
            ]
        )
    );

const CLASSIC_BRICK_COLOR_BY_NUMBER =
    new Map(
        CLASSIC_BRICK_COLOR_LIST.map(
            entry => [
                entry.Number,
                entry
            ]
        )
    );

function makeBrickColor(entry) {
    return Mutable({
        Name:
            entry.Name,

        Number:
            entry.Number,

        Color:
            createColor3(
                entry.RGB[0] / 255,
                entry.RGB[1] / 255,
                entry.RGB[2] / 255
            ),

        r:
            entry.RGB[0] / 255,

        g:
            entry.RGB[1] / 255,

        b:
            entry.RGB[2] / 255
    });
}

function nearestBrickColorFromColor3(color) {
    const r =
        THREE.MathUtils.clamp(
            Number(color?.R) || 0,
            0,
            1
        ) * 255;

    const g =
        THREE.MathUtils.clamp(
            Number(color?.G) || 0,
            0,
            1
        ) * 255;

    const b =
        THREE.MathUtils.clamp(
            Number(color?.B) || 0,
            0,
            1
        ) * 255;

    let best =
        CLASSIC_BRICK_COLOR_BY_NAME.get(
            "medium stone grey"
        );

    let bestDistance =
        Infinity;

    for (
        const entry of
        CLASSIC_BRICK_COLOR_LIST
    ) {
        const dr =
            entry.RGB[0] - r;

        const dg =
            entry.RGB[1] - g;

        const db =
            entry.RGB[2] - b;

        const distance =
            dr * dr +
            dg * dg +
            db * db;

        if (
            distance <
            bestDistance
        ) {
            bestDistance =
                distance;

            best =
                entry;
        }
    }

    return best;
}

const BrickColorApi = Mutable({
    new(...args) {
        const values =
            args.filter(arg =>
                arg !== BrickColorApi
            );

        const value =
            values.length
                ? values[
                    values.length - 1
                ]
                : "Medium stone grey";

        let entry = null;

        if (
            typeof value === "string"
        ) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NAME.get(
                    value.toLowerCase()
                );
        } else if (
            typeof value === "number"
        ) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NUMBER.get(
                    Math.trunc(value)
                );
        } else if (
            value &&
            typeof value === "object"
        ) {
            if (
                typeof value.Number ===
                "number"
            ) {
                entry =
                    CLASSIC_BRICK_COLOR_BY_NUMBER.get(
                        Math.trunc(
                            value.Number
                        )
                    );
            }

            if (
                !entry &&
                typeof value.Name ===
                "string"
            ) {
                entry =
                    CLASSIC_BRICK_COLOR_BY_NAME.get(
                        value.Name.toLowerCase()
                    );
            }

            if (
                !entry &&
                "R" in value &&
                "G" in value &&
                "B" in value
            ) {
                entry =
                    nearestBrickColorFromColor3(
                        value
                    );
            }
        }

        if (!entry) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NAME.get(
                    "medium stone grey"
                );
        }

        return makeBrickColor(
            entry
        );
    },

    palette(...args) {
        const index =
            Math.abs(
                Math.trunc(
                    getNumberArg(
                        args,
                        0
                    ) || 0
                )
            );

        const entry =
            CLASSIC_BRICK_COLOR_LIST[
                index %
                CLASSIC_BRICK_COLOR_LIST.length
            ];

        return makeBrickColor(
            entry
        );
    },

    random(...args) {
        const entry =
            CLASSIC_BRICK_COLOR_LIST[
                Math.floor(
                    Math.random() *
                    CLASSIC_BRICK_COLOR_LIST.length
                )
            ];

        return makeBrickColor(
            entry
        );
    }
});

function syncLuaValueObjects() {
    for (
        const instance of
        [...luaValueObjects]
    ) {
        if (
            !instance ||
            instance.__destroyed
        ) {
            continue;
        }

        const coerced =
            coerceValueObjectValue(
                instance.ClassName,
                instance.Value
            );

        if (
            coerced !==
            instance.Value
        ) {
            instance.Value =
                coerced;
        }

        if (
            instance.Value !==
            instance.__lastValue
        ) {
            instance.__lastValue =
                instance.Value;

            // ValueBase.Changed historically passes the new value.
            fireLuaSignal(
                instance.Changed,
                instance.Value
            );
        }
    }
}

let currentPlayerHumanoid = null;
let currentCharacterModel = null;
const characterVisualBindings = [];


function syncHumanoids() {
    for (
        const humanoid of
        [...luaHumanoids]
    ) {
        if (
            !humanoid ||
            humanoid.__destroyed
        ) {
            continue;
        }

        const last =
            humanoid.__humanoidLast;

        const maxHealth =
            Math.max(
                0,
                Number(
                    humanoid.MaxHealth
                ) || 0
            );

        humanoid.MaxHealth =
            maxHealth;

        const health =
            THREE.MathUtils.clamp(
                Number(
                    humanoid.Health
                ) || 0,
                0,
                maxHealth
            );

        if (
            humanoid.Health !==
            health
        ) {
            humanoid.Health =
                health;
        }

        if (
            last.MaxHealth !==
            maxHealth
        ) {
            last.MaxHealth =
                maxHealth;

            fireChanged(
                humanoid,
                "MaxHealth"
            );
        }

        if (
            last.Health !==
            health
        ) {
            last.Health =
                health;

            fireChanged(
                humanoid,
                "Health"
            );

            fireLuaSignal(
                humanoid.HealthChanged,
                health
            );
        }

        for (
            const propertyName of
            [
                "WalkSpeed",
                "JumpPower",
                "Jump",
                "Sit",
                "PlatformStand"
            ]
        ) {
            if (
                last[propertyName] !==
                humanoid[propertyName]
            ) {
                last[propertyName] =
                    humanoid[propertyName];

                fireChanged(
                    humanoid,
                    propertyName
                );
            }
        }

        if (
            health <= 0 &&
            !humanoid.__dead
        ) {
            humanoid.__dead =
                true;

            fireLuaSignal(
                humanoid.Died
            );

            if (
                humanoid ===
                currentPlayerHumanoid
            ) {
                breakCharacterJoints();
            }

            console.log(
                "[Humanoid] Died"
            );
        }

        if (
            health > 0 &&
            humanoid.__dead &&
            !(
                humanoid === currentPlayerHumanoid &&
                characterJointsBroken
            )
        ) {
            humanoid.__dead =
                false;
        }
    }

    if (
        currentPlayerHumanoid &&
        !currentPlayerHumanoid.__destroyed
    ) {
        const h =
            currentPlayerHumanoid;

        const bodyVel =
            playerBody.linvel();

        const horizontalSpeed =
            Math.hypot(
                bodyVel.x,
                bodyVel.z
            );

        let state =
            "Running";

        if (h.__dead) {
            state = "Dead";
        } else if (h.PlatformStand) {
            state = "PlatformStanding";
        } else if (h.Sit) {
            state = "Seated";
        } else if (!playerState.grounded) {
            state =
                bodyVel.y > 1
                    ? "Jumping"
                    : "Freefall";
        }

        const oldState =
            h.__humanoidLast.State ||
            "Running";

        if (state !== oldState) {
            h.__humanoidLast.State =
                state;

            fireLuaSignal(
                h.StateChanged,
                oldState,
                state
            );

            if (state === "Jumping") {
                fireLuaSignal(
                    h.Jumping,
                    true
                );
            }

            if (state === "Freefall") {
                fireLuaSignal(
                    h.FreeFalling,
                    true
                );
            }
        }

        if (
            Math.abs(
                horizontalSpeed -
                (
                    h.__humanoidLast.RunningSpeed ||
                    0
                )
            ) > 0.05
        ) {
            h.__humanoidLast.RunningSpeed =
                horizontalSpeed;

            fireLuaSignal(
                h.Running,
                horizontalSpeed
            );
        }

        h.FloorMaterial =
            playerState.grounded
                ? "Plastic"
                : "Air";

        if (h.__moveToTarget) {
            const pos =
                playerBody.translation();

            const target =
                new THREE.Vector3(
                    h.__moveToTarget.X,
                    h.__moveToTarget.Y,
                    h.__moveToTarget.Z
                );

            const deltaTo =
                target.sub(
                    new THREE.Vector3(
                        pos.x,
                        pos.y,
                        pos.z
                    )
                );

            deltaTo.y = 0;

            if (
                deltaTo.length() <
                0.5
            ) {
                h.__moveToTarget =
                    null;

                h.MoveDirection =
                    createVector3();
            } else {
                deltaTo.normalize();

                h.MoveDirection =
                    createVector3(
                        deltaTo.x,
                        0,
                        deltaTo.z
                    );
            }
        }

        // Public Roblox WalkSpeed remains 16 by default. The emulator's
        // historical movement scale is ~1/3 of that value.
        playerState.moveSpeed =
            Math.max(
                0,
                Number(
                    currentPlayerHumanoid.WalkSpeed
                ) || 0
            ) / 3;

        // Preserve the current jump feel while exposing familiar JumpPower=50.
        playerState.jumpPower =
            Math.max(
                0,
                Number(
                    currentPlayerHumanoid.JumpPower
                ) || 0
            ) * (23 / 50);
    }
}
