function resetPlayerGuiFromStarterGui() {
    if (typeof PlayerGuiApi==="undefined") return;
    for (const child of [...getLuaChildren(PlayerGuiApi)]) child.Destroy();
    starterGuiCloneMap.clear();
}

function syncLuaScreenGuis() {
    syncStarterGuiToPlayerGui();

    for (const gui of [...luaScreenGuis]) {
        if (gui && !gui.__destroyed) syncLuaGuiObject(gui);
    }

    for (const o of [...luaGuiObjects]) {
        if (!o || o.__destroyed) continue;

        let p=o.Parent,inBillboard=false;
        while (p) {
            if (p.ClassName==="BillboardGui"){inBillboard=true;break;}
            p=p.Parent;
        }

        if (inBillboard) {
            o.__guiElement?.remove?.();
            continue;
        }

        syncLuaGuiObject(o);
    }
}

function disconnectClassicGuiSignals(o) {
    for (const n of [
        "MouseEnter","MouseLeave","MouseMoved","DragBegin","DragStopped",
        "MouseButton1Click","MouseButton1Down","MouseButton1Up",
        "MouseButton2Click","MouseButton2Down","MouseButton2Up",
        "Focused","FocusLost"
    ]) disconnectLuaSignal(o?.[n]);
}

// ─── BillboardGui + ImageLabel ───────────────────────────────────────────────
//
// This is a compact classic billboard implementation. ImageLabel is included
// so BillboardGui can display script-controlled images without adding the full
// modern Roblox GUI stack.
function createLuaBillboardGui() {
    const gui =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "BillboardGui",

                ClassName:
                    "BillboardGui",

                Parent:
                    null,

                Archivable:
                    true,

                Adornee:
                    null,

                Size:
                    createUDim2(
                        0,
                        100,
                        0,
                        100
                    ),

                StudsOffset:
                    createVector3(
                        0,
                        0,
                        0
                    ),

                Enabled:
                    true,

                AlwaysOnTop:
                    false
            })
        );

    const sprite =
        new THREE.Sprite(
            new THREE.SpriteMaterial({
                color:
                    0xffffff,

                transparent:
                    true,

                opacity:
                    1,

                depthWrite:
                    false
            })
        );

    sprite.visible =
        false;

    scene.add(
        sprite
    );

    Object.defineProperty(
        gui,
        "__billboardSprite",
        {
            value:
                sprite,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        gui,
        "__lastBillboard",
        {
            value: {
                Texture:
                    "",

                Color:
                    "",

                Transparency:
                    NaN
            },

            writable:
                true,

            enumerable:
                false
        }
    );

    luaBillboardGuis.add(
        gui
    );

    return gui;
}

function createLuaImageLabel() {
    return createLuaGuiObject("ImageLabel");
}

function getBillboardImageLabel(gui) {
    for (
        const child of
        getLuaChildren(
            gui
        )
    ) {
        if (
            child &&
            !child.__destroyed &&
            child.ClassName ===
                "ImageLabel"
        ) {
            return child;
        }
    }

    return null;
}

function getBillboardWorldPosition(gui) {
    const adornee =
        gui.Adornee &&
        isA(
            gui.Adornee,
            "BasePart"
        )
            ? gui.Adornee
            : (
                gui.Parent &&
                isA(
                    gui.Parent,
                    "BasePart"
                )
                    ? gui.Parent
                    : null
            );

    if (!adornee)
        return null;

    const p =
        adornee.Position;

    if (!p)
        return null;

    const offset =
        gui.StudsOffset ||
        createVector3(
            0,
            0,
            0
        );

    return new THREE.Vector3(
        (Number(p.X) || 0) +
            (Number(offset.X) || 0),

        (Number(p.Y) || 0) +
            (Number(offset.Y) || 0),

        (Number(p.Z) || 0) +
            (Number(offset.Z) || 0)
    );
}

function udim2ToWorldScale(
    size,
    baseWidth = 4,
    baseHeight = 4
) {
    const xScale =
        Number(
            size?.X?.Scale
        ) || 0;

    const xOffset =
        Number(
            size?.X?.Offset
        ) || 0;

    const yScale =
        Number(
            size?.Y?.Scale
        ) || 0;

    const yOffset =
        Number(
            size?.Y?.Offset
        ) || 0;

    return {
        x:
            Math.max(
                0.01,
                xScale *
                    baseWidth +
                xOffset /
                    50
            ),

        y:
            Math.max(
                0.01,
                yScale *
                    baseHeight +
                yOffset /
                    50
            )
    };
}


const billboardGuiCanvasCache=new WeakMap();
const billboardImageCache=new Map();

function billboardCanvas(gui){
    let r=billboardGuiCanvasCache.get(gui);
    if(r)return r;
    const canvas=document.createElement("canvas");
    canvas.width=256;canvas.height=256;
    const texture=new THREE.CanvasTexture(canvas);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.minFilter=THREE.LinearFilter;
    texture.magFilter=THREE.LinearFilter;
    r={canvas,texture};
    billboardGuiCanvasCache.set(gui,r);
    return r;
}

function billboardImage(path){
    if(!path)return null;
    let r=billboardImageCache.get(path);
    if(r)return r;
    const image=new Image();
    r={image,loaded:false};
    image.onload=()=>r.loaded=true;
    image.src=path;
    billboardImageCache.set(path,r);
    return r;
}

function billboardExtended(gui){
    return getLuaDescendants(gui).some(c=>c && !c.__destroyed && c.ClassName!=="ImageLabel");
}

function billboardRect(o,p){
    const pos=o.Position||createUDim2(), size=o.Size||createUDim2(1,0,1,0);
    return {
        x:p.x+p.w*(Number(pos.X?.Scale)||0)+(Number(pos.X?.Offset)||0),
        y:p.y+p.h*(Number(pos.Y?.Scale)||0)+(Number(pos.Y?.Offset)||0),
        w:Math.max(0,p.w*(Number(size.X?.Scale)||0)+(Number(size.X?.Offset)||0)),
        h:Math.max(0,p.h*(Number(size.Y?.Scale)||0)+(Number(size.Y?.Offset)||0))
    };
}

function drawBillboardGuiObject(ctx,o,parentRect){
    if(!o||o.__destroyed||o.Visible===false)return;
    const r=billboardRect(o,parentRect);
    const ba=1-THREE.MathUtils.clamp(Number(o.BackgroundTransparency)||0,0,1);
    if(ba>0.001){
        ctx.fillStyle=color3ToCss(o.BackgroundColor3,ba);
        ctx.fillRect(r.x,r.y,r.w,r.h);
    }
    const bs=Math.max(0,Math.trunc(Number(o.BorderSizePixel)||0));
    if(bs>0){
        ctx.strokeStyle=color3ToCss(o.BorderColor3,1);
        ctx.lineWidth=bs;
        ctx.strokeRect(r.x+bs/2,r.y+bs/2,Math.max(0,r.w-bs),Math.max(0,r.h-bs));
    }

    if(o.ClassName==="ImageLabel"||o.ClassName==="ImageButton"){
        const id=normalizeLocalTextureId(o.Image);
        const path=id?getLocalTexturePath(id):"";
        const ir=billboardImage(path);
        if(ir?.loaded){
            ctx.save();
            ctx.globalAlpha=1-THREE.MathUtils.clamp(Number(o.ImageTransparency)||0,0,1);
            ctx.drawImage(ir.image,r.x,r.y,r.w,r.h);
            ctx.restore();
        }
    }

    if(o.ClassName==="TextLabel"||o.ClassName==="TextButton"||o.ClassName==="TextBox"){
        ctx.save();
        const px=guiFontPx(o.FontSize);
        ctx.font=`${String(o.Font)==="ArialBold"?"bold ":""}${px}px Arial`;
        ctx.textBaseline="middle";
        const xa=String(o.TextXAlignment);
        ctx.textAlign=xa==="Left"?"left":xa==="Right"?"right":"center";
        const x=xa==="Left"?r.x+2:xa==="Right"?r.x+r.w-2:r.x+r.w/2;
        ctx.fillStyle=color3ToCss(o.TextColor3,1-THREE.MathUtils.clamp(Number(o.TextTransparency)||0,0,1));
        ctx.fillText(String(o.Text??""),x,r.y+r.h/2,Math.max(0,r.w-4));
        ctx.restore();
    }

    const children=getLuaChildren(o)
        .filter(c=>isA(c,"GuiObject"))
        .sort((a,b)=>(Number(a.ZIndex)||1)-(Number(b.ZIndex)||1));
    for(const c of children)drawBillboardGuiObject(ctx,c,r);
}

function renderExtendedBillboardGui(gui,material){
    const rec=billboardCanvas(gui),ctx=rec.canvas.getContext("2d");
    ctx.clearRect(0,0,rec.canvas.width,rec.canvas.height);
    const children=getLuaChildren(gui)
        .filter(c=>isA(c,"GuiObject"))
        .sort((a,b)=>(Number(a.ZIndex)||1)-(Number(b.ZIndex)||1));
    for(const c of children)drawBillboardGuiObject(ctx,c,{x:0,y:0,w:rec.canvas.width,h:rec.canvas.height});
    rec.texture.needsUpdate=true;
    material.map=rec.texture;
    material.color.setHex(0xffffff);
    material.opacity=1;
    material.needsUpdate=true;
    return children.length>0;
}

function syncLuaBillboardGuis() {
    for (
        const gui of
        [...luaBillboardGuis]
    ) {
        if (
            !gui ||
            gui.__destroyed
        ) {
            continue;
        }

        const sprite =
            gui.__billboardSprite;

        const material =
            sprite?.material;

        const last =
            gui.__lastBillboard;

        if (
            !sprite ||
            !material ||
            !last
        ) {
            continue;
        }

        const image =
            getBillboardImageLabel(
                gui
            );

        const hasExtendedGui =
            billboardExtended(
                gui
            );

        const worldPosition =
            getBillboardWorldPosition(
                gui
            );

        if (
            !gui.Enabled ||
            !worldPosition ||
            (
                !hasExtendedGui &&
                (
                    !image ||
                    image.Visible === false
                )
            )
        ) {
            sprite.visible =
                false;

            continue;
        }

        if (hasExtendedGui) {
            const rendered =
                renderExtendedBillboardGui(
                    gui,
                    material
                );

            material.depthTest =
                !Boolean(
                    gui.AlwaysOnTop
                );

            sprite.renderOrder =
                gui.AlwaysOnTop
                    ? 100
                    : 4;

            sprite.position.copy(
                worldPosition
            );

            const scale =
                udim2ToWorldScale(
                    gui.Size
                );

            sprite.scale.set(
                scale.x,
                scale.y,
                1
            );

            sprite.visible =
                rendered;

            continue;
        }

        const normalizedTexture =
            normalizeLocalTextureId(
                image.Image
            );

        if (
            normalizedTexture !==
            image.Image
        ) {
            image.Image =
                normalizedTexture;
        }

        if (
            normalizedTexture !==
            last.Texture
        ) {
            material.map =
                normalizedTexture
                    ? getLocalTexture(
                        normalizedTexture
                    )
                    : null;

            material.needsUpdate =
                true;

            last.Texture =
                normalizedTexture;
        }

        const transparency =
            THREE.MathUtils.clamp(
                Number(
                    image.ImageTransparency
                ) || 0,
                0,
                1
            );

        material.opacity =
            1 -
            transparency;

        const color =
            color3ToThree(
                image.ImageColor3
            );

        material.color.copy(
            color
        );

        material.depthTest =
            !Boolean(
                gui.AlwaysOnTop
            );

        sprite.renderOrder =
            gui.AlwaysOnTop
                ? 100
                : 4;

        sprite.position.copy(
            worldPosition
        );

        const scale =
            udim2ToWorldScale(
                gui.Size
            );

        sprite.scale.set(
            scale.x,
            scale.y,
            1
        );

        sprite.visible =
            Boolean(
                normalizedTexture
            ) &&
            transparency <
                1;
    }
}


// ─── ParticleEmitter ─────────────────────────────────────────────────────────
function getNumberRangeMinMax(
    range,
    fallbackMin = 0,
    fallbackMax = fallbackMin
) {
    if (
        range &&
        typeof range === "object"
    ) {
        const min =
            Number(
                range.Min
            );

        const max =
            Number(
                range.Max
            );

        if (
            Number.isFinite(min) &&
            Number.isFinite(max)
        ) {
            return {
                min:
                    Math.min(
                        min,
                        max
                    ),

                max:
                    Math.max(
                        min,
                        max
                    )
            };
        }
    }

    const n =
        Number(
            range
        );

    if (
        Number.isFinite(n)
    ) {
        return {
            min: n,
            max: n
        };
    }

    return {
        min:
            fallbackMin,

        max:
            fallbackMax
    };
}

function randomRange(range, fallback = 0) {
    const {
        min,
        max
    } =
        getNumberRangeMinMax(
            range,
            fallback,
            fallback
        );

    return (
        min +
        Math.random() *
            (max - min)
    );
}

function getNumberSequenceValue(
    sequence,
    alpha,
    fallback = 1
) {
    const points =
        sequence?.Keypoints;

    if (
        !points ||
        points.length === 0
    ) {
        return Number(
            sequence
        ) || fallback;
    }

    if (
        points.length === 1
    ) {
        return (
            Number(
                points[0]?.Value
            ) || 0
        );
    }

    const a =
        THREE.MathUtils.clamp(
            alpha,
            0,
            1
        );

    let left =
        points[0];

    let right =
        points[
            points.length -
            1
        ];

    for (
        let i = 0;
        i <
        points.length -
            1;
        i++
    ) {
        const p0 =
            points[i];

        const p1 =
            points[i + 1];

        const t0 =
            Number(
                p0?.Time
            ) || 0;

        const t1 =
            Number(
                p1?.Time
            ) || 1;

        if (
            a >= t0 &&
            a <= t1
        ) {
            left = p0;
            right = p1;
            break;
        }
    }

    const t0 =
        Number(
            left?.Time
        ) || 0;

    const t1 =
        Number(
            right?.Time
        ) || 1;

    const span =
        Math.max(
            1e-6,
            t1 - t0
        );

    const local =
        THREE.MathUtils.clamp(
            (a - t0) /
                span,
            0,
            1
        );

    return THREE.MathUtils.lerp(
        Number(
            left?.Value
        ) || 0,
        Number(
            right?.Value
        ) || 0,
        local
    );
}

function getColorSequenceValue(
    sequence,
    alpha
) {
    const points =
        sequence?.Keypoints;

    if (
        !points ||
        points.length === 0
    ) {
        if (
            sequence &&
            sequence.R !==
                undefined
        ) {
            return color3ToThree(
                sequence
            );
        }

        return new THREE.Color(
            0xffffff
        );
    }

    const a =
        THREE.MathUtils.clamp(
            alpha,
            0,
            1
        );

    let left =
        points[0];

    let right =
        points[
            points.length -
            1
        ];

    for (
        let i = 0;
        i <
        points.length -
            1;
        i++
    ) {
        const p0 =
            points[i];

        const p1 =
            points[i + 1];

        const t0 =
            Number(
                p0?.Time
            ) || 0;

        const t1 =
            Number(
                p1?.Time
            ) || 1;

        if (
            a >= t0 &&
            a <= t1
        ) {
            left = p0;
            right = p1;
            break;
        }
    }

    const t0 =
        Number(
            left?.Time
        ) || 0;

    const t1 =
        Number(
            right?.Time
        ) || 1;

    const span =
        Math.max(
            1e-6,
            t1 - t0
        );

    const local =
        THREE.MathUtils.clamp(
            (a - t0) /
                span,
            0,
            1
        );

    const c0 =
        color3ToThree(
            left?.Value
        );

    const c1 =
        color3ToThree(
            right?.Value
        );

    return c0.lerp(
        c1,
        local
    );
}

function getEmitterWorldPosition(emitter) {
    const parent =
        emitter?.Parent;

    if (
        parent &&
        isA(
            parent,
            "BasePart"
        ) &&
        parent.Position
    ) {
        return new THREE.Vector3(
            Number(parent.Position.X) || 0,
            Number(parent.Position.Y) || 0,
            Number(parent.Position.Z) || 0
        );
    }

    return null;
}

function createVisualParticle({
    textureId = "",
    position = new THREE.Vector3(),
    velocity = new THREE.Vector3(),
    acceleration = new THREE.Vector3(),
    drag = 0,
    life = 1,
    rotation = 0,
    rotSpeed = 0,
    sizeSequence = null,
    transparencySequence = null,
    colorSequence = null,
    lightEmission = 0,
    startSize = 1,
    endSize = 1,
    startTransparency = 0,
    endTransparency = 1,
    color = new THREE.Color(0xffffff)
}) {
    const texture =
        textureId
            ? getLocalTexture(
                textureId
            )
            : null;

    const material =
        new THREE.SpriteMaterial({
            map:
                texture,

            color:
                color,

            transparent:
                true,

            opacity:
                1,

            depthWrite:
                false,

            blending:
                Number(
                    lightEmission
                ) >
                0.05
                    ? THREE.AdditiveBlending
                    : THREE.NormalBlending
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.position.copy(
        position
    );

    sprite.material.rotation =
        THREE.MathUtils.degToRad(
            rotation
        );

    scene.add(
        sprite
    );

    const particle = {
        sprite,
        material,
        velocity:
            velocity.clone(),
        acceleration:
            acceleration.clone(),
        drag:
            Math.max(
                0,
                Number(drag) || 0
            ),
        age:
            0,
        life:
            Math.max(
                0.01,
                Number(life) || 1
            ),
        rotSpeed:
            THREE.MathUtils.degToRad(
                Number(
                    rotSpeed
                ) || 0
            ),
        sizeSequence,
        transparencySequence,
        colorSequence,
        startSize:
            Math.max(
                0.001,
                Number(
                    startSize
                ) || 1
            ),
        endSize:
            Math.max(
                0.001,
                Number(
                    endSize
                ) || 1
            ),
        startTransparency:
            THREE.MathUtils.clamp(
                Number(
                    startTransparency
                ) || 0,
                0,
                1
            ),
        endTransparency:
            THREE.MathUtils.clamp(
                Number(
                    endTransparency
                ) || 1,
                0,
                1
            ),
        baseColor:
            color.clone()
    };

    activeVisualParticles.add(
        particle
    );

    return particle;
}

function createLuaParticleEmitter() {
    const emitter =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "ParticleEmitter",

                ClassName:
                    "ParticleEmitter",

                Parent:
                    null,

                Archivable:
                    true,

                Texture:
                    "",

                Enabled:
                    true,

                Rate:
                    20,

                Lifetime:
                    createNumberRange(
                        1,
                        1
                    ),

                Speed:
                    createNumberRange(
                        5,
                        5
                    ),

                SpreadAngle:
                    createVector3(
                        0,
                        0,
                        0
                    ),

                Rotation:
                    createNumberRange(
                        0,
                        0
                    ),

                RotSpeed:
                    createNumberRange(
                        0,
                        0
                    ),

                Size:
                    createNumberSequence(
                        1
                    ),

                Transparency:
                    createNumberSequence(
                        0
                    ),

                Color:
                    createColorSequence(
                        createColor3(
                            1,
                            1,
                            1
                        )
                    ),

                LightEmission:
                    0,

                Acceleration:
                    createVector3(
                        0,
                        0,
                        0
                    ),

                Drag:
                    0,

                VelocityInheritance:
                    0,

                ZOffset:
                    0
            })
        );

    Object.defineProperty(
        emitter,
        "__particleAccumulator",
        {
            value:
                0,

            writable:
                true,

            enumerable:
                false
        }
    );

    emitter.Emit =
        (...args) => {
            const count =
                Math.max(
                    0,
                    Math.min(
                        1000,
                        Math.floor(
                            getNumberArg(
                                args,
                                1
                            ) || 0
                        )
                    )
                );

            emitFromLuaParticleEmitter(
                emitter,
                count
            );
        };

    luaParticleEmitters.add(
        emitter
    );

    return emitter;
}

function emitFromLuaParticleEmitter(
    emitter,
    count
) {
    if (
        !emitter ||
        emitter.__destroyed ||
        count <= 0
    ) {
        return;
    }

    const origin =
        getEmitterWorldPosition(
            emitter
        );

    if (!origin)
        return;

    const normalizedTexture =
        normalizeLocalTextureId(
            emitter.Texture
        );

    if (
        normalizedTexture !==
        emitter.Texture
    ) {
        emitter.Texture =
            normalizedTexture;
    }

    const parentVelocity =
        emitter.Parent?.Velocity;

    const inherit =
        THREE.MathUtils.clamp(
            Number(
                emitter.VelocityInheritance
            ) || 0,
            0,
            1
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {
        const yaw =
            Math.random() *
            Math.PI *
            2;

        const spreadX =
            THREE.MathUtils.degToRad(
                Math.abs(
                    Number(
                        emitter.SpreadAngle?.X
                    ) || 0
                )
            );

        const spreadY =
            THREE.MathUtils.degToRad(
                Math.abs(
                    Number(
                        emitter.SpreadAngle?.Y
                    ) || 0
                )
            );

        const pitch =
            (
                Math.random() -
                0.5
            ) *
            spreadY;

        const yawOffset =
            (
                Math.random() -
                0.5
            ) *
            spreadX;

        // Local +Y is the default emission direction.
        const direction =
            new THREE.Vector3(
                Math.sin(
                    yaw +
                    yawOffset
                ) *
                    Math.cos(
                        pitch
                    ),
                Math.cos(
                    pitch
                ),
                Math.cos(
                    yaw +
                    yawOffset
                ) *
                    Math.sin(
                        pitch
                    )
            );

        if (
            direction.lengthSq() <
            1e-8
        ) {
            direction.set(
                0,
                1,
                0
            );
        }

        direction.normalize();

        const speed =
            randomRange(
                emitter.Speed,
                5
            );

        const velocity =
            direction.multiplyScalar(
                speed
            );

        if (
            parentVelocity
        ) {
            velocity.add(
                new THREE.Vector3(
                    Number(
                        parentVelocity.X
                    ) || 0,
                    Number(
                        parentVelocity.Y
                    ) || 0,
                    Number(
                        parentVelocity.Z
                    ) || 0
                ).multiplyScalar(
                    inherit
                )
            );
        }

        const acceleration =
            new THREE.Vector3(
                Number(
                    emitter.Acceleration?.X
                ) || 0,
                Number(
                    emitter.Acceleration?.Y
                ) || 0,
                Number(
                    emitter.Acceleration?.Z
                ) || 0
            );

        const life =
            randomRange(
                emitter.Lifetime,
                1
            );

        createVisualParticle({
            textureId:
                normalizedTexture,

            position:
                origin,

            velocity,

            acceleration,

            drag:
                emitter.Drag,

            life,

            rotation:
                randomRange(
                    emitter.Rotation,
                    0
                ),

            rotSpeed:
                randomRange(
                    emitter.RotSpeed,
                    0
                ),

            sizeSequence:
                emitter.Size,

            transparencySequence:
                emitter.Transparency,

            colorSequence:
                emitter.Color,

            lightEmission:
                emitter.LightEmission
        });
    }
}

function syncLuaParticleEmitters(
    delta
) {
    for (
        const emitter of
        [...luaParticleEmitters]
    ) {
        if (
            !emitter ||
            emitter.__destroyed ||
            !emitter.Enabled ||
            !isInWorkspace(
                emitter
            )
        ) {
            continue;
        }

        const rate =
            Math.max(
                0,
                Number(
                    emitter.Rate
                ) || 0
            );

        emitter.__particleAccumulator +=
            rate *
            delta;

        const count =
            Math.floor(
                emitter.__particleAccumulator
            );

        if (
            count >
            0
        ) {
            emitter.__particleAccumulator -=
                count;

            emitFromLuaParticleEmitter(
                emitter,
                Math.min(
                    count,
                    200
                )
            );
        }
    }
}

function syncVisualParticles(
    delta
) {
    for (
        const particle of
        [...activeVisualParticles]
    ) {
        particle.age +=
            delta;

        if (
            particle.age >=
            particle.life
        ) {
            scene.remove(
                particle.sprite
            );

            particle.material
                ?.dispose?.();

            activeVisualParticles.delete(
                particle
            );

            continue;
        }

        const alpha =
            THREE.MathUtils.clamp(
                particle.age /
                    particle.life,
                0,
                1
            );

        particle.velocity.addScaledVector(
            particle.acceleration,
            delta
        );

        if (
            particle.drag >
            0
        ) {
            particle.velocity.multiplyScalar(
                Math.exp(
                    -particle.drag *
                    delta
                )
            );
        }

        particle.sprite.position.addScaledVector(
            particle.velocity,
            delta
        );

        particle.material.rotation +=
            particle.rotSpeed *
            delta;

        const size =
            particle.sizeSequence
                ? getNumberSequenceValue(
                    particle.sizeSequence,
                    alpha,
                    1
                )
                : THREE.MathUtils.lerp(
                    particle.startSize,
                    particle.endSize,
                    alpha
                );

        particle.sprite.scale.set(
            Math.max(
                0.001,
                size
            ),
            Math.max(
                0.001,
                size
            ),
            1
        );

        const transparency =
            particle.transparencySequence
                ? getNumberSequenceValue(
                    particle.transparencySequence,
                    alpha,
                    0
                )
                : THREE.MathUtils.lerp(
                    particle.startTransparency,
                    particle.endTransparency,
                    alpha
                );

        particle.material.opacity =
            1 -
            THREE.MathUtils.clamp(
                transparency,
                0,
                1
            );

        if (
            particle.colorSequence
        ) {
            particle.material.color.copy(
                getColorSequenceValue(
                    particle.colorSequence,
                    alpha
                )
            );
        } else {
            particle.material.color.copy(
                particle.baseColor
            );
        }
    }
}


// ─── Classic Explosion positional sound ─────────────────────────────────────
//
// Explosion sounds are renderer/audio-owned effects, not Lua Sound Instances.
// We use a Web Audio PannerNode so Sounds/collide.wav originates from the actual
// Explosion.Position. If Web Audio cannot be created, playback falls back to a
// normal HTMLAudioElement instead of breaking the explosion.
let explosionAudioContext = null;
const activeExplosionSpatialSounds = new Set();

function getExplosionAudioContext() {
    if (explosionAudioContext)
        return explosionAudioContext;

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass)
        return null;

    try {
        explosionAudioContext =
            new AudioContextClass();

        return explosionAudioContext;
    } catch (error) {
        console.warn(
            "[Explosion] Could not create positional audio context:",
            error
        );

        return null;
    }
}

function setAudioParamValue(
    param,
    value,
    now
) {
    if (!param)
        return;

    if (
        typeof param.setValueAtTime ===
        "function"
    ) {
        param.setValueAtTime(
            value,
            now
        );
    } else {
        param.value =
            value;
    }
}

function updateExplosionAudioListener() {
    const context =
        explosionAudioContext;

    if (
        !context ||
        !camera
    ) {
        return;
    }

    const listener =
        context.listener;

    if (!listener)
        return;

    const now =
        context.currentTime;

    const position =
        camera.getWorldPosition(
            new THREE.Vector3()
        );

    const forward =
        camera.getWorldDirection(
            new THREE.Vector3()
        );

    const up =
        new THREE.Vector3(
            0,
            1,
            0
        ).applyQuaternion(
            camera.getWorldQuaternion(
                new THREE.Quaternion()
            )
        );

    if (
        listener.positionX
    ) {
        setAudioParamValue(
            listener.positionX,
            position.x,
            now
        );

        setAudioParamValue(
            listener.positionY,
            position.y,
            now
        );

        setAudioParamValue(
            listener.positionZ,
            position.z,
            now
        );

        setAudioParamValue(
            listener.forwardX,
            forward.x,
            now
        );

        setAudioParamValue(
            listener.forwardY,
            forward.y,
            now
        );

        setAudioParamValue(
            listener.forwardZ,
            forward.z,
            now
        );

        setAudioParamValue(
            listener.upX,
            up.x,
            now
        );

        setAudioParamValue(
            listener.upY,
            up.y,
            now
        );

        setAudioParamValue(
            listener.upZ,
            up.z,
            now
        );
    } else {
        listener.setPosition?.(
            position.x,
            position.y,
            position.z
        );

        listener.setOrientation?.(
            forward.x,
            forward.y,
            forward.z,
            up.x,
            up.y,
            up.z
        );
    }
}

function cleanupExplosionSpatialSound(
    entry
) {
    if (!entry)
        return;

    activeExplosionSpatialSounds.delete(
        entry
    );

    try {
        entry.source?.disconnect?.();
    } catch {}

    try {
        entry.panner?.disconnect?.();
    } catch {}

    try {
        entry.gain?.disconnect?.();
    } catch {}

    if (entry.audio) {
        entry.audio.onended =
            null;

        entry.audio.onerror =
            null;
    }
}

function playExplosionSoundAt(
    position
) {
    warmLocalSoundPath(
        "Sounds/collide.wav"
    );

    const audio =
        new Audio(
            "Sounds/collide.wav"
        );

    audio.preload =
        "auto";

    audio.volume =
        0.9;

    const context =
        getExplosionAudioContext();

    // Graceful non-WebAudio fallback.
    if (!context) {
        audio.play()
            .catch(error => {
                console.warn(
                    "[Explosion] Could not play Sounds/collide.wav:",
                    error
                );
            });

        return;
    }

    const entry = {
        audio,
        source:
            null,
        panner:
            null,
        gain:
            null
    };

    try {
        const source =
            context.createMediaElementSource(
                audio
            );

        const panner =
            context.createPanner();

        const gain =
            context.createGain();

        panner.panningModel =
            "HRTF";

        panner.distanceModel =
            "inverse";

        // Classic Roblox-ish audible range: very strong nearby, then a smooth
        // drop-off instead of being heard at full volume across the whole map.
        panner.refDistance =
            6;

        panner.maxDistance =
            160;

        panner.rolloffFactor =
            1.15;

        panner.coneInnerAngle =
            360;

        panner.coneOuterAngle =
            360;

        const now =
            context.currentTime;

        if (
            panner.positionX
        ) {
            setAudioParamValue(
                panner.positionX,
                position.x,
                now
            );

            setAudioParamValue(
                panner.positionY,
                position.y,
                now
            );

            setAudioParamValue(
                panner.positionZ,
                position.z,
                now
            );
        } else {
            panner.setPosition?.(
                position.x,
                position.y,
                position.z
            );
        }

        gain.gain.value =
            1;

        source.connect(
            panner
        );

        panner.connect(
            gain
        );

        gain.connect(
            context.destination
        );

        entry.source =
            source;

        entry.panner =
            panner;

        entry.gain =
            gain;

        activeExplosionSpatialSounds.add(
            entry
        );

        audio.onended =
            () =>
                cleanupExplosionSpatialSound(
                    entry
                );

        audio.onerror =
            () =>
                cleanupExplosionSpatialSound(
                    entry
                );

        updateExplosionAudioListener();

        const startPlayback =
            () =>
                audio.play()
                    .catch(error => {
                        console.warn(
                            "[Explosion] Could not play Sounds/collide.wav:",
                            error
                        );

                        cleanupExplosionSpatialSound(
                            entry
                        );
                    });

        if (
            context.state ===
            "suspended"
        ) {
            context.resume()
                .then(
                    startPlayback
                )
                .catch(
                    startPlayback
                );
        } else {
            startPlayback();
        }
    } catch (error) {
        console.warn(
            "[Explosion] Positional audio setup failed; using normal playback:",
            error
        );

        cleanupExplosionSpatialSound(
            entry
        );

        audio.play()
            .catch(playError => {
                console.warn(
                    "[Explosion] Could not play Sounds/collide.wav:",
                    playError
                );
            });
    }
}

function syncExplosionSpatialAudio() {
    if (
        activeExplosionSpatialSounds.size >
        0
    ) {
        updateExplosionAudioListener();
    }
}


// ─── Explosion ───────────────────────────────────────────────────────────────
//
// Parenting an Explosion anywhere under Workspace detonates it once.
// Blast detection is a spatial query, not a permanent Rapier collider.
function createLuaExplosion() {
    const explosion =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "Explosion",

                ClassName:
                    "Explosion",

                Parent:
                    null,

                Archivable:
                    true,

                Position:
                    createVector3(
                        0,
                        0,
                        0
                    ),

                BlastRadius:
                    10,

                BlastPressure:
                    500000,

                DestroyJointRadiusPercent:
                    1,

                ExplosionType:
                    "Craters",

                Visible:
                    true,

                Hit:
                    createLuaSignal(
                        "Explosion.Hit"
                    )
            })
        );

    Object.defineProperty(
        explosion,
        "__detonated",
        {
            value:
                false,

            writable:
                true,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        explosion,
        "__cleanupAt",
        {

            enumerable:

    );

    luaExplosions.add(

function getBasePartWorldPosition(
    part
) {
    if (
        !part ||
        !isA(
            part,
            "BasePart"
        )
    ) {
        return null;
    }

    const body =
        part.__internal?.body;

    if (body) {
        const p =
            body.translation();

        return new THREE.Vector3(
            p.x,
            p.y,
            p.z
        );
    }

    if (
        part.Position
    ) {
        return new THREE.Vector3(
            Number(
                part.Position.X
            ) || 0,
            Number(
                part.Position.Y
            ) || 0,
            Number(
                part.Position.Z
            ) || 0
        );
    }

    return null;
}

function spawnClassicExplosionVisual(
    position,

) {
    const textureId =
        "explosion.png";

    const baseRadius =
        Math.max(
            2,
            Number(
                radius
            ) || 10
        );

    // Scale the VISUAL intensity from BlastRadius while keeping a radius of 10
    // looking essentially like the existing/default explosion.
    //
    // Larger blasts get:
    //   - faster outward-moving fireball layers
    //   - larger fireball sprites
    //   - faster and larger sparks
    //
    // The clamps keep extreme BlastRadius values from creating absurdly large
    // velocities/sprites that could hurt rendering performance.
    const blastScale =
        Math.max(
            0.2,
            baseRadius / 10

        THREE.MathUtils.clamp(
            Math.pow(
                blastScale,
                0.65

            0.45,
            4.5

        THREE.MathUtils.clamp(
            Math.pow(
                blastScale,
                0.25

            0.8,

        baseRadius *

        textureId,

        position:
            position.clone(),

        velocity:
            new THREE.Vector3(),

        acceleration:
            new THREE.Vector3(),

        drag:
            0,

        life:
            0.28,

        startSize:
            visualRadius *
            1.46,

        endSize:
            visualRadius *
            1.16,

        startTransparency:
            0,

        endTransparency:
            1,

        color:
            new THREE.Color(
                0xc27932
            ),

        lightEmission:
            0
    });

    // 2009-era sparks.
    const sparkCount =
        Math.max(
            22,
            Math.min(
                48,
                Math.round(
                    baseRadius *
                    2.8
                )
            )
        );

    for (
        let i = 0;
        i < sparkCount;
        i++
    ) {
        const direction =
            new THREE.Vector3(
                Math.random() *
                    2 -
                    1,
                Math.random() *
                    1.6 -
                    0.15,
                Math.random() *
                    2 -
                    1
            );

        if (
            direction.lengthSq() <
            1e-8
        ) {
            direction.set(
                0,
                1,
                0
            );
        }

        direction.normalize();

        const speed =
            (
                12 +
                Math.random() *
                    40
            ) *
            velocityScale;

        // No texture here: SpriteMaterial draws a square point. At this tiny
        // scale it reads as the classic bright spark flecks.
        createVisualParticle({
            textureId,

            position:
                position.clone(),

            velocity:
                direction.multiplyScalar(
                    speed
                ),

            acceleration:
                new THREE.Vector3(
                    0,
                    -18,
                    0
                ),

            drag:
                1.4,

            life:
                0.5 +
                Math.random() *
                    0.65,

            startSize:
                (
                    0.7 +
                    Math.random() *
                        0.24
                ) *
                sizeBoost,

            endSize:
                0.3 *
                sizeBoost,

            startTransparency:
                0,

            endTransparency:
                1,

            color:
                new THREE.Color(
                    0xff8a36
                ),

            lightEmission:
                0.4
        });
    }
}

function breakExplosionJoints(
    position,
    radius
) {
    let count =
        0;

    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            !joint ||
            joint.__destroyed
        ) {
            continue;
        }

        // A classic ForceField prevents Explosion from breaking joints belonging
        // to the protected model/character.
        if (
            isForceFieldProtectedInstance(
                joint.Part0
            ) ||
            isForceFieldProtectedInstance(
                joint.Part1
            )
        ) {
            continue;
        }

        const p0 =
            getBasePartWorldPosition(
                joint.Part0
            );

        const p1 =
            getBasePartWorldPosition(
                joint.Part1
            );

        let distance = Infinity;

        if (p0) {
            distance =
                Math.min(
                    distance,
                    getExplosionColliderDistance(
                        position,
                        joint.Part0?.__internal?.collider,
                        p0
                    )
                );
        }

        if (p1) {
            distance =
                Math.min(
                    distance,
                    getExplosionColliderDistance(
                        position,
                        joint.Part1?.__internal?.collider,
                        p1
                    )
                );
        }

        if (
            distance <=
            radius
        ) {
            destroyLuaInstance(
                joint
            );

            count++;
        }
    }

    return count;
}


// Measure an Explosion from the actual collider SURFACE instead of only from
// the Part/body center. This makes BlastRadius act like a true world-space
// radius for large Parts and the player's capsule.
function getExplosionColliderDistance(
    center,
    collider,
    fallbackPosition
) {
    if (
        collider &&
        typeof collider.projectPoint ===
            "function"
    ) {
        try {
            const projection =
                collider.projectPoint(
                    {
                        x: center.x,
                        y: center.y,
                        z: center.z
                    },
                    true
                );

            const point =
                projection?.point;

            if (point) {
                return center.distanceTo(
                    new THREE.Vector3(
                        Number(point.x) || 0,
                        Number(point.y) || 0,
                        Number(point.z) || 0
                    )
                );
            }
        } catch {
            // Fall back to center-distance if projection is unavailable.
        }
    }

    if (fallbackPosition) {
        return center.distanceTo(
            fallbackPosition
        );
    }

    return Infinity;
}


// The old linear falloff made the OUTER half of BlastRadius feel too weak.
// Keep full strength through the inner half, then smoothly taper to zero at
// the exact edge of the radius.
function getClassicExplosionFalloff(
    distance,
    radius
) {
    if (
        radius <= 0 ||
        distance >= radius
    ) {
        return 0;
    }

    const normalized =
        THREE.MathUtils.clamp(
            distance /
                Math.max(
                    radius,
                    1e-6
                ),
            0,
            1
        );

    const edgeStart =
        0.5;

    if (
        normalized <=
        edgeStart
    ) {
        return 1;
    }

    const edge =
        (
            normalized -
            edgeStart
        ) /
        (
            1 -
            edgeStart
        );

    return THREE.MathUtils.clamp(
        1 -
            edge *
            edge,
        0,
        1
    );
}


function detonateLuaExplosion(
    explosion
) {
    if (
        !explosion ||
        explosion.__destroyed ||
        explosion.__detonated
    ) {
        return;
    }

    explosion.__detonated =
        true;

    const center =
        new THREE.Vector3(
            Number(
                explosion.Position?.X
            ) || 0,
            Number(
                explosion.Position?.Y
            ) || 0,
            Number(
                explosion.Position?.Z
            ) || 0
        );

    const radius =
        Math.max(
            0,
            Number(
                explosion.BlastRadius
            ) || 0
        );

    const pressure =
        Math.max(
            0,
            Number(
                explosion.BlastPressure
            ) || 0
        );

    const breakPercent =
        THREE.MathUtils.clamp(
            Number(
                explosion.DestroyJointRadiusPercent
            ) || 0,
            0,
            1
        );

    // Classic collision/explosion sound, spatialized at Explosion.Position.
    playExplosionSoundAt(
        center
    );

    if (
        explosion.Visible !==
        false
    ) {
        spawnClassicExplosionVisual(
            center,
            radius
        );
    }

    if (
        radius >
        0
    ) {
        // Break welds/joints BEFORE applying blast force. Previously the
        // explosion pushed the still-connected assembly first and only broke
        // it afterward, so freshly-created debris inherited very little motion.
        if (
            breakPercent >
            0
        ) {
            breakExplosionJoints(
                center,
                radius *
                    breakPercent
            );
        }

        const hitParts =
            [];

        for (
            const part of
            luaInstances
        ) {
            if (
                !part ||
                part.__destroyed ||
                !isA(
                    part,
                    "BasePart"
                ) ||
                !isInWorkspace(
                    part
                )
            ) {
                continue;
            }

            const partPosition =
                getBasePartWorldPosition(
                    part
                );

            if (!partPosition)
                continue;

            const distance =
                getExplosionColliderDistance(
                    center,
                    part.__internal?.collider,
                    partPosition
                );

            if (
                distance >
                radius
            ) {
                continue;
            }

            hitParts.push({
                part,
                position:
                    partPosition,
                distance
            });
        }

        for (
            const hit of
            hitParts
        ) {
            const falloff =
                getClassicExplosionFalloff(
                    hit.distance,
                    radius
                );

            fireLuaSignal(
                explosion.Hit,
                hit.part,
                hit.distance
            );

            const internal =
                hit.part.__internal;

            if (
                internal?.body &&
                !hit.part.Anchored
            ) {
                const direction =
                    hit.position.clone()
                        .sub(
                            center
                        );

                if (
                    direction.lengthSq() <
                    1e-8
                ) {
                    direction.set(
                        0,
                        1,
                        0
                    );
                }

                direction.normalize();

                // Explosion force should THROW loose debris, not merely nudge it.
                //
                // Use BlastPressure to create a direct change in velocity rather
                // than a tiny mass-dependent impulse. This also makes pieces that
                // were just disconnected by the explosion visibly fly apart.
                const blastSpeed =
                    Math.min(
                        140,
                        pressure /
                            9000 *
                            falloff
                    );

                if (
                    blastSpeed >
                    0
                ) {
                    // Give mostly-radial motion plus an upward kick so debris
                    // actually leaves the ground instead of only sliding away.
                    const throwDirection =
                        direction.clone();

                    throwDirection.y +=
                        0.38;

                    throwDirection.normalize();

                    const currentVelocity =
                        internal.body.linvel();

                    internal.body.setLinvel(
                        {
                            x:
                                currentVelocity.x +
                                throwDirection.x *
                                blastSpeed,

                            y:
                                currentVelocity.y +
                                throwDirection.y *
                                blastSpeed,

                            z:
                                currentVelocity.z +
                                throwDirection.z *
                                blastSpeed
                        },
                        true
                    );

                    // A little angular motion makes broken structures look like
                    // debris instead of perfectly-oriented blocks translating away.
                    const currentAngularVelocity =
                        internal.body.angvel();

                    const spin =
                        Math.min(
                            18,
                            3 +
                            blastSpeed *
                                0.16
                        );

                    internal.body.setAngvel(
                        {
                            x:
                                currentAngularVelocity.x +
                                (
                                    Math.random() *
                                        2 -
                                    1
                                ) *
                                spin,

                            y:
                                currentAngularVelocity.y +
                                (
                                    Math.random() *
                                        2 -
                                    1
                                ) *
                                spin,

                            z:
                                currentAngularVelocity.z +
                                (
                                    Math.random() *
                                        2 -
                                    1
                                ) *
                                spin
                        },
                        true
                    );

                    internal.body.wakeUp?.();
                }
            }
        }

        // Damage the local R6 once, using the actual player rigid body center.
        if (
            currentPlayerHumanoid &&
            !currentPlayerHumanoid.__dead &&
            playerBody
        ) {
            const p =
                playerBody.translation();

            const playerPosition =
                new THREE.Vector3(
                    p.x,
                    p.y,
                    p.z
                );

            // Measure to the nearest point on the player's Rapier capsule.
            // This avoids making the blast seem much smaller just because the
            // capsule center is several studs away from the visible body edge.
            const distance =
                getExplosionColliderDistance(
                    center,
                    playerCollider,
                    playerPosition
                );

            if (
                distance <=
                radius
            ) {
                const falloff =
                    getClassicExplosionFalloff(
                        distance,
                        radius
                    );

                // Default BlastPressure 500000 can deal up to 100 damage at
                // the center, with a strong inner blast and softened edge falloff.
                const damage =
                    Math.min(
                        100,
                        pressure /
                            5000
                    ) *
                    falloff;

                if (
                    damage >
                    0
                ) {
                    // Route explosion damage through the classic protected API.
                    // ForceField therefore blocks it without adding a second,
                    // special-case damage rule.
                    currentPlayerHumanoid.TakeDamage(
                        damage
                    );
                }

                const direction =
                    playerPosition.clone()
                        .sub(
                            center
                        );

                if (
                    direction.lengthSq() <
                    1e-8
                ) {
                    direction.set(
                        0,
                        1,
                        0
                    );
                }

                direction.normalize();

                const knockbackStrength =
                    Math.min(
                        75,
                        pressure /
                            12000 *
                            falloff
                    );

                if (
                    knockbackStrength >
                    0
                ) {
                    playerBody.applyImpulse(
                        {
                            x:
                                direction.x *
                                knockbackStrength,

                            y:
                                direction.y *
                                knockbackStrength +
                                knockbackStrength *
                                0.30,

                            z:
                                direction.z *
                                knockbackStrength
                        },
                        true
                    );
                }
            }
        }

    }

    // Keep the Explosion Instance alive briefly so queued Hit callbacks can run.
    explosion.__cleanupAt =
        performance.now() +
        1300;
}

function syncLuaExplosions() {
    const now =
        performance.now();

    for (
        const explosion of
        [...luaExplosions]
    ) {
        if (
            !explosion ||
            explosion.__destroyed
        ) {
            continue;
        }

        if (
            !explosion.__detonated &&
            isInWorkspace(
                explosion
            )
        ) {
            detonateLuaExplosion(
                explosion
            );
        }

        if (
            explosion.__detonated &&
            explosion.__cleanupAt >
                0 &&
            now >=
                explosion.__cleanupAt
        ) {
            destroyLuaInstance(
                explosion
            );
        }
    }
}

function hasDirectForceField(model) {
    if (
        !model ||
        model.__destroyed
    ) {
        return false;
    }

    return getLuaChildren(
        model
    ).some(child =>
        child &&
        !child.__destroyed &&
        child.ClassName ===
            "ForceField"
    );
}

function isForceFieldProtectedInstance(instance) {
    if (
        !instance ||
        instance.__destroyed
    ) {
        return false;
    }

    let current =
        instance;

    while (current) {
        if (
            current.ClassName ===
                "Model" &&
            hasDirectForceField(
                current
            )
        ) {
            return true;
        }

        current =
            current.Parent;
    }

    return false;
}

function createLuaForceField() {
    const forceField =

            Mutable({

        }

    luaForceFields.add(

}

function getClickDetectorsForTarget(
    target
) {
    if (
        !target ||
        target.__destroyed
    ) {
        return [];
    }

    return getLuaChildren(
        target
    ).filter(child =>
        child &&
        !child.__destroyed &&
        child.ClassName ===
            "ClickDetector"
    );
}

function fireClickDetectorsForCurrentTarget() {
    const hit =
        currentMouseWorldHit;

    const target =
        hit?.instance ||
        MouseApi.Target;

    if (
        !target ||
        !isA(
            target,
            "BasePart"
        ) ||
        !playerBody
    ) {
        return false;
    }

    const detectors =
        getClickDetectorsForTarget(
            target
        );

    if (
        detectors.length ===
        0
    ) {
        return false;
    }

    const playerPosition =
        playerBody.translation();

    const point =
        hit?.point ||
        {
            x:
                Number(
                    target.Position?.X
                ) || 0,

            y:
                Number(
                    target.Position?.Y
                ) || 0,

            z:
                Number(
                    target.Position?.Z
                ) || 0
        };

    const dx =
        point.x -
        playerPosition.x;

    const dy =
        point.y -
        playerPosition.y;

    const dz =
        point.z -
        playerPosition.z;

    const distance =
        Math.hypot(
            dx,
            dy,
            dz
        );

    let activated =
        false;

    for (
        const detector of
        detectors
    ) {
        const maxDistance =
            Math.max(
                0,
                Number(
                    detector.MaxActivationDistance
                ) || 0
            );

        if (
            distance >
            maxDistance
        ) {
            continue;
        }

        activated =
            true;

        fireLuaSignal(
            detector.MouseClick,
            localPlayerApi
        );
    }

    return activated;
}

function getSparkleWorldSpawnPoint(
    part
) {
    const mesh =
        getPartVisualMesh(
            part
        );

    if (!mesh)
        return null;

    const size =
        part.Size ||
        createVector3(
            1,
            1,
            1
        );

    const local =
        new THREE.Vector3(
            (
                Math.random() -
                0.5
            ) *
                Math.max(
                    0.1,
                    Number(size.X) || 1
                ),

            (
                Math.random() -
                0.25
            ) *
                Math.max(
                    0.1,
                    Number(size.Y) || 1
                ),

            (
                Math.random() -
                0.5
            ) *
                Math.max(
                    0.1,
                    Number(size.Z) || 1
                )
        );

    mesh.updateWorldMatrix(
        true,
        false
    );

    return mesh.localToWorld(
        local
    );
}

function syncLuaSparkles(
    delta
) {
    for (
        const sparkles of
        [...luaSparkles]
    ) {
        if (
            !sparkles ||
            sparkles.__destroyed ||
            sparkles.Enabled ===
                false
        ) {
            continue;
        }

        const part =
            sparkles.Parent;

        if (
            !part ||
            !isA(
                part,
                "BasePart"
            ) ||
            !isInWorkspace(
                part
            )
        ) {
            continue;
        }

        // Keep this intentionally light: old Sparkles were sparse, and the
        // transient particle system removes each sprite after its short life.
        sparkles.__sparkleAccumulator +=
            delta *
            10;

        let count =
            Math.floor(
                sparkles.__sparkleAccumulator
            );

        if (
            count <=
            0
        ) {
            continue;
        }

        sparkles.__sparkleAccumulator -=
            count;

        count =
            Math.min(
                count,
                3
            );

        const color =
            color3ToThree(
                sparkles.SparkleColor,
                0xaa33ff
            );

        for (
            let i = 0;
            i < count;
            i++
        ) {
            const position =
                getSparkleWorldSpawnPoint(
                    part
                );

            if (!position)
                continue;

            createVisualParticle({
                textureId:
                    "sparkle.png",

                position,

                velocity:
                    new THREE.Vector3(
                        (
                            Math.random() -
                            0.5
                        ) *
                            0.8,

                        0.8 +
                        Math.random() *
                            1.2,

                        (
                            Math.random() -
                            0.5
                        ) *
                            0.8
                    ),

                acceleration:
                    new THREE.Vector3(
                        0,
                        -0.5,
                        0
                    ),

                drag:
                    1.0,

                life:
                    0.45 +
                    Math.random() *
                        0.45,

                rotation:
                    Math.random() *
                    360,

                rotSpeed:
                    (
                        Math.random() -
                        0.5
                    ) *
                        120,

                startSize:
                    0.35 +
                    Math.random() *
                        0.25,

                endSize:
                    0.08,

                startTransparency:
                    0,

                endTransparency:
                    1,

                color,

                lightEmission:
                    1
            });
        }
    }
}

function createLuaMessageLike(
    className
) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Text:
                    ""
            })
        );

    const element =
        document.createElement(
            "div"
        );

    element.className =
        className === "Hint"
            ? "classicMessageBar classicHintBar"
            : "classicMessageBar classicMessageOverlay";

    element.style.display =
        "none";

    classicMessageStack
        ?.appendChild(
            element
        );

    Object.defineProperty(
        instance,
        "__messageElement",
        {
            value:
                element,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        instance,
        "__lastMessageText",
        {
            value:
                "",

            writable:
                true,

            enumerable:
                false
        }
    );

    luaMessages.add(
        instance
    );

    return instance;
}

function syncLuaMessages() {
    for (
        const message of
        [...luaMessages]
    ) {
        if (
            !message ||
            message.__destroyed
        ) {
            continue;
        }

        const element =
            message.__messageElement;

        if (!element)
            continue;

        const text =
            String(
                message.Text ??
                ""
            );

        if (
            text !==
            message.__lastMessageText
        ) {
            element.textContent =
                text;

            message.__lastMessageText =
                text;

            fireChanged(
                message,
                "Text"
            );
        }

        let visible =
            isInWorkspace(
                message
            );

        if (!visible && typeof PlayerGuiApi !== "undefined") {
            let parent = message.Parent;
            while (parent) {
                if (parent === PlayerGuiApi) {
                    visible = true;
                    break;
                }
                parent = parent.Parent;
            }
        }

        element.style.display =
            visible
                ? (message.ClassName === "Hint" ? "block" : "flex")
                : "none";
    }
}

function sameBrickColor(
    a,
    b
) {
    if (
        !a ||
        !b
    ) {
        return false;
    }

    const aName =
        String(
            a.Name ??
            ""
        );

    const bName =
        String(
            b.Name ??
            ""
        );

    if (
        aName &&
        bName
    ) {
        return aName ===
            bName;
    }

    return Number(
        a.Number
    ) ===
        Number(
            b.Number
        );
}

function getClassicTeams() {
    if (
        typeof TeamsApi ===
        "undefined"
    ) {
        return [];
    }

    return getLuaChildren(
        TeamsApi
    ).filter(instance =>
        instance &&
        !instance.__destroyed &&
        instance.ClassName ===
            "Team"
    );
}

function findTeamByColor(
    color
) {
    return (
        getClassicTeams()
            .find(team =>
                sameBrickColor(
                    team.TeamColor,
                    color
                )
            ) ||
        null
    );
}

function assignLocalPlayerToTeam(
    team
) {
    if (
        !team ||
        team.__destroyed ||
        team.ClassName !==
            "Team"
    ) {
        return false;
    }

    localPlayerApi.Team =
        team;

    localPlayerApi.TeamColor =
        BrickColorApi.new(
            team.TeamColor?.Name ||
            "Medium stone grey"
        );

    localPlayerApi.Neutral =
        false;

    return true;
}

function ensureLocalPlayerAutoTeam() {
    if (
        !localPlayerApi ||
        localPlayerApi.Neutral ===
            false
    ) {
        return (
            localPlayerApi?.Team ||
            null
        );
    }

    const available =
        getClassicTeams()
            .filter(team =>
                team.AutoAssignable !==
                false
            );

    if (
        available.length ===
        0
    ) {
        return null;
    }

    const team =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];

    assignLocalPlayerToTeam(
        team
    );

    return team;
}

function syncLocalPlayerTeamState() {
    if (
        !localPlayerApi
    ) {
        return;
    }

    if (
        localPlayerApi.Neutral ===
        true
    ) {
        localPlayerApi.Team =
            null;

        return;
    }

    const matching =
        findTeamByColor(
            localPlayerApi.TeamColor
        );

    if (
        matching !==
        localPlayerApi.Team
    ) {
        localPlayerApi.Team =
            matching;
    }
}
