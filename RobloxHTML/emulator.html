function quaternionFromCFrameValue(cf) {
    if (
        cf &&
        Number.isFinite(Number(cf._qx)) &&
        Number.isFinite(Number(cf._qy)) &&
        Number.isFinite(Number(cf._qz)) &&
        Number.isFinite(Number(cf._qw))
    ) {
        return new THREE.Quaternion(
            Number(cf._qx),
            Number(cf._qy),
            Number(cf._qz),
            Number(cf._qw)
        ).normalize();
    }

    return new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
            Number(cf?._rx) || 0,
            Number(cf?._ry) || 0,
            Number(cf?._rz) || 0,
            "XYZ"
        )
    );
}

function makeCFrameFromQuaternion(
    x = 0,
    y = 0,
    z = 0,
    quaternion = new THREE.Quaternion()
) {
    const q =
        quaternion.clone().normalize();

    const euler =
        new THREE.Euler()
            .setFromQuaternion(
                q,
                "XYZ"
            );

    const position =
        createVector3(
            Number(x) || 0,
            Number(y) || 0,
            Number(z) || 0
        );

    const right =
        new THREE.Vector3(1, 0, 0)
            .applyQuaternion(q);

    const up =
        new THREE.Vector3(0, 1, 0)
            .applyQuaternion(q);

    // Roblox's LookVector points along local -Z.
    const look =
        new THREE.Vector3(0, 0, -1)
            .applyQuaternion(q);

    let cf = null;

    const multiplyImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    (
                        "X" in arg &&
                        "Y" in arg &&
                        "Z" in arg
                    )
                )
            );

        if (!other)
            return cf;

        // CFrame * Vector3 style through :Multiply/:mul.
        if (
            !("_qx" in other) &&
            !("_rx" in other)
        ) {
            const p =
                new THREE.Vector3(
                    Number(other.X) || 0,
                    Number(other.Y) || 0,
                    Number(other.Z) || 0
                )
                    .applyQuaternion(q)
                    .add(
                        new THREE.Vector3(
                            position.X,
                            position.Y,
                            position.Z
                        )
                    );

            return createVector3(
                p.x,
                p.y,
                p.z
            );
        }

        const bq =
            quaternionFromCFrameValue(
                other
            );

        const bp =
            new THREE.Vector3(
                Number(other.X) || 0,
                Number(other.Y) || 0,
                Number(other.Z) || 0
            );

        const p =
            bp.applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            q.clone().multiply(bq)
        );
    };

    const inverseImpl = () => {
        const qi =
            q.clone().invert();

        const p =
            new THREE.Vector3(
                -position.X,
                -position.Y,
                -position.Z
            ).applyQuaternion(qi);

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            qi
        );
    };

    const lerpImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    "_rx" in arg
                )
            );

        const alphaArg =
            [...args]
                .reverse()
                .find(arg =>
                    typeof arg === "number"
                );

        const alpha =
            THREE.MathUtils.clamp(
                Number(alphaArg) || 0,
                0,
                1
            );

        if (!other)
            return cf;

        const oq =
            quaternionFromCFrameValue(
                other
            );

        const blendedQ =
            q.clone().slerp(
                oq,
                alpha
            );

        return makeCFrameFromQuaternion(
            THREE.MathUtils.lerp(
                position.X,
                Number(other.X) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Y,
                Number(other.Y) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Z,
                Number(other.Z) || 0,
                alpha
            ),
            blendedQ
        );
    };

    const pointToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const pointToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .sub(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                )
                .applyQuaternion(
                    q.clone().invert()
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(q);

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(
                q.clone().invert()
            );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    cf = Mutable({
        X: position.X,
        Y: position.Y,
        Z: position.Z,

        _rx: euler.x,
        _ry: euler.y,
        _rz: euler.z,

        _qx: q.x,
        _qy: q.y,
        _qz: q.z,
        _qw: q.w,

        Position: position,
        p: position,

        Orientation:
            createVector3(
                THREE.MathUtils.radToDeg(
                    euler.x
                ),
                THREE.MathUtils.radToDeg(
                    euler.y
                ),
                THREE.MathUtils.radToDeg(
                    euler.z
                )
            ),

        LookVector:
            createVector3(
                look.x,
                look.y,
                look.z
            ),

        RightVector:
            createVector3(
                right.x,
                right.y,
                right.z
            ),

        UpVector:
            createVector3(
                up.x,
                up.y,
                up.z
            ),

        inverse: inverseImpl,
        Inverse: inverseImpl,

        lerp: lerpImpl,
        Lerp: lerpImpl,

        mul: multiplyImpl,
        Multiply: multiplyImpl,
        ToWorldSpace: multiplyImpl,

        ToObjectSpace(...args) {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (!other)
                return cf;

            return inverseImpl()
                .Multiply(other);
        },

        pointToWorldSpace: pointToWorldImpl,
        PointToWorldSpace: pointToWorldImpl,

        pointToObjectSpace: pointToObjectImpl,
        PointToObjectSpace: pointToObjectImpl,

        vectorToWorldSpace: vectorToWorldImpl,
        VectorToWorldSpace: vectorToWorldImpl,

        vectorToObjectSpace: vectorToObjectImpl,
        VectorToObjectSpace: vectorToObjectImpl,

        components() {
            // Position + 3x3 rotation matrix, matching classic CFrame components.
            const m =
                new THREE.Matrix4()
                    .makeRotationFromQuaternion(q);

            const e = m.elements;

            return [
                position.X,
                position.Y,
                position.Z,

                e[0], e[4], e[8],
                e[1], e[5], e[9],
                e[2], e[6], e[10]
            ];
        },

        GetComponents() {
            return this.components();
        }
    });

    return cf;
}

function createCFrame(
    x = 0,
    y = 0,
    z = 0,
    rx = 0,
    ry = 0,
    rz = 0
) {
    const q =
        new THREE.Quaternion()
            .setFromEuler(
                new THREE.Euler(
                    Number(rx) || 0,
                    Number(ry) || 0,
                    Number(rz) || 0,
                    "XYZ"
                )
            );

    return makeCFrameFromQuaternion(
        Number(x) || 0,
        Number(y) || 0,
        Number(z) || 0,
        q
    );
}

function cframeLookAt(
    px,
    py,
    pz,
    tx,
    ty,
    tz
) {
    const position =
        new THREE.Vector3(
            px,
            py,
            pz
        );

    const target =
        new THREE.Vector3(
            tx,
            ty,
            tz
        );

    const direction =
        target.clone()
            .sub(position);

    if (direction.lengthSq() < 1e-12) {
        return makeCFrameFromQuaternion(
            px,
            py,
            pz,
            new THREE.Quaternion()
        );
    }

    direction.normalize();

    // Three cameras/objects look down -Z, matching Roblox LookVector.
    const q =
        new THREE.Quaternion()
            .setFromUnitVectors(
                new THREE.Vector3(
                    0,
                    0,
                    -1
                ),
                direction
            );

    return makeCFrameFromQuaternion(
        px,
        py,
        pz,
        q
    );
}

const CFrameApi = Mutable({
    new(...args) {
        // Ignore a possible API receiver from colon-style invocation.
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        // CFrame.new(Vector3)
        if (
            values.length >= 1 &&
            typeof values[0] === "object" &&
            values[0] !== null &&
            "X" in values[0] &&
            "Y" in values[0] &&
            "Z" in values[0]
        ) {
            const from =
                values[0];

            // Classic CFrame.new(position, lookAtPosition)
            if (
                values.length >= 2 &&
                typeof values[1] === "object" &&
                values[1] !== null &&
                "X" in values[1] &&
                "Y" in values[1] &&
                "Z" in values[1]
            ) {
                return cframeLookAt(
                    Number(from.X) || 0,
                    Number(from.Y) || 0,
                    Number(from.Z) || 0,
                    Number(values[1].X) || 0,
                    Number(values[1].Y) || 0,
                    Number(values[1].Z) || 0
                );
            }

            return createCFrame(
                from.X,
                from.Y,
                from.Z
            );
        }

        return createCFrame(
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    Angles(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        return createCFrame(
            0,
            0,
            0,
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    fromEulerAnglesXYZ(...args) {
        return CFrameApi.Angles(
            ...args
        );
    },

    fromEulerAnglesYXZ(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const e =
            new THREE.Euler(
                Number(values[0]) || 0,
                Number(values[1]) || 0,
                Number(values[2]) || 0,
                "YXZ"
            );

        const q =
            new THREE.Quaternion()
                .setFromEuler(e);

        return makeCFrameFromQuaternion(
            0,
            0,
            0,
            q
        );
    },

    lookAt(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const from =
            values[0];

        const to =
            values[1];

        if (
            !from ||
            !to
        ) {
            return createCFrame();
        }

        return cframeLookAt(
            Number(from.X) || 0,
            Number(from.Y) || 0,
            Number(from.Z) || 0,
            Number(to.X) || 0,
            Number(to.Y) || 0,
            Number(to.Z) || 0
        );
    }
});

// ─── 2010-era Instance / parenting / joint helpers ───────────────────────────
const luaJoints = new Set();
const luaBodyMovers = new Set();
const luaValueObjects = new Set();
const luaHumanoids = new Set();

// Phase 3.6 runtime state is declared early because Instance verification can
// destroy objects before the playable Character is constructed.
let currentSeat = null;
let currentSeatWeld = null;
let playerColliderDisabled = false;
let characterRespawnTimer = null;
const CHARACTER_RESPAWN_DELAY_MS = 5000;

// Tracks dynamic child-name aliases such as model.Head / workspace.Part.
const childAliasState = new WeakMap();

const CLASS_PARENTS = {
    Part: ["BasePart", "PVInstance", "Instance"],
    Seat: ["BasePart", "PVInstance", "Instance"],

    Model: ["PVInstance", "Instance"],
    Folder: ["Instance"],

    Humanoid: ["Instance"],

    Terrain: ["Instance"],
    SelectionBox: ["Instance"],

    RemoteEvent: ["Instance"],
    RemoteFunction: ["Instance"],
    BindableEvent: ["Instance"],
    BindableFunction: ["Instance"],

    Weld: ["JointInstance", "Instance"],
    ManualWeld: ["JointInstance", "Instance"],
    Snap: ["JointInstance", "Instance"],
    Glue: ["JointInstance", "Instance"],
    Motor: ["JointInstance", "Instance"],
    Rotate: ["JointInstance", "Instance"],

    // Classic BodyMover hierarchy
    BodyVelocity: ["BodyMover", "Instance"],
    BodyPosition: ["BodyMover", "Instance"],
    BodyGyro: ["BodyMover", "Instance"],
    BodyForce: ["BodyMover", "Instance"],
    BodyAngularVelocity: ["BodyMover", "Instance"],
    BodyThrust: ["BodyMover", "Instance"],

    StringValue: ["ValueBase", "Instance"],
    BoolValue: ["ValueBase", "Instance"],
    IntValue: ["ValueBase", "Instance"],
    NumberValue: ["ValueBase", "Instance"],
    ObjectValue: ["ValueBase", "Instance"]
};

function getLuaChildren(parent) {
    return Array.from(luaInstances)
        .filter(instance =>
            instance &&
            !instance.__destroyed &&
            instance.Parent === parent
        );
}

function getLuaDescendants(parent) {
    const out = [];

    const visit = current => {
        for (
            const child of
            getLuaChildren(current)
        ) {
            out.push(child);
            visit(child);
        }
    };

    visit(parent);
    return out;
}

function isInWorkspace(instance) {
    let p = instance;

    while (p) {
        if (p === workspaceApi)
            return true;

        p = p.Parent;
    }

    return false;
}

function isA(instance, className) {
    if (!instance)
        return false;

    return (
        instance.ClassName === className ||
        className === "Instance" ||
        (
            CLASS_PARENTS[
                instance.ClassName
            ] || []
        ).includes(className)
    );
}

function getStringArg(args, fallback = "") {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "string")
            return args[i];
    }

    return fallback;
}

function getBooleanArg(args, fallback = false) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "boolean")
            return args[i];
    }

    return fallback;
}

function getNumberArg(args, fallback = null) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (
            typeof args[i] === "number" &&
            Number.isFinite(args[i])
        ) {
            return args[i];
        }
    }

    return fallback;
}

function refreshChildAliases(parent) {
    if (
        !parent ||
        (
            typeof parent !== "object" &&
            typeof parent !== "function"
        )
    ) {
        return;
    }

    let state =
        childAliasState.get(parent);

    if (!state) {
        state = {
            names: new Set()
        };

        childAliasState.set(
            parent,
            state
        );
    }

    const children =
        getLuaChildren(parent);

    const desired =
        new Map();

    for (const child of children) {
        const name =
            String(
                child.Name || ""
            );

        if (
            !name ||
            desired.has(name)
        ) {
            continue;
        }

        desired.set(
            name,
            child
        );
    }

    // Remove only aliases that WE created.
    for (
        const oldName of
        [...state.names]
    ) {
        if (!desired.has(oldName)) {
            try {
                if (
                    parent[oldName] &&
                    parent[oldName].Parent === parent
                ) {
                    parent[oldName] = undefined;
                }
            } catch {}

            state.names.delete(
                oldName
            );
        }
    }

    for (
        const [name, child] of
        desired
    ) {
        // Never overwrite real properties/methods such as Name, Parent,
        // GetChildren, etc.
        const current =
            parent[name];

        if (
            current === undefined ||
            state.names.has(name)
        ) {
            try {
                parent[name] = child;
                state.names.add(name);
            } catch {}
        }
    }
}

function addCommonInstanceApi(instance) {
    addInstanceSignals(instance);

    instance.GetChildren = (...args) =>
        getLuaChildren(instance);

    instance.children =
        instance.GetChildren;

    instance.GetDescendants = (...args) =>
        getLuaDescendants(instance);

    instance.FindFirstChild = (...args) => {
        const name =
            getStringArg(
                args,
                ""
            );

        const recursive =
            getBooleanArg(
                args,
                false
            );

        const list =
            recursive
                ? getLuaDescendants(
                    instance
                )
                : getLuaChildren(
                    instance
                );

        return (
            list.find(child =>
                child.Name === name
            ) ||
            null
        );
    };

    instance.findFirstChild =
        instance.FindFirstChild;

    instance.FindFirstChildOfClass =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            return (
                getLuaChildren(instance)
                    .find(child =>
                        child.ClassName ===
                        className
                    ) ||
                null
            );
        };

    instance.FindFirstChildWhichIsA =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const list =
                recursive
                    ? getLuaDescendants(
                        instance
                    )
                    : getLuaChildren(
                        instance
                    );

            return (
                list.find(child =>
                    isA(
                        child,
                        className
                    )
                ) ||
                null
            );
        };

    instance.WaitForChild =
        async (...args) => {
            const name =
                getStringArg(
                    args,
                    ""
                );

            const timeout =
                getNumberArg(
                    args,
                    null
                );

            const existing =
                getLuaChildren(
                    instance
                ).find(child =>
                    child.Name === name
                );

            if (existing)
                return existing;

            const started =
                performance.now();

            while (
                !instance.__destroyed
            ) {
                const found =
                    getLuaChildren(
                        instance
                    ).find(child =>
                        child.Name === name
                    );

                if (found)
                    return found;

                if (
                    timeout !== null &&
                    (
                        performance.now() -
                        started
                    ) / 1000 >= timeout
                ) {
                    return null;
                }

                await sleepSeconds(
                    CLASSIC_WAIT_QUANTUM
                );
            }

            return null;
        };

    instance.IsA = (...args) =>
        isA(
            instance,
            getStringArg(
                args,
                ""
            )
        );

    instance.isA =
        instance.IsA;

    instance.IsDescendantOf =
        (...args) => {
            const ancestor =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                instance.Parent;

            while (p) {
                if (p === ancestor)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.IsAncestorOf =
        (...args) => {
            const descendant =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                descendant?.Parent;

            while (p) {
                if (p === instance)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.GetFullName =
        (...args) => {
            const names = [];
            let p = instance;

            while (p) {
                if (p === gameApi)
                    break;

                if (p.Name)
                    names.unshift(
                        p.Name
                    );

                p = p.Parent;
            }

            return names.join(".");
        };

    instance.Remove =
        (...args) => {
            if (instance.Destroy)
                instance.Destroy();
        };

    instance.ClearAllChildren =
        (...args) => {
            for (
                const child of
                [...getLuaChildren(instance)]
            ) {
                child.Destroy();
            }
        };

    instance.Clone =
        (...args) =>
            cloneLuaInstance(
                instance
            );

    if (
        !("__eventLastParent" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastParent",
            {
                value:
                    instance.Parent ??
                    null,
                writable: true,
                enumerable: false
            }
        );
    }

    if (
        !("__eventLastName" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastName",
            {
                value:
                    instance.Name,
                writable: true,
                enumerable: false
            }
        );
    }

    return instance;
}

function destroyLuaInstance(instance) {
    if (
        !instance ||
        instance.__destroyed
    ) {
        return;
    }

    if (
        instance === currentSeat
    ) {
        unseatPlayer(
            true
        );
    } else if (
        instance === currentSeatWeld
    ) {
        // External SeatWeld deletion is equivalent to getting up. Do not try to
        // destroy the weld recursively because this call is already doing it.
        unseatPlayer(
            true,
            false
        );
    }

    for (
        const child of
        [...getLuaChildren(instance)]
    ) {
        destroyLuaInstance(
            child
        );
    }

    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            joint !== instance &&
            (
                joint.Part0 === instance ||
                joint.Part1 === instance
            )
        ) {
            destroyLuaInstance(
                joint
            );
        }
    }

    const oldParent =
        instance.Parent;

    luaJoints.delete(
        instance
    );

    luaBodyMovers.delete(
        instance
    );

    if (
        selectionBoxes.has(
            instance
        )
    ) {
        const visual =
            instance.__selectionVisual;

        if (visual) {
            scene.remove(
                visual
            );

            visual.geometry?.dispose?.();
            visual.material?.dispose?.();
        }

        selectionBoxes.delete(
            instance
        );
    }

    luaValueObjects.delete(
        instance
    );

    luaHumanoids.delete(
        instance
    );

    const part =
        instance.__internal;

    if (
        part &&
        !part.isCharacterVisual
    ) {
        const i =
            physObjects.indexOf(
                part
            );

        if (i !== -1)
            physObjects.splice(
                i,
                1
            );

        if (part.mesh?.parent)
            part.mesh.parent.remove(
                part.mesh
            );

        if (part.body) {
            world.removeRigidBody(
                part.body
            );

            part.body = null;
        }
    }

    instance.Parent = null;
    instance.__destroyed = true;

    if (oldParent) {
        fireLuaSignal(
            oldParent.ChildRemoved,
            instance
        );

        refreshChildAliases(
            oldParent
        );
    }

    fireLuaSignal(
        instance.AncestryChanged,
        instance,
        null
    );

    disconnectInstanceSignals(
        instance
    );

    luaInstances.delete(
        instance
    );
}

function finalizeLuaInstance(
    instance,
    internal = null
) {
    addCommonInstanceApi(
        instance
    );

    instance.Destroy =
        (...args) => {
            destroyLuaInstance(
                instance
            );
        };

    Object.defineProperty(
        instance,
        "__destroyed",
        {
            value: false,
            writable: true,
            enumerable: false
        }
    );

    if (
        !("__internal" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__internal",
            {
                value: internal,
                writable: true,
                enumerable: false
            }
        );
    }

    luaInstances.add(
        instance
    );

    return instance;
}

function createLuaContainer(
    className = "Model"
) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true
            })
        );

    return instance;
}

function getModelParts(model) {
    return getLuaDescendants(model)
        .filter(instance =>
            isA(
                instance,
                "BasePart"
            )
        );
}

function getPartCFrame(instance) {
    if (
        instance?.CFrame
    ) {
        return instance.CFrame;
    }

    return createCFrame(
        Number(
            instance?.Position?.X
        ) || 0,
        Number(
            instance?.Position?.Y
        ) || 0,
        Number(
            instance?.Position?.Z
        ) || 0
    );
}

function moveLuaPartBy(
    part,
    dx,
    dy,
    dz
) {
    if (!part?.Position)
        return;

    part.Position.X =
        (Number(part.Position.X) || 0) +
        dx;

    part.Position.Y =
        (Number(part.Position.Y) || 0) +
        dy;

    part.Position.Z =
        (Number(part.Position.Z) || 0) +
        dz;

    if (part.CFrame) {
        part.CFrame =
            createCFrame(
                part.Position.X,
                part.Position.Y,
                part.Position.Z,
                Number(
                    part.Orientation?.X
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.X
                    ) :
                    0,
                Number(
                    part.Orientation?.Y
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Y
                    ) :
                    0,
                Number(
                    part.Orientation?.Z
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Z
                    ) :
                    0
            );
    }
}

function createLuaModel() {
    const model =
        createLuaContainer(
            "Model"
        );

    model.PrimaryPart = null;

    model.MoveTo =
        (...args) => {
            const position =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            if (!position)
                return;

            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return;

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            const dx =
                (Number(position.X) || 0) -
                (Number(root.Position?.X) || 0);

            const dy =
                (Number(position.Y) || 0) -
                (Number(root.Position?.Y) || 0);

            const dz =
                (Number(position.Z) || 0) -
                (Number(root.Position?.Z) || 0);

            for (
                const part of parts
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }
        };

    model.GetModelCFrame =
        (...args) => {
            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return createCFrame();

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            return getPartCFrame(
                root
            );
        };

    model.SetPrimaryPartCFrame =
        (...args) => {
            const target =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (
                !target ||
                !model.PrimaryPart ||
                !isA(
                    model.PrimaryPart,
                    "BasePart"
                )
            ) {
                return;
            }

            const old =
                getPartCFrame(
                    model.PrimaryPart
                );

            const dx =
                (Number(target.X) || 0) -
                (Number(old.X) || 0);

            const dy =
                (Number(target.Y) || 0) -
                (Number(old.Y) || 0);

            const dz =
                (Number(target.Z) || 0) -
                (Number(old.Z) || 0);

            for (
                const part of
                getModelParts(model)
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }

            model.PrimaryPart.CFrame =
                target;
        };

    model.MakeJoints =
        (...args) => {
            for (
                const part of
                getModelParts(model)
            ) {
                part.MakeJoints?.();
            }
        };

    model.BreakJoints =
        (...args) => {
            if (
                model ===
                currentCharacterModel
            ) {
                return breakCharacterJoints();
            }

            let broken =
                0;

            for (
                const part of
                getModelParts(model)
            ) {
                broken +=
                    Number(
                        part.BreakJoints?.()
                    ) || 0;
            }

            return broken;
        };

    return model;
}

function createLuaFolder() {
    return createLuaContainer(
        "Folder"
    );
}

function coerceValueObjectValue(
    className,
    value
) {
    if (className === "StringValue")
        return String(
            value ?? ""
        );

    if (className === "BoolValue")
        return Boolean(value);

    if (className === "IntValue")
        return Math.trunc(
            Number(value) || 0
        );

    if (className === "NumberValue")
        return Number(value) || 0;

    if (className === "ObjectValue")
        return value ?? null;

    return value;
}

function createLuaValue(className) {
    let initial = null;

    if (className === "StringValue")
        initial = "";

    if (className === "BoolValue")
        initial = false;

    if (
        className === "IntValue" ||
        className === "NumberValue"
    ) {
        initial = 0;
    }

    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Value:
                    initial
            })
        );

    Object.defineProperty(
        instance,
        "__lastValue",
        {
            value:
                initial,
            writable:
                true,
            enumerable:
                false
        }
    );

    luaValueObjects.add(
        instance
    );

    return instance;
}

function createLuaHumanoid() {
    const humanoid =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "Humanoid",

                ClassName:
                    "Humanoid",

                Parent:
                    null,

                Archivable:
                    true,

                Health:
                    100,

                MaxHealth:
                    100,

                WalkSpeed:
                    16,

                JumpPower:
                    50,

                Jump:
                    false,

                Sit:
                    false,

                PlatformStand:
                    false,

                AutoRotate:
                    true,

                MoveDirection:
                    createVector3(),

                FloorMaterial:
                    "Air",

                StateChanged:
                    createLuaSignal(
                        "Humanoid.StateChanged"
                    ),

                Running:
                    createLuaSignal(
                        "Humanoid.Running"
                    ),

                Climbing:
                    createLuaSignal(
                        "Humanoid.Climbing"
                    ),

                Swimming:
                    createLuaSignal(
                        "Humanoid.Swimming"
                    ),

                Jumping:
                    createLuaSignal(
                        "Humanoid.Jumping"
                    ),

                FreeFalling:
                    createLuaSignal(
                        "Humanoid.FreeFalling"
                    ),

                Died:
                    createLuaSignal(
                        "Humanoid.Died"
                    ),

                HealthChanged:
                    createLuaSignal(
                        "Humanoid.HealthChanged"
                    )
            })
        );

    Object.defineProperty(
        humanoid,
        "__humanoidLast",
        {
            value: {
                Health: 100,
                MaxHealth: 100,
                WalkSpeed: 16,
                JumpPower: 50,
                Jump: false,
                Sit: false,
                PlatformStand: false,
                State: "Running",
                RunningSpeed: 0,
                ClimbingSpeed: 0,
                SwimmingSpeed: 0
            },
            writable: true,
            enumerable: false
        }
    );

    Object.defineProperty(
        humanoid,
        "__dead",
        {
            value: false,
            writable: true,
            enumerable: false
        }
    );

    humanoid.TakeDamage =
        (...args) => {
            const amount =
                getNumberArg(
                    args,
                    0
                ) || 0;

            if (
                humanoid.__dead ||
                amount <= 0
            ) {
                return;
            }

            humanoid.Health =
                Math.max(
                    0,
                    Number(
                        humanoid.Health
                    ) - amount
                );
        };

    humanoid.takeDamage =
        humanoid.TakeDamage;

    humanoid.GetState =
        (...args) =>
            humanoid.__humanoidLast.State ||
            "Running";

    humanoid.ChangeState =
        (...args) => {
            const newState =
                getStringArg(
                    args,
                    humanoid.GetState()
                );

            const oldState =
                humanoid.__humanoidLast.State ||
                "Running";

            humanoid.__humanoidLast.State =
                newState;

            if (oldState !== newState) {
                fireLuaSignal(
                    humanoid.StateChanged,
                    oldState,
                    newState
                );
            }
        };

    humanoid.Move =
        (...args) => {
            const direction =
                args.find(v =>
                    v &&
                    typeof v === "object" &&
                    "X" in v &&
                    "Y" in v &&
                    "Z" in v
                );

            if (!direction)
                return;

            humanoid.MoveDirection =
                createVector3(
                    direction.X,
                    direction.Y,
                    direction.Z
                );
        };

    humanoid.MoveTo =
        (...args) => {
            const target =
                args.find(v =>
                    v &&
                    typeof v === "object" &&
                    "X" in v &&
                    "Y" in v &&
                    "Z" in v
                );

            if (!target)
                return;

            Object.defineProperty(
                humanoid,
                "__moveToTarget",
                {
                    value: createVector3(
                        target.X,
                        target.Y,
                        target.Z
                    ),
                    writable: true,
                    configurable: true,
                    enumerable: false
                }
            );
        };

    luaHumanoids.add(
        humanoid
    );

    return humanoid;
}

// ─── Phase 3: classic JointInstance physics ─────────────────────────────────
//
// Relationship used by Weld/Snap/Glue/Motor/Rotate:
//     Part0.CFrame * C0 == Part1.CFrame * C1
//
// The old prototype always started C0/C1 at identity, which caused newly
// created joints to pull both part centers together. Phase 3 captures the
// parts' CURRENT relative pose the first time a joint becomes valid, unless
// the script already supplied explicit C0/C1 values.

function isIdentityCFrame(cf, epsilon = 1e-6) {
    if (!cf)
        return true;

    return (
        Math.abs(Number(cf.X) || 0) < epsilon &&
        Math.abs(Number(cf.Y) || 0) < epsilon &&
        Math.abs(Number(cf.Z) || 0) < epsilon &&
        Math.abs(Number(cf._qx) || 0) < epsilon &&
        Math.abs(Number(cf._qy) || 0) < epsilon &&
        Math.abs(Number(cf._qz) || 0) < epsilon &&
        Math.abs((Number(cf._qw) || 1) - 1) < epsilon
    );
}

function frameToCFrame(frame) {
    return makeCFrameFromQuaternion(
        frame.p.x,
        frame.p.y,
        frame.p.z,
        frame.q
    );
}

function createLuaJoint(className) {
    const joint =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Part0:
                    null,

                Part1:
                    null,

                C0:
                    createCFrame(0, 0, 0),

                C1:
                    createCFrame(0, 0, 0),

                CurrentAngle:
                    0,

                DesiredAngle:
                    0,

                MaxVelocity:
                    className === "Motor"
                        ? 0.1
                        : 0,

                Velocity:
                    className === "Rotate"
                        ? 1
                        : 0
            })
        );

    Object.defineProperty(
        joint,
        "__phase3Joint",
        {
            value: {
                captured:
                    false,

                lastPart0:
                    null,

                lastPart1:
                    null,

                lastC0:
                    joint.C0,

                lastC1:
                    joint.C1
            },
            writable: true,
            enumerable: false
        }
    );

    joint.SetDesiredAngle =
        (...args) => {
            joint.DesiredAngle =
                getNumberArg(
                    args,
                    0
                ) || 0;
        };

    luaJoints.add(
        joint
    );

    return joint;
}

function getBodyFrame(instance) {
    const body =
        instance?.__internal?.body;

    if (!body)
        return null;

    const t =
        body.translation();

    const r =
        body.rotation();

    return {
        p:
            new THREE.Vector3(
                t.x,
                t.y,
                t.z
            ),

        q:
            new THREE.Quaternion(
                r.x,
                r.y,
                r.z,
                r.w
            )
    };
}

function cfFrame(cf) {
    return {
        p:
            new THREE.Vector3(
                Number(cf?.X) || 0,
                Number(cf?.Y) || 0,
                Number(cf?.Z) || 0
            ),

        q:
            quaternionFromCFrameValue(
                cf
            )
    };
}

function mulFrame(a, b) {
    return {
        p:
            a.p.clone()
                .add(
                    b.p.clone()
                        .applyQuaternion(
                            a.q
                        )
                ),

        q:
            a.q.clone()
                .multiply(
                    b.q
                )
    };
}

function invFrame(a) {
    const q =
        a.q.clone()
            .invert();

    return {
        p:
            a.p.clone()
                .multiplyScalar(-1)
                .applyQuaternion(q),

        q
    };
}

function setLuaPartWorldFrame(instance, frame) {
    const internal =
        instance?.__internal;

    if (
        !internal?.body ||
        !internal?.mesh
    ) {
        return;
    }

    internal.body.setTranslation(
        {
            x: frame.p.x,
            y: frame.p.y,
            z: frame.p.z
        },
        true
    );

    internal.body.setRotation(
        {
            x: frame.q.x,
            y: frame.q.y,
            z: frame.q.z,
            w: frame.q.w
        },
        true
    );

    // A welded/motor-driven part should not keep stale velocity fighting the
    // joint solver.
    if (!instance.Anchored) {
        internal.body.setLinvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );

        internal.body.setAngvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );
    }

    internal.mesh.position.copy(
        frame.p
    );

    internal.mesh.quaternion.copy(
        frame.q
    );

    instance.Position.X =
        frame.p.x;

    instance.Position.Y =
        frame.p.y;

    instance.Position.Z =
        frame.p.z;

    const e =
        new THREE.Euler()
            .setFromQuaternion(
                frame.q,
                "XYZ"
            );

    instance.Orientation.X =
        THREE.MathUtils.radToDeg(
            e.x
        );

    instance.Orientation.Y =
        THREE.MathUtils.radToDeg(
            e.y
        );

    instance.Orientation.Z =
        THREE.MathUtils.radToDeg(
            e.z
        );

    instance.CFrame =
        makeCFrameFromQuaternion(
            frame.p.x,
            frame.p.y,
            frame.p.z,
            frame.q
        );

    if (instance.__last) {
        instance.__last.Position = [
            frame.p.x,
            frame.p.y,
            frame.p.z
        ];

        instance.__last.Orientation = [
            instance.Orientation.X,
            instance.Orientation.Y,
            instance.Orientation.Z
        ];
    }
}

function captureJointCurrentPose(joint) {
    const a =
        joint.Part0;

    const b =
        joint.Part1;

    const aFrame =
        getBodyFrame(a);

    const bFrame =
        getBodyFrame(b);

    if (
        !aFrame ||
        !bFrame
    ) {
        return false;
    }

    // Preserve explicit C0/C1 if the script supplied either of them.
    if (
        isIdentityCFrame(joint.C0) &&
        isIdentityCFrame(joint.C1)
    ) {
        // Part0 * Identity = Part1 * C1
        // C1 = inverse(Part1) * Part0
        const relative =
            mulFrame(
                invFrame(bFrame),
                aFrame
            );

        joint.C1 =
            frameToCFrame(
                relative
            );
    }

    joint.__phase3Joint.captured =
        true;

    joint.__phase3Joint.lastPart0 =
        a;

    joint.__phase3Joint.lastPart1 =
        b;

    return true;
}

function resetJointCaptureIfChanged(joint) {
    const state =
        joint.__phase3Joint;

    if (!state)
        return;

    if (
        state.lastPart0 !== joint.Part0 ||
        state.lastPart1 !== joint.Part1
    ) {
        state.captured =
            false;
    }
}

function syncLuaJoints(delta) {
    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            !joint ||
            joint.__destroyed ||
            !joint.Parent
        ) {
            continue;
        }

        const a =
            joint.Part0;

        const b =
            joint.Part1;

        if (
            !a?.__internal?.body ||
            !b?.__internal?.body ||
            a === b
        ) {
            continue;
        }

        resetJointCaptureIfChanged(
            joint
        );

        if (
            !joint.__phase3Joint?.captured &&
            !captureJointCurrentPose(joint)
        ) {
            continue;
        }

        if (
            joint.ClassName === "Motor"
        ) {
            const cur =
                Number(
                    joint.CurrentAngle
                ) || 0;

            const dst =
                Number(
                    joint.DesiredAngle
                ) || 0;

            const maxVel =
                Math.abs(
                    Number(
                        joint.MaxVelocity
                    ) || 0
                );

            const step =
                maxVel *
                delta;

            joint.CurrentAngle =
                step <= 0
                    ? cur
                    : (
                        Math.abs(
                            dst - cur
                        ) <= step
                            ? dst
                            : cur +
                              Math.sign(
                                  dst - cur
                              ) *
                              step
                    );
        } else if (
            joint.ClassName === "Rotate"
        ) {
            joint.CurrentAngle =
                (
                    Number(
                        joint.CurrentAngle
                    ) || 0
                ) +
                (
                    Number(
                        joint.Velocity
                    ) || 0
                ) *
                delta;
        }

        let target =
            mulFrame(
                getBodyFrame(a),
                cfFrame(
                    joint.C0
                )
            );

        if (
            joint.ClassName === "Motor" ||
            joint.ClassName === "Rotate"
        ) {
            // Classic hinge-style joint axis.
            target =
                mulFrame(
                    target,
                    {
                        p:
                            new THREE.Vector3(),

                        q:
                            new THREE.Quaternion()
                                .setFromAxisAngle(
                                    new THREE.Vector3(
                                        0,
                                        1,
                                        0
                                    ),
                                    Number(
                                        joint.CurrentAngle
                                    ) || 0
                                )
                    }
                );
        }

        target =
            mulFrame(
                target,
                invFrame(
                    cfFrame(
                        joint.C1
                    )
                )
            );

        setLuaPartWorldFrame(
            b,
            target
        );
    }
}

function touchingFacePair(a, b, epsilon = 0.08) {
    const ax=a.Position.X, ay=a.Position.Y, az=a.Position.Z;
    const bx=b.Position.X, by=b.Position.Y, bz=b.Position.Z;
    const ahx=a.Size.X/2, ahy=a.Size.Y/2, ahz=a.Size.Z/2;
    const bhx=b.Size.X/2, bhy=b.Size.Y/2, bhz=b.Size.Z/2;
    const overlapX = Math.abs(ax-bx) <= ahx+bhx+epsilon;
    const overlapY = Math.abs(ay-by) <= ahy+bhy+epsilon;
    const overlapZ = Math.abs(az-bz) <= ahz+bhz+epsilon;
    if (!(overlapX && overlapY && overlapZ)) return null;

    if (Math.abs((ay+ahy)-(by-bhy)) <= epsilon) return ["TopSurface","BottomSurface"];
    if (Math.abs((ay-ahy)-(by+bhy)) <= epsilon) return ["BottomSurface","TopSurface"];
    if (Math.abs((ax+ahx)-(bx-bhx)) <= epsilon) return ["RightSurface","LeftSurface"];
    if (Math.abs((ax-ahx)-(bx+bhx)) <= epsilon) return ["LeftSurface","RightSurface"];
    if (Math.abs((az+ahz)-(bz-bhz)) <= epsilon) return ["BackSurface","FrontSurface"];
    if (Math.abs((az-ahz)-(bz+bhz)) <= epsilon) return ["FrontSurface","BackSurface"];
    return null;
}

function makeSurfaceJoints(part) {
    if (
        !part?.IsA?.("BasePart")
    ) {
        return;
    }

    for (
        const other of
        luaInstances
    ) {
        if (
            other === part ||
            !other?.IsA?.("BasePart") ||
            !isInWorkspace(other)
        ) {
            continue;
        }

        const faces =
            touchingFacePair(
                part,
                other
            );

        if (!faces)
            continue;

        const s0 =
            part[
                faces[0]
            ] ||
            "Smooth";

        const s1 =
            other[
                faces[1]
            ] ||
            "Smooth";

        let className =
            null;

        if (
            s0 === "Glue" ||
            s1 === "Glue"
        ) {
            className =
                "Glue";
        } else if (
            s0 === "Weld" ||
            s1 === "Weld"
        ) {
            className =
                "Weld";
        } else if (
            [
                "Studs",
                "Inlet",
                "Universal"
            ].includes(s0) &&
            [
                "Studs",
                "Inlet",
                "Universal"
            ].includes(s1)
        ) {
            className =
                "Snap";
        }

        if (!className)
            continue;

        const exists =
            [...luaJoints]
                .some(joint =>
                    !joint.__destroyed &&
                    (
                        (
                            joint.Part0 === part &&
                            joint.Part1 === other
                        ) ||
                        (
                            joint.Part0 === other &&
                            joint.Part1 === part
                        )
                    )
                );

        if (exists)
            continue;

        const joint =
            createLuaJoint(
                className
            );

        joint.Part0 =
            part;

        joint.Part1 =
            other;

        joint.Parent =
            part;

        // Capture NOW, while the objects are still at their intended touching
        // positions, instead of waiting for the first simulation frame.
        captureJointCurrentPose(
            joint
        );
    }
}

// ─── Phase 3: classic BodyMovers ─────────────────────────────────────────────
//
// Implemented:
//   BodyVelocity
//   BodyPosition
//   BodyGyro
//   BodyForce
//   BodyAngularVelocity
//   BodyThrust
//
// These operate on the BasePart they are parented to.

function vectorMagnitude(v) {
    const x =
        Number(v?.X) || 0;

    const y =
        Number(v?.Y) || 0;

    const z =
        Number(v?.Z) || 0;

    return Math.hypot(
        x,
        y,
        z
    );
}

function vector3ToThree(v) {
    return new THREE.Vector3(
        Number(v?.X) || 0,
        Number(v?.Y) || 0,
        Number(v?.Z) || 0
    );
}

function clampVectorComponents(v, max) {
    return new THREE.Vector3(
        THREE.MathUtils.clamp(
            v.x,
            -Math.abs(Number(max?.X) || 0),
            Math.abs(Number(max?.X) || 0)
        ),
        THREE.MathUtils.clamp(
            v.y,
            -Math.abs(Number(max?.Y) || 0),
            Math.abs(Number(max?.Y) || 0)
        ),
        THREE.MathUtils.clamp(
            v.z,
            -Math.abs(Number(max?.Z) || 0),
            Math.abs(Number(max?.Z) || 0)
        )
    );
}

function createLuaBodyMover(className) {
    const common = {
        Name:
            className,

        ClassName:
            className,

        Parent:
            null,

        Archivable:
            true
    };

    if (
        className === "BodyVelocity"
    ) {
        Object.assign(
            common,
            {
                Velocity:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyPosition"
    ) {
        Object.assign(
            common,
            {
                Position:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    10000,

                D:
                    1250
            }
        );
    } else if (
        className === "BodyGyro"
    ) {
        Object.assign(
            common,
            {
                CFrame:
                    createCFrame(),

                MaxTorque:
                    createVector3(
                        400000,
                        0,
                        400000
                    ),

                P:
                    3000,

                D:
                    500
            }
        );
    } else if (
        className === "BodyForce"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3()
            }
        );
    } else if (
        className ===
        "BodyAngularVelocity"
    ) {
        Object.assign(
            common,
            {
                AngularVelocity:
                    createVector3(),

                MaxTorque:
                    createVector3(
                        400000,
                        400000,
                        400000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyThrust"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3(),

                Location:
                    createVector3()
            }
        );
    }

    const mover =
        finalizeLuaInstance(
            Mutable(
                common
            )
        );

    luaBodyMovers.add(
        mover
    );

    return mover;
}

function getBodyMoverPart(mover) {
    const parent =
        mover?.Parent;

    if (
        parent &&
        isA(
            parent,
            "BasePart"
        ) &&
        parent.__internal?.body &&
        !parent.Anchored
    ) {
        return parent;
    }

    return null;
}

function applyBodyVelocity(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const current =
        body.linvel();

    const target =
        vector3ToThree(
            mover.Velocity
        );

    const cur =
        new THREE.Vector3(
            current.x,
            current.y,
            current.z
        );

    // Convert P into a stable interpolation rate rather than allowing huge
    // gains to explode the browser physics simulation.
    const response =
        1 -
        Math.exp(
            -Math.max(
                0,
                Number(mover.P) || 0
            ) *
            delta /
            1250
        );

    let desiredChange =
        target.clone()
            .sub(cur)
            .multiplyScalar(
                response
            );

    const maxForce =
        mover.MaxForce;

    // Treat MaxForce as an acceleration/authority limit in the emulator.
    desiredChange =
        clampVectorComponents(
            desiredChange,
            createVector3(
                (Number(maxForce?.X) || 0) * delta,
                (Number(maxForce?.Y) || 0) * delta,
                (Number(maxForce?.Z) || 0) * delta
            )
        );

    cur.add(
        desiredChange
    );

    body.setLinvel(
        {
            x: cur.x,
            y: cur.y,
            z: cur.z
        },
        true
    );
}

function applyBodyPosition(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const posRaw =
        body.translation();

    const velRaw =
        body.linvel();

    const pos =
        new THREE.Vector3(
            posRaw.x,
            posRaw.y,
            posRaw.z
        );

    const vel =
        new THREE.Vector3(
            velRaw.x,
            velRaw.y,
            velRaw.z
        );

    const target =
        vector3ToThree(
            mover.Position
        );

    const error =
        target.sub(
            pos
        );

    // PD controller.
    const p =
        Math.max(
            0,
            Number(mover.P) || 0
        );

    const d =
        Math.max(
            0,
            Number(mover.D) || 0
        );

    let acceleration =
        error.multiplyScalar(
            p / 10000
        )
            .sub(
                vel.clone()
                    .multiplyScalar(
                        d / 1250
                    )
            );

    acceleration =
        clampVectorComponents(
            acceleration,
            mover.MaxForce
        );

    vel.addScaledVector(
        acceleration,
        delta
    );

    body.setLinvel(
        {
            x: vel.x,
            y: vel.y,
            z: vel.z
        },
        true
    );
}

function applyBodyForce(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const force =
        vector3ToThree(
            mover.Force
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: force.x,
                y: force.y,
                z: force.z
            },
            true
        );
    } else {
        // Fallback for Rapier builds without addForce exposed.
        const vel =
            body.linvel();

        body.setLinvel(
            {
                x:
                    vel.x +
                    force.x * 0.001,

                y:
                    vel.y +
                    force.y * 0.001,

                z:
                    vel.z +
                    force.z * 0.001
            },
            true
        );
    }
}

function applyBodyAngularVelocity(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const currentRaw =
        body.angvel();

    const current =
        new THREE.Vector3(
            currentRaw.x,
            currentRaw.y,
            currentRaw.z
        );

    const target =
        vector3ToThree(
            mover.AngularVelocity
        );

    const response =
        1 -
        Math.exp(
            -Math.max(
                0,
                Number(mover.P) || 0
            ) *
            delta /
            1250
        );

    let change =
        target.clone()
            .sub(current)
            .multiplyScalar(
                response
            );

    change =
        clampVectorComponents(
            change,
            createVector3(
                (Number(mover.MaxTorque?.X) || 0) * delta,
                (Number(mover.MaxTorque?.Y) || 0) * delta,
                (Number(mover.MaxTorque?.Z) || 0) * delta
            )
        );

    current.add(
        change
    );

    body.setAngvel(
        {
            x: current.x,
            y: current.y,
            z: current.z
        },
        true
    );
}

function applyBodyGyro(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const raw =
        body.rotation();

    const current =
        new THREE.Quaternion(
            raw.x,
            raw.y,
            raw.z,
            raw.w
        );

    const target =
        quaternionFromCFrameValue(
            mover.CFrame
        );

    const torque =
        vectorMagnitude(
            mover.MaxTorque
        );

    if (
        torque <= 0
    ) {
        return;
    }

    const p =
        Math.max(
            0,
            Number(mover.P) || 0
        );

    const d =
        Math.max(
            0,
            Number(mover.D) || 0
        );

    const response =
        THREE.MathUtils.clamp(
            (
                p /
                Math.max(
                    1,
                    p + d
                )
            ) *
            delta *
            12,
            0,
            1
        );

    current.slerp(
        target,
        response
    );

    body.setRotation(
        {
            x: current.x,
            y: current.y,
            z: current.z,
            w: current.w
        },
        true
    );

    // Damping keeps old angular momentum from immediately undoing the gyro.
    const av =
        body.angvel();

    const damping =
        Math.exp(
            -d *
            delta /
            500
        );

    body.setAngvel(
        {
            x: av.x * damping,
            y: av.y * damping,
            z: av.z * damping
        },
        true
    );
}

function applyBodyThrust(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const localForce =
        vector3ToThree(
            mover.Force
        );

    const rawRotation =
        body.rotation();

    const q =
        new THREE.Quaternion(
            rawRotation.x,
            rawRotation.y,
            rawRotation.z,
            rawRotation.w
        );

    const worldForce =
        localForce.applyQuaternion(
            q
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: worldForce.x,
                y: worldForce.y,
                z: worldForce.z
            },
            true
        );
    }
}

function syncLuaBodyMovers(delta) {
    for (
        const mover of
        [...luaBodyMovers]
    ) {
        if (
            !mover ||
            mover.__destroyed
        ) {
            continue;
        }

        const part =
            getBodyMoverPart(
                mover
            );

        if (!part)
            continue;

        switch (
            mover.ClassName
        ) {
            case "BodyVelocity":
                applyBodyVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyPosition":
                applyBodyPosition(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyGyro":
                applyBodyGyro(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyForce":
                applyBodyForce(
                    mover,
                    part
                );
                break;

            case "BodyAngularVelocity":
                applyBodyAngularVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyThrust":
                applyBodyThrust(
                    mover,
                    part
                );
                break;
        }
    }
}

function cloneLuaInstance(source) {
    if (
        !source ||
        source.__destroyed ||
        source.Archivable === false
    ) {
        return null;
    }

    const c =
        InstanceApi.new(
            source.ClassName
        );

    c.Name =
        source.Name;

    c.Archivable =
        source.Archivable;

    if (
        isA(
            source,
            "BasePart"
        )
    ) {
        c.Size =
            createVector3(
                source.Size.X,
                source.Size.Y,
                source.Size.Z
            );

        c.Position =
            createVector3(
                source.Position.X,
                source.Position.Y,
                source.Position.Z
            );

        c.Orientation =
            createVector3(
                source.Orientation.X,
                source.Orientation.Y,
                source.Orientation.Z
            );

        c.CFrame =
            source.CFrame;

        c.Color =
            createColor3(
                source.Color.R,
                source.Color.G,
                source.Color.B
            );

        c.BrickColor =
            BrickColorApi.new(
                source.BrickColor?.Name ||
                "Medium stone grey"
            );

        c.Anchored =
            source.Anchored;

        c.CanCollide =
            source.CanCollide;

        c.Transparency =
            source.Transparency;

        c.Reflectance =
            source.Reflectance || 0;

        if (
            source.ClassName ===
            "Seat"
        ) {
            c.Disabled =
                Boolean(
                    source.Disabled
                );

            // Occupant/SeatWeld are runtime state and are intentionally not cloned.
            c.Occupant =
                null;
        }

        for (
            const key of
            [
                "TopSurface",
                "BottomSurface",
                "LeftSurface",
                "RightSurface",
                "FrontSurface",
                "BackSurface"
            ]
        ) {
            c[key] =
                source[key];
        }
    } else if (
        source.ClassName ===
        "Humanoid"
    ) {
        c.Health =
            source.Health;

        c.MaxHealth =
            source.MaxHealth;

        c.WalkSpeed =
            source.WalkSpeed;

        c.JumpPower =
            source.JumpPower;

        c.Sit =
            source.Sit;

        c.PlatformStand =
            source.PlatformStand;

        c.AutoRotate =
            source.AutoRotate;
    } else if (
        luaBodyMovers.has(source)
    ) {
        for (
            const propertyName of
            [
                "Velocity",
                "MaxForce",
                "Position",
                "P",
                "D",
                "CFrame",
                "MaxTorque",
                "Force",
                "AngularVelocity",
                "Location"
            ]
        ) {
            if (
                propertyName in source
            ) {
                c[propertyName] =
                    source[propertyName];
            }
        }
    } else if (
        "Value" in source
    ) {
        c.Value =
            source.Value;
    }

    if (
        source.ClassName ===
        "Model"
    ) {
        // PrimaryPart is re-linked by name after descendants are cloned.
        c.PrimaryPart = null;
    }

    if (
        luaJoints.has(source)
    ) {
        c.Part0 =
            source.Part0;

        c.Part1 =
            source.Part1;

        c.C0 =
            source.C0;

        c.C1 =
            source.C1;

        c.CurrentAngle =
            source.CurrentAngle;

        c.DesiredAngle =
            source.DesiredAngle;

        c.MaxVelocity =
            source.MaxVelocity;

        c.Velocity =
            source.Velocity;
    }

    for (
        const child of
        source.GetChildren?.() || []
    ) {
        const cc =
            cloneLuaInstance(
                child
            );

        if (cc)
            cc.Parent = c;
    }

    if (
        source.ClassName === "Model" &&
        source.PrimaryPart
    ) {
        c.PrimaryPart =
            c.FindFirstChild(
                source.PrimaryPart.Name,
                true
            );
    }

    refreshChildAliases(c);

    return c;
}

function createLuaPart(className = "Part") {

    const internal = createPart(
        4,
        1,
        2,
        0,
        0.5,
        0,
        {
            color: 0xaaaaaa,
            anchored: false,
            canCollide: true
        }
    );

    // Don't display it until Parent = workspace.
    scene.remove(internal.mesh);

    const instance = Mutable({

        Name: className,
        ClassName: className,
        Archivable: true,

        Parent: null,

        Touched: createLuaSignal(`${className}.Touched`),
        TouchEnded: createLuaSignal(`${className}.TouchEnded`),

        Size: createVector3(
            4,
            1,
            2
        ),

        Position: createVector3(
            0,
            0.5,
            0
        ),

        Orientation: createVector3(
            0,
            0,
            0
        ),

        CFrame: createCFrame(
            0,
            0.5,
            0
        ),

        Color: createColor3(
            170 / 255,
            170 / 255,
            170 / 255
        ),

        BrickColor: BrickColorApi.new("Medium stone grey"),

        Anchored: false,

        CanCollide: true,

        Transparency: 0,

        CastShadow: true,
        Reflectance: 0,

        // Phase 3.5 classic physics properties.
        Velocity: createVector3(0,0,0),
        RotVelocity: createVector3(0,0,0),
        AssemblyMass: 1,
        Massless: false,
        CollisionGroup: "Default",
        CustomPhysicalProperties: null,

        // Classic 2010-style surfaces
        TopSurface: "Studs",
        BottomSurface: "Inlet",
        LeftSurface: "Smooth",
        RightSurface: "Smooth",
        FrontSurface: "Smooth",
        BackSurface: "Smooth",

        MakeJoints() { makeSurfaceJoints(this); },
        BreakJoints() {
            const connected =
                [...luaJoints]
                    .filter(joint =>
                        joint.Part0 === this ||
                        joint.Part1 === this
                    );

            for (
                const joint of
                connected
            ) {
                destroyLuaInstance(
                    joint
                );
            }

            return connected.length;
        },

        Destroy() {
            destroyLuaInstance(this);
        }

    });

    Object.defineProperty(
        instance,
        "__internal",
        {
            value: internal,
            writable: true,
            enumerable: false
        }
    );

    Object.defineProperty(
        instance,
        "__last",
        {
            value: {
                Size: [4, 1, 2],
                Position: [0, 0.5, 0],
                Orientation: [0, 0, 0],
                Parent: null,
                Color: 0xaaaaaa,
                BrickColorName: "Medium stone grey",
                Anchored: false,
                CanCollide: true,
                Transparency: 0,
                Reflectance: 0,
                CastShadow: true,
                Velocity: [0,0,0],
                RotVelocity: [0,0,0],
                Massless: false,
                CollisionGroup: "Default"
            },
            writable: true,
            enumerable: false
        }
    );

    instance.GetConnectedParts =
        (...args) => {
            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const found =
                new Set();

            const visit =
                current => {
                    for (
                        const joint of
                        luaJoints
                    ) {
                        if (
                            joint.__destroyed
                        ) {
                            continue;
                        }

                        let other =
                            null;

                        if (
                            joint.Part0 ===
                            current
                        ) {
                            other =
                                joint.Part1;
                        } else if (
                            joint.Part1 ===
                            current
                        ) {
                            other =
                                joint.Part0;
                        }

                        if (
                            !other ||
                            found.has(other)
                        ) {
                            continue;
                        }

                        found.add(
                            other
                        );

                        if (recursive)
                            visit(other);
                    }
                };

            visit(instance);

            return [...found];
        };

    addCommonInstanceApi(instance);
    Object.defineProperty(instance, "__destroyed", { value: false, writable: true, enumerable: false });

    // IMPORTANT: Parts must be registered so syncLuaInstances(), parenting,
    // Workspace:GetChildren(), joints, and the void system can see them.
    luaInstances.add(instance);

    return instance;
}


function createLuaSeat() {
