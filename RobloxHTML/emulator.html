    BodyAngularVelocity: ["BodyMover", "Instance"],
    BodyThrust: ["BodyMover", "Instance"],
    RocketPropulsion: ["BodyMover", "Instance"],

    StringValue: ["ValueBase", "Instance"],
    BoolValue: ["ValueBase", "Instance"],
    IntValue: ["ValueBase", "Instance"],
    NumberValue: ["ValueBase", "Instance"],
    ObjectValue: ["ValueBase", "Instance"],
    Vector3Value: ["ValueBase", "Instance"],
    CFrameValue: ["ValueBase", "Instance"],
    Color3Value: ["ValueBase", "Instance"],
    BrickColorValue: ["ValueBase", "Instance"]
};

function getLuaChildren(parent) {
    return Array.from(luaInstances)
        .filter(instance =>
            instance &&
            !instance.__destroyed &&
            instance.Parent === parent
        );
}

function getLuaDescendants(parent) {
    const out = [];

    const visit = current => {
        for (
            const child of
            getLuaChildren(current)
        ) {
            out.push(child);
            visit(child);
        }
    };

    visit(parent);
    return out;
}

function isInWorkspace(instance) {
    let p = instance;

    while (p) {
        if (p === workspaceApi)
            return true;

        p = p.Parent;
    }

    return false;
}

function isA(instance, className) {
    if (!instance)
        return false;

    return (
        instance.ClassName === className ||
        className === "Instance" ||
        (
            CLASS_PARENTS[
                instance.ClassName
            ] || []
        ).includes(className)
    );
}

function getStringArg(args, fallback = "") {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "string")
            return args[i];
    }

    return fallback;
}

function getBooleanArg(args, fallback = false) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "boolean")
            return args[i];
    }

    return fallback;
}

function getNumberArg(args, fallback = null) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (
            typeof args[i] === "number" &&
            Number.isFinite(args[i])
        ) {
            return args[i];
        }
    }

    return fallback;
}

function refreshChildAliases(parent) {
    if (
        !parent ||
        (
            typeof parent !== "object" &&
            typeof parent !== "function"
        )
    ) {
        return;
    }

    let state =
        childAliasState.get(parent);

    if (!state) {
        state = {
            names: new Set()
        };

        childAliasState.set(
            parent,
            state
        );
    }

    const children =
        getLuaChildren(parent);

    const desired =
        new Map();

    for (const child of children) {
        const name =
            String(
                child.Name || ""
            );

        if (
            !name ||
            desired.has(name)
        ) {
            continue;
        }

        desired.set(
            name,
            child
        );
    }

    // Remove only aliases that WE created.
    for (
        const oldName of
        [...state.names]
    ) {
        if (!desired.has(oldName)) {
            try {
                if (
                    parent[oldName] &&
                    parent[oldName].Parent === parent
                ) {
                    parent[oldName] = undefined;
                }
            } catch {}

            state.names.delete(
                oldName
            );
        }
    }

    for (
        const [name, child] of
        desired
    ) {
        // Never overwrite real properties/methods such as Name, Parent,
        // GetChildren, etc.
        const current =
            parent[name];

        if (
            current === undefined ||
            state.names.has(name)
        ) {
            try {
                parent[name] = child;
                state.names.add(name);
            } catch {}
        }
    }
}

function addCommonInstanceApi(instance) {
    addInstanceSignals(instance);

    // Roblox-style property signal. The same signal object is returned every
    // time for the same Instance/property pair.
    instance.GetPropertyChangedSignal =
        (...args) => {
            const propertyName =
                getStringArg(
                    args,
                    ""
                );

            if (!propertyName) {
                throw new Error(
                    "GetPropertyChangedSignal expected a property name"
                );
            }

            return getPropertySignal(
                instance,
                propertyName,
                true
            );
        };

    instance.getPropertyChangedSignal =
        instance.GetPropertyChangedSignal;

    // Script-facing hierarchy queries must not expose raw JavaScript arrays.
    // luau-web reports those as host "table" values, but native ipairs() does
    // not treat them as normal Luau arrays. Keep engine internals on raw arrays
    // and wrap only the public API in a stable 1-based collection.
    instance.GetChildren = (...args) =>
        makeLuaCollection(
            getLuaChildren(instance)
        );

    instance.children =
        instance.GetChildren;

    instance.GetDescendants = (...args) =>
        makeLuaCollection(
            getLuaDescendants(instance)
        );

    instance.FindFirstChild = (...args) => {
        const name =
            getStringArg(
                args,
                ""
            );

        const recursive =
            getBooleanArg(
                args,
                false
            );

        const list =
            recursive
                ? getLuaDescendants(
                    instance
                )
                : getLuaChildren(
                    instance
                );

        return (
            list.find(child =>
                child.Name === name
            ) ||
            null
        );
    };

    instance.findFirstChild =
        instance.FindFirstChild;

    instance.FindFirstChildOfClass =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            return (
                getLuaChildren(instance)
                    .find(child =>
                        child.ClassName ===
                        className
                    ) ||
                null
            );
        };

    instance.FindFirstChildWhichIsA =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const list =
                recursive
                    ? getLuaDescendants(
                        instance
                    )
                    : getLuaChildren(
                        instance
                    );

            return (
                list.find(child =>
                    isA(
                        child,
                        className
                    )
                ) ||
                null
            );
        };

    instance.WaitForChild =
        async (...args) => {
            const name =
                getStringArg(
                    args,
                    ""
                );

            const timeout =
                getNumberArg(
                    args,
                    null
                );

            const existing =
                getLuaChildren(
                    instance
                ).find(child =>
                    child.Name === name
                );

            if (existing)
                return existing;

            const started =
                performance.now();

            while (
                !instance.__destroyed
            ) {
                const found =
                    getLuaChildren(
                        instance
                    ).find(child =>
                        child.Name === name
                    );

                if (found)
                    return found;

                if (
                    timeout !== null &&
                    (
                        performance.now() -
                        started
                    ) / 1000 >= timeout
                ) {
                    return null;
                }

                await sleepSeconds(
                    CLASSIC_WAIT_QUANTUM
                );
            }

            return null;
        };

    instance.IsA = (...args) =>
        isA(
            instance,
            getStringArg(
                args,
                ""
            )
        );

    instance.isA =
        instance.IsA;

    instance.IsDescendantOf =
        (...args) => {
            const ancestor =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                instance.Parent;

            while (p) {
                if (p === ancestor)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.IsAncestorOf =
        (...args) => {
            const descendant =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                descendant?.Parent;

            while (p) {
                if (p === instance)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.GetFullName =
        (...args) => {
            const names = [];
            let p = instance;

            while (p) {
                if (p === gameApi)
                    break;

                if (p.Name)
                    names.unshift(
                        p.Name
                    );

                p = p.Parent;
            }

            return names.join(".");
        };

    instance.Remove =
        (...args) => {
            if (instance.Destroy)
                instance.Destroy();
        };

    instance.ClearAllChildren =
        (...args) => {
            for (
                const child of
                [...getLuaChildren(instance)]
            ) {
                child.Destroy();
            }
        };

    instance.Clone =
        (...args) =>
            cloneLuaInstance(
                instance
            );

    // Older Roblox scripts commonly used lowercase aliases. Keep the modern
    // spellings above as canonical while accepting the classic forms too.
    instance.getChildren =
        instance.GetChildren;

    instance.getDescendants =
        instance.GetDescendants;

    instance.findFirstChildOfClass =
        instance.FindFirstChildOfClass;

    instance.findFirstChildWhichIsA =
        instance.FindFirstChildWhichIsA;

    instance.waitForChild =
        instance.WaitForChild;

    instance.isDescendantOf =
        instance.IsDescendantOf;

    instance.isAncestorOf =
        instance.IsAncestorOf;

    instance.getFullName =
        instance.GetFullName;

    instance.remove =
        instance.Remove;

    instance.clearAllChildren =
        instance.ClearAllChildren;

    instance.clone =
        instance.Clone;

    if (
        !("__eventLastParent" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastParent",
            {
                value:
                    instance.Parent ??
                    null,
                writable: true,
                enumerable: false
            }
        );
    }

    if (
        !("__eventLastName" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastName",
            {
                value:
                    instance.Name,
                writable: true,
                enumerable: false
            }
        );
    }

    return instance;
}

function destroyLuaInstance(instance) {
    if (
        !instance ||
        instance.__destroyed
    ) {
        return;
    }

    // Release a selected BackpackItem before its Handle/children disappear.
    if (
        instance === equippedBackpackItem
    ) {
        releaseClassicBackpackItem(
            instance,
            {
                reparentToBackpack: false,
                destroying: true
            }
        );
    }

    if (
        instance === currentSeat
    ) {
        unseatPlayer(
            true
        );
    } else if (
        instance === currentSeatWeld
    ) {
        // External SeatWeld deletion is equivalent to getting up. Do not try to
        // destroy the weld recursively because this call is already doing it.
        unseatPlayer(
            true,
            false
        );
    }

    for (
        const child of
        [...getLuaChildren(instance)]
    ) {
        destroyLuaInstance(
            child
        );
    }

    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            joint !== instance &&
            (
                joint.Part0 === instance ||
                joint.Part1 === instance
            )
        ) {
            destroyLuaInstance(
                joint
            );
        }
    }

    const oldParent =
        instance.Parent;

    luaJoints.delete(
        instance
    );

    luaBodyMovers.delete(
        instance
    );

    if (
        instance.ClassName === "RocketPropulsion" &&
        instance.ReachedTarget
    ) {
        disconnectLuaSignal(instance.ReachedTarget);
    }

    if (
        selectionBoxes.has(
            instance
        )
    ) {
        const visual =
            instance.__selectionVisual;

        if (visual) {
            scene.remove(
                visual
            );

            visual.traverse?.(
                child => {
                    child.geometry?.dispose?.();
                }
            );

            instance.__selectionMaterial
                ?.dispose?.();
        }

        selectionBoxes.delete(
            instance
        );
    }

    luaValueObjects.delete(
        instance
    );

    if (luaTools.has(instance)) {
        disconnectLuaSignal(instance.Activated);
        disconnectLuaSignal(instance.Deactivated);
        disconnectLuaSignal(instance.Equipped);
        disconnectLuaSignal(instance.Unequipped);
    }

    if (luaHopperBins.has(instance)) {
        disconnectLuaSignal(instance.Selected);
        disconnectLuaSignal(instance.Deselected);
    }

    luaBackpackItems.delete(
        instance
    );
    luaTools.delete(
        instance
    );
    luaHopperBins.delete(
        instance
    );

    if (instance === localBackpackApi) {
        localBackpackApi = null;
    }

    luaSkies.delete(
        instance
    );

    luaHumanoids.delete(
        instance
    );

    removeHumanoidNameplate(
        instance
    );

    if (
        luaDecals.has(
            instance
        )
    ) {
        const visual =
            instance.__decalVisual;

        if (
            visual?.parent
        ) {
            visual.parent.remove(
                visual
            );
        }

        visual?.geometry
            ?.dispose?.();

        instance.__decalMaterial
            ?.dispose?.();

        luaDecals.delete(
            instance
        );
    }

    if (
        luaBillboardGuis.has(
            instance
        )
    ) {
        const sprite =
            instance.__billboardSprite;

        if (
            sprite?.parent
        ) {
            sprite.parent.remove(
                sprite
            );
        }

        sprite?.material
            ?.dispose?.();

        luaBillboardGuis.delete(
            instance
        );
    }

    luaImageLabels.delete(
        instance
    );

    luaScreenGuis.delete(
        instance
    );

    if (
        luaGuiObjects.has(
            instance
        )
    ) {
        disconnectClassicGuiSignals(
            instance
        );

        luaGuiObjects.delete(
            instance
        );
    }

    luaTextBoxes.delete(
        instance
    );

    if (
        instance.__guiElement
    ) {
        instance.__guiElement.remove?.();
        instance.__guiElement =
            null;
    }

    const billboardRecord =
        billboardGuiCanvasCache.get(
            instance
        );

    if (billboardRecord) {
        billboardRecord.texture?.dispose?.();
        billboardGuiCanvasCache.delete(
            instance
        );
    }

    luaParticleEmitters.delete(
        instance
    );

    if (
        luaExplosions.has(
            instance
        )
    ) {
        disconnectLuaSignal(
            instance.Hit
        );

        luaExplosions.delete(
            instance
        );
    }

    if (
        luaForceFields.has(
            instance
        )
    ) {
        if (
            instance ===
            activeVisualForceField
        ) {
            activeVisualForceField =
                null;

            clearSpawnSelectionBoxes();
        }

        if (
            instance ===
            activeSpawnForceField
        ) {
            activeSpawnForceField =
                null;
        }

        luaForceFields.delete(
            instance
        );
    }

    if (
        luaClickDetectors.has(
            instance
        )
    ) {
        disconnectLuaSignal(
            instance.MouseClick
        );

        luaClickDetectors.delete(
            instance
        );
    }

    luaSparkles.delete(
        instance
    );

    if (
        luaMessages.has(
            instance
        )
    ) {
        instance.__messageElement
            ?.remove?.();

        luaMessages.delete(
            instance
        );
    }

    if (
        luaSounds.has(
            instance
        )
    ) {
        const audio =
            instance.__audio;

        if (
            instance.PlayOnRemove &&
            audio &&
            audio.src
        ) {
            try {
                audio.currentTime =
                    0;

                // PlayOnRemove is a one-shot effect even if the source Sound
                // itself was looped.
                audio.loop =
                    false;

                instance
                    .__spatialAudio
                    ?.context
                    ?.resume?.()
                    ?.catch?.(
                        () => {}
                    );

                audio.play().catch(
                    () => {}
                );

                audio.addEventListener(
                    "ended",
                    () =>
                        cleanupLuaSoundSpatialAudio(
                            instance
                        ),
                    {
                        once:
                            true
                    }
                );
            } catch {
                cleanupLuaSoundSpatialAudio(
                    instance
                );
            }
        } else {
            audio?.pause?.();

            cleanupLuaSoundSpatialAudio(
                instance
            );
        }

        disconnectLuaSignal(
            instance.Ended
        );

        disconnectLuaSignal(
            instance.Stopped
        );

        disconnectLuaSignal(
            instance.Loaded
        );

        luaSounds.delete(
            instance
        );
    }

    const part =
        instance.__internal;

    if (
        part &&
        !part.isCharacterVisual
    ) {
        const i =
            physObjects.indexOf(
                part
            );

        if (i !== -1)
            physObjects.splice(
                i,
                1
            );

        if (part.mesh?.parent)
            part.mesh.parent.remove(
                part.mesh
            );

        if (part.body) {
            unregisterRapierColliderOwner(
                part.collider
            );

            world.removeRigidBody(
                part.body
            );

            part.body = null;
            part.collider = null;
        }
    }

    instance.Parent = null;
    instance.__destroyed = true;

    if (oldParent) {
        fireLuaSignal(
            oldParent.ChildRemoved,
            instance
        );

        refreshChildAliases(
            oldParent
        );
    }

    fireLuaSignal(
        instance.AncestryChanged,
        instance,
        null
    );

    disconnectInstanceSignals(
        instance
    );

    luaInstances.delete(
        instance
    );
}

function finalizeLuaInstance(
    instance,
    internal = null
) {
    addCommonInstanceApi(
        instance
    );

    instance.Destroy =
        (...args) => {
            destroyLuaInstance(
                instance
            );
        };

    Object.defineProperty(
        instance,
        "__destroyed",
        {
            value: false,
            writable: true,
            enumerable: false
        }
    );

    if (
        !("__internal" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__internal",
            {
                value: internal,
                writable: true,
                enumerable: false
            }
        );
    }

    luaInstances.add(
        instance
    );

    return instance;
}

function createLuaContainer(
    className = "Model"
) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true
            })
        );

    return instance;
}

function getModelParts(model) {
    return getLuaDescendants(model)
        .filter(instance =>
            isA(
                instance,
                "BasePart"
            )
        );
}

function getPartCFrame(instance) {
    if (
        instance?.CFrame
    ) {
        return instance.CFrame;
    }

    return createCFrame(
        Number(
            instance?.Position?.X
        ) || 0,
        Number(
            instance?.Position?.Y
        ) || 0,
        Number(
            instance?.Position?.Z
        ) || 0
    );
}

function moveLuaPartBy(
    part,
    dx,
    dy,
    dz
) {
    if (!part?.Position)
        return;

    part.Position.X =
        (Number(part.Position.X) || 0) +
        dx;

    part.Position.Y =
        (Number(part.Position.Y) || 0) +
        dy;

    part.Position.Z =
        (Number(part.Position.Z) || 0) +
        dz;

    if (part.CFrame) {
        part.CFrame =
            createCFrame(
                part.Position.X,
                part.Position.Y,
                part.Position.Z,
                Number(
                    part.Orientation?.X
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.X
                    ) :
                    0,
                Number(
                    part.Orientation?.Y
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Y
                    ) :
                    0,
                Number(
                    part.Orientation?.Z
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Z
                    ) :
                    0
            );
    }
}

function createLuaModel() {
    const model =
        createLuaContainer(
            "Model"
        );

    model.PrimaryPart = null;

    model.MoveTo =
        (...args) => {
            const position =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            if (!position)
                return;

            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return;

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            const dx =
                (Number(position.X) || 0) -
                (Number(root.Position?.X) || 0);

            const dy =
                (Number(position.Y) || 0) -
                (Number(root.Position?.Y) || 0);

            const dz =
                (Number(position.Z) || 0) -
                (Number(root.Position?.Z) || 0);

            for (
                const part of parts
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }
        };

    model.GetModelCFrame =
        (...args) => {
            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return createCFrame();

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            return getPartCFrame(
                root
            );
        };

    model.SetPrimaryPartCFrame =
        (...args) => {
            const target =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (
                !target ||
                !model.PrimaryPart ||
                !isA(
                    model.PrimaryPart,
                    "BasePart"
                )
            ) {
                return;
            }

            const old =
                getPartCFrame(
                    model.PrimaryPart
                );

            const dx =
                (Number(target.X) || 0) -
                (Number(old.X) || 0);

            const dy =
                (Number(target.Y) || 0) -
                (Number(old.Y) || 0);

            const dz =
                (Number(target.Z) || 0) -
                (Number(old.Z) || 0);

            for (
                const part of
                getModelParts(model)
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }

            model.PrimaryPart.CFrame =
                target;
        };

    model.MakeJoints =
        (...args) => {
            for (
                const part of
                getModelParts(model)
            ) {
                part.MakeJoints?.();
            }
        };

    model.BreakJoints =
        (...args) => {
            if (
                model ===
                currentCharacterModel
            ) {
                return breakCharacterJoints();
            }

            let broken =
                0;

            for (
                const part of
                getModelParts(model)
            ) {
                broken +=
                    Number(
                        part.BreakJoints?.()
                    ) || 0;
            }

            return broken;
        };

    return model;
}

function createLuaFolder() {
    return createLuaContainer(
        "Folder"
    );
}

// ─── 2008 Backpack / Tool / HopperBin ───────────────────────────────────────
function markClassicInventoryOrder(item) {
    if (!item || item.__classicInventoryOrder)
        return;

    Object.defineProperty(
        item,
        "__classicInventoryOrder",
        {
            value: classicInventoryOrderCounter++,
            writable: false,
            enumerable: false
        }
    );
}

function createLuaBackpack() {
    const backpack =
        createLuaContainer(
            "Backpack"
        );

    backpack.Name =
        "Backpack";

    return backpack;
}

function createLuaTool() {
    const tool =
        createLuaModel();

    tool.ClassName =
        "Tool";
    tool.Name =
        "Tool";

    // BackpackItem.TextureId dates to the original classic API. If it is blank,
    // the core hotbar renders Name as text instead of an image.
    tool.TextureId = "";

    tool.Enabled = true;
    tool.CanBeDropped = true;
    tool.ToolTip = "";

    // Classic grip fields. Grip is authoritative when scripts provide a CFrame;
    // GripPos remains supported because old tools frequently set it directly.
    tool.Grip = createCFrame();
    tool.GripPos = createVector3(0, 0, 0);
    tool.GripForward = createVector3(0, 0, -1);
    tool.GripRight = createVector3(1, 0, 0);
    tool.GripUp = createVector3(0, 1, 0);

    tool.Activated =
        createLuaSignal(
            "Tool.Activated",
            tool
        );
    tool.Deactivated =
        createLuaSignal(
            "Tool.Deactivated",
            tool
        );
    tool.Equipped =
        createLuaSignal(
            "Tool.Equipped",
            tool
        );
    tool.Unequipped =
        createLuaSignal(
            "Tool.Unequipped",
            tool
        );

    tool.Activate =
        (...args) =>
            activateClassicEquippedTool(
                tool
            );

    tool.Deactivate =
        (...args) =>
            deactivateClassicEquippedTool(
                tool
            );

    luaBackpackItems.add(
        tool
    );
    luaTools.add(
        tool
    );
    markClassicInventoryOrder(
        tool
    );

    return tool;
}

function createLuaHopperBin() {
    const bin =
        createLuaModel();

    bin.ClassName =
        "HopperBin";
    bin.Name =
        "HopperBin";
    bin.TextureId = "";
    bin.Active = false;
    bin.BinType = "Script";

    bin.Selected =
        createLuaSignal(
            "HopperBin.Selected",
            bin
        );
    bin.Deselected =
        createLuaSignal(
            "HopperBin.Deselected",
            bin
        );

    bin.ToggleSelect =
        (...args) => {
            if (
                equippedBackpackItem === bin &&
                bin.Active
            ) {
                releaseClassicBackpackItem(
                    bin
                );
            } else {
                equipClassicBackpackItem(
                    bin
                );
            }
        };

    bin.Disable =
        (...args) => {
            if (
                equippedBackpackItem === bin
            ) {
                releaseClassicBackpackItem(
                    bin
                );
            }
            bin.Active = false;
        };

    luaBackpackItems.add(
        bin
    );
    luaHopperBins.add(
        bin
    );
    markClassicInventoryOrder(
        bin
    );

    return bin;
}

function getClassicToolHandle(tool) {
    if (
        !tool ||
        tool.__destroyed ||
        tool.ClassName !== "Tool"
    ) {
        return null;
    }

    const handle =
        getLuaChildren(
            tool
        ).find(child =>
            child &&
            !child.__destroyed &&
            child.Name === "Handle" &&
            isA(
                child,
                "BasePart"
            )
        );

    return handle || null;
}

function getClassicBackpackParts(item) {
    if (!item)
        return [];

    return getLuaDescendants(
        item
    ).filter(descendant =>
        descendant &&
        !descendant.__destroyed &&
        isA(
            descendant,
            "BasePart"
        )
    );
}

function removePartFromPhysicsSync(part) {
    const internal =
        part?.__internal;

    if (!internal)
        return;

    const index =
        physObjects.indexOf(
            internal
        );

    if (index !== -1) {
        physObjects.splice(
            index,
            1
        );
    }
}

function addPartToPhysicsSync(part) {
    const internal =
        part?.__internal;

    if (
        !internal ||
        !internal.body ||
        part.Anchored ||
        physObjects.includes(
            internal
        )
    ) {
        return;
    }

    physObjects.push(
        internal
    );
}

function freezeClassicInventoryPart(part) {
    const internal =
        part?.__internal;

    if (
        !internal ||
        !internal.body
    ) {
        return;
    }

    removePartFromPhysicsSync(
        part
    );

    for (
        let i = 0;
        i < internal.body.numColliders();
        i++
    ) {
        internal.body
            .collider(i)
            .setSensor(true);
    }

    internal.body.setLinvel?.(
        { x: 0, y: 0, z: 0 },
        false
    );
    internal.body.setAngvel?.(
        { x: 0, y: 0, z: 0 },
        false
    );
    internal.body.setGravityScale?.(
        0,
        false
    );
    internal.body.sleep?.();
}

function stowClassicBackpackItemParts(item) {
    for (
        const part of
        getClassicBackpackParts(
            item
        )
    ) {
        freezeClassicInventoryPart(
            part
        );

        const mesh =
            part.__internal?.mesh;

        if (
            mesh?.parent
        ) {
            mesh.parent.remove(
                mesh
            );
        }
    }
}

function restoreClassicWorldBackpackItemParts(item) {
    for (
        const part of
        getClassicBackpackParts(
            item
        )
    ) {
        const internal =
            part.__internal;
        const body =
            internal?.body;

        if (!body)
            continue;

        const wasPhysicsSynced =
            physObjects.includes(
                internal
            );

        body.setGravityScale?.(
            1,
            false
        );

        for (
            let i = 0;
            i < body.numColliders();
            i++
        ) {
            body.collider(i).setSensor(
                !Boolean(
                    part.CanCollide
                )
            );
        }

        addPartToPhysicsSync(
            part
        );

        if (!wasPhysicsSynced) {
            body.wakeUp?.();
        }
    }
}

function syncClassicBackpackItemStorage() {
    // If a script reparents the selected item itself, mirror Roblox's selection
    // state instead of leaving a phantom RightGrip/hotbar highlight behind.
    if (
        equippedBackpackItem &&
        !equippedBackpackItem.__destroyed
    ) {
        if (
            equippedBackpackItem.ClassName === "Tool" &&
            equippedBackpackItem.Parent !== currentCharacterModel
        ) {
            releaseClassicBackpackItem(
                equippedBackpackItem,
                {
                    reparentToBackpack: false
                }
            );
        } else if (
            equippedBackpackItem.ClassName === "HopperBin" &&
            equippedBackpackItem.Parent !== localBackpackApi
        ) {
            releaseClassicBackpackItem(
                equippedBackpackItem,
                {
                    reparentToBackpack: false
                }
            );
        }
    }

    // Parent-to-Character is the classic representation of an equipped Tool.
    // Honor scripts that perform that reparent directly rather than through the
    // core hotbar.
    if (!equippedBackpackItem) {
        const scriptedEquippedTool =
            [...luaTools].find(tool =>
                tool &&
                !tool.__destroyed &&
                tool.Parent === currentCharacterModel
            );

        if (scriptedEquippedTool) {
            equipClassicBackpackItem(
                scriptedEquippedTool
            );
        }
    }

    for (
        const item of
        [...luaBackpackItems]
    ) {
        if (
            !item ||
            item.__destroyed
        ) {
            continue;
        }

        if (
            item.Parent === localBackpackApi ||
            item.Parent === StarterPackApi
        ) {
            stowClassicBackpackItemParts(
                item
            );
        } else if (
            item.ClassName === "Tool" &&
            item !== equippedBackpackItem &&
            isInWorkspace(
                item
            )
        ) {
            restoreClassicWorldBackpackItemParts(
                item
            );
        }
    }
}

function syncClassicGripProperties(tool) {
    // Keep the old split GripPos field useful even though Grip itself is a CFrame.
    const grip =
        tool?.Grip;

    return {
        position: new THREE.Vector3(
            Number(grip?.X) || 0,
            Number(grip?.Y) || 0,
            Number(grip?.Z) || 0
        ).add(
            new THREE.Vector3(
                Number(tool?.GripPos?.X) || 0,
                Number(tool?.GripPos?.Y) || 0,
                Number(tool?.GripPos?.Z) || 0
            )
        ),
        quaternion:
            quaternionFromCFrameValue(
                grip
            )
    };
}

function destroyClassicRightGrip() {
    const joint =
        activeRightGripJoint;

    activeRightGripJoint =
        null;

    if (
        joint &&
        !joint.__destroyed
    ) {
        destroyLuaInstance(
            joint
        );
    }
}

function beginClassicToolGrip(tool) {
    const handle =
        getClassicToolHandle(
            tool
        );

    if (
        !handle ||
        !limbs.rightArm
    ) {
        return false;
    }

    destroyClassicRightGrip();

    const rightArmPart =
        currentCharacterModel
            ?.FindFirstChild?.(
                "Right Arm"
            ) ||
        null;

    if (rightArmPart) {
        const gripJoint =
            createLuaJoint(
                "Weld"
            );

        gripJoint.Name =
            "RightGrip";
        gripJoint.Part0 =
            rightArmPart;
        gripJoint.Part1 =
            handle;
        gripJoint.Parent =
            rightArmPart;

        activeRightGripJoint =
            gripJoint;
    }

    Object.defineProperty(
        handle,
        "__classicHeldTool",
        {
            value: tool,
            writable: true,
            configurable: true,
            enumerable: false
        }
    );

    freezeClassicInventoryPart(
        handle
    );

    const mesh =
        handle.__internal?.mesh;

    if (mesh) {
        if (mesh.parent) {
            mesh.parent.remove(
                mesh
            );
        }

        limbs.rightArm.add(
            mesh
        );
    }

    syncClassicEquippedToolGrip();
    return true;
}

function syncClassicEquippedToolGrip() {
    const tool =
        equippedBackpackItem;

    if (
        !tool ||
        tool.__destroyed ||
        tool.ClassName !== "Tool" ||
        tool.Parent !== currentCharacterModel ||
        !limbs.rightArm
    ) {
        return;
    }

    const handle =
        getClassicToolHandle(
            tool
        );

    if (!handle)
        return;

    freezeClassicInventoryPart(
        handle
    );

    const mesh =
        handle.__internal?.mesh;

    if (!mesh)
        return;

    if (
        mesh.parent !==
        limbs.rightArm
    ) {
        if (mesh.parent) {
            mesh.parent.remove(
                mesh
            );
        }

        limbs.rightArm.add(
            mesh
        );
    }

    const grip =
        syncClassicGripProperties(
            tool
        );

    // The R6 arm pivot is at the shoulder and the 2-stud arm extends down to
    // local Y=-2. This puts the Handle at the hand, then applies Tool.Grip.
    mesh.position.set(
        grip.position.x,
        -2 + grip.position.y,
        grip.position.z
    );

    mesh.quaternion.copy(
        grip.quaternion
    );

    mesh.updateMatrixWorld(
        true
    );

    // Keep Handle.Position/CFrame and its query collider at the actual hand.
    // The body is a zero-gravity sensor while equipped, so it participates in
    // ray queries at the correct location without pushing the character around.
    const worldPosition =
        mesh.getWorldPosition(
            new THREE.Vector3()
        );
    const worldQuaternion =
        mesh.getWorldQuaternion(
            new THREE.Quaternion()
        );
    const body =
        handle.__internal?.body;

    body?.setTranslation?.(
        {
            x: worldPosition.x,
            y: worldPosition.y,
            z: worldPosition.z
        },
        false
    );
    body?.setRotation?.(
        {
            x: worldQuaternion.x,
            y: worldQuaternion.y,
            z: worldQuaternion.z,
            w: worldQuaternion.w
        },
        false
    );

    handle.Position.X = worldPosition.x;
    handle.Position.Y = worldPosition.y;
    handle.Position.Z = worldPosition.z;
    handle.CFrame =
        makeCFrameFromQuaternion(
            worldPosition.x,
            worldPosition.y,
            worldPosition.z,
            worldQuaternion
        );

    const handleEuler =
        new THREE.Euler()
            .setFromQuaternion(
                worldQuaternion,
                "XYZ"
            );
    handle.Orientation.X =
        THREE.MathUtils.radToDeg(
            handleEuler.x
        );
    handle.Orientation.Y =
        THREE.MathUtils.radToDeg(
            handleEuler.y
        );
    handle.Orientation.Z =
        THREE.MathUtils.radToDeg(
            handleEuler.z
        );

    if (handle.__last) {
        handle.__last.Position = [
            worldPosition.x,
            worldPosition.y,
            worldPosition.z
        ];
        handle.__last.Orientation = [
            handle.Orientation.X,
            handle.Orientation.Y,
            handle.Orientation.Z
        ];
    }
}

function releaseClassicToolGrip(
    tool,
    dropToWorkspace = false
) {
    const handle =
        getClassicToolHandle(
            tool
        );

    destroyClassicRightGrip();

    if (!handle)
        return;

    const internal =
        handle.__internal;
    const mesh =
        internal?.mesh;
    const body =
        internal?.body;

    let worldPosition =
        null;
    let worldQuaternion =
        null;

    if (
        dropToWorkspace &&
        mesh
    ) {
        mesh.updateWorldMatrix(
            true,
            false
        );

        worldPosition =
            mesh.getWorldPosition(
                new THREE.Vector3()
            );
        worldQuaternion =
            mesh.getWorldQuaternion(
                new THREE.Quaternion()
            );

        scene.attach(
            mesh
        );
    } else if (
        mesh?.parent
    ) {
        mesh.parent.remove(
            mesh
        );
    }

    try {
        delete handle.__classicHeldTool;
    } catch {
        handle.__classicHeldTool = null;
    }

    if (
        body &&
        dropToWorkspace &&
        worldPosition &&
        worldQuaternion
    ) {
        body.setTranslation(
            {
                x: worldPosition.x,
                y: worldPosition.y,
                z: worldPosition.z
            },
            false
        );
        body.setRotation(
            {
                x: worldQuaternion.x,
                y: worldQuaternion.y,
                z: worldQuaternion.z,
                w: worldQuaternion.w
            },
            false
        );
        body.setGravityScale?.(
            1,
            true
        );

        for (
            let i = 0;
            i < body.numColliders();
            i++
        ) {
            body.collider(i).setSensor(
                !Boolean(
                    handle.CanCollide
                )
            );
        }

        handle.Position.X =
            worldPosition.x;
        handle.Position.Y =
            worldPosition.y;
        handle.Position.Z =
            worldPosition.z;
        handle.CFrame =
            makeCFrameFromQuaternion(
                worldPosition.x,
                worldPosition.y,
                worldPosition.z,
                worldQuaternion
            );

        const euler =
            new THREE.Euler()
                .setFromQuaternion(
                    worldQuaternion,
                    "XYZ"
                );
        handle.Orientation.X =
            THREE.MathUtils.radToDeg(
                euler.x
            );
        handle.Orientation.Y =
            THREE.MathUtils.radToDeg(
                euler.y
            );
        handle.Orientation.Z =
            THREE.MathUtils.radToDeg(
                euler.z
            );

        if (handle.__last) {
            handle.__last.Position = [
                worldPosition.x,
                worldPosition.y,
                worldPosition.z
            ];
            handle.__last.Orientation = [
                handle.Orientation.X,
                handle.Orientation.Y,
                handle.Orientation.Z
            ];
        }

        addPartToPhysicsSync(
            handle
        );
        body.wakeUp?.();
    }
}

function ensureLocalBackpack() {
    if (
        localBackpackApi &&
        !localBackpackApi.__destroyed
    ) {
        return localBackpackApi;
    }

    localBackpackApi =
        createLuaBackpack();
    localBackpackApi.Parent =
        localPlayerApi;
    localPlayerApi.Backpack =
        localBackpackApi;

    refreshChildAliases(
        localPlayerApi
    );

    return localBackpackApi;
}

function getClassicInventoryItems() {
    const backpack =
        localBackpackApi;
    const items = [];

    if (
        backpack &&
        !backpack.__destroyed
    ) {
        for (
            const child of
            getLuaChildren(
                backpack
            )
        ) {
            if (
                child &&
                !child.__destroyed &&
                isA(
                    child,
                    "BackpackItem"
                )
            ) {
                items.push(
                    child
                );
            }
        }
    }

    if (
        equippedBackpackItem &&
        !equippedBackpackItem.__destroyed &&
        !items.includes(
            equippedBackpackItem
        )
    ) {
        items.push(
            equippedBackpackItem
        );
    }

    items.sort(
        (a, b) =>
            (a.__classicInventoryOrder || 0) -
            (b.__classicInventoryOrder || 0)
    );

    // The 2006-2009 backpack displayed at most ten BackpackItems (0-9).
    return items.slice(
        0,
        10
    );
}

function equipClassicBackpackItem(item) {
    if (
        !item ||
        item.__destroyed ||
        !isA(
            item,
            "BackpackItem"
        )
    ) {
        return false;
    }

    ensureLocalBackpack();

    if (
        equippedBackpackItem === item
    ) {
        return true;
    }

    if (
        equippedBackpackItem
    ) {
        releaseClassicBackpackItem(
            equippedBackpackItem
        );
    }

    if (
        item.ClassName === "Tool"
    ) {
        // In this era Tools require a Part named Handle. Handle-less selectable
        // tools are represented by HopperBin instead.
        if (
            !getClassicToolHandle(
                item
            )
        ) {
            return false;
        }

        if (
            !currentCharacterModel ||
            currentCharacterModel.__destroyed
        ) {
            return false;
        }

        item.Parent =
            currentCharacterModel;
        equippedBackpackItem =
            item;
        classicToolActivationHeld =
            false;

        beginClassicToolGrip(
            item
        );

        fireLuaSignal(
            item.Equipped,
            MouseApi
        );
    } else if (
        item.ClassName === "HopperBin"
    ) {
        item.Active =
            true;
        equippedBackpackItem =
            item;

        fireLuaSignal(
            item.Selected,
            MouseApi
        );
    } else {
        return false;
    }

    renderClassicHotbar();
    return true;
}

function activateClassicEquippedTool(
    requestedTool = null
) {
    const tool =
        requestedTool ||
        equippedBackpackItem;

    if (
        !tool ||
        tool.__destroyed ||
        tool !== equippedBackpackItem ||
        tool.ClassName !== "Tool" ||
        tool.Parent !== currentCharacterModel ||
        tool.Enabled === false
    ) {
        return false;
    }

    if (!classicToolActivationHeld) {
        classicToolActivationHeld =
            true;
        fireLuaSignal(
            tool.Activated
        );
    }

    return true;
}

function deactivateClassicEquippedTool(
    requestedTool = null
) {
    const tool =
        requestedTool ||
        equippedBackpackItem;

    if (
        !tool ||
        tool.__destroyed ||
        tool.ClassName !== "Tool" ||
        tool !== equippedBackpackItem ||
        tool.Enabled === false ||
        !classicToolActivationHeld
    ) {
        return false;
    }

    classicToolActivationHeld =
        false;
    fireLuaSignal(
        tool.Deactivated
    );
    return true;
}

function releaseClassicBackpackItem(
    item = equippedBackpackItem,
    options = {}
) {
    if (!item)
        return false;

    const {
        reparentToBackpack = true,
        destroying = false
    } = options;

    if (
        item.ClassName === "Tool"
    ) {
        if (
            classicToolActivationHeld
        ) {
            classicToolActivationHeld =
                false;
            if (!destroying) {
                fireLuaSignal(
                    item.Deactivated
                );
            }
        }

        releaseClassicToolGrip(
            item,
            false
        );

        if (
            reparentToBackpack &&
            !destroying
        ) {
            item.Parent =
                ensureLocalBackpack();
            stowClassicBackpackItemParts(
                item
            );
        }

        if (!destroying) {
            fireLuaSignal(
                item.Unequipped
            );
        }
    } else if (
        item.ClassName === "HopperBin"
    ) {
        item.Active =
            false;

        if (!destroying) {
            fireLuaSignal(
                item.Deselected
            );
        }
    }

    if (
        equippedBackpackItem === item
    ) {
        equippedBackpackItem =
            null;
    }

    if (!destroying) {
        renderClassicHotbar();
    }

    return true;
}

function dropClassicEquippedTool() {
    const tool =
        equippedBackpackItem;

    if (
        !tool ||
        tool.__destroyed ||
        tool.ClassName !== "Tool" ||
        tool.CanBeDropped === false
    ) {
        return false;
    }

    if (
        classicToolActivationHeld
    ) {
        classicToolActivationHeld =
            false;
        fireLuaSignal(
            tool.Deactivated
        );
    }

    // Capture/restore the Handle world transform while it is still at the hand.
    releaseClassicToolGrip(
        tool,
        true
    );

    equippedBackpackItem =
        null;
    tool.Parent =
        workspaceApi;

    fireLuaSignal(
        tool.Unequipped
    );

    renderClassicHotbar();
    return true;
}

function pickupClassicTool(tool) {
    if (
        !tool ||
        tool.__destroyed ||
        tool.ClassName !== "Tool" ||
        tool === equippedBackpackItem ||
        !isInWorkspace(
            tool
        )
    ) {
        return false;
    }

    const inventory =
        getClassicInventoryItems();

    if (
        inventory.length >= 10
    ) {
        return false;
    }

    const handle =
        getClassicToolHandle(
            tool
        );

    if (!handle)
        return false;

    tool.Parent =
        ensureLocalBackpack();
    stowClassicBackpackItemParts(
        tool
    );
    renderClassicHotbar();
    return true;
}

function updateClassicToolPickup() {
    if (
        !playerBody ||
        playerColliderDisabled ||
        characterJointsBroken
    ) {
        return;
    }

    for (
        const tool of
        [...luaTools]
    ) {
        if (
            !tool ||
            tool.__destroyed ||
            tool === equippedBackpackItem ||
            !isInWorkspace(
                tool
            ) ||
            tool.Parent === currentCharacterModel
        ) {
            continue;
        }

        const handle =
            getClassicToolHandle(
                tool
            );

        if (
            handle &&
            playerCapsuleTouchesPart(
                handle
            )
        ) {
            pickupClassicTool(
                tool
            );
        }
    }
}

function copyClassicStarterPackSignalConnections(
    source,
    clone
) {
    if (
        !source ||
        !clone
    ) {
        return;
    }

    const signalNames =
        source.ClassName === "Tool"
            ? [
                "Equipped",
                "Unequipped",
                "Activated",
                "Deactivated"
            ]
            : (
                source.ClassName === "HopperBin"
                    ? [
                        "Selected",
                        "Deselected"
                    ]
                    : []
            );

    for (const signalName of signalNames) {
        const sourceSignal =
            source[signalName];
        const cloneSignal =
            clone[signalName];

        const sourceState =
            luaSignalInternals.get(
                sourceSignal
            );

        if (
            !sourceState ||
            !cloneSignal?.Connect
        ) {
            continue;
        }

        // Connections themselves are not ordinary Roblox Instance data, but in
        // this single-script emulator the StarterPack template is often created
        // and connected at runtime. Carry those callbacks onto the Backpack copy
        // so `tool.Equipped:Connect(...)` on the template behaves as expected.
        for (const entry of sourceState.listeners) {
            if (
                !entry?.connected ||
                typeof entry.callback !== "function"
            ) {
                continue;
            }

            cloneSignal.Connect(
                entry.callback
            );
        }
    }
}

function cloneStarterPackItem(source) {
    const clone =
        cloneLuaInstance(
            source
        );

    if (!clone)
        return null;

    copyClassicStarterPackSignalConnections(
        source,
        clone
    );

    clone.Parent =
        ensureLocalBackpack();
    stowClassicBackpackItemParts(
        clone
    );
    return clone;
}

function syncStarterPackToBackpack() {
    ensureLocalBackpack();

    for (
        const source of
        getLuaChildren(
            StarterPackApi
        )
    ) {
        if (
            !source ||
            source.__destroyed ||
            !isA(
                source,
                "BackpackItem"
            ) ||
            starterPackSeenSources.has(
                source
            )
        ) {
            continue;
        }

        // A classic Tool is not usable until its Handle exists. Waiting here
        // also prevents cloning a half-constructed StarterPack Tool when a
        // startup script creates the Tool first and its Handle a moment later.
        if (
            source.ClassName === "Tool" &&
            !getClassicToolHandle(
                source
            )
        ) {
            continue;
        }

        stowClassicBackpackItemParts(
            source
        );

        starterPackSeenSources.add(
            source
        );

        const clone =
            cloneStarterPackItem(
                source
            );

        starterPackCloneMap.set(
            source,
            clone
        );
    }
}

function resetLocalBackpackFromStarterPack() {
    if (
        equippedBackpackItem
    ) {
        releaseClassicBackpackItem(
            equippedBackpackItem
        );
    }

    if (
        localBackpackApi &&
        !localBackpackApi.__destroyed
    ) {
        destroyLuaInstance(
            localBackpackApi
        );
    }

    localBackpackApi =
        null;
    starterPackCloneMap.clear();
    starterPackSeenSources.clear();

    ensureLocalBackpack();
    syncStarterPackToBackpack();
    renderClassicHotbar();
}

function getClassicHotbarIndexFromCode(code) {
    if (
        /^Digit[1-9]$/.test(
            code
        )
    ) {
        return Number(
            code.slice(5)
        ) - 1;
    }

    if (code === "Digit0")
        return 9;

    return -1;
}

function selectClassicHotbarIndex(index) {
    const items =
        getClassicInventoryItems();
    const item =
        items[index];

    if (!item)
        return false;

    if (
        equippedBackpackItem === item
    ) {
        return releaseClassicBackpackItem(
            item
        );
    }

    return equipClassicBackpackItem(
        item
    );
}

function getClassicHotbarSignature() {
    return getClassicInventoryItems()
        .map(item =>
            [
                getLuaInstanceId(item),
                item.Name || "",
                item.TextureId || "",
                item === equippedBackpackItem ? 1 : 0,
                item.ClassName || ""
            ].join(":")
        )
        .join("|");
}

function renderClassicHotbar() {
    if (!classicHotbar)
        return;

    const items =
        getClassicInventoryItems();

    classicHotbarSignature =
        getClassicHotbarSignature();

    classicHotbar.textContent =
        "";

    for (
        let i = 0;
        i < items.length;
        i++
    ) {
        const item =
            items[i];
        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "classicToolSlot" +
            (
                item === equippedBackpackItem
                    ? " selected"
                    : ""
            );
        slot.title =
            String(
                item.ToolTip ||
                item.Name ||
                "Tool"
            );

        const iconPath =
            getLocalTexturePath(
                item.TextureId
            );

        const name =
            document.createElement(
                "div"
            );
        name.className =
            "classicToolSlotName";
        name.textContent =
            String(
                item.Name ||
                "Tool"
            );

        if (iconPath) {
            const image =
                document.createElement(
                    "img"
                );
            image.src =
                iconPath;
            image.alt =
                "";
            image.addEventListener(
                "load",
                () => {
                    name.style.display =
                        "none";
                },
                { once: true }
            );
            image.addEventListener(
                "error",
                () => {
                    image.remove();
                    name.style.display =
                        "flex";
                },
                { once: true }
            );
            slot.appendChild(
                image
            );
        }

        slot.appendChild(
            name
        );

        const key =
            document.createElement(
                "div"
            );
        key.className =
            "classicToolSlotKey";
        key.textContent =
            i === 9
                ? "0"
                : String(i + 1);
        slot.appendChild(
            key
        );

        slot.addEventListener(
            "mousedown",
            event => {
                event.preventDefault();
                event.stopPropagation();
                selectClassicHotbarIndex(
                    i
                );
            }
        );

        classicHotbar.appendChild(
            slot
        );
    }
}

function coerceLeaderboardDisplayValue(value) {
    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {
        return String(
            value
        );
    }

    if (
        value &&
        typeof value === "object" &&
        "Value" in value
    ) {
        return String(
            value.Value ?? ""
        );
    }

    return "";
}

function getLeaderboardValue(
    player,
    key
) {
    if (
        player &&
        key in player
    ) {
        const direct =
            coerceLeaderboardDisplayValue(
                player[key]
            );

        if (direct !== "")
            return direct;
    }

    const directChild =
        getLuaChildren(
            player
        ).find(child =>
            child &&
            child.Name === key &&
            isA(
                child,
                "ValueBase"
            )
        );

    if (directChild)
        return coerceLeaderboardDisplayValue(
            directChild
        );

    const leaderstats =
        getLuaChildren(
            player
        ).find(child =>
            child &&
            child.Name === "leaderstats"
        );

    if (leaderstats) {
        const stat =
            getLuaChildren(
                leaderstats
            ).find(child =>
                child &&
                child.Name === key &&
                isA(
                    child,
                    "ValueBase"
                )
            );

        if (stat)
            return coerceLeaderboardDisplayValue(
                stat
            );
    }

    return "";
}

function getClassicLeaderboardKeys() {
    const keys =
        [...classicLeaderboardKeys];

    // Compatibility extension: also discover the familiar leaderstats folder
    // when a place uses it, while preserving the 2008 AddLeaderboardKey API.
    const leaderstats =
        getLuaChildren(
            localPlayerApi
        ).find(child =>
            child &&
            child.Name === "leaderstats"
        );

    if (leaderstats) {
        for (
            const stat of
            getLuaChildren(
                leaderstats
            )
        ) {
            if (
                isA(
                    stat,
                    "ValueBase"
                ) &&
                !keys.includes(
                    stat.Name
                )
            ) {
                keys.push(
                    stat.Name
                );
            }
        }
    }

    return keys.slice(
        0,
        6
    );
}

function renderClassicLeaderboard() {
    if (
        !classicLeaderboardBody
    ) {
        return;
    }

    const playerCollection =
        PlayersApi.GetPlayers();
    const players =
        playerCollection?.ToArray?.() ||
        [];
    const keys =
        getClassicLeaderboardKeys();
    const columns =
        1 + keys.length;

    classicLeaderboardBody.textContent =
        "";

    const header =
        document.createElement(
            "div"
        );
    header.className =
        "classicLeaderboardGrid classicLeaderboardHeader";
    header.style.gridTemplateColumns =
        `minmax(75px,1fr) ${keys.map(() => "auto").join(" ")}`.trim();

    const playerHeader =
        document.createElement(
            "div"
        );
    playerHeader.textContent =
        "Player";
    header.appendChild(
        playerHeader
    );

    for (
        const key of
        keys
    ) {
        const cell =
            document.createElement(
                "div"
            );
        cell.textContent =
            String(key);
        header.appendChild(
            cell
        );
    }

    classicLeaderboardBody.appendChild(
        header
    );

    for (
        const player of
        players
    ) {
        const row =
            document.createElement(
                "div"
            );
        row.className =
            "classicLeaderboardGrid";
        row.style.gridTemplateColumns =
            header.style.gridTemplateColumns;

        const nameCell =
            document.createElement(
                "div"
            );
        nameCell.className =
            "classicLeaderboardCell";
        nameCell.textContent =
            String(
                player.Name ||
                "Player"
            );

        const teamColor =
            player.TeamColor?.Color;
        if (
            teamColor &&
            typeof teamColor.R === "number"
        ) {
            nameCell.style.color =
                `rgb(${Math.round(teamColor.R*255)},${Math.round(teamColor.G*255)},${Math.round(teamColor.B*255)})`;
        }

        row.appendChild(
            nameCell
        );

        for (
            const key of
            keys
        ) {
            const cell =
                document.createElement(
                    "div"
                );
            cell.className =
                "classicLeaderboardCell";
            cell.textContent =
                getLeaderboardValue(
                    player,
                    key
                );
            row.appendChild(
                cell
            );
        }

        classicLeaderboardBody.appendChild(
            row
        );
    }
}

function getClassicChatNameColor(player) {
    const c =
        player?.TeamColor?.Color;

    if (
        c &&
        typeof c.R === "number"
    ) {
        return `rgb(${Math.round(c.R*255)},${Math.round(c.G*255)},${Math.round(c.B*255)})`;
    }

    return "#f2df55";
}

function appendClassicChatMessage(
    player,
    message,
    chatType = "All",
    recipient = null
) {
    const text =
        String(
            message ?? ""
        ).trim();

    if (!text)
        return;

    classicChatMessages.push({
        player,
        message: text,
        chatType,
        recipient
    });

    while (
        classicChatMessages.length > 9
    ) {
        classicChatMessages.shift();
    }

    if (!classicChatPanel)
        return;

    classicChatPanel.textContent =
        "";

    for (
        const entry of
        classicChatMessages
    ) {
        const line =
            document.createElement(
                "div"
            );
        line.className =
            "classicChatLine";

        const name =
            document.createElement(
                "span"
            );
        name.className =
            "classicChatName";
        name.style.color =
            getClassicChatNameColor(
                entry.player
            );

        const prefix =
            entry.chatType === "Team"
                ? "[TEAM] "
                : (
                    entry.chatType === "Whisper"
                        ? "[WHISPER] "
                        : ""
                );

        name.textContent =
            `${prefix}${entry.player?.Name || "Player"}: `;

        const body =
            document.createElement(
                "span"
            );
        body.textContent =
            entry.message;

        line.appendChild(
            name
        );
        line.appendChild(
            body
        );
        classicChatPanel.appendChild(
            line
        );
    }
}

function dispatchClassicPlayerChat(
    player,
    message,
    chatType = "All",
    recipient = null
) {
    const text =
        String(
            message ?? ""
        ).trim();

    if (!text)
        return false;

    appendClassicChatMessage(
        player,
        text,
        chatType,
        recipient
    );

    if (
        player?.Chatted
    ) {
        fireLuaSignal(
            player.Chatted,
            text,
            recipient || null
        );
    }

    if (
        typeof PlayersApi !== "undefined" &&
        PlayersApi?.PlayerChatted
    ) {
        fireLuaSignal(
            PlayersApi.PlayerChatted,
            chatType,
            player,
            text,
            recipient || null
        );
    }

    return true;
}

function isClassicChatInputFocused() {
    return Boolean(
        classicChatInput &&
        document.activeElement ===
            classicChatInput
    );
}

function openClassicChatInput() {
    if (!classicChatInput)
        return;

    keys.w = false;
    keys.a = false;
    keys.s = false;
    keys.d = false;
    keys.space = false;

    classicChatPrompt.style.display =
        "none";
    classicChatInput.style.display =
        "block";
    classicChatInput.focus();
}

function closeClassicChatInput() {
    if (!classicChatInput)
        return;

    classicChatInput.value =
        "";
    classicChatInput.style.display =
        "none";
    classicChatPrompt.style.display =
        "inline";
    classicChatInput.blur();
}

function submitClassicChatInput() {
    if (!classicChatInput)
        return;

    let text =
        classicChatInput.value.trim();

    if (!text) {
        closeClassicChatInput();
        return;
    }

    let type =
        "All";

    if (
        text.startsWith("%")
    ) {
        type = "Team";
        text = text.slice(1).trim();
    } else if (
        /^\/team\s+/i.test(
            text
        )
    ) {
        type = "Team";
        text = text.replace(
            /^\/team\s+/i,
            ""
        ).trim();
    }

    if (text) {
        dispatchClassicPlayerChat(
            localPlayerApi,
            text,
            type,
            null
        );
    }

    closeClassicChatInput();
}

function closeClassicTopMenus() {
    if (classicToolsMenu)
        classicToolsMenu.style.display = "none";
    if (classicInsertMenu)
        classicInsertMenu.style.display = "none";
}

) {

            "button"
        );
    button.type =
        "button";
    button.className =
        "classicTopMenuItem";
    button.textContent =
        label;
    button.disabled =

    if (!disabled) {
        button.addEventListener(
            "click",

                event.stopPropagation();

function appendClassicMenuSeparator(menu) {
    const separator =
        document.createElement(
            "div"
        );
    separator.className =
        "classicTopMenuSeparator";
    menu.appendChild(
        separator
    );
}

function renderClassicToolsMenu() {
    if (!classicToolsMenu)
        return;

    classicToolsMenu.textContent =
        "";

    const items =
        getClassicInventoryItems();

    if (!items.length) {
        appendClassicMenuButton(
            classicToolsMenu,
            "No tools",
            () => {},
            true
        );
    } else {
        for (
            const item of
            items
        ) {
            const selected =
                item === equippedBackpackItem;

            appendClassicMenuButton(
                classicToolsMenu,
                `${selected ? "✓ " : ""}${item.Name || item.ClassName}`,
                () => {
                    if (selected) {
                        releaseClassicBackpackItem(
                            item
                        );
                    } else {
                        equipClassicBackpackItem(
                            item
                        );
                    }
                }
            );
        }
    }

    if (
        equippedBackpackItem
    ) {
        appendClassicMenuSeparator(
            classicToolsMenu
        );
        appendClassicMenuButton(
            classicToolsMenu,
            "Unequip",
            () =>
                releaseClassicBackpackItem(
                    equippedBackpackItem
                )
        );

        appendClassicMenuButton(
            classicToolsMenu,
            "Drop Tool (Backspace)",
            () =>
                dropClassicEquippedTool(),
            !(
                equippedBackpackItem.ClassName === "Tool" &&
                equippedBackpackItem.CanBeDropped !== false
            )
        );
    }
}

function insertClassicPrimitive(
    className,
    shape = null
) {
    const instance =
        InstanceApi.new(
            className
        );

    if (
        className === "Part" &&
        shape
    ) {
        instance.Shape =
            shape;
    }

    const p =
        playerBody?.translation?.() ||
        { x: 0, y: 4, z: 0 };

    const facing =
        Number(
            player?.rotation?.y
        ) || 0;

    instance.Position =
        createVector3(
            p.x + Math.sin(facing) * 8,
            p.y + 2,
            p.z + Math.cos(facing) * 8
        );
    instance.Anchored =
        false;
    instance.Parent =
        workspaceApi;

    return instance;
}

function renderClassicInsertMenu() {
    if (!classicInsertMenu)
        return;

    classicInsertMenu.textContent =
        "";

    const choices = [
        ["Part", "Part", "Block"],
        ["Ball", "Part", "Ball"],
        ["Cylinder", "Part", "Cylinder"],
        ["Wedge", "WedgePart", null],
        ["Seat", "Seat", null],
        ["SpawnLocation", "SpawnLocation", null]
    ];

    for (
        const [label, className, shape] of
        choices
    ) {
        appendClassicMenuButton(
            classicInsertMenu,
            label,
            () =>
                insertClassicPrimitive(
