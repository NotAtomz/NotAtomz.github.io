// ─── Phase 3: classic JointInstance physics ─────────────────────────────────
//
// Relationship used by Weld/Snap/Glue/Motor/Rotate:
//     Part0.CFrame * C0 == Part1.CFrame * C1
//
// The old prototype always started C0/C1 at identity, which caused newly
// created joints to pull both part centers together. Phase 3 captures the
// parts' CURRENT relative pose the first time a joint becomes valid, unless
// the script already supplied explicit C0/C1 values.

function isIdentityCFrame(cf, epsilon = 1e-6) {
    if (!cf)
        return true;

    return (
        Math.abs(Number(cf.X) || 0) < epsilon &&
        Math.abs(Number(cf.Y) || 0) < epsilon &&
        Math.abs(Number(cf.Z) || 0) < epsilon &&
        Math.abs(Number(cf._qx) || 0) < epsilon &&
        Math.abs(Number(cf._qy) || 0) < epsilon &&
        Math.abs(Number(cf._qz) || 0) < epsilon &&
        Math.abs((Number(cf._qw) || 1) - 1) < epsilon
    );
}

function frameToCFrame(frame) {
    return makeCFrameFromQuaternion(
        frame.p.x,
        frame.p.y,
        frame.p.z,
        frame.q
    );
}

function createLuaJoint(className) {
    const joint =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Part0:
                    null,

                Part1:
                    null,

                C0:
                    createCFrame(0, 0, 0),

                C1:
                    createCFrame(0, 0, 0),

                CurrentAngle:
                    0,

                DesiredAngle:
                    0,

                MaxVelocity:
                    className === "Motor"
                        ? 0.1
                        : 0,

                Velocity:
                    className === "Rotate"
                        ? 1
                        : 0
            })
        );

    Object.defineProperty(
        joint,
        "__phase3Joint",
        {
            value: {
                captured:
                    false,

                lastPart0:
                    null,

                lastPart1:
                    null,

                lastC0:
                    joint.C0,

                lastC1:
                    joint.C1
            },
            writable: true,
            enumerable: false
        }
    );

    joint.SetDesiredAngle =
        (...args) => {
            joint.DesiredAngle =
                getNumberArg(
                    args,
                    0
                ) || 0;
        };

    luaJoints.add(
        joint
    );

    return joint;
}

function getBodyFrame(instance) {
    const body =
        instance?.__internal?.body;

    if (!body)
        return null;

    const t =
        body.translation();

    const r =
        body.rotation();

    return {
        p:
            new THREE.Vector3(
                t.x,
                t.y,
                t.z
            ),

        q:
            new THREE.Quaternion(
                r.x,
                r.y,
                r.z,
                r.w
            )
    };
}

function cfFrame(cf) {
    return {
        p:
            new THREE.Vector3(
                Number(cf?.X) || 0,
                Number(cf?.Y) || 0,
                Number(cf?.Z) || 0
            ),

        q:
            quaternionFromCFrameValue(
                cf
            )
    };
}

function mulFrame(a, b) {
    return {
        p:
            a.p.clone()
                .add(
                    b.p.clone()
                        .applyQuaternion(
                            a.q
                        )
                ),

        q:
            a.q.clone()
                .multiply(
                    b.q
                )
    };
}

function invFrame(a) {
    const q =
        a.q.clone()
            .invert();

    return {
        p:
            a.p.clone()
                .multiplyScalar(-1)
                .applyQuaternion(q),

        q
    };
}

function setLuaPartWorldFrame(instance, frame) {
    const internal =
        instance?.__internal;

    if (
        !internal?.body ||
        !internal?.mesh
    ) {
        return;
    }

    internal.body.setTranslation(
        {
            x: frame.p.x,
            y: frame.p.y,
            z: frame.p.z
        },
        true
    );

    internal.body.setRotation(
        {
            x: frame.q.x,
            y: frame.q.y,
            z: frame.q.z,
            w: frame.q.w
        },
        true
    );

    // A welded/motor-driven part should not keep stale velocity fighting the
    // joint solver.
    if (!instance.Anchored) {
        internal.body.setLinvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );

        internal.body.setAngvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );
    }

    internal.mesh.position.copy(
        frame.p
    );

    internal.mesh.quaternion.copy(
        frame.q
    );

    instance.Position.X =
        frame.p.x;

    instance.Position.Y =
        frame.p.y;

    instance.Position.Z =
        frame.p.z;

    const e =
        new THREE.Euler()
            .setFromQuaternion(
                frame.q,
                "XYZ"
            );

    instance.Orientation.X =
        THREE.MathUtils.radToDeg(
            e.x
        );

    instance.Orientation.Y =
        THREE.MathUtils.radToDeg(
            e.y
        );

    instance.Orientation.Z =
        THREE.MathUtils.radToDeg(
            e.z
        );

    instance.CFrame =
        makeCFrameFromQuaternion(
            frame.p.x,
            frame.p.y,
            frame.p.z,
            frame.q
        );

    if (instance.__last) {
        instance.__last.Position = [
            frame.p.x,
            frame.p.y,
            frame.p.z
        ];

        instance.__last.Orientation = [
            instance.Orientation.X,
            instance.Orientation.Y,
            instance.Orientation.Z
        ];
    }
}

function captureJointCurrentPose(joint) {
    const a =
        joint.Part0;

    const b =
        joint.Part1;

    const aFrame =
        getBodyFrame(a);

    const bFrame =
        getBodyFrame(b);

    if (
        !aFrame ||
        !bFrame
    ) {
        return false;
    }

    // Preserve explicit C0/C1 if the script supplied either of them.
    if (
        isIdentityCFrame(joint.C0) &&
        isIdentityCFrame(joint.C1)
    ) {
        // Part0 * Identity = Part1 * C1
        // C1 = inverse(Part1) * Part0
        const relative =
            mulFrame(
                invFrame(bFrame),
                aFrame
            );

        joint.C1 =
            frameToCFrame(
                relative
            );
    }

    joint.__phase3Joint.captured =
        true;

    joint.__phase3Joint.lastPart0 =
        a;

    joint.__phase3Joint.lastPart1 =
        b;

    return true;
}

function resetJointCaptureIfChanged(joint) {
    const state =
        joint.__phase3Joint;

    if (!state)
        return;

    if (
        state.lastPart0 !== joint.Part0 ||
        state.lastPart1 !== joint.Part1
    ) {
        state.captured =
            false;
    }
}

function syncLuaJoints(delta) {
    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            !joint ||
            joint.__destroyed ||
            !joint.Parent
        ) {
            continue;
        }

        const a =
            joint.Part0;

        const b =
            joint.Part1;

        if (
            !a?.__internal?.body ||
            !b?.__internal?.body ||
            a === b
        ) {
            continue;
        }

        resetJointCaptureIfChanged(
            joint
        );

        if (
            !joint.__phase3Joint?.captured &&
            !captureJointCurrentPose(joint)
        ) {
            continue;
        }

        if (
            joint.ClassName === "Motor"
        ) {
            const cur =
                Number(
                    joint.CurrentAngle
                ) || 0;

            const dst =
                Number(
                    joint.DesiredAngle
                ) || 0;

            const maxVel =
                Math.abs(
                    Number(
                        joint.MaxVelocity
                    ) || 0
                );

            const step =
                maxVel *
                delta;

            joint.CurrentAngle =
                step <= 0
                    ? cur
                    : (
                        Math.abs(
                            dst - cur
                        ) <= step
                            ? dst
                            : cur +
                              Math.sign(
                                  dst - cur
                              ) *
                              step
                    );
        } else if (
            joint.ClassName === "Rotate"
        ) {
            joint.CurrentAngle =
                (
                    Number(
                        joint.CurrentAngle
                    ) || 0
                ) +
                (
                    Number(
                        joint.Velocity
                    ) || 0
                ) *
                delta;
        }

        let target =
            mulFrame(
                getBodyFrame(a),
                cfFrame(
                    joint.C0
                )
            );

        if (
            joint.ClassName === "Motor" ||
            joint.ClassName === "Rotate"
        ) {
            // Classic hinge-style joint axis.
            target =
                mulFrame(
                    target,
                    {
                        p:
                            new THREE.Vector3(),

                        q:
                            new THREE.Quaternion()
                                .setFromAxisAngle(
                                    new THREE.Vector3(
                                        0,
                                        1,
                                        0
                                    ),
                                    Number(
                                        joint.CurrentAngle
                                    ) || 0
                                )
                    }
                );
        }

        target =
            mulFrame(
                target,
                invFrame(
                    cfFrame(
                        joint.C1
                    )
                )
            );

        setLuaPartWorldFrame(
            b,
            target
        );
    }
}

function touchingFacePair(a, b, epsilon = 0.08) {
    const ax=a.Position.X, ay=a.Position.Y, az=a.Position.Z;
    const bx=b.Position.X, by=b.Position.Y, bz=b.Position.Z;
    const ahx=a.Size.X/2, ahy=a.Size.Y/2, ahz=a.Size.Z/2;
    const bhx=b.Size.X/2, bhy=b.Size.Y/2, bhz=b.Size.Z/2;
    const overlapX = Math.abs(ax-bx) <= ahx+bhx+epsilon;
    const overlapY = Math.abs(ay-by) <= ahy+bhy+epsilon;
    const overlapZ = Math.abs(az-bz) <= ahz+bhz+epsilon;
    if (!(overlapX && overlapY && overlapZ)) return null;

    if (Math.abs((ay+ahy)-(by-bhy)) <= epsilon) return ["TopSurface","BottomSurface"];
    if (Math.abs((ay-ahy)-(by+bhy)) <= epsilon) return ["BottomSurface","TopSurface"];
    if (Math.abs((ax+ahx)-(bx-bhx)) <= epsilon) return ["RightSurface","LeftSurface"];
    if (Math.abs((ax-ahx)-(bx+bhx)) <= epsilon) return ["LeftSurface","RightSurface"];
    if (Math.abs((az+ahz)-(bz-bhz)) <= epsilon) return ["BackSurface","FrontSurface"];
    if (Math.abs((az-ahz)-(bz+bhz)) <= epsilon) return ["FrontSurface","BackSurface"];
    return null;
}

function makeSurfaceJoints(part) {
    if (
        !part?.IsA?.("BasePart")
    ) {
        return;
    }

    for (
        const other of
        luaInstances
    ) {
        if (
            other === part ||
            !other?.IsA?.("BasePart") ||
            !isInWorkspace(other)
        ) {
            continue;
        }

        const faces =
            touchingFacePair(
                part,
                other
            );

        if (!faces)
            continue;

        const s0 =
            part[
                faces[0]
            ] ||
            "Smooth";

        const s1 =
            other[
                faces[1]
            ] ||
            "Smooth";

        let className =
            null;

        if (
            s0 === "Glue" ||
            s1 === "Glue"
        ) {
            className =
                "Glue";
        } else if (
            s0 === "Weld" ||
            s1 === "Weld"
        ) {
            className =
                "Weld";
        } else if (
            [
                "Studs",
                "Inlet",
                "Universal"
            ].includes(s0) &&
            [
                "Studs",
                "Inlet",
                "Universal"
            ].includes(s1)
        ) {
            className =
                "Snap";
        }

        if (!className)
            continue;

        const exists =
            [...luaJoints]
                .some(joint =>
                    !joint.__destroyed &&
                    (
                        (
                            joint.Part0 === part &&
                            joint.Part1 === other
                        ) ||
                        (
                            joint.Part0 === other &&
                            joint.Part1 === part
                        )
                    )
                );

        if (exists)
            continue;

        const joint =
            createLuaJoint(
                className
            );

        joint.Part0 =
            part;

        joint.Part1 =
            other;

        joint.Parent =
            part;

        // Capture NOW, while the objects are still at their intended touching
        // positions, instead of waiting for the first simulation frame.
        captureJointCurrentPose(
            joint
        );
    }
}

// ─── Phase 3: classic BodyMovers ─────────────────────────────────────────────
//
// Implemented:
//   BodyVelocity
//   BodyPosition
//   BodyGyro
//   BodyForce
//   BodyAngularVelocity
//   BodyThrust
//
// These operate on the BasePart they are parented to.

function vectorMagnitude(v) {
    const x =
        Number(v?.X) || 0;

    const y =
        Number(v?.Y) || 0;

    const z =
        Number(v?.Z) || 0;

    return Math.hypot(
        x,
        y,
        z
    );
}

function vector3ToThree(v) {
    return new THREE.Vector3(
        Number(v?.X) || 0,
        Number(v?.Y) || 0,
        Number(v?.Z) || 0
    );
}

function clampVectorComponents(v, max) {
    return new THREE.Vector3(
        THREE.MathUtils.clamp(
            v.x,
            -Math.abs(Number(max?.X) || 0),
            Math.abs(Number(max?.X) || 0)
        ),
        THREE.MathUtils.clamp(
            v.y,
            -Math.abs(Number(max?.Y) || 0),
            Math.abs(Number(max?.Y) || 0)
        ),
        THREE.MathUtils.clamp(
            v.z,
            -Math.abs(Number(max?.Z) || 0),
            Math.abs(Number(max?.Z) || 0)
        )
    );
}

function createLuaBodyMover(className) {
    const common = {
        Name:
            className,

        ClassName:
            className,

        Parent:
            null,

        Archivable:
            true
    };

    if (
        className === "BodyVelocity"
    ) {
        Object.assign(
            common,
            {
                Velocity:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyPosition"
    ) {
        Object.assign(
            common,
            {
                Position:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    10000,

                D:
                    1250
            }
        );
    } else if (
        className === "BodyGyro"
    ) {
        Object.assign(
            common,
            {
                CFrame:
                    createCFrame(),

                MaxTorque:
                    createVector3(
                        400000,
                        0,
                        400000
                    ),

                P:
                    3000,

                D:
                    500
            }
        );
    } else if (
        className === "BodyForce"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3()
            }
        );
    } else if (
        className ===
        "BodyAngularVelocity"
    ) {
        Object.assign(
            common,
            {
                AngularVelocity:
                    createVector3(),

                MaxTorque:
                    createVector3(
                        400000,
                        400000,
                        400000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyThrust"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3(),

                Location:
                    createVector3()
            }
        );
    }

    const mover =
        finalizeLuaInstance(
            Mutable(
                common
            )
        );

    luaBodyMovers.add(
        mover
    );

    return mover;
}

function getBodyMoverPart(mover) {
    const parent =
        mover?.Parent;

    if (
        parent &&
        isA(
            parent,
            "BasePart"
        ) &&
        parent.__internal?.body &&
        !parent.Anchored
    ) {
        return parent;
    }

    return null;
}

function applyBodyVelocity(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const current =
        body.linvel();

    const target =
        vector3ToThree(
            mover.Velocity
        );

    const cur =
        new THREE.Vector3(
            current.x,
            current.y,
            current.z
        );

    // Convert P into a stable interpolation rate rather than allowing huge
    // gains to explode the browser physics simulation.
    const response =
        1 -
        Math.exp(
            -Math.max(
                0,
                Number(mover.P) || 0
            ) *
            delta /
            1250
        );

    let desiredChange =
        target.clone()
            .sub(cur)
            .multiplyScalar(
                response
            );

    const maxForce =
        mover.MaxForce;

    // Treat MaxForce as an acceleration/authority limit in the emulator.
    desiredChange =
        clampVectorComponents(
            desiredChange,
            createVector3(
                (Number(maxForce?.X) || 0) * delta,
                (Number(maxForce?.Y) || 0) * delta,
                (Number(maxForce?.Z) || 0) * delta
            )
        );

    cur.add(
        desiredChange
    );

    body.setLinvel(
        {
            x: cur.x,
            y: cur.y,
            z: cur.z
        },
        true
    );
}

function applyBodyPosition(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const posRaw =
        body.translation();

    const velRaw =
        body.linvel();

    const pos =
        new THREE.Vector3(
            posRaw.x,
            posRaw.y,
            posRaw.z
        );

    const vel =
        new THREE.Vector3(
            velRaw.x,
            velRaw.y,
            velRaw.z
        );

    const target =
        vector3ToThree(
            mover.Position
        );

    const error =
        target.sub(
            pos
        );

    // PD controller.
    const p =
        Math.max(
            0,
            Number(mover.P) || 0
        );

    const d =
        Math.max(
            0,
            Number(mover.D) || 0
        );

    let acceleration =
        error.multiplyScalar(
            p / 10000
        )
            .sub(
                vel.clone()
                    .multiplyScalar(
                        d / 1250
                    )
            );

    acceleration =
        clampVectorComponents(
            acceleration,
            mover.MaxForce
        );

    vel.addScaledVector(
        acceleration,
        delta
    );

    body.setLinvel(
        {
            x: vel.x,
            y: vel.y,
            z: vel.z
        },
        true
    );
}

function applyBodyForce(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const force =
        vector3ToThree(
            mover.Force
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: force.x,
                y: force.y,
                z: force.z
            },
            true
        );
    } else {
        // Fallback for Rapier builds without addForce exposed.
        const vel =
            body.linvel();

        body.setLinvel(
            {
                x:
                    vel.x +
                    force.x * 0.001,

                y:
                    vel.y +
                    force.y * 0.001,

                z:
                    vel.z +
                    force.z * 0.001
            },
            true
        );
    }
}

function applyBodyAngularVelocity(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const currentRaw =
        body.angvel();

    const current =
        new THREE.Vector3(
            currentRaw.x,
            currentRaw.y,
            currentRaw.z
        );

    const target =
        vector3ToThree(
            mover.AngularVelocity
        );

    const response =
        1 -
        Math.exp(
            -Math.max(
                0,
                Number(mover.P) || 0
            ) *
            delta /
            1250
        );

    let change =
        target.clone()
            .sub(current)
            .multiplyScalar(
                response
            );

    change =
        clampVectorComponents(
            change,
            createVector3(
                (Number(mover.MaxTorque?.X) || 0) * delta,
                (Number(mover.MaxTorque?.Y) || 0) * delta,
                (Number(mover.MaxTorque?.Z) || 0) * delta
            )
        );

    current.add(
        change
    );

    body.setAngvel(
        {
            x: current.x,
            y: current.y,
            z: current.z
        },
        true
    );
}

function applyBodyGyro(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const raw =
        body.rotation();

    const current =
        new THREE.Quaternion(
            raw.x,
            raw.y,
            raw.z,
            raw.w
        );

    const target =
        quaternionFromCFrameValue(
            mover.CFrame
        );

    const torque =
        vectorMagnitude(
            mover.MaxTorque
        );

    if (
        torque <= 0
    ) {
        return;
    }

    const p =
        Math.max(
            0,
            Number(mover.P) || 0
        );

    const d =
        Math.max(
            0,
            Number(mover.D) || 0
        );

    const response =
        THREE.MathUtils.clamp(
            (
                p /
                Math.max(
                    1,
                    p + d
                )
            ) *
            delta *
            12,
            0,
            1
        );

    current.slerp(
        target,
        response
    );

    body.setRotation(
        {
            x: current.x,
            y: current.y,
            z: current.z,
            w: current.w
        },
        true
    );

    // Damping keeps old angular momentum from immediately undoing the gyro.
    const av =
        body.angvel();

    const damping =
        Math.exp(
            -d *
            delta /
            500
        );

    body.setAngvel(
        {
            x: av.x * damping,
            y: av.y * damping,
            z: av.z * damping
        },
        true
    );
}

function applyBodyThrust(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const localForce =
        vector3ToThree(
            mover.Force
        );

    const rawRotation =
        body.rotation();

    const q =
        new THREE.Quaternion(
            rawRotation.x,
            rawRotation.y,
            rawRotation.z,
            rawRotation.w
        );

    const worldForce =
        localForce.applyQuaternion(
            q
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: worldForce.x,
                y: worldForce.y,
                z: worldForce.z
            },
            true
        );
    }
}

function syncLuaBodyMovers(delta) {
    for (
        const mover of
        [...luaBodyMovers]
    ) {
        if (
            !mover ||
            mover.__destroyed
        ) {
            continue;
        }

        const part =
            getBodyMoverPart(
                mover
            );

        if (!part)
            continue;

        switch (
            mover.ClassName
        ) {
            case "BodyVelocity":
                applyBodyVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyPosition":
                applyBodyPosition(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyGyro":
                applyBodyGyro(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyForce":
                applyBodyForce(
                    mover,
                    part
                );
                break;

            case "BodyAngularVelocity":
                applyBodyAngularVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyThrust":
                applyBodyThrust(
                    mover,
                    part
                );
                break;
        }
    }
}

function cloneLuaInstance(source) {
    if (
        !source ||
        source.__destroyed ||
        source.Archivable === false
    ) {
        return null;
    }

    const c =
        InstanceApi.new(
            source.ClassName
        );

    c.Name =
        source.Name;

    c.Archivable =
        source.Archivable;

    if (
        isA(
            source,
            "BasePart"
        )
    ) {
        c.Size =
            createVector3(
                source.Size.X,
                source.Size.Y,
                source.Size.Z
            );

        c.Position =
            createVector3(
                source.Position.X,
                source.Position.Y,
                source.Position.Z
            );

        c.Orientation =
            createVector3(
                source.Orientation.X,
                source.Orientation.Y,
                source.Orientation.Z
            );

        c.CFrame =
            source.CFrame;

        c.Color =
            createColor3(
                source.Color.R,
                source.Color.G,
                source.Color.B
            );

        c.BrickColor =
            BrickColorApi.new(
                source.BrickColor?.Name ||
                "Medium stone grey"
            );

        c.Anchored =
            source.Anchored;

        c.CanCollide =
            source.CanCollide;

        c.Transparency =
            source.Transparency;

        c.Reflectance =
            source.Reflectance || 0;

        if (
            source.ClassName ===
            "Seat"
        ) {
            c.Disabled =
                Boolean(
                    source.Disabled
                );

            // Occupant/SeatWeld are runtime state and are intentionally not cloned.
            c.Occupant =
                null;
        }

        if (
            source.ClassName ===
            "SpawnLocation"
        ) {
            c.Enabled =
                source.Enabled;

            c.Neutral =
                source.Neutral;

            c.TeamColor =
                BrickColorApi.new(
                    source.TeamColor?.Name ||
                    "Medium stone grey"
                );

            c.AllowTeamChangeOnTouch =
                source.AllowTeamChangeOnTouch;

            c.Duration =
                source.Duration;
        }

        for (
            const key of
            [
                "TopSurface",
                "BottomSurface",
                "LeftSurface",
                "RightSurface",
                "FrontSurface",
                "BackSurface"
            ]
        ) {
            c[key] =
                source[key];
        }
    } else if (
        source.ClassName ===
        "Sound"
    ) {
        c.SoundId =
            source.SoundId;

        c.Volume =
            source.Volume;

        c.Pitch =
            source.Pitch;

        c.Looped =
            source.Looped;

        c.TimePosition =
            source.TimePosition;

        c.PlayOnRemove =
            source.PlayOnRemove;

        c.MinDistance =
            source.MinDistance;

        c.MaxDistance =
            source.MaxDistance;

        c.EmitterSize =
            source.EmitterSize;

        // Roblox Clone() should not automatically start a sound merely because
        // the original is currently playing.
        c.Playing =
            false;
    } else if (
        source.ClassName ===
        "Decal"
    ) {
        c.Texture =
            source.Texture;

        c.Face =
            source.Face;

        c.Transparency =
            source.Transparency;

        c.Color3 =
            source.Color3;
    } else if (
        source.ClassName ===
        "ParticleEmitter"
    ) {
        for (
            const propertyName of
            [
                "Texture",
                "Enabled",
                "Rate",
                "Lifetime",
                "Speed",
                "SpreadAngle",
                "Rotation",
                "RotSpeed",
                "Size",
                "Transparency",
                "Color",
                "LightEmission",
                "Acceleration",
                "Drag",
                "VelocityInheritance",
                "ZOffset"
            ]
        ) {
            c[propertyName] =
                source[propertyName];
        }
    } else if (
        source.ClassName ===
        "BillboardGui"
    ) {
        c.Adornee =
            source.Adornee;

        c.Size =
            source.Size;

        c.StudsOffset =
            source.StudsOffset;

        c.Enabled =
            source.Enabled;

        c.AlwaysOnTop =
            source.AlwaysOnTop;
    } else if (
        source.ClassName ===
        "ImageLabel"
    ) {
        c.Image =
            source.Image;

        c.ImageColor3 =
            source.ImageColor3;

        c.ImageTransparency =
            source.ImageTransparency;

        c.BackgroundTransparency =
            source.BackgroundTransparency;

        c.Visible =
            source.Visible;

        c.Size =
            source.Size;

        c.Position =
            source.Position;
    } else if (
        source.ClassName ===
        "Explosion"
    ) {
        c.Position =
            source.Position;

        c.BlastRadius =
            source.BlastRadius;

        c.BlastPressure =
            source.BlastPressure;

        c.DestroyJointRadiusPercent =
            source.DestroyJointRadiusPercent;

        c.ExplosionType =
            source.ExplosionType;

        c.Visible =
            source.Visible;
    } else if (
        source.ClassName ===
        "ForceField"
    ) {
        // ForceField has no script-facing state in this classic implementation.
    } else if (
        source.ClassName ===
        "ClickDetector"
    ) {
        c.MaxActivationDistance =
            source.MaxActivationDistance;
    } else if (
        source.ClassName ===
        "Sparkles"
    ) {
        c.Enabled =
            source.Enabled;

        c.SparkleColor =
            createColor3(
                source.SparkleColor?.R,
                source.SparkleColor?.G,
                source.SparkleColor?.B
            );
    } else if (
        source.ClassName ===
            "Message" ||
        source.ClassName ===
            "Hint"
    ) {
        c.Text =
            source.Text;
    } else if (
        source.ClassName ===
        "Team"
    ) {
        c.TeamColor =
            BrickColorApi.new(
                source.TeamColor?.Name ||
                "Medium stone grey"
            );

        c.AutoAssignable =
            source.AutoAssignable;

        c.Score =
            source.Score;
    } else if (
        source.ClassName ===
        "HumanoidDescription"
    ) {
        for (
            const propertyName of
            [
                "Shirt",
                "Pants",
                "ShirtGraphic",
                "HeadColor",
                "TorsoColor",
                "LeftArmColor",
                "RightArmColor",
                "LeftLegColor",
                "RightLegColor"
            ]
        ) {
            c[propertyName] =
                source[propertyName];
        }
    } else if (
        source.ClassName ===
        "BodyColors"
    ) {
        for (
            const propertyName of
            [
                "HeadColor",
                "TorsoColor",
                "LeftArmColor",
                "RightArmColor",
                "LeftLegColor",
                "RightLegColor"
            ]
        ) {
            const value =
                source[propertyName];

            c[propertyName] =
                BrickColorApi.new(
                    value?.Name ??
                    value?.Number ??
                    "Medium stone grey"
                );
        }
    } else if (
        source.ClassName ===
        "Shirt"
    ) {
        c.ShirtTemplate =
            source.ShirtTemplate;
    } else if (
        source.ClassName ===
        "Pants"
    ) {
        c.PantsTemplate =
            source.PantsTemplate;
    } else if (
        source.ClassName ===
        "ShirtGraphic"
    ) {
        c.Graphic =
            source.Graphic;
    } else if (
        source.ClassName ===
        "Humanoid"
    ) {
        c.Health =
            source.Health;

        c.MaxHealth =
            source.MaxHealth;

        c.WalkSpeed =
            source.WalkSpeed;

        c.JumpPower =
            source.JumpPower;

        c.Sit =
            source.Sit;

        c.PlatformStand =
            source.PlatformStand;

        c.AutoRotate =
            source.AutoRotate;
    } else if (
        luaBodyMovers.has(source)
    ) {
        for (
            const propertyName of
            [
                "Velocity",
                "MaxForce",
                "Position",
                "P",
                "D",
                "CFrame",
                "MaxTorque",
                "Force",
                "AngularVelocity",
                "Location"
            ]
        ) {
            if (
                propertyName in source
            ) {
                c[propertyName] =
                    source[propertyName];
            }
        }
    } else if (
        "Value" in source
    ) {
        c.Value =
            cloneClassicValueObjectValue(
                source.ClassName,
                source.Value
            );
    }

    if (
        source.ClassName ===
        "Model"
    ) {
        // PrimaryPart is re-linked by name after descendants are cloned.
        c.PrimaryPart = null;
    }

    if (
        luaJoints.has(source)
    ) {
        c.Part0 =
            source.Part0;

        c.Part1 =
            source.Part1;

        c.C0 =
            source.C0;

        c.C1 =
            source.C1;

        c.CurrentAngle =
            source.CurrentAngle;

        c.DesiredAngle =
            source.DesiredAngle;

        c.MaxVelocity =
            source.MaxVelocity;

        c.Velocity =
            source.Velocity;
    }

    for (
        const child of
        source.GetChildren?.() || []
    ) {
        const cc =
            cloneLuaInstance(
                child
            );

        if (cc)
            cc.Parent = c;
    }

    if (
        source.ClassName ===
        "Humanoid"
    ) {
        c.Description =
            c.FindFirstChildOfClass?.(
                "HumanoidDescription"
            ) ||
            null;
    }

    if (
        source.ClassName === "Model" &&
        source.PrimaryPart
    ) {
        c.PrimaryPart =
            c.FindFirstChild(
                source.PrimaryPart.Name,
                true
            );
    }

    refreshChildAliases(c);

    return c;
}

function createLuaPart(className = "Part") {

    const internal = createPart(
        4,
        1,
        2,
        0,
        0.5,
        0,
        {
            color: 0xaaaaaa,
            anchored: false,
            canCollide: true
        }
    );

    // Don't display it until Parent = workspace.
    scene.remove(internal.mesh);

    const instance = Mutable({

        Name: className,
        ClassName: className,
        Archivable: true,

        Parent: null,

        Touched: createLuaSignal(`${className}.Touched`),
        TouchEnded: createLuaSignal(`${className}.TouchEnded`),

        Size: createVector3(
            4,
            1,
            2
        ),

        Position: createVector3(
            0,
            0.5,
            0
        ),

        Orientation: createVector3(
            0,
            0,
            0
        ),

        CFrame: createCFrame(
            0,
            0.5,
            0
        ),

        Color: createColor3(
            170 / 255,
            170 / 255,
            170 / 255
        ),

        BrickColor: BrickColorApi.new("Medium stone grey"),

        Anchored: false,

        CanCollide: true,

        Transparency: 0,

        CastShadow: true,
        Reflectance: 0,

        // Phase 3.5 classic physics properties.
        Velocity: createVector3(0,0,0),
        RotVelocity: createVector3(0,0,0),
        AssemblyMass: 1,
        Massless: false,
        CollisionGroup: "Default",
        CustomPhysicalProperties: null,

        // Classic 2010-style surfaces
        TopSurface: "Studs",
        BottomSurface: "Inlet",
        LeftSurface: "Smooth",
        RightSurface: "Smooth",
        FrontSurface: "Smooth",
        BackSurface: "Smooth",

        MakeJoints() { makeSurfaceJoints(this); },
        BreakJoints() {
            const connected =
                [...luaJoints]
                    .filter(joint =>
                        joint.Part0 === this ||
                        joint.Part1 === this
                    );

            for (
                const joint of
                connected
            ) {
                destroyLuaInstance(
                    joint
                );
            }

            return connected.length;
        },

        Destroy() {
            destroyLuaInstance(this);
        }

    });

    Object.defineProperty(
        instance,
        "__internal",
        {
            value: internal,
            writable: true,
            enumerable: false
        }
    );

    // Link this scripted Part to its one Rapier collider. The mapping lets
    // camera rays and touch broad-phase queries avoid full-map scans.
    internal.luaInstance =
        instance;

    registerRapierColliderOwner(
        instance,
        internal.collider
    );

    Object.defineProperty(
        instance,
        "__last",
        {
            value: {
                Size: [4, 1, 2],
                Position: [0, 0.5, 0],
                Orientation: [0, 0, 0],
                Parent: null,
                Color: 0xaaaaaa,
                BrickColorName: "Medium stone grey",
                Anchored: false,
                CanCollide: true,
                Transparency: 0,
                Reflectance: 0,
                CastShadow: true,
                Velocity: [0,0,0],
                RotVelocity: [0,0,0],
                Massless: false,
                CollisionGroup: "Default"
            },
            writable: true,
            enumerable: false
        }
    );

    instance.GetConnectedParts =
        (...args) => {
            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const found =
                new Set();

            const visit =
                current => {
                    for (
                        const joint of
                        luaJoints
                    ) {
                        if (
                            joint.__destroyed
                        ) {
                            continue;
                        }

                        let other =
                            null;

                        if (
                            joint.Part0 ===
                            current
                        ) {
                            other =
                                joint.Part1;
                        } else if (
                            joint.Part1 ===
                            current
                        ) {
                            other =
                                joint.Part0;
                        }

                        if (
                            !other ||
                            found.has(other)
                        ) {
                            continue;
                        }

                        found.add(
                            other
                        );

                        if (recursive)
                            visit(other);
                    }
                };

            visit(instance);

            return makeLuaCollection(
                [...found]
            );
        };

    instance.GetMass =
        (...args) => {
            const body =
                instance.__internal?.body;

            const bodyMass =
                Number(
                    body?.mass?.()
                );

            if (
                Number.isFinite(
                    bodyMass
                ) &&
                bodyMass >
                    0
            ) {
                return bodyMass;
            }

            return Math.max(
                0,
                Number(
                    instance.AssemblyMass
                ) || 1
            );
        };

    instance.GetRootPart =
        (...args) => {
            const found =
                new Set([
                    instance
                ]);

            const visit =
                current => {
                    for (
                        const joint of
                        luaJoints
                    ) {
                        if (
                            !joint ||
                            joint.__destroyed
                        ) {
                            continue;
                        }

                        let other =
                            null;

                        if (
                            joint.Part0 ===
                            current
                        ) {
                            other =
                                joint.Part1;
                        } else if (
                            joint.Part1 ===
                            current
                        ) {
                            other =
                                joint.Part0;
                        }

                        if (
                            !other ||
                            !isA(
                                other,
                                "BasePart"
                            ) ||
                            found.has(
                                other
                            )
                        ) {
                            continue;
                        }

                        found.add(
                            other
                        );

                        visit(
                            other
                        );
                    }
                };

            visit(
                instance
            );

            const parts =
                [...found];

            const anchored =
                parts.filter(part =>
                    Boolean(
                        part.Anchored
                    )
                );

            const candidates =
                anchored.length
                    ? anchored
                    : parts;

            candidates.sort(
                (a, b) =>
                    Number(
                        getLuaInstanceId(
                            a
                        )
                    ) -
                    Number(
                        getLuaInstanceId(
                            b
                        )
                    )
            );

            return (
                candidates[0] ||
                instance
            );
        };

    instance.Resize =
        (...args) => {
            const face =
                getStringArg(
                    args,
                    ""
                );

            const amount =
                Math.trunc(
                    getNumberArg(
                        args,
                        0
                    ) || 0
                );

            if (
                amount ===
                0
            ) {
                return false;
            }

            const size =
                new THREE.Vector3(
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.X
                            ) || 1
                        )
                    ),
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.Y
                            ) || 1
                        )
                    ),
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.Z
                            ) || 1
                        )
                    )
                );

            const localNormal =
                new THREE.Vector3();

            let axis =
                "y";

            switch (face) {
                case "Right":
                    axis = "x";
                    localNormal.set(
                        1,
                        0,
                        0
                    );
                    break;

                case "Left":
                    axis = "x";
                    localNormal.set(
                        -1,
                        0,
                        0
                    );
                    break;

                case "Top":
                    axis = "y";
                    localNormal.set(
                        0,
                        1,
                        0
                    );
                    break;

                case "Bottom":
                    axis = "y";
                    localNormal.set(
                        0,
                        -1,
                        0
                    );
                    break;

                case "Back":
                    axis = "z";
                    localNormal.set(
                        0,
                        0,
                        1
                    );
                    break;

                case "Front":
                    axis = "z";
                    localNormal.set(
                        0,
                        0,
                        -1
                    );
                    break;

                default:
                    return false;
            }

            const newAxisSize =
                size[axis] +
                amount;

            if (
                newAxisSize <
                1
            ) {
                return false;
            }

            size[axis] =
                newAxisSize;

            const rotation =
                new THREE.Quaternion()
                    .setFromEuler(
                        new THREE.Euler(
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.X
                                ) || 0
                            ),
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.Y
                                ) || 0
                            ),
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.Z
                                ) || 0
                            ),
                            "XYZ"
                        )
                    );

            const worldNormal =
                localNormal
                    .clone()
                    .applyQuaternion(
                        rotation
                    );

            const position =
                new THREE.Vector3(
                    Number(
                        instance.Position?.X
                    ) || 0,
                    Number(
                        instance.Position?.Y
                    ) || 0,
                    Number(
                        instance.Position?.Z
                    ) || 0
                )
                    .addScaledVector(
                        worldNormal,
                        amount /
                            2
                    );

            instance.Size =
                createVector3(
                    size.x,
                    size.y,
                    size.z
                );

            instance.Position =
                createVector3(
                    position.x,
                    position.y,
                    position.z
                );

            instance.CFrame =
                makeCFrameFromQuaternion(
                    position.x,
                    position.y,
                    position.z,
                    rotation
                );

            return true;
        };

    instance.getMass =
        instance.GetMass;

    instance.getRootPart =
        instance.GetRootPart;

    instance.resize =
        instance.Resize;

    addCommonInstanceApi(instance);
    Object.defineProperty(instance, "__destroyed", { value: false, writable: true, enumerable: false });

    // IMPORTANT: Parts must be registered so syncLuaInstances(), parenting,
    // Workspace:GetChildren(), joints, and the void system can see them.
    luaInstances.add(instance);

    return instance;
}

// ─── Classic 2010-style Sound ────────────────────────────────────────────────
//
// Security / asset rule for Blox Emulation:
// SoundId is ALWAYS resolved inside the local Sounds/ directory.
// Example:
//     sound.SoundId = "victory.wav"
// becomes:
//     Sounds/victory.wav
//
// URLs, drive paths, and ".." path traversal are rejected.
function normalizeLocalSoundId(value) {
    let id =
        String(
            value ?? ""
        ).trim();

    if (!id)
        return "";

    id =
        id.replace(
            /\\/g,
            "/"
        );

    // Accept users writing "Sounds/foo.wav" too, but normalize it back to
    // the relative SoundId Roblox-facing property.
    if (
        id.toLowerCase().startsWith(
            "sounds/"
        )
    ) {
        id =
            id.slice(7);
    }

    // Never allow external URLs, protocols, absolute paths, query strings,
    // fragments, or directory traversal outside the Sounds folder.
    if (
        /^[a-z][a-z0-9+.-]*:/i.test(id) ||
        id.startsWith("/") ||
        id.includes("..") ||
        id.includes("?") ||
        id.includes("#")
    ) {
        return "";
    }

    const pieces =
        id.split("/")
            .filter(piece =>
                piece &&
                piece !== "."
            );

    if (
        pieces.length === 0
    ) {
        return "";
    }

    return pieces.join("/");
}

function getLocalSoundPath(soundId) {
    const clean =
        normalizeLocalSoundId(
            soundId
        );

    return clean
        ? `Sounds/${clean}`
        : "";
}


// ─── Shared local Sound preloader/cache ───────────────────────────────────────
//
// Every Sound still owns its own HTMLAudioElement for independent playback,
// seeking, looping, pitch, and 3D positioning. These warm elements only start
// loading local files as early as possible so later playback usually hits the
// browser's already-warm media/HTTP cache.
const localSoundWarmCache =
    new Map();

function warmLocalSoundPath(path) {
    const cleanPath =
        String(
            path ??
            ""
        ).trim();

    if (
        !cleanPath ||
        !cleanPath.startsWith(
            "Sounds/"
        )
    ) {
        return null;
    }

    const existing =
        localSoundWarmCache.get(
            cleanPath
        );

    if (existing)
        return existing;

    const audio =
        new Audio();

    audio.preload =
        "auto";

    const entry = {
        audio,
        path:
            cleanPath,
        ready:
            false,
        failed:
            false
    };

    const markReady =
        () => {
            entry.ready =
                true;
        };

    audio.addEventListener(
        "loadedmetadata",
        markReady,
        {
            once:
                true
        }
    );

    audio.addEventListener(
        "canplay",
        markReady,
        {
            once:
                true
        }
    );

    audio.addEventListener(
        "error",
        () => {
            entry.failed =
                true;
        },
        {
            once:
                true
        }
    );

    localSoundWarmCache.set(
        cleanPath,
        entry
    );

    audio.src =
        cleanPath;

    try {
        audio.load();
    } catch {}

    return entry;
}

function warmLocalSoundId(soundId) {
    const path =
        getLocalSoundPath(
            soundId
        );

    return path
        ? warmLocalSoundPath(
            path
        )
        : null;
}

function prewarmLiteralSoundsFromLuauSource(
    source
) {
    const code =
        String(
            source ??
            ""
        );

    if (!code)
        return 0;

    const found =
        new Set();

    // Covers normal scripts and exporter output such as:
    // sound.SoundId = "engine.wav"
    // SoundId = 'alarm.mp3'
    const pattern =
        /\bSoundId\s*=\s*(["'])(.*?)\1/g;

    let match =
        null;

    while (
        (
            match =
                pattern.exec(
                    code
                )
        )
    ) {
        const id =
            normalizeLocalSoundId(
                match[2]
            );

        if (!id)
            continue;

        found.add(
            id
        );
    }

    for (
        const id of
        found
    ) {
        warmLocalSoundId(
            id
        );
    }

    return found.size;
}
