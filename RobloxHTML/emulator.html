// ─── 2009/2010-style click-to-move markers ──────────────────────────────────
//
// Classic behavior:
// 1. A green cylinder continuously follows the mouse over valid floor surfaces.
// 2. Clicking creates/places a separate destination cylinder.
// 3. The destination cylinder remains while the player walks toward it.
// 4. Once the player reaches it, the destination cylinder disappears.
//
// Both markers are visual-only Three.js objects. They are not Workspace/Lua
// Instances, Rapier bodies, or physObjects, so void/character cleanup cannot
// accidentally destroy them.
const CLASSIC_CLICK_MOVE_STOP_DISTANCE = 1.15;

// Roblox-style Size = Vector3.new(2, 0.25, 2)
const CLASSIC_CLICK_MARKER_SIZE_X = 2;
const CLASSIC_CLICK_MARKER_SIZE_Y = 0.1;
const CLASSIC_CLICK_MARKER_SIZE_Z = 2;

// Dedicated Three.js layer reserved for engine-only click markers.
// Ordinary Raycaster instances remain on layer 0 and therefore cannot hit it.
const CLASSIC_CLICK_MARKER_RENDER_LAYER = 31;

// Keep the marker visible to the actual game camera.
camera.layers.enable(
    CLASSIC_CLICK_MARKER_RENDER_LAYER
);

const classicClickMove = {
    active: false,
    destination: new THREE.Vector3()
};

function createClassicClickCylinder() {
    const marker =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                CLASSIC_CLICK_MARKER_SIZE_X * 0.5,
                CLASSIC_CLICK_MARKER_SIZE_Z * 0.5,
                CLASSIC_CLICK_MARKER_SIZE_Y,
                32,
                1,
                false
            ),
            new THREE.MeshStandardMaterial({
                color: 0x32cd32,

                emissive: 0x32cd32,
                emissiveIntensity: -0.5,

                roughness: 0.8,
                metalness: 0,

                transparent: false
            })
        );

    marker.castShadow = false;
    marker.receiveShadow = false;
    marker.visible = false;

    // Dedicated visual marker: not part of Lua/Rapier/physObjects.
    marker.userData.bloxPersistentClickMarker = true;
    marker.userData.bloxIgnoreMouseRay = true;

    // Engine-only visual. Keep rendering/depth exactly as-is while making all
    // THREE.Raycaster instances pass through the cylinder.
    marker.raycast = () => {};

    // Put click-to-move markers on a rendering-only Three.js layer.
    //
    // - Camera explicitly renders this layer, so the green cylinders stay visible.
    // - THREE.Raycaster defaults to layer 0, so normal visual/picking rays can
    //   never hit these markers.
    // - Rapier/Luau rays already ignore them because the cylinders have no
    //   collider and are not Lua BaseParts.
    //
    // This is cleaner than disabling marker.raycast() or depthWrite, both of
    // which can interfere with how the marker itself is displayed.
    marker.layers.set(
        CLASSIC_CLICK_MARKER_RENDER_LAYER
    );

    scene.add(marker);

    return marker;
}

// Mouse-following preview cylinder.
const classicMouseMarker =
    createClassicClickCylinder();

// Clicked destination cylinder.
const classicDestinationMarker =
    createClassicClickCylinder();

function hideClassicDestinationMarker() {
    classicClickMove.active = false;
    classicDestinationMarker.visible = false;
}

function updateClassicMouseMarker() {
    const hit =
        currentMouseWorldHit;

    if (
        !hit ||
        !hit.point ||
        !hit.normal ||
        (Number(hit.normal.y) || 0) < 0.45
    ) {
        classicMouseMarker.visible = false;
        return;
    }

    classicMouseMarker.position.set(
        Number(hit.point.x) || 0,
        (Number(hit.point.y) || 0) +
            CLASSIC_CLICK_MARKER_SIZE_Y * 0.5 +
            0.015,
        Number(hit.point.z) || 0
    );

    classicMouseMarker.visible = true;
}

function placeClassicClickMoveDestination() {
    const hit =
        currentMouseWorldHit;

    if (
        !hit ||
        !hit.point ||
        !hit.normal
    ) {
        return false;
    }

    // Only floor-like upward surfaces are valid destinations.
    if (
        (Number(hit.normal.y) || 0) <
        0.45
    ) {
        return false;
    }

    classicClickMove.destination.set(
        Number(hit.point.x) || 0,
        Number(hit.point.y) || 0,
        Number(hit.point.z) || 0
    );

    classicClickMove.active = true;

    classicDestinationMarker.position.set(
        classicClickMove.destination.x,
        classicClickMove.destination.y +
            CLASSIC_CLICK_MARKER_SIZE_Y * 0.5 +
            0.015,
        classicClickMove.destination.z
    );

    classicDestinationMarker.visible = true;

    return true;
}

function updateClassicClickMoveMarkers() {
    // The preview follows the mouse every frame.
    updateClassicMouseMarker();

    // Destination visibility is owned by click-to-move state.
    classicDestinationMarker.visible =
        classicClickMove.active;
}

    if (isClassicChatInputFocused())

    if (
        (e.code === "Slash" || e.key === "/") &&

    }

    if (
        e.code === "Escape"
    ) {
        closeClassicTopMenus();

    const hotbarIndex =
        getClassicHotbarIndexFromCode(

        );

    if (
        hotbarIndex !== -1 &&
        !e.repeat
    ) {
        selectClassicHotbarIndex(
            hotbarIndex
        );
    }

    if (
        e.code === "Backspace" &&
        !e.repeat
    ) {
        if (
            dropClassicEquippedTool()
        ) {
            e.preventDefault();
        }
    }

    switch (e.code) {
        case "KeyW":   keys.w     = true;  break;
        case "KeyA":   keys.a     = true;  break;
        case "KeyS":   keys.s     = true;  break;
        case "KeyD":   keys.d     = true;  break;
        case "Space":  keys.space = true;  e.preventDefault(); break;

        case "ArrowLeft":
            if (!e.repeat) {
                CAM.yaw += CAMERA_ARROW_YAW_STEP;
                playZoomSound();
            }
            e.preventDefault();
            break;

        case "ArrowRight":
            if (!e.repeat) {
                CAM.yaw -= CAMERA_ARROW_YAW_STEP;
                playZoomSound();
            }
            e.preventDefault();
            break;

        case "ArrowUp":
            if (!e.repeat) {
                CAM.pitch = THREE.MathUtils.clamp(
                    CAM.pitch - CAMERA_ARROW_PITCH_STEP,
                    -1,
                    Math.PI / 2 - 0.08
                );
                playZoomSound();
            }
            e.preventDefault();
            break;

        case "ArrowDown":
            if (!e.repeat) {
                CAM.pitch = THREE.MathUtils.clamp(
                    CAM.pitch + CAMERA_ARROW_PITCH_STEP,
                    -1,
                    Math.PI / 2 - 0.08
                );
                playZoomSound();
            }
            e.preventDefault();
            break;
    }

    const keyCode =
        e.code.startsWith("Key")
            ? e.code.slice(3)
            : (
                e.code === "Space"
                    ? "Space"
                    : e.code
            );

    heldInputCodes.add(
        keyCode
    );

    const input =
        makeInputObject(
            "Keyboard",
            keyCode
        );

    fireLuaSignal(
        UserInputServiceApi.InputBegan,
        input,
        false
    );

    fireLuaSignal(
        MouseApi.KeyDown,
        String(e.key || "").toLowerCase()

    fireContextActions(
        keyCode,
        "Begin",
        input
    );

// Scroll to zoom
window.addEventListener(
    "wheel",
    e => {
        const zoomingOut =
            e.deltaY > 0;

        const prev =
            CAM.zoomCurrent;

        const wasFirstPerson =
            CAM.firstPerson;

        // Large steps while far away, then progressively smaller steps near
        // the character so you can zoom right up to the face before FP.
        let zoomStep;

        if (
            CAM.zoomCurrent > 15
        ) {
            zoomStep = 5;
        } else if (
            CAM.zoomCurrent > 6
        ) {
            zoomStep = 2;
        } else if (
            CAM.zoomCurrent > 2
        ) {
            zoomStep = 0.75;
        } else {
            zoomStep = 0.20;
        }

        const dir =
            zoomingOut
                ? zoomStep
                : -zoomStep;

        CAM.zoomCurrent =
            THREE.MathUtils.clamp(
                CAM.zoomCurrent + dir,
                CAMERA_MIN_ZOOM_DISTANCE,
                60
            );

        CAM.firstPerson =
            CAM.zoomCurrent <=
            FIRST_PERSON_ZOOM_DISTANCE +
            0.001;

        if (
            CAM.zoomCurrent !==
            prev
        ) {
            playZoomSound();
        }

        if (
            CAM.firstPerson &&
            !wasFirstPerson &&
            document.pointerLockElement !==
                canvas
        ) {
            canvas.requestPointerLock?.();
        } else if (
            !CAM.firstPerson &&
            wasFirstPerson &&
            !CAM.orbiting &&
            document.pointerLockElement ===
                canvas
        ) {
            document.exitPointerLock?.();
        }

        e.preventDefault();
    },
    {
        passive: false
    }
);

// ─── Player setup: in-engine classic R6 rig ─────────────────────────────────
// No Rig/r6_rigged.fbx is used anymore.
//
// The Rapier capsule remains the player's ONLY movement collider.
// These meshes are visual character pieces parented to playerRoot.
//
// Layout:
//   Head       1x1x1-ish, centered at Y=4
//   Torso      2x2x1, centered at Y=2.5
//   Arms       1x2x1, centered at Y=2.5
//   Legs       1x2x1, centered at Y=0.5
//
// Arms rotate from shoulder pivots.
// Legs rotate from hip pivots.

const PLAYER_SKIN_COLOR = 0xffff82;
const PLAYER_TORSO_COLOR = 0xff8282;

// How far below the very top of the arm the shoulder pivot sits.
// 0.0 = exactly at the top edge
// 0.15 = slightly lower
// 0.25 = noticeably lower
const ARM_PIVOT_DROP = 0.5;

// Animation code continues to use this same object, except the entries are
// now THREE.Group pivot joints instead of FBX bones.
const limbs = {};

function makeCharacterMaterialSet(w, d, color) {
    const max = renderer.capabilities.getMaxAnisotropy();

    const sideMat =
        new THREE.MeshStandardMaterial({
            color,
            roughness: 0.3,
            metalness: 0.0
        });

    const topMat =
        new THREE.MeshStandardMaterial({
            map: loadTex(
                "Textures/top-stud.jpg",
                w,
                d
            ),
            color,
            roughness: 0.3,
            metalness: 0.0
        });

    const bottomMat =
        new THREE.MeshStandardMaterial({
            map: loadTex(
                "Textures/bottom-stud.jpg",
                w,
                d
            ),
            color,
            roughness: 0.3,
            metalness: 0.0
        });

    if (topMat.map)
        topMat.map.anisotropy = max;

    if (bottomMat.map)
        bottomMat.map.anisotropy = max;

    return [
        sideMat,
        sideMat,
        topMat,
        bottomMat,
        sideMat,
        sideMat
    ];
}

function makeCharacterBlock(
    name,
    w,
    h,
    d,
    color
) {
    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            makeCharacterMaterialSet(
                w,
                d,
                color
            )
        );

    mesh.name = name;
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}

function makeFaceTextureWithSkinBackground(
    path,
    skinColorHex
) {
    const canvas =
        document.createElement("canvas");

    // Give CanvasTexture valid initial image data immediately.
    canvas.width = 1;
    canvas.height = 1;

    const ctx =
        canvas.getContext("2d");

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.minFilter =
        THREE.LinearFilter;

    texture.magFilter =
        THREE.LinearFilter;

    const img =
        new Image();

    img.onload = () => {
        canvas.width =
            img.width;

        canvas.height =
            img.height;

        const skin =
            new THREE.Color(
                skinColorHex
            );

        // THREE.Color is in working linear space, so convert a clone back to
        // sRGB before using it as a CSS canvas fill.
        const srgbSkin =
            skin.clone();

        if (typeof srgbSkin.convertLinearToSRGB === "function") {
            srgbSkin.convertLinearToSRGB();
        }

        const r =
            Math.round(
                THREE.MathUtils.clamp(
                    srgbSkin.r,
                    0,
                    1
                ) * 255
            );

        const g =
            Math.round(
                THREE.MathUtils.clamp(
                    srgbSkin.g,
                    0,
                    1
                ) * 255
            );

        const b =
            Math.round(
                THREE.MathUtils.clamp(
                    srgbSkin.b,
                    0,
                    1
                ) * 255
            );

        // Blender-style RGB background + transparent PNG compositing.
        ctx.fillStyle =
            `rgb(${r}, ${g}, ${b})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );

        texture.needsUpdate =
            true;
    };

    img.onerror = () => {
        console.error(
            "Failed to load player face texture:",
            path
        );
    };

    function redrawSkinColor(newSkinColorHex) {
        if (!img.complete || !img.naturalWidth)
            return;

        const c =
            new THREE.Color(
                newSkinColorHex
            );

        const srgb =
            c.clone();

        if (
            typeof srgb.convertLinearToSRGB ===
            "function"
        ) {
            srgb.convertLinearToSRGB();
        }

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
            `rgb(${Math.round(srgb.r * 255)}, ${Math.round(srgb.g * 255)}, ${Math.round(srgb.b * 255)})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );

        texture.needsUpdate =
            true;
    }

    texture.userData =
        texture.userData || {};

    texture.userData.setSkinColor =
        redrawSkinColor;

    img.src = path;

    return texture;
}

function createPartBasedPlayer() {
    const rig =
        new THREE.Group();

    rig.name =
        "ClassicR6Player";

    // ── Torso ────────────────────────────────────────────────────────────────
    const torso =
        makeCharacterBlock(
            "body",
            2,
            2,
            1,
            LOCAL_AVATAR_TORSO_COLOR
        );

    torso.position.set(
        0,
        2.5,
        0
    );

    rig.add(torso);

    // ── Arm pivots ───────────────────────────────────────────────────────────
    // Pivot is at the TOP/CENTER of each arm, like a shoulder Motor.
    const leftArmPivot =
        new THREE.Group();

    leftArmPivot.name =
        "LeftArmMotor";

    // This R6 faces +Z. In that coordinate convention, the character's
    // RIGHT side is -X and its LEFT side is +X. Keep the semantic Roblox
    // limb names on the visually correct sides so Right Arm really is right.
    leftArmPivot.position.set(
        1.5,
        3.5 - ARM_PIVOT_DROP,
        0
    );

    const leftArm =
        makeCharacterBlock(
            "LeftArm",
            1,
            2,
            1,
            LOCAL_AVATAR_LEFT_ARM_COLOR
        );

    leftArm.position.set(
        0,
        -1 + ARM_PIVOT_DROP,
        0
    );

    leftArmPivot.add(
        leftArm
    );

    rig.add(
        leftArmPivot
    );

    const rightArmPivot =
        new THREE.Group();

    rightArmPivot.name =
        "RightArmMotor";

    rightArmPivot.position.set(
        -1.5,
        3.5 - ARM_PIVOT_DROP,
        0
    );

    const rightArm =
        makeCharacterBlock(
            "RightArm",
            1,
            2,
            1,
            LOCAL_AVATAR_RIGHT_ARM_COLOR
        );

    rightArm.position.set(
        0,
        -1 + ARM_PIVOT_DROP,
        0
    );

    rightArmPivot.add(
        rightArm
    );

    rig.add(
        rightArmPivot
    );

    // ── Leg pivots ───────────────────────────────────────────────────────────
    // Pivot is at the TOP/CENTER of each leg, like a hip Motor.
    const leftLegPivot =
        new THREE.Group();

    leftLegPivot.name =
        "LeftLegMotor";

    leftLegPivot.position.set(
        0.5,
        1.5,
        0
    );

    const leftLeg =
        makeCharacterBlock(
            "LeftLeg",
            1,
            2,
            1,
            LOCAL_AVATAR_LEFT_LEG_COLOR
        );

    leftLeg.position.set(
        0,
        -1,
        0
    );

    leftLegPivot.add(
        leftLeg
    );

    rig.add(
        leftLegPivot
    );

    const rightLegPivot =
        new THREE.Group();

    rightLegPivot.name =
        "RightLegMotor";

    rightLegPivot.position.set(
        -0.5,
        1.5,
        0
    );

    const rightLeg =
        makeCharacterBlock(
            "RightLeg",
            1,
            2,
            1,
            LOCAL_AVATAR_RIGHT_LEG_COLOR
        );

    rightLeg.position.set(
        0,
        -1,
        0
    );

    rightLegPivot.add(
        rightLeg
    );

    rig.add(
        rightLegPivot
    );

    // Animation system now controls these in-engine pivot groups.
    limbs.leftArm =
        leftArmPivot;

    limbs.rightArm =
        rightArmPivot;

    limbs.leftLeg =
        leftLegPivot;

    limbs.rightLeg =
        rightLegPivot;

    limbs.leftArmBaseY =
        leftArmPivot.position.y;

    limbs.rightArmBaseY =
        rightArmPivot.position.y;

    // ── Head ─────────────────────────────────────────────────────────────────
    // Keep a stable named head root immediately so the camera can track it
    // before head.fbx finishes loading.
    const headRoot =
        new THREE.Group();

    headRoot.name =
        "head";

    headRoot.position.set(
        0,
        4,
        0
    );

    rig.add(
        headRoot
    );

    const faceTexture =
        makeFaceTextureWithSkinBackground(
            "Textures/Player/rblx_faces.png",
            LOCAL_AVATAR_HEAD_COLOR
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            map: faceTexture,
            roughness: 0.45,
            metalness: 0.0
        });

    const headLoader =
        new FBXLoader();

    headLoader.load(
        "Rig/head.fbx",

        loadedHead => {
            loadedHead.traverse(
                child => {
                    if (!child.isMesh)
                        return;

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {
                        child.material =
                            child.material.map(
                                () =>
                                    headMaterial.clone()
                            );
                    } else {
                        child.material =
                            headMaterial.clone();
                    }
                }
            );

            loadedHead.updateMatrixWorld(
                true
            );

            const originalBounds =
                new THREE.Box3()
                    .setFromObject(
                        loadedHead
                    );

            const originalSize =
                originalBounds.getSize(
                    new THREE.Vector3()
                );

            if (originalSize.y > 0) {
                const normalizedScale =
                    1 /
                    originalSize.y;

                // Keep the slightly oversized head you were using in preview.
                loadedHead.scale.multiplyScalar(
                    normalizedScale *
                    1.2
                );
            }

            loadedHead.updateMatrixWorld(
                true
            );

            const scaledBounds =
                new THREE.Box3()
                    .setFromObject(
                        loadedHead
                    );

            const scaledCenter =
                scaledBounds.getCenter(
                    new THREE.Vector3()
                );

            // Center FBX geometry at the head joint origin.
            loadedHead.position.sub(
                scaledCenter
            );

            headRoot.add(
                loadedHead
            );

            headRoot.userData.setSkinColor =
                newColorHex => {
                    faceTexture.userData
                        ?.setSkinColor?.(
                            newColorHex
                        );

                    // Keep material tint neutral because the canvas itself
                    // supplies the skin background.
                    loadedHead.traverse(
                        child => {
                            if (!child.isMesh)
                                return;

                            const materials =
                                Array.isArray(
                                    child.material
                                )
                                    ? child.material
                                    : [child.material];

                            for (
                                const material of
                                materials
                            ) {
                                material?.color
                                    ?.setHex(
                                        0xffffff
                                    );
                            }
                        }
                    );
                };

            // The FBX finishes asynchronously. Re-apply the live description's
            // HeadColor now so an avatar/script color change made during loading
            // cannot leave the head on its original default color.
            const liveHeadColor =
                currentPlayerHumanoid
                    ? getResolvedHumanoidAppearance(
                        currentPlayerHumanoid
                    )?.colors?.HeadColor
                    : null;

            headRoot.userData.setSkinColor(
                liveHeadColor
                    ? color3ToHex(
                        liveHeadColor
                    )
                    : LOCAL_AVATAR_HEAD_COLOR
            );

            console.log(
                "[Player] Loaded part-based R6 head from Rig/head.fbx"
            );
        },

        xhr => {
            if (xhr.total) {
                console.log(
                    "[Player] Head FBX:",
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    ) + "%"
                );
            }
        },

        error => {
            console.error(
                "[Player] Failed to load Rig/head.fbx",
                error
            );

            // Visible fallback so the player remains usable.
            const fallbackHead =
                makeCharacterBlock(
                    "HeadFallback",
                    1.2,
                    1.2,
                    1.2,
                    LOCAL_AVATAR_HEAD_COLOR
                );

            headRoot.add(
                fallbackHead
            );
        }
    );

    rig.userData.characterParts = {
        Head:
            headRoot,

        Torso:
            torso,

        "Left Arm":
            leftArm,

        "Right Arm":
            rightArm,

        "Left Leg":
            leftLeg,

        "Right Leg":
            rightLeg
    };

    return rig;
}

// Build the actual playable visual character.
player =
    createPartBasedPlayer();

// IMPORTANT:
// The classic R6 layout uses leg centers at local Y = 0.5 with 2-stud-tall
// legs, so the raw rig extends down to local Y = -0.5.
//
// playerRoot itself represents the TRUE physics foot/floor contact point.
// Lift only the visual rig by 0.5 stud so its feet sit exactly at local Y = 0
// instead of appearing half a stud inside floors/parts.
const PLAYER_VISUAL_Y_OFFSET = 0.5;
player.position.y = PLAYER_VISUAL_Y_OFFSET;

playerRoot.add(
    player
);

playerRoot.position.set(
    0,
    0,
    0
);

playerState.height =
    5;

// Initialise camera behind the new in-engine character.
CAM.currentPos.set(
    0,
    playerState.height * 0.6,
    CAM.zoomSteps[
        CAM.zoomIndex
    ]
);

console.log(
    "[Player] Using in-engine part-based R6 rig; r6_rigged.fbx disabled."
);

// ─── Classic spawn SelectionBox ForceField ──────────────────────────────────
//
// The visual stays exactly as before: rainbow SelectionBoxes around all six R6
// body parts. It is now backed by a real ForceField Instance, so TakeDamage()
// and Explosion joint destruction can respect it.
const SPAWN_SELECTION_DURATION_MS = 10000;
const spawnSelectionBoxes = [];
let spawnSelectionStartedAt = 0;
let activeVisualForceField = null;
let activeSpawnForceField = null;
let lastPlayerSpawnLocation = null;

function clearSpawnSelectionBoxes() {
    for (
        const box of
        spawnSelectionBoxes
    ) {
        if (
            box &&
            !box.__destroyed
        ) {
            destroyLuaInstance(
                box
            );
        }
    }

    spawnSelectionBoxes.length = 0;
    spawnSelectionStartedAt = 0;
}

function startSpawnSelectionEffect(
    characterParts
) {
    clearSpawnSelectionBoxes();

    if (
        !Array.isArray(
            characterParts
        )
    ) {
        return;
    }

    for (
        const part of
        characterParts
    ) {
        if (!part)
            continue;

        const box =
            createLuaSelectionBox();

        box.Name =
            "SpawnSelectionBox";

        box.Adornee =
            part;

        box.Parent =
            currentCharacterModel;

        box.LineThickness =
            0.25;

        box.SurfaceTransparency =
            1;

        box.Visible =
            true;

        spawnSelectionBoxes.push(
            box
        );
    }

    spawnSelectionStartedAt =
        performance.now();
}

function updateSpawnSelectionEffect() {
    if (
        spawnSelectionBoxes.length ===
        0
    ) {
        return;
    }

    const elapsed =
        performance.now() -
        spawnSelectionStartedAt;

    // Smooth rainbow cycle while a ForceField exists. Spawn-created
    // ForceFields still default to ten seconds, matching the old visual.
    const hue =
        (
            elapsed /
            1600
        ) % 1;

    const color =
        new THREE.Color()
            .setHSL(
                hue,
                1,
                0.5
            );

    for (
        const box of
        spawnSelectionBoxes
    ) {
        if (
            !box ||
            box.__destroyed
        ) {
            continue;
        }

        box.Color3 =
            createColor3(
                color.r,
                color.g,
                color.b
            );
    }
}


function getCurrentCharacterBodyPartsForForceField() {
    if (
        !currentCharacterModel ||
        currentCharacterModel.__destroyed
    ) {
        return [];
    }

    const names = [
        "Head",
        "Torso",
        "Left Arm",
        "Right Arm",
        "Left Leg",
        "Right Leg"
    ];

    return names
        .map(name =>
            currentCharacterModel
                .FindFirstChild?.(
                    name
                )
        )
        .filter(Boolean);
}

function startForceFieldVisual(
    forceField
) {
    if (
        !forceField ||
        forceField.__destroyed ||
        forceField.Parent !==
            currentCharacterModel
    ) {
        return;
    }

    activeVisualForceField =
        forceField;

    startSpawnSelectionEffect(
        getCurrentCharacterBodyPartsForForceField()
    );
}

function createSpawnForceFieldForCurrentCharacter(
    spawnLocation = null
) {
    if (
        !currentCharacterModel ||
        currentCharacterModel.__destroyed
    ) {
        return null;
    }

    if (
        activeSpawnForceField &&
        !activeSpawnForceField.__destroyed
    ) {
        destroyLuaInstance(
            activeSpawnForceField
        );
    }

    const durationSeconds =
        Math.max(
            0,
            Number(
                spawnLocation?.Duration
            ) ||
            (
                SPAWN_SELECTION_DURATION_MS /
                1000
            )
        );

    if (
        durationSeconds <=
        0
    ) {
        clearSpawnSelectionBoxes();
        return null;
    }

    const forceField =
        createLuaForceField();

    forceField.Name =
        "ForceField";

    forceField.Parent =
        currentCharacterModel;

    forceField.__expiresAt =
        performance.now() +
        durationSeconds *
        1000;

    activeSpawnForceField =
        forceField;

    startForceFieldVisual(
        forceField
    );

    refreshChildAliases(
        currentCharacterModel
    );

    return forceField;
}

function syncLuaForceFields() {
    const now =
        performance.now();

    for (
        const forceField of
        [...luaForceFields]
    ) {
        if (
            !forceField ||
            forceField.__destroyed
        ) {
            continue;
        }

        if (
            forceField.__expiresAt >
                0 &&
            now >=
                forceField.__expiresAt
        ) {
            destroyLuaInstance(
                forceField
            );

            continue;
        }
    }

    if (
        !currentCharacterModel ||
        currentCharacterModel.__destroyed
    ) {
        if (
            spawnSelectionBoxes.length >
            0
        ) {
            clearSpawnSelectionBoxes();
        }

        activeVisualForceField =
            null;

        return;
    }

    const forceField =
        getLuaChildren(
            currentCharacterModel
        ).find(child =>
            child &&
            !child.__destroyed &&
            child.ClassName ===
                "ForceField"
        ) ||
        null;

    if (
        forceField !==
        activeVisualForceField
    ) {
        clearSpawnSelectionBoxes();

        activeVisualForceField =
            null;

        if (forceField) {
            startForceFieldVisual(
                forceField
            );
        }
    }
}


// ─── Phase 2: expose the playable R6 as LocalPlayer.Character ────────────────

        );

            {
                x: 2,
                y: 2,
                z: 1
            },

        );

    const leftArm =
        makeCharacterPartInstance(

            {
                x: 1,
                y: 2,
                z: 1
            },

        );

            {
                x: 1,
                y: 2,

            },

        );

    const leftLeg =
        makeCharacterPartInstance(
            "Left Leg",
            visuals["Left Leg"],
            {
                x: 1,
                y: 2,
                z: 1
            },
            LOCAL_AVATAR_LEFT_LEG_COLOR,
            character
        );

    const rightLeg =
        makeCharacterPartInstance(
            "Right Leg",
            visuals["Right Leg"],
            {
                x: 1,
                y: 2,
                z: 1
            },
            LOCAL_AVATAR_RIGHT_LEG_COLOR,

        );

    // Keep those values on a HumanoidDescription owned by the Humanoid so the

    createLocalPlayerAvatarDescription(

    );

function scheduleCharacterRespawn() {
    if (characterRespawnTimer)
        return;

    characterRespawnTimer =
        setTimeout(
            () => {
                characterRespawnTimer =
                    null;

                rebuildLocalPlayerCharacter(
                    true
                );
            },
            CHARACTER_RESPAWN_DELAY_MS
        );
}

function rebuildLocalPlayerCharacter(
    playSpawn = true
) {
    resetPlayerGuiFromStarterGui();
    resetLocalBackpackFromStarterPack();

    if (characterRespawnTimer) {
        clearTimeout(
            characterRespawnTimer
        );

        characterRespawnTimer =
            null;
    }

    unseatPlayer(
        false
    );

    const oldCharacter =
        currentCharacterModel;

    if (
        oldCharacter &&
        !oldCharacter.__destroyed
    ) {
        fireLuaSignal(
            localPlayerApi.CharacterRemoving,
            oldCharacter
        );
    }

    localPlayerApi.Character =
        null;

    clearSpawnSelectionBoxes();

    // Remove ragdoll sync entries first. Their rigid bodies are then removed by
    // destroying the old Character proxies, whose __internal points at them.
    for (
        const ragdollPart of
        characterRagdollBodies
    ) {
        const index =
            physObjects.indexOf(
                ragdollPart
            );

        if (index !== -1) {
            physObjects.splice(
                index,
                1
            );
        }
    }

    if (
        oldCharacter &&
        !oldCharacter.__destroyed
    ) {
        destroyLuaInstance(
            oldCharacter
        );
    }

    characterRagdollBodies.length =
        0;

    characterVisualBindings.length =
        0;

    currentCharacterModel =
        null;

    currentPlayerHumanoid =
        null;

    // Remove the old empty R6 hierarchy left behind after the pieces detached.
    if (
        player &&
        player.parent
    ) {
        player.parent.remove(
            player
        );
    }

    for (
        const key of
        Object.keys(limbs)
    ) {
        delete limbs[key];
    }

    try {
        delete window.rbx08Anim;
    } catch {
        window.rbx08Anim =
            undefined;
    }

    characterJointsBroken =
        false;

    resetPhysicsRagdollState();

    playerBody.setGravityScale?.(
        PLAYER_GRAVITY_SCALE,
        true
    );

    setPlayerMainColliderEnabled(
        true
    );

    setPlayerSeatCollisionMode(
        false
    );

    // Pick a fresh random enabled SpawnLocation for each Character spawn.
    // Falls back to (0, 4, 0) when none are available.
    movePlayerToChosenSpawn(
        false
    );

    player =
        createPartBasedPlayer();

    player.position.y =
        PLAYER_VISUAL_Y_OFFSET;

    playerRoot.add(
        player
    );

    const newCharacter =
        buildLocalPlayerCharacterModel();

    CameraApi.CameraSubject =
        currentPlayerHumanoid;

    cameraCharacterTransparency =
        0;

    firstPersonBlend =
        CAM.firstPerson
            ? 1
            : 0;

    const headPosition =
        getPlayerHeadWorldPosition();

    const focus =
        headPosition.clone();

    if (!CAM.firstPerson) {
        focus.y +=
            zoomVerticalOffset(
                CAM.zoomCurrent
            );
    }

    CAM.targetOffset.copy(
        focus
    );

    if (CAM.firstPerson) {
        CAM.currentPos.copy(
            headPosition
        );
    } else {
        const dist =
            CAM.zoomCurrent;

        CAM.currentPos.set(
            focus.x -
                dist *
                Math.sin(CAM.yaw),
            focus.y -
                dist *
                Math.sin(CAM.pitch),
            focus.z +
                dist *
                Math.cos(CAM.yaw)
        );
    }

    camera.position.copy(
        CAM.currentPos
    );

    if (playSpawn) {
        playSpawnSound();
    }

    console.log(
        "[Phase 3.6] Character rebuilt after death/LoadCharacter."
    );

    return newCharacter;
}

// The playable Character is constructed before uploaded place scripts run.
// Initialize the engine-owned 2008 UI now; StarterPack is then watched for
// newly-created source items so scripts that populate it during startup work.
syncStarterPackToBackpack();
initializeClassicCoreUi();
buildLocalPlayerCharacterModel();



// ─── Update ──────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

// ─── Player ground/support detection ─────────────────────────────────────────
//
// Prefer actual Rapier contact manifolds instead of relying only on a tiny ray.
// This is important for unanchored Parts: the support itself can move slightly
// between simulation ticks while still being physically in contact with the
// player capsule.
//
// A short center ray remains as a fallback for tiny solver separations.
const PLAYER_GROUND_PROBE_DISTANCE = 0.32;
const PLAYER_GROUND_MIN_NORMAL_Y = 0.42;

function rememberPlayerGround(
    collider
) {
    playerGroundCollider =
        collider ||
        null;

    playerGroundBody =
        collider?.parent?.() ||
        null;
}

function checkGrounded() {
    playerGroundCollider =
        null;

    playerGroundBody =
        null;

    const pos =
        playerBody.translation();

    const velocity =
        playerBody.linvel();

    // Once a jump is clearly travelling upward, contacts left over from the
    // launch frame must not immediately mark the Humanoid as grounded again.
    if (
        velocity.y >
        2.0
    ) {
        return false;
    }

    // First use real collision contacts. This works for fixed AND dynamic
    // rigid-bodies and avoids treating a nearby wall as a floor.
    let groundedByContact =
        false;

    try {
        world.contactPairsWith(
            playerCollider,
            otherCollider => {
                if (
                    groundedByContact ||
                    !otherCollider ||
                    otherCollider ===
                        playerCollider ||
                    otherCollider.isSensor?.()
                ) {
                    return;
                }

                world.contactPair(
                    playerCollider,
                    otherCollider,
                    manifold => {
                        if (
                            groundedByContact ||
                            !manifold
                        ) {
                            return;
                        }

                        const normal =
                            manifold.normal?.();

                        if (
                            !normal ||
                            Math.abs(
                                Number(
                                    normal.y
                                ) || 0
                            ) <
                                PLAYER_GROUND_MIN_NORMAL_Y
                        ) {
                            // Mostly-horizontal normal = wall contact.
                            return;
                        }

                        let contactIsBelowPlayer =
                            false;

                        const solverContactCount =
                            Number(
                                manifold.numSolverContacts?.()
                            ) || 0;

                        // Solver contact points are world-space. A floor/support
                        // contact must occur on the lower half of the capsule.
                        for (
                            let i = 0;
                            i < solverContactCount;
                            i++
                        ) {
                            const point =
                                manifold.solverContactPoint?.(
                                    i
                                );

                            if (
                                point &&
                                Number(
                                    point.y
                                ) <=
                                    pos.y -
                                    PLAYER_HALF_H *
                                        0.35
                            ) {
                                contactIsBelowPlayer =
                                    true;
                                break;
                            }
                        }

                        // Some contact manifolds may temporarily have no solver
                        // contact points. Fall back to the other collider's world
                        // center so moving supports still remain usable.
                        if (
                            !contactIsBelowPlayer &&
                            solverContactCount ===
                                0
                        ) {
                            const otherPosition =
                                otherCollider.translation?.();

                            contactIsBelowPlayer =
                                Boolean(
                                    otherPosition &&
                                    Number(
                                        otherPosition.y
                                    ) <
                                        pos.y
                                );
                        }

                        if (
                            !contactIsBelowPlayer
                        ) {
                            return;
                        }

                        rememberPlayerGround(
                            otherCollider
                        );

                        groundedByContact =
                            true;
                    }
                );
            }
        );
    } catch {
        // Keep the ray fallback below for compatibility if a browser/Rapier
        // build ever fails to expose narrow-phase contact iteration.
    }

    if (
        groundedByContact
    ) {
        return true;
    }

    // Fallback: probe a little farther than the old 0.15-stud ray so a dynamic
    // support can move a small amount without making the character enter the
    // falling state for a frame.
    const feetY =
        pos.y -
        PLAYER_HALF_H -
        PLAYER_RADIUS;

    const ray =
        new RAPIER.Ray(
            {
                x: pos.x,
                y: feetY + 0.08,
                z: pos.z
            },
            {
                x: 0,
                y: -1,
                z: 0
            }
        );

    const hit =
        world.castRay(
            ray,
            PLAYER_GROUND_PROBE_DISTANCE,
            true,

            RAPIER.QueryFilterFlags.EXCLUDE_SENSORS,

            undefined,
            undefined,
            playerBody,

            collider =>
                !collider.isSensor()
        );

    if (
        !hit ||
        hit.collider?.isSensor?.()
    ) {
        return false;
    }

    rememberPlayerGround(
        hit.collider
    );

    return true;
}

// Velocity of the Part currently under the player's feet.
//
// This lets the controlled capsule ride unanchored/moving Parts instead of
// overwriting its X/Z velocity with zero every render frame.
function getPlayerGroundVelocity() {
    if (
        !playerState.grounded ||
        !playerGroundBody ||
        playerGroundBody ===
            playerBody
    ) {
        return {
            x: 0,
            y: 0,
            z: 0
        };
    }

    try {
        const pos =
            playerBody.translation();

        const footPoint = {
            x:
                pos.x,

            y:
                pos.y -
                PLAYER_HALF_H -
                PLAYER_RADIUS,

            z:
                pos.z
        };

        // velocityAtPoint also includes motion caused by a rotating platform.
        const velocity =
            playerGroundBody.velocityAtPoint?.(
                footPoint
            ) ||
            playerGroundBody.linvel?.();

        if (velocity) {
            return {
                x:
                    Number(
                        velocity.x
                    ) || 0,

                y:
                    Number(
                        velocity.y
                    ) || 0,

                z:
                    Number(
                        velocity.z
                    ) || 0
            };
        }
    } catch {}

    return {
        x: 0,
        y: 0,
        z: 0
    };
}

// ─── Classic Roblox-style step-up helper ─────────────────────────────────────
// The player may automatically climb vertical ledges up to exactly 1 stud.
// This leaves the existing Rapier capsule intact; we simply probe the surface
// immediately ahead of the player and raise the capsule when the next floor is
// within the allowed step height.

const PLAYER_MAX_STEP_HEIGHT = 1.7;

// Editable: how fast the player eases upward onto a stair, in studs/second.
const PLAYER_STEP_UP_SPEED = 12.0;

const PLAYER_STEP_PROBE_FORWARD = PLAYER_RADIUS + 0.35;
const PLAYER_STEP_EPSILON = 0.02;

// Stores how much vertical rise is still left to smoothly climb.
let playerStepRemaining = 0;

function detectPlayerStep(moveDir) {
    if (
        !playerState.grounded ||
        !moveDir ||
        moveDir.lengthSq() <= 0
    ) {
        return 0;
    }

    const pos = playerBody.translation();

    const feetY =
        pos.y -
        PLAYER_HALF_H -
        PLAYER_RADIUS;

    const probeX =
        pos.x +
        moveDir.x * PLAYER_STEP_PROBE_FORWARD;

    const probeZ =
        pos.z +
        moveDir.z * PLAYER_STEP_PROBE_FORWARD;

    // Probe from just above the maximum allowed step.
    const rayOriginY =
        feetY +
        PLAYER_MAX_STEP_HEIGHT +
        0.10;

    const ray = new RAPIER.Ray(
        {
            x: probeX,
            y: rayOriginY,
            z: probeZ
        },
        {
            x: 0,
            y: -1,
            z: 0
        }
    );

    const hit = world.castRay(
        ray,
        PLAYER_MAX_STEP_HEIGHT + 0.20,
        true,

        // Ignore CanCollide=false sensor Parts. Without this, the stair helper
        // sees them as a ledge and manually lifts the player while walking,
        // which makes a non-collidable Part feel solid only during movement.
        RAPIER.QueryFilterFlags.EXCLUDE_SENSORS,

        undefined,
        undefined,
        playerBody,

        // Hard fallback: the stair helper may only see physically solid
        // colliders. Touched sensors are deliberately invisible to this query.
        collider =>
            !collider.isSensor()
    );

    if (
        !hit ||
        hit.collider?.isSensor?.()
    ) {
        return 0;
    }

    const hitY =
        rayOriginY -
        hit.toi;

    const stepHeight =
        hitY -
        feetY;

    if (
        stepHeight <= 0.05 ||
        stepHeight > PLAYER_MAX_STEP_HEIGHT + 0.001
    ) {
        return 0;
    }

    return stepHeight;
}

function updatePlayerStep(moveDir, delta) {
    const detectedStep =
        detectPlayerStep(moveDir);

    if (detectedStep > 0) {
        // Don't accumulate multiple stair detections into a wall climb.
        playerStepRemaining =
            Math.max(
                playerStepRemaining,
                Math.min(
                    detectedStep + PLAYER_STEP_EPSILON,
                    PLAYER_MAX_STEP_HEIGHT + PLAYER_STEP_EPSILON
                )
            );
    }

    // IMPORTANT:
    // Once a SOLID step has been detected, finish the committed lift even if
    // the probe no longer sees that exact top surface on the following frame.
    //
    // The old code cleared playerStepRemaining immediately whenever a later
    // probe missed, which reduced a normal stair climb to a single tiny nudge.
    // CanCollide=false Parts still cannot START a step because detectPlayerStep()
    // explicitly excludes Rapier sensors.
    if (playerStepRemaining <= 0)
        return false;

    const amount =
        Math.min(
            playerStepRemaining,
            PLAYER_STEP_UP_SPEED * delta
        );

    if (amount <= 0)
        return false;

    const pos = playerBody.translation();

    // Smooth micro-lift over several frames instead of a one-frame teleport.
    // This acts like walking up a tiny invisible ramp while keeping your
    // existing dynamic Rapier capsule.
    playerBody.setTranslation(
        {
            x: pos.x,
            y: pos.y + amount,
            z: pos.z
        },
        true
    );

    playerStepRemaining -= amount;

    if (playerStepRemaining < 0.001) {
        playerStepRemaining = 0;
    }

    return true;
}


// ─── Classic stacked-part climbing ───────────────────────────────────────────
//
// Blox currently has no TrussPart, so classic ladder-like structures are
// recognized from multiple separated solid horizontal Parts in front of the
// player. A continuous wall forms one hit band and is not climbable.
// Climbing uses the SAME effective speed as normal walking. Keep this as a
// scale instead of a second hard-coded velocity so changing Humanoid.WalkSpeed
// automatically changes climbing speed too.
const PLAYER_CLIMB_SPEED_SCALE = 1.0;
const PLAYER_CLIMB_PROBE_DISTANCE = PLAYER_RADIUS + 0.80;
const PLAYER_CLIMB_SAMPLE_STEP = 0.30;
const PLAYER_CLIMB_SAMPLE_HEIGHT = 4.80;
const PLAYER_CLIMB_GRACE_SECONDS = 0.16;
const PLAYER_CLIMB_HORIZONTAL_SCALE = 0.20;

let playerClimbGraceRemaining = 0;

function rayHitsSolidClimbSurface(
    origin,
    direction
) {
    const ray =
        new RAPIER.Ray(
            origin,
            direction
        );

    const hit =
        world.castRay(
            ray,
            PLAYER_CLIMB_PROBE_DISTANCE,
            true,

            // CanCollide=false sensors still participate in Touched, but must
            // never behave as invisible ladder rungs.
            RAPIER.QueryFilterFlags.EXCLUDE_SENSORS,

            undefined,
            undefined,
            playerBody,

            collider =>
                !collider.isSensor()
        );

    if (
        !hit ||
        hit.collider?.isSensor?.()
    ) {
        return null;
    }

    return hit;
}

function detectPlayerClimb(
    moveDir
) {
    if (
        !moveDir ||
        moveDir.lengthSq() <=
            1e-8 ||
        !playerBody ||
        playerColliderDisabled ||
        characterJointsBroken
    ) {
        return {
            climbable: false,
            bands: 0,
            hitSamples: 0
        };
    }

    const direction =
        moveDir.clone();

    direction.y = 0;

    if (
        direction.lengthSq() <=
        1e-8
    ) {
        return {
            climbable: false,
            bands: 0,
            hitSamples: 0
        };
    }

    direction.normalize();

    const pos =
        playerBody.translation();

    const feetY =
        pos.y -
        PLAYER_HALF_H -
        PLAYER_RADIUS;

    let bands = 0;
    let hitSamples = 0;
    let previousHit = false;

    // Track the average horizontal ray distance for each separated vertical
    // hit band. Ladder-like stacked Parts have nearly the same front plane.
    // Normal stairs do not: each higher tread is horizontally offset.
    const bandDistances = [];
    let currentBandDistanceTotal = 0;
    let currentBandSamples = 0;

    const finishBand =
        () => {
            if (
                currentBandSamples <= 0
            ) {
                return;
            }

            bandDistances.push(
                currentBandDistanceTotal /
                currentBandSamples
            );

            currentBandDistanceTotal = 0;
            currentBandSamples = 0;
        };

    const sampleCount =
        Math.floor(
            PLAYER_CLIMB_SAMPLE_HEIGHT /
            PLAYER_CLIMB_SAMPLE_STEP
        ) +
        1;

    for (
        let i = 0;
        i < sampleCount;
        i++
    ) {
        const sampleY =
            feetY +
            0.15 +
            i *
                PLAYER_CLIMB_SAMPLE_STEP;

        const hit =
            rayHitsSolidClimbSurface(
                {
                    x: pos.x,
                    y: sampleY,
                    z: pos.z
                },
                {
                    x: direction.x,
                    y: 0,
                    z: direction.z
                }
            );

        const solid =
            Boolean(
                hit
            );

        if (solid) {
            hitSamples++;

            if (!previousHit) {
                bands++;
            }

            currentBandDistanceTotal +=
                Math.max(
                    0,
                    Number(
                        hit.toi
                    ) || 0
                );

            currentBandSamples++;
        } else if (previousHit) {
            finishBand();
        }

        previousHit =
            solid;
    }

    if (previousHit) {
        finishBand();
    }

    const PLAYER_CLIMB_FACE_ALIGNMENT_TOLERANCE =
        0.45;

    let alignedPairFound =
        false;

    for (
        let i = 0;
        i < bandDistances.length &&
        !alignedPairFound;
        i++
    ) {
        for (
            let j = i + 1;
            j < bandDistances.length;
            j++
        ) {
            if (
                Math.abs(
                    bandDistances[i] -
                    bandDistances[j]
                ) <=
                PLAYER_CLIMB_FACE_ALIGNMENT_TOLERANCE
            ) {
                alignedPairFound =
                    true;

                break;
            }
        }
    }

    const startClimb =
        bands >= 2 &&
        alignedPairFound;

    // Once already climbing, allow a single remaining band briefly so the
    // capsule can clear the top rung. Starting a climb still requires two
    // aligned bands, which keeps ordinary stairs on updatePlayerStep().
    const continueClimb =
        playerState.climbing &&
        (
            startClimb ||
            (
                bands >= 1 &&
                hitSamples >= 2
            )
        );

    return {
        climbable:
            startClimb ||
            continueClimb,

        bands,
        hitSamples,
        bandDistances
    };
}

function updatePlayerClimbing(
    moveDir,
    delta
) {
    if (
        !moveDir ||
        moveDir.lengthSq() <=
            1e-8
    ) {
        playerClimbGraceRemaining = 0;
        playerState.climbing = false;
        return false;
    }

    const result =
        detectPlayerClimb(
            moveDir
        );

    if (result.climbable) {
        playerClimbGraceRemaining =
            PLAYER_CLIMB_GRACE_SECONDS;

        playerState.climbing = true;
        return true;
    }

    // Brief grace lets the capsule move past the last rung instead of dropping
    // the exact frame the final horizontal band leaves the probe.
    if (
        playerState.climbing &&
        playerClimbGraceRemaining > 0
    ) {
        playerClimbGraceRemaining =
            Math.max(
                0,
                playerClimbGraceRemaining -
                delta
            );

        return true;
    }

    playerClimbGraceRemaining = 0;
    playerState.climbing = false;
    return false;
}

// ─── Void / respawn system ───────────────────────────────────────────────────

const VOID_Y = -500;

// Fallback player spawn position when no enabled SpawnLocation exists.
const PLAYER_SPAWN = {
    x: 0,
    y: 4,
    z: 0
};

// User-requested offset: the player's physics centre is placed 5 studs above
// the SpawnLocation's Position.
const SPAWN_LOCATION_Y_OFFSET = 5;

function isInstanceInsideWorkspace(instance) {
    if (
        !instance ||
        instance.__destroyed
    ) {
        return false;
    }

    let parent =
        instance.Parent;

    while (parent) {
        if (parent === workspaceApi)
            return true;

        parent =
            parent.Parent;
    }

    return false;
}

function getEnabledSpawnLocations() {
    const enabled =
        [];

    for (
        const instance of
        luaInstances
    ) {
        if (
            !instance ||
            instance.__destroyed ||
            instance.ClassName !==
                "SpawnLocation" ||
            instance.Enabled !==
                true ||
            !isInstanceInsideWorkspace(
                instance
            )
        ) {
            continue;
        }

        enabled.push(
            instance
        );
    }

    return enabled;
}

function choosePlayerSpawnPosition() {
    ensureLocalPlayerAutoTeam();
    syncLocalPlayerTeamState();

    const allSpawns =
        getEnabledSpawnLocations();

    if (
        allSpawns.length ===
        0
    ) {
        return {
            x: PLAYER_SPAWN.x,
            y: PLAYER_SPAWN.y,
            z: PLAYER_SPAWN.z,
            spawnLocation: null
        };
    }

    const explicitRespawn =
        localPlayerApi.RespawnLocation;

    if (
        explicitRespawn &&
        !explicitRespawn.__destroyed &&
        explicitRespawn.ClassName ===
            "SpawnLocation" &&
        explicitRespawn.Enabled ===
            true &&
        allSpawns.includes(
            explicitRespawn
        )
    ) {
        return {
            x:
                Number(
                    explicitRespawn.Position?.X
                ) || 0,

            y:
                (
                    Number(
                        explicitRespawn.Position?.Y
                    ) || 0
                ) +
                SPAWN_LOCATION_Y_OFFSET,

            z:
                Number(
                    explicitRespawn.Position?.Z
                ) || 0,

            spawnLocation:
                explicitRespawn
        };
    }

    let spawns =
        [];

    if (
        localPlayerApi.Neutral ===
        false
    ) {
        // Team players prefer non-neutral pads matching TeamColor.
        spawns =
            allSpawns.filter(spawn =>
                spawn.Neutral !==
                    true &&
                sameBrickColor(
                    spawn.TeamColor,
                    localPlayerApi.TeamColor
                )
            );

        // If the team has no pad, fall back to a neutral pad.
        if (
            spawns.length ===
            0
        ) {
            spawns =
                allSpawns.filter(spawn =>
                    spawn.Neutral ===
                        true
                );
        }
    } else {
        spawns =
            allSpawns.filter(spawn =>
                spawn.Neutral ===
                    true
            );
    }

    // Preserve the old emulator's forgiving behavior if a place has no matching
    // team/neutral pad at all.
    if (
        spawns.length ===
        0
    ) {
        spawns =
            allSpawns;
    }

    const chosen =
        spawns[
            Math.floor(
                Math.random() *
                spawns.length
            )
        ];

    return {
        x:
            Number(
                chosen.Position?.X
            ) || 0,

        y:
            (
                Number(
                    chosen.Position?.Y
                ) || 0
            ) +
            SPAWN_LOCATION_Y_OFFSET,

        z:
            Number(
                chosen.Position?.Z
            ) || 0,

        spawnLocation:
            chosen
    };
}

function movePlayerToChosenSpawn(
    playSound = false
) {
    if (
        !playerBody ||
        !playerRoot
    ) {
        return null;
    }

    const spawnPosition =
        choosePlayerSpawnPosition();

    lastPlayerSpawnLocation =
        spawnPosition.spawnLocation ||
        null;

    playerBody.setTranslation(
        {
            x: spawnPosition.x,
            y: spawnPosition.y,
            z: spawnPosition.z
        },
        true
    );

    playerBody.setLinvel(
        { x: 0, y: 0, z: 0 },
        true
    );

    playerBody.setAngvel(
        { x: 0, y: 0, z: 0 },
        true
    );

    playerStepRemaining =
        0;

    playerState.climbing =
        false;

    playerClimbGraceRemaining =
        0;

    playerRoot.position.set(
        spawnPosition.x,
        spawnPosition.y -
            PLAYER_HALF_H -
            PLAYER_RADIUS,
        spawnPosition.z
    );

    if (playSound)
        playSpawnSound();

    // Initial map load moves an already-created Character after place scripts
    // create SpawnLocations; restart protection using that chosen pad's Duration.
    if (
        currentCharacterModel &&
        !currentCharacterModel.__destroyed
    ) {
        createSpawnForceFieldForCurrentCharacter(
            lastPlayerSpawnLocation
        );
    }

    return spawnPosition;
}

function respawnPlayer() {

    if (
        characterJointsBroken ||
        currentPlayerHumanoid?.__dead
    ) {
        rebuildLocalPlayerCharacter(
            true
        );
        return;
    }

    // Pick a random enabled SpawnLocation, or use (0,4,0) if there are none.
    movePlayerToChosenSpawn(
        true
    );
    console.log("[Void] Player respawned.");
}
function destroyPhysicsPart(part) {

    if (!part)
        return;

    const index = physObjects.indexOf(part);

    if (index !== -1) {
        physObjects.splice(index, 1);
    }

    if (part.mesh?.parent) {
        part.mesh.parent.remove(part.mesh);
    }

    if (part.body) {
        unregisterRapierColliderOwner(
            part.collider
        );

        world.removeRigidBody(part.body);
        part.body = null;
        part.collider = null;
    }

    console.log("[Void] Destroyed falling object.");
}
function updateVoid() {

    // ─────────────────────────────
    // Player
    // ─────────────────────────────

    const playerPos = playerBody.translation();

    if (playerPos.y < VOID_Y) {
        respawnPlayer();
    }

    // Create a set of all physics parts owned by Lua instances.
    // This lets us avoid destroying them in the generic physObjects loop.
    const luaPhysicsParts = new Set();

    for (const instance of luaInstances) {
        if (instance.__internal) {
            luaPhysicsParts.add(instance.__internal);
        }
    }

    // ─────────────────────────────
    // Regular non-Lua physics parts
    // ─────────────────────────────

    for (let i = physObjects.length - 1; i >= 0; i--) {

        const part = physObjects[i];

        if (!part)
            continue;

        // Never treat player as normal part
        if (part.body === playerBody)
            continue;

        // IMPORTANT:
        // Lua-created parts are handled separately below.
        if (luaPhysicsParts.has(part))
            continue;

        const pos = part.body.translation();

        if (pos.y < VOID_Y) {
            destroyPhysicsPart(part);
        }
    }

    // ─────────────────────────────
    // Lua-created parts
    // ─────────────────────────────

    for (const instance of [...luaInstances]) {

        const part = instance.__internal;

        if (!part || !part.body)
            continue;

        // Anchored objects do not get voided.
        if (instance.Anchored)
            continue;

        const pos = part.body.translation();

        if (pos.y < VOID_Y) {

            // Remove from physics sync list
            const index = physObjects.indexOf(part);

            if (index !== -1) {
                physObjects.splice(index, 1);
            }

            // Remove visual mesh
            if (part.mesh?.parent) {
                part.mesh.parent.remove(part.mesh);
            }

            // Remove Rapier rigid body + its collider-owner mapping.
            unregisterRapierColliderOwner(
                part.collider
            );

            world.removeRigidBody(part.body);

            // Remove Lua/Roblox instance
            luaInstances.delete(instance);

            // Mark internal physics as gone so nothing can use it later.
            part.body = null;
            part.collider = null;

            console.log(
                `[Void] Destroyed ${instance.Name || "Part"}`
            );
        }
    }
}

function updatePlayer(delta) {
    if (!player) return;

    // Phase 2 Humanoid owns high-level movement state.
    const humanoid =
        currentPlayerHumanoid;

    if (
        humanoid?.__dead &&
        characterJointsBroken
    ) {
        playerState.climbing =
            false;

        playerClimbGraceRemaining =
            0;

        if (!walkSound.paused)
            walkSound.pause();

        return;
    }

    playerState.grounded =
        checkGrounded();

    const humanoidJumpRequested =
        Boolean(
            humanoid &&
            humanoid.Jump
        );

    const jumpRequested =
        Boolean(
            keys.space ||
            humanoidJumpRequested
        );

    let jumpedOutOfSit =
        false;

    // Jump is the universal way out of Humanoid.Sit, whether Sit came from an
    // actual Seat or was set manually by a script.
    if (
        humanoid &&
        humanoid.Sit &&
        !humanoid.__dead &&
        jumpRequested
    ) {
        unseatPlayer(
            false
        );

        humanoid.Sit =
            false;

        jumpedOutOfSit =
            true;
    }

    // Scripted Humanoid.Sit=false also breaks the SeatWeld immediately.
    if (
        currentSeat &&
        (
            !humanoid ||
            !humanoid.Sit ||
            humanoid.__dead
        )
    ) {
        unseatPlayer(
            false
        );
    }

    const sittingOnSeat =
        Boolean(
            currentSeat &&
            humanoid?.Sit
        );

    if (sittingOnSeat) {
        updateSeatedPlayerTransform();
    }

    const movementDisabled =
        Boolean(
            physicsRagdoll.active ||
            physicsRagdoll.recovering ||
            (
                humanoid &&
                (
                    humanoid.__dead ||
                    humanoid.PlatformStand ||
                    humanoid.Sit
                )
            )
        );

    const forward = new THREE.Vector3(-Math.sin(CAM.yaw), 0, Math.cos(CAM.yaw));
    const right   = new THREE.Vector3(Math.cos(CAM.yaw), 0, Math.sin(CAM.yaw));

    const dir = new THREE.Vector3();

    if (!movementDisabled) {
        const keyboardMoving =
            keys.w ||
            keys.a ||
            keys.s ||
            keys.d;

        if (keys.w) dir.sub(forward);
        if (keys.s) dir.add(forward);
        if (keys.d) dir.add(right);
        if (keys.a) dir.sub(right);

        if (
            keyboardMoving &&
            classicClickMove.active
        ) {
            hideClassicDestinationMarker();
        }

        if (
            dir.lengthSq() <= 0 &&
            classicClickMove.active
        ) {
            const bodyPosition =
                playerBody.translation();

            const dx =
                classicClickMove.destination.x -
                bodyPosition.x;

            const dz =
                classicClickMove.destination.z -
                bodyPosition.z;

            const horizontalDistance =
                Math.hypot(
                    dx,
                    dz
                );

            if (
                horizontalDistance <=
                CLASSIC_CLICK_MOVE_STOP_DISTANCE
            ) {
                hideClassicDestinationMarker();
            } else {
                dir.set(
                    dx / horizontalDistance,
                    0,
                    dz / horizontalDistance
                );
            }
        }

        if (
            dir.lengthSq() <= 0 &&
            humanoid?.MoveDirection
        ) {
            dir.set(
                Number(humanoid.MoveDirection.X)||0,
                0,
                Number(humanoid.MoveDirection.Z)||0
            );
        }
    } else if (
        classicClickMove.active
    ) {
        hideClassicDestinationMarker();
    }

    if (
        movementDisabled
    ) {
        playerState.climbing =
            false;

        playerClimbGraceRemaining =
            0;
    }

    const curVel =
        playerBody.linvel();

    const groundVelocity =
        getPlayerGroundVelocity();

    // Standing still on an unanchored/moving Part should carry the character
    // with that Part instead of forcing world-space X/Z velocity back to zero.
    let vx =
        playerState.grounded
            ? groundVelocity.x
            : 0;

    let vz =
        playerState.grounded
            ? groundVelocity.z
            : 0;

    let steppingUp = false;
    let climbing = false;

    if (dir.lengthSq() > 0) {
        dir.normalize();

        // Climbing only activates for vertically separated surfaces whose
        // front faces line up like ladder rungs. Ordinary offset stairs now fall
        // through to the original stair helper below.
        climbing =
            updatePlayerClimbing(
                dir,
                delta
            );

        if (!climbing) {
            steppingUp =
                updatePlayerStep(
                    dir,
                    delta
                );
        } else {
            playerStepRemaining =
                0;
        }

        const horizontalScale =
            climbing
                ? PLAYER_CLIMB_HORIZONTAL_SCALE
                : 1;

        vx =
            (
                playerState.grounded
                    ? groundVelocity.x
                    : 0
            ) +
            dir.x *
            playerState.moveSpeed *
            horizontalScale;

        vz =
            (
                playerState.grounded
                    ? groundVelocity.z
                    : 0
            ) +
            dir.z *
            playerState.moveSpeed *
            horizontalScale;

        // Face movement direction using the shortest rotation path.
        const targetRot = Math.atan2(dir.x, dir.z);

        let angleDifference = targetRot - player.rotation.y;

        angleDifference = Math.atan2(
            Math.sin(angleDifference),
            Math.cos(angleDifference)
        );

        player.rotation.y += angleDifference * 0.18;
    }

    // First-person body lock is suspended while seated so the Seat owns facing.
    if (
        CAM.firstPerson &&
        !characterJointsBroken &&
        !physicsRagdoll.active &&
        !physicsRagdoll.recovering &&
        !humanoid?.Sit
    ) {
        const firstPersonBodyYaw =
            Math.PI -
            CAM.yaw;

        player.rotation.y =
            Math.atan2(
                Math.sin(firstPersonBodyYaw),
                Math.cos(firstPersonBodyYaw)
            );
    }

    const isWalking =
        dir.lengthSq() > 0 &&
        playerState.grounded &&
        !physicsRagdoll.active &&
        !physicsRagdoll.recovering &&
        !humanoid?.Sit;

    if (isWalking) {
        if (walkSound.paused)
            walkSound.play().catch(() => {});
    } else if (!walkSound.paused) {
        walkSound.pause();
    }

    if (
        dir.lengthSq() === 0
    ) {
        if (
            playerState.climbing
        ) {
            updatePlayerClimbing(
                null,
                delta
            );

            climbing =
                false;
        }

        if (
            playerStepRemaining > 0 &&
            !humanoid?.Sit
        ) {
            steppingUp =
                updatePlayerStep(
                    null,
                    delta
                );
        }
    }

    const verticalVelocity =
        sittingOnSeat
            ? 0
            : (
                climbing
                    ? (
                        playerState.moveSpeed *
                        PLAYER_CLIMB_SPEED_SCALE
                    )
                    : (
                        steppingUp
                            ? Math.max(curVel.y, 0)
                            : curVel.y
                    )
            );

    const ragdollPhysicsOwned =
        physicsRagdoll.active ||
        physicsRagdoll.recovering;

    // During the temporary ragdoll Rapier owns the complete rigid body.
    // Do not overwrite its linear velocity with the normal character controller.
    if (!ragdollPhysicsOwned) {
        playerBody.setLinvel(
            {
                x: vx,
                y: verticalVelocity,
                z: vz
            },
            true
        );
    }

    if (
        !ragdollPhysicsOwned &&
        !movementDisabled &&
        jumpRequested &&
        (
            playerState.grounded ||
            playerState.climbing ||
            jumpedOutOfSit
        )
    ) {
        playerState.climbing =
            false;

        playerClimbGraceRemaining =
            0;

        playerBody.setLinvel(
            {
                x: vx,

                // Jump relative to an upward-moving support instead of losing
                // the platform's existing upward momentum.
                y:
                    playerState.jumpPower +
                    Math.max(
                        0,
                        groundVelocity.y
                    ),

                z: vz
            },
            true
        );

        playerState.grounded =
            false;

        playJumpSound();

        keys.space =
            false;

        if (humanoid)
            humanoid.Jump = false;
    }

    // Sync the visible R6 root from the Rapier capsule.
    //
    // Rapier now runs at a fixed 60 Hz, while rendering may run at 120/144 Hz.
    // If we display the raw body translation on every render frame, the player
    // visually holds the same pose between physics ticks and then jumps forward
    // on the next tick. That looks like a one-frame "ghost"/jitter trail.
    //
    // Smooth ONLY the local player by extrapolating its VISUAL transform through
    // the leftover fixed-step accumulator. Physics, collision, Touched, stairs,
    // climbing, and every other rigid body remain on their existing transforms.
    const t =
        playerBody.translation();

    if (
        !physicsRagdoll.active &&
        !physicsRagdoll.recovering
    ) {
        const renderVelocity =
            playerBody.linvel();

        const renderLead =
            THREE.MathUtils.clamp(
                physicsAccumulator,
                0,
                PHYSICS_FIXED_TIMESTEP
            );

        const renderX =
            t.x +
            renderVelocity.x *
                renderLead;

        const renderZ =
            t.z +
            renderVelocity.z *
                renderLead;

        // Ground contacts are most stable when Y comes directly from Rapier.
        // Only extrapolate vertical motion while genuinely airborne/climbing,
        // so walking across floors/stairs cannot acquire a visual bob/jitter.
        const extrapolateY =
            !playerState.grounded &&
            !sittingOnSeat &&
            !steppingUp;

        const renderY =
            t.y +
            (
                extrapolateY
                    ? renderVelocity.y *
                        renderLead
                    : 0
            );

        // Normal mode: root represents the standing foot/floor point.
        // A Seat already positioned playerRoot along its own local +Y axis;
        // using world-Y here would break tilted and upside-down seating.
        if (
            !sittingOnSeat
        ) {
            playerRoot.position.set(
                renderX,
                renderY -
                    PLAYER_HALF_H -
                    PLAYER_RADIUS,
                renderZ
            );
        }
    }

    // During instability ragdoll the full Rapier rigid-body transform owns the
    // visible R6. Animation code below still runs on the limb pivots.
    updatePhysicsRagdollVisual(delta);

// --- 2008-style procedural character animation ---
if (limbs.leftArm && limbs.rightArm && limbs.leftLeg && limbs.rightLeg) {

    // In-engine limb pivots have clean zero rotations.
    // Unlike the old FBX bones, no bind-pose correction angles are needed.
    const baseLA = 0;
    const baseRA = 0;
    const baseLL = 0;
    const baseRL = 0;

    // Old Roblox-style animation timing:
    // targets update at a lower "animation tick" rate, while the motors keep
    // moving smoothly toward those targets every render frame.
    if (typeof window.rbx08Anim === "undefined") {
        window.rbx08Anim = {
            accumulator: 0,
            tickRate: 1 / 20, // stepped target updates (~20 Hz)

            // Continuous phase: never reset when changing states.
            walkPhase: 0,
            idlePhase: 0,

            // State blends overlap instead of snapping.
            walkBlend: 0,
            idleBlend: 1,
            jumpBlend: 0,

            // Motor-like targets.
            target: {
                leftArm:  baseLA,
                rightArm: baseRA,
                leftLeg:  baseLL,
                rightLeg: baseRL
            },

            // Motor angular velocities.
            velocity: {
                leftArm: 0,
                rightArm: 0,
                leftLeg: 0,
                rightLeg: 0
            },

            // Extra physical-looking arm inertia.
            armInertiaAngle: 0,
            armInertiaVelocity: 0,
            wasStepping: false,
            lastHorizontalSpeed: 0
        };
    }

    const anim = window.rbx08Anim;

    // Delta from the render loop is already clamped.
    // Use it so animation speed stays consistent at different FPS.
    const animDelta = Math.min(delta, 0.05);

    // ─── EASY ANIMATION TUNING ────────────────────────────────────────────────
    // Walk cycle speed. Higher = faster arm/leg swing.
    const WALK_ANIM_SPEED = 10.75;

    // Idle sway speed. Higher = faster idle motion.
    const IDLE_ANIM_SPEED = 0.5;

    // How often animation targets update.
    // Lower value = smoother/more modern.
    // Higher value = more visibly "stepped"/old Roblox.
    anim.tickRate = 1 / 20;

    // State transition smoothness.
    // Higher = faster/snappier transitions.
    // Lower = slower/smoother blending.
    const WALK_BLEND_SPEED = 12.0;
    const IDLE_BLEND_SPEED = 9.0;
    const JUMP_BLEND_SPEED = 40.0;

    // Keep phases running continuously.
    anim.walkPhase += animDelta * WALK_ANIM_SPEED;
    anim.idlePhase += animDelta * IDLE_ANIM_SPEED;

    // Smooth state weights. These are intentionally slower than modern
    // animation blending so landing -> walking has the classic "arms fall
    // back into the walk" look.
    const sittingPose =
        Boolean(
            humanoid &&
            humanoid.Sit &&
            !humanoid.__dead
        );

    const climbingPose =
        Boolean(
            playerState.climbing &&
            !sittingPose
        );

    // Climbing mixes the existing walking cycle with part of the jump pose.
    const walkTarget =
        sittingPose
            ? 0
            : (
                climbingPose
                    ? 0.80
                    : (
                        (isWalking && playerState.grounded)
                            ? 1
                            : 0
                    )
