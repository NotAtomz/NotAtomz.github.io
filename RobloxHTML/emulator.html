// ─── Phase 2: CFrame math ────────────────────────────────────────────────────

function quaternionFromCFrameValue(cf) {
    if (
        cf &&
        Number.isFinite(Number(cf._qx)) &&
        Number.isFinite(Number(cf._qy)) &&
        Number.isFinite(Number(cf._qz)) &&
        Number.isFinite(Number(cf._qw))
    ) {
        return new THREE.Quaternion(
            Number(cf._qx),
            Number(cf._qy),
            Number(cf._qz),
            Number(cf._qw)
        ).normalize();
    }

    return new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
            Number(cf?._rx) || 0,
            Number(cf?._ry) || 0,
            Number(cf?._rz) || 0,
            "XYZ"
        )
    );
}

function makeCFrameFromQuaternion(
    x = 0,
    y = 0,
    z = 0,
    quaternion = new THREE.Quaternion()
) {
    const q =
        quaternion.clone().normalize();

    const euler =
        new THREE.Euler()
            .setFromQuaternion(
                q,
                "XYZ"
            );

    const position =
        createVector3(
            Number(x) || 0,
            Number(y) || 0,
            Number(z) || 0
        );

    const right =
        new THREE.Vector3(1, 0, 0)
            .applyQuaternion(q);

    const up =
        new THREE.Vector3(0, 1, 0)
            .applyQuaternion(q);

    // Roblox's LookVector points along local -Z.
    const look =
        new THREE.Vector3(0, 0, -1)
            .applyQuaternion(q);

    let cf = null;

    const multiplyImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    (
                        "X" in arg &&
                        "Y" in arg &&
                        "Z" in arg
                    )
                )
            );

        if (!other)
            return cf;

        // CFrame * Vector3 style through :Multiply/:mul.
        if (
            !("_qx" in other) &&
            !("_rx" in other)
        ) {
            const p =
                new THREE.Vector3(
                    Number(other.X) || 0,
                    Number(other.Y) || 0,
                    Number(other.Z) || 0
                )
                    .applyQuaternion(q)
                    .add(
                        new THREE.Vector3(
                            position.X,
                            position.Y,
                            position.Z
                        )
                    );

            return createVector3(
                p.x,
                p.y,
                p.z
            );
        }

        const bq =
            quaternionFromCFrameValue(
                other
            );

        const bp =
            new THREE.Vector3(
                Number(other.X) || 0,
                Number(other.Y) || 0,
                Number(other.Z) || 0
            );

        const p =
            bp.applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            q.clone().multiply(bq)
        );
    };

    const inverseImpl = () => {
        const qi =
            q.clone().invert();

        const p =
            new THREE.Vector3(
                -position.X,
                -position.Y,
                -position.Z
            ).applyQuaternion(qi);

        return makeCFrameFromQuaternion(
            p.x,
            p.y,
            p.z,
            qi
        );
    };

    const lerpImpl = (...args) => {
        const other =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                (
                    "_qx" in arg ||
                    "_rx" in arg
                )
            );

        const alphaArg =
            [...args]
                .reverse()
                .find(arg =>
                    typeof arg === "number"
                );

        const alpha =
            THREE.MathUtils.clamp(
                Number(alphaArg) || 0,
                0,
                1
            );

        if (!other)
            return cf;

        const oq =
            quaternionFromCFrameValue(
                other
            );

        const blendedQ =
            q.clone().slerp(
                oq,
                alpha
            );

        return makeCFrameFromQuaternion(
            THREE.MathUtils.lerp(
                position.X,
                Number(other.X) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Y,
                Number(other.Y) || 0,
                alpha
            ),
            THREE.MathUtils.lerp(
                position.Z,
                Number(other.Z) || 0,
                alpha
            ),
            blendedQ
        );
    };

    const pointToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .applyQuaternion(q)
                .add(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const pointToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            )
                .sub(
                    new THREE.Vector3(
                        position.X,
                        position.Y,
                        position.Z
                    )
                )
                .applyQuaternion(
                    q.clone().invert()
                );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToWorldImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(q);

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    const vectorToObjectImpl = (...args) => {
        const v =
            args.find(arg =>
                arg &&
                typeof arg === "object" &&
                "X" in arg &&
                "Y" in arg &&
                "Z" in arg
            );

        if (!v)
            return createVector3();

        const p =
            new THREE.Vector3(
                Number(v.X) || 0,
                Number(v.Y) || 0,
                Number(v.Z) || 0
            ).applyQuaternion(
                q.clone().invert()
            );

        return createVector3(
            p.x,
            p.y,
            p.z
        );
    };

    cf = Mutable({
        X: position.X,
        Y: position.Y,
        Z: position.Z,

        _rx: euler.x,
        _ry: euler.y,
        _rz: euler.z,

        _qx: q.x,
        _qy: q.y,
        _qz: q.z,
        _qw: q.w,

        Position: position,
        p: position,

        Orientation:
            createVector3(
                THREE.MathUtils.radToDeg(
                    euler.x
                ),
                THREE.MathUtils.radToDeg(
                    euler.y
                ),
                THREE.MathUtils.radToDeg(
                    euler.z
                )
            ),

        LookVector:
            createVector3(
                look.x,
                look.y,
                look.z
            ),

        RightVector:
            createVector3(
                right.x,
                right.y,
                right.z
            ),

        UpVector:
            createVector3(
                up.x,
                up.y,
                up.z
            ),

        inverse: inverseImpl,
        Inverse: inverseImpl,

        lerp: lerpImpl,
        Lerp: lerpImpl,

        mul: multiplyImpl,
        Multiply: multiplyImpl,
        ToWorldSpace: multiplyImpl,

        ToObjectSpace(...args) {
            const other =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (!other)
                return cf;

            return inverseImpl()
                .Multiply(other);
        },

        pointToWorldSpace: pointToWorldImpl,
        PointToWorldSpace: pointToWorldImpl,

        pointToObjectSpace: pointToObjectImpl,
        PointToObjectSpace: pointToObjectImpl,

        vectorToWorldSpace: vectorToWorldImpl,
        VectorToWorldSpace: vectorToWorldImpl,

        vectorToObjectSpace: vectorToObjectImpl,
        VectorToObjectSpace: vectorToObjectImpl,

        components() {
            // Position + 3x3 rotation matrix, matching classic CFrame components.
            const m =
                new THREE.Matrix4()
                    .makeRotationFromQuaternion(q);

            const e = m.elements;

            return [
                position.X,
                position.Y,
                position.Z,

                e[0], e[4], e[8],
                e[1], e[5], e[9],
                e[2], e[6], e[10]
            ];
        },

        GetComponents() {
            return this.components();
        }
    });

    return cf;
}

function createCFrame(
    x = 0,
    y = 0,
    z = 0,
    rx = 0,
    ry = 0,
    rz = 0
) {
    const q =
        new THREE.Quaternion()
            .setFromEuler(
                new THREE.Euler(
                    Number(rx) || 0,
                    Number(ry) || 0,
                    Number(rz) || 0,
                    "XYZ"
                )
            );

    return makeCFrameFromQuaternion(
        Number(x) || 0,
        Number(y) || 0,
        Number(z) || 0,
        q
    );
}

function cframeLookAt(
    px,
    py,
    pz,
    tx,
    ty,
    tz
) {
    const position =
        new THREE.Vector3(
            px,
            py,
            pz
        );

    const target =
        new THREE.Vector3(
            tx,
            ty,
            tz
        );

    const direction =
        target.clone()
            .sub(position);

    if (direction.lengthSq() < 1e-12) {
        return makeCFrameFromQuaternion(
            px,
            py,
            pz,
            new THREE.Quaternion()
        );
    }

    direction.normalize();

    // Three cameras/objects look down -Z, matching Roblox LookVector.
    const q =
        new THREE.Quaternion()
            .setFromUnitVectors(
                new THREE.Vector3(
                    0,
                    0,
                    -1
                ),
                direction
            );

    return makeCFrameFromQuaternion(
        px,
        py,
        pz,
        q
    );
}

const CFrameApi = Mutable({
    new(...args) {
        // Ignore a possible API receiver from colon-style invocation.
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        // CFrame.new(Vector3)
        if (
            values.length >= 1 &&
            typeof values[0] === "object" &&
            values[0] !== null &&
            "X" in values[0] &&
            "Y" in values[0] &&
            "Z" in values[0]
        ) {
            const from =
                values[0];

            // Classic CFrame.new(position, lookAtPosition)
            if (
                values.length >= 2 &&
                typeof values[1] === "object" &&
                values[1] !== null &&
                "X" in values[1] &&
                "Y" in values[1] &&
                "Z" in values[1]
            ) {
                return cframeLookAt(
                    Number(from.X) || 0,
                    Number(from.Y) || 0,
                    Number(from.Z) || 0,
                    Number(values[1].X) || 0,
                    Number(values[1].Y) || 0,
                    Number(values[1].Z) || 0
                );
            }

            return createCFrame(
                from.X,
                from.Y,
                from.Z
            );
        }

        return createCFrame(
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    Angles(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        return createCFrame(
            0,
            0,
            0,
            values[0] ?? 0,
            values[1] ?? 0,
            values[2] ?? 0
        );
    },

    fromEulerAnglesXYZ(...args) {
        return CFrameApi.Angles(
            ...args
        );
    },

    fromEulerAnglesYXZ(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const e =
            new THREE.Euler(
                Number(values[0]) || 0,
                Number(values[1]) || 0,
                Number(values[2]) || 0,
                "YXZ"
            );

        const q =
            new THREE.Quaternion()
                .setFromEuler(e);

        return makeCFrameFromQuaternion(
            0,
            0,
            0,
            q
        );
    },

    lookAt(...args) {
        const values =
            args.filter(arg =>
                arg !== CFrameApi
            );

        const from =
            values[0];

        const to =
            values[1];

        if (
            !from ||
            !to
        ) {
            return createCFrame();
        }

        return cframeLookAt(
            Number(from.X) || 0,
            Number(from.Y) || 0,
            Number(from.Z) || 0,
            Number(to.X) || 0,
            Number(to.Y) || 0,
            Number(to.Z) || 0
        );
    }
});

// ─── 2010-era Instance / parenting / joint helpers ───────────────────────────
const luaJoints = new Set();
const luaBodyMovers = new Set();
const luaValueObjects = new Set();
const luaHumanoids = new Set();

// Renderer-owned classic Humanoid nameplates. These are intentionally not
// Lua Instances, so automatic NPC names never pollute Workspace/GetChildren().
const humanoidNameplates = new Map();

const luaSounds = new Set();

// Classic visual/effect runtime objects.
const luaDecals = new Set();
const luaParticleEmitters = new Set();
const luaBillboardGuis = new Set();
const luaImageLabels = new Set();
const luaExplosions = new Set();

// Early-classic gameplay objects.
const luaForceFields = new Set();
const luaClickDetectors = new Set();
const luaSparkles = new Set();
const luaMessages = new Set();

// Renderer-owned transient particles are deliberately NOT Lua Instances or
// Rapier bodies. This keeps particle visuals out of physics/void cleanup.
const activeVisualParticles = new Set();

// Phase 3.6 runtime state is declared early because Instance verification can
// destroy objects before the playable Character is constructed.
let currentSeat = null;
let currentSeatWeld = null;
let playerColliderDisabled = false;
let characterRespawnTimer = null;
const CHARACTER_RESPAWN_DELAY_MS = 5000;

// Tracks dynamic child-name aliases such as model.Head / workspace.Part.
const childAliasState = new WeakMap();

const CLASS_PARENTS = {
    Part: ["BasePart", "PVInstance", "Instance"],
    Seat: ["BasePart", "PVInstance", "Instance"],
    SpawnLocation: ["BasePart", "PVInstance", "Instance"],

    Model: ["PVInstance", "Instance"],
    Folder: ["Instance"],

    Humanoid: ["Instance"],
    HumanoidDescription: ["Instance"],
    BodyColors: ["Instance"],
    Shirt: ["Instance"],
    Pants: ["Instance"],
    ShirtGraphic: ["Instance"],
    Sound: ["Instance"],

    ForceField: ["Instance"],
    ClickDetector: ["Instance"],
    Sparkles: ["Instance"],
    Message: ["Instance"],
    Hint: ["Instance"],
    Team: ["Instance"],

    Decal: ["Instance"],
    ParticleEmitter: ["Instance"],
    BillboardGui: ["LayerCollector", "GuiBase2d", "Instance"],
    ImageLabel: ["GuiObject", "GuiBase2d", "Instance"],
    Explosion: ["Instance"],

    Terrain: ["Instance"],
    SelectionBox: ["Instance"],

    RemoteEvent: ["Instance"],
    RemoteFunction: ["Instance"],
    BindableEvent: ["Instance"],
    BindableFunction: ["Instance"],

    Weld: ["JointInstance", "Instance"],
    ManualWeld: ["JointInstance", "Instance"],
    Snap: ["JointInstance", "Instance"],
    Glue: ["JointInstance", "Instance"],
    Motor: ["JointInstance", "Instance"],
    Rotate: ["JointInstance", "Instance"],

    // Classic BodyMover hierarchy
    BodyVelocity: ["BodyMover", "Instance"],
    BodyPosition: ["BodyMover", "Instance"],
    BodyGyro: ["BodyMover", "Instance"],
    BodyForce: ["BodyMover", "Instance"],
    BodyAngularVelocity: ["BodyMover", "Instance"],
    BodyThrust: ["BodyMover", "Instance"],

    StringValue: ["ValueBase", "Instance"],
    BoolValue: ["ValueBase", "Instance"],
    IntValue: ["ValueBase", "Instance"],
    NumberValue: ["ValueBase", "Instance"],
    ObjectValue: ["ValueBase", "Instance"],
    Vector3Value: ["ValueBase", "Instance"],
    CFrameValue: ["ValueBase", "Instance"],
    Color3Value: ["ValueBase", "Instance"],
    BrickColorValue: ["ValueBase", "Instance"]
};

function getLuaChildren(parent) {
    return Array.from(luaInstances)
        .filter(instance =>
            instance &&
            !instance.__destroyed &&
            instance.Parent === parent
        );
}

function getLuaDescendants(parent) {
    const out = [];

    const visit = current => {
        for (
            const child of
            getLuaChildren(current)
        ) {
            out.push(child);
            visit(child);
        }
    };

    visit(parent);
    return out;
}

function isInWorkspace(instance) {
    let p = instance;

    while (p) {
        if (p === workspaceApi)
            return true;

        p = p.Parent;
    }

    return false;
}

function isA(instance, className) {
    if (!instance)
        return false;

    return (
        instance.ClassName === className ||
        className === "Instance" ||
        (
            CLASS_PARENTS[
                instance.ClassName
            ] || []
        ).includes(className)
    );
}

function getStringArg(args, fallback = "") {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "string")
            return args[i];
    }

    return fallback;
}

function getBooleanArg(args, fallback = false) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (typeof args[i] === "boolean")
            return args[i];
    }

    return fallback;
}

function getNumberArg(args, fallback = null) {
    for (
        let i = args.length - 1;
        i >= 0;
        i--
    ) {
        if (
            typeof args[i] === "number" &&
            Number.isFinite(args[i])
        ) {
            return args[i];
        }
    }

    return fallback;
}

function refreshChildAliases(parent) {
    if (
        !parent ||
        (
            typeof parent !== "object" &&
            typeof parent !== "function"
        )
    ) {
        return;
    }

    let state =
        childAliasState.get(parent);

    if (!state) {
        state = {
            names: new Set()
        };

        childAliasState.set(
            parent,
            state
        );
    }

    const children =
        getLuaChildren(parent);

    const desired =
        new Map();

    for (const child of children) {
        const name =
            String(
                child.Name || ""
            );

        if (
            !name ||
            desired.has(name)
        ) {
            continue;
        }

        desired.set(
            name,
            child
        );
    }

    // Remove only aliases that WE created.
    for (
        const oldName of
        [...state.names]
    ) {
        if (!desired.has(oldName)) {
            try {
                if (
                    parent[oldName] &&
                    parent[oldName].Parent === parent
                ) {
                    parent[oldName] = undefined;
                }
            } catch {}

            state.names.delete(
                oldName
            );
        }
    }

    for (
        const [name, child] of
        desired
    ) {
        // Never overwrite real properties/methods such as Name, Parent,
        // GetChildren, etc.
        const current =
            parent[name];

        if (
            current === undefined ||
            state.names.has(name)
        ) {
            try {
                parent[name] = child;
                state.names.add(name);
            } catch {}
        }
    }
}

function addCommonInstanceApi(instance) {
    addInstanceSignals(instance);

    // Roblox-style property signal. The same signal object is returned every
    // time for the same Instance/property pair.
    instance.GetPropertyChangedSignal =
        (...args) => {
            const propertyName =
                getStringArg(
                    args,
                    ""
                );

            if (!propertyName) {
                throw new Error(
                    "GetPropertyChangedSignal expected a property name"
                );
            }

            return getPropertySignal(
                instance,
                propertyName,
                true
            );
        };

    instance.getPropertyChangedSignal =
        instance.GetPropertyChangedSignal;

    // Script-facing hierarchy queries must not expose raw JavaScript arrays.
    // luau-web reports those as host "table" values, but native ipairs() does
    // not treat them as normal Luau arrays. Keep engine internals on raw arrays
    // and wrap only the public API in a stable 1-based collection.
    instance.GetChildren = (...args) =>
        makeLuaCollection(
            getLuaChildren(instance)
        );

    instance.children =
        instance.GetChildren;

    instance.GetDescendants = (...args) =>
        makeLuaCollection(
            getLuaDescendants(instance)
        );

    instance.FindFirstChild = (...args) => {
        const name =
            getStringArg(
                args,
                ""
            );

        const recursive =
            getBooleanArg(
                args,
                false
            );

        const list =
            recursive
                ? getLuaDescendants(
                    instance
                )
                : getLuaChildren(
                    instance
                );

        return (
            list.find(child =>
                child.Name === name
            ) ||
            null
        );
    };

    instance.findFirstChild =
        instance.FindFirstChild;

    instance.FindFirstChildOfClass =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            return (
                getLuaChildren(instance)
                    .find(child =>
                        child.ClassName ===
                        className
                    ) ||
                null
            );
        };

    instance.FindFirstChildWhichIsA =
        (...args) => {
            const className =
                getStringArg(
                    args,
                    ""
                );

            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const list =
                recursive
                    ? getLuaDescendants(
                        instance
                    )
                    : getLuaChildren(
                        instance
                    );

            return (
                list.find(child =>
                    isA(
                        child,
                        className
                    )
                ) ||
                null
            );
        };

    instance.WaitForChild =
        async (...args) => {
            const name =
                getStringArg(
                    args,
                    ""
                );

            const timeout =
                getNumberArg(
                    args,
                    null
                );

            const existing =
                getLuaChildren(
                    instance
                ).find(child =>
                    child.Name === name
                );

            if (existing)
                return existing;

            const started =
                performance.now();

            while (
                !instance.__destroyed
            ) {
                const found =
                    getLuaChildren(
                        instance
                    ).find(child =>
                        child.Name === name
                    );

                if (found)
                    return found;

                if (
                    timeout !== null &&
                    (
                        performance.now() -
                        started
                    ) / 1000 >= timeout
                ) {
                    return null;
                }

                await sleepSeconds(
                    CLASSIC_WAIT_QUANTUM
                );
            }

            return null;
        };

    instance.IsA = (...args) =>
        isA(
            instance,
            getStringArg(
                args,
                ""
            )
        );

    instance.isA =
        instance.IsA;

    instance.IsDescendantOf =
        (...args) => {
            const ancestor =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                instance.Parent;

            while (p) {
                if (p === ancestor)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.IsAncestorOf =
        (...args) => {
            const descendant =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    arg !== instance
                );

            let p =
                descendant?.Parent;

            while (p) {
                if (p === instance)
                    return true;

                p = p.Parent;
            }

            return false;
        };

    instance.GetFullName =
        (...args) => {
            const names = [];
            let p = instance;

            while (p) {
                if (p === gameApi)
                    break;

                if (p.Name)
                    names.unshift(
                        p.Name
                    );

                p = p.Parent;
            }

            return names.join(".");
        };

    instance.Remove =
        (...args) => {
            if (instance.Destroy)
                instance.Destroy();
        };

    instance.ClearAllChildren =
        (...args) => {
            for (
                const child of
                [...getLuaChildren(instance)]
            ) {
                child.Destroy();
            }
        };

    instance.Clone =
        (...args) =>
            cloneLuaInstance(
                instance
            );

    // Older Roblox scripts commonly used lowercase aliases. Keep the modern
    // spellings above as canonical while accepting the classic forms too.
    instance.getChildren =
        instance.GetChildren;

    instance.getDescendants =
        instance.GetDescendants;

    instance.findFirstChildOfClass =
        instance.FindFirstChildOfClass;

    instance.findFirstChildWhichIsA =
        instance.FindFirstChildWhichIsA;

    instance.waitForChild =
        instance.WaitForChild;

    instance.isDescendantOf =
        instance.IsDescendantOf;

    instance.isAncestorOf =
        instance.IsAncestorOf;

    instance.getFullName =
        instance.GetFullName;

    instance.remove =
        instance.Remove;

    instance.clearAllChildren =
        instance.ClearAllChildren;

    instance.clone =
        instance.Clone;

    if (
        !("__eventLastParent" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastParent",
            {
                value:
                    instance.Parent ??
                    null,
                writable: true,
                enumerable: false
            }
        );
    }

    if (
        !("__eventLastName" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__eventLastName",
            {
                value:
                    instance.Name,
                writable: true,
                enumerable: false
            }
        );
    }

    return instance;
}

function destroyLuaInstance(instance) {
    if (
        !instance ||
        instance.__destroyed
    ) {
        return;
    }

    if (
        instance === currentSeat
    ) {
        unseatPlayer(
            true
        );
    } else if (
        instance === currentSeatWeld
    ) {
        // External SeatWeld deletion is equivalent to getting up. Do not try to
        // destroy the weld recursively because this call is already doing it.
        unseatPlayer(
            true,
            false
        );
    }

    for (
        const child of
        [...getLuaChildren(instance)]
    ) {
        destroyLuaInstance(
            child
        );
    }

    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            joint !== instance &&
            (
                joint.Part0 === instance ||
                joint.Part1 === instance
            )
        ) {
            destroyLuaInstance(
                joint
            );
        }
    }

    const oldParent =
        instance.Parent;

    luaJoints.delete(
        instance
    );

    luaBodyMovers.delete(
        instance
    );

    if (
        selectionBoxes.has(
            instance
        )
    ) {
        const visual =
            instance.__selectionVisual;

        if (visual) {
            scene.remove(
                visual
            );

            visual.traverse?.(
                child => {
                    child.geometry?.dispose?.();
                }
            );

            instance.__selectionMaterial
                ?.dispose?.();
        }

        selectionBoxes.delete(
            instance
        );
    }

    luaValueObjects.delete(
        instance
    );

    luaHumanoids.delete(
        instance
    );

    removeHumanoidNameplate(
        instance
    );

    if (
        luaDecals.has(
            instance
        )
    ) {
        const visual =
            instance.__decalVisual;

        if (
            visual?.parent
        ) {
            visual.parent.remove(
                visual
            );
        }

        visual?.geometry
            ?.dispose?.();

        instance.__decalMaterial
            ?.dispose?.();

        luaDecals.delete(
            instance
        );
    }

    if (
        luaBillboardGuis.has(
            instance
        )
    ) {
        const sprite =
            instance.__billboardSprite;

        if (
            sprite?.parent
        ) {
            sprite.parent.remove(
                sprite
            );
        }

        sprite?.material
            ?.dispose?.();

        luaBillboardGuis.delete(
            instance
        );
    }

    luaImageLabels.delete(
        instance
    );

    luaParticleEmitters.delete(
        instance
    );

    if (
        luaExplosions.has(
            instance
        )
    ) {
        disconnectLuaSignal(
            instance.Hit
        );

        luaExplosions.delete(
            instance
        );
    }

    if (
        luaForceFields.has(
            instance
        )
    ) {
        if (
            instance ===
            activeVisualForceField
        ) {
            activeVisualForceField =
                null;

            clearSpawnSelectionBoxes();
        }

        if (
            instance ===
            activeSpawnForceField
        ) {
            activeSpawnForceField =
                null;
        }

        luaForceFields.delete(
            instance
        );
    }

    if (
        luaClickDetectors.has(
            instance
        )
    ) {
        disconnectLuaSignal(
            instance.MouseClick
        );

        luaClickDetectors.delete(
            instance
        );
    }

    luaSparkles.delete(
        instance
    );

    if (
        luaMessages.has(
            instance
        )
    ) {
        instance.__messageElement
            ?.remove?.();

        luaMessages.delete(
            instance
        );
    }

    if (
        luaSounds.has(
            instance
        )
    ) {
        const audio =
            instance.__audio;

        if (
            instance.PlayOnRemove &&
            audio &&
            audio.src
        ) {
            try {
                audio.currentTime =
                    0;

                // PlayOnRemove is a one-shot effect even if the source Sound
                // itself was looped.
                audio.loop =
                    false;

                instance
                    .__spatialAudio
                    ?.context
                    ?.resume?.()
                    ?.catch?.(
                        () => {}
                    );

                audio.play().catch(
                    () => {}
                );

                audio.addEventListener(
                    "ended",
                    () =>
                        cleanupLuaSoundSpatialAudio(
                            instance
                        ),
                    {
                        once:
                            true
                    }
                );
            } catch {
                cleanupLuaSoundSpatialAudio(
                    instance
                );
            }
        } else {
            audio?.pause?.();

            cleanupLuaSoundSpatialAudio(
                instance
            );
        }

        disconnectLuaSignal(
            instance.Ended
        );

        disconnectLuaSignal(
            instance.Stopped
        );

        disconnectLuaSignal(
            instance.Loaded
        );

        luaSounds.delete(
            instance
        );
    }

    const part =
        instance.__internal;

    if (
        part &&
        !part.isCharacterVisual
    ) {
        const i =
            physObjects.indexOf(
                part
            );

        if (i !== -1)
            physObjects.splice(
                i,
                1
            );

        if (part.mesh?.parent)
            part.mesh.parent.remove(
                part.mesh
            );

        if (part.body) {
            unregisterRapierColliderOwner(
                part.collider
            );

            world.removeRigidBody(
                part.body
            );

            part.body = null;
            part.collider = null;
        }
    }

    instance.Parent = null;
    instance.__destroyed = true;

    if (oldParent) {
        fireLuaSignal(
            oldParent.ChildRemoved,
            instance
        );

        refreshChildAliases(
            oldParent
        );
    }

    fireLuaSignal(
        instance.AncestryChanged,
        instance,
        null
    );

    disconnectInstanceSignals(
        instance
    );

    luaInstances.delete(
        instance
    );
}

function finalizeLuaInstance(
    instance,
    internal = null
) {
    addCommonInstanceApi(
        instance
    );

    instance.Destroy =
        (...args) => {
            destroyLuaInstance(
                instance
            );
        };

    Object.defineProperty(
        instance,
        "__destroyed",
        {
            value: false,
            writable: true,
            enumerable: false
        }
    );

    if (
        !("__internal" in instance)
    ) {
        Object.defineProperty(
            instance,
            "__internal",
            {
                value: internal,
                writable: true,
                enumerable: false
            }
        );
    }

    luaInstances.add(
        instance
    );

    return instance;
}

function createLuaContainer(
    className = "Model"
) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true
            })
        );

    return instance;
}

function getModelParts(model) {
    return getLuaDescendants(model)
        .filter(instance =>
            isA(
                instance,
                "BasePart"
            )
        );
}

function getPartCFrame(instance) {
    if (
        instance?.CFrame
    ) {
        return instance.CFrame;
    }

    return createCFrame(
        Number(
            instance?.Position?.X
        ) || 0,
        Number(
            instance?.Position?.Y
        ) || 0,
        Number(
            instance?.Position?.Z
        ) || 0
    );
}

function moveLuaPartBy(
    part,
    dx,
    dy,
    dz
) {
    if (!part?.Position)
        return;

    part.Position.X =
        (Number(part.Position.X) || 0) +
        dx;

    part.Position.Y =
        (Number(part.Position.Y) || 0) +
        dy;

    part.Position.Z =
        (Number(part.Position.Z) || 0) +
        dz;

    if (part.CFrame) {
        part.CFrame =
            createCFrame(
                part.Position.X,
                part.Position.Y,
                part.Position.Z,
                Number(
                    part.Orientation?.X
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.X
                    ) :
                    0,
                Number(
                    part.Orientation?.Y
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Y
                    ) :
                    0,
                Number(
                    part.Orientation?.Z
                ) ?
                    THREE.MathUtils.degToRad(
                        part.Orientation.Z
                    ) :
                    0
            );
    }
}

function createLuaModel() {
    const model =
        createLuaContainer(
            "Model"
        );

    model.PrimaryPart = null;

    model.MoveTo =
        (...args) => {
            const position =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    "X" in arg &&
                    "Y" in arg &&
                    "Z" in arg
                );

            if (!position)
                return;

            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return;

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            const dx =
                (Number(position.X) || 0) -
                (Number(root.Position?.X) || 0);

            const dy =
                (Number(position.Y) || 0) -
                (Number(root.Position?.Y) || 0);

            const dz =
                (Number(position.Z) || 0) -
                (Number(root.Position?.Z) || 0);

            for (
                const part of parts
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }
        };

    model.GetModelCFrame =
        (...args) => {
            const parts =
                getModelParts(
                    model
                );

            if (!parts.length)
                return createCFrame();

            const root =
                (
                    model.PrimaryPart &&
                    isA(
                        model.PrimaryPart,
                        "BasePart"
                    )
                )
                    ? model.PrimaryPart
                    : parts[0];

            return getPartCFrame(
                root
            );
        };

    model.SetPrimaryPartCFrame =
        (...args) => {
            const target =
                args.find(arg =>
                    arg &&
                    typeof arg === "object" &&
                    (
                        "_qx" in arg ||
                        "_rx" in arg
                    )
                );

            if (
                !target ||
                !model.PrimaryPart ||
                !isA(
                    model.PrimaryPart,
                    "BasePart"
                )
            ) {
                return;
            }

            const old =
                getPartCFrame(
                    model.PrimaryPart
                );

            const dx =
                (Number(target.X) || 0) -
                (Number(old.X) || 0);

            const dy =
                (Number(target.Y) || 0) -
                (Number(old.Y) || 0);

            const dz =
                (Number(target.Z) || 0) -
                (Number(old.Z) || 0);

            for (
                const part of
                getModelParts(model)
            ) {
                moveLuaPartBy(
                    part,
                    dx,
                    dy,
                    dz
                );
            }

            model.PrimaryPart.CFrame =
                target;
        };

    model.MakeJoints =
        (...args) => {
            for (
                const part of
                getModelParts(model)
            ) {
                part.MakeJoints?.();
            }
        };

    model.BreakJoints =
        (...args) => {
            if (
                model ===
                currentCharacterModel
            ) {
                return breakCharacterJoints();
            }

            let broken =
                0;

            for (
                const part of
                getModelParts(model)
            ) {
                broken +=
                    Number(
                        part.BreakJoints?.()
                    ) || 0;
            }

            return broken;
        };

    return model;
}

function coerceValueObjectValue(
    className,
    value
) {
    if (className === "StringValue")
        return String(
            value ?? ""
        );

    if (className === "BoolValue")
        return Boolean(value);

    if (className === "IntValue")
        return Math.trunc(
            Number(value) || 0
        );

    if (className === "NumberValue")
        return Number(value) || 0;

    if (className === "ObjectValue")
        return value ?? null;

    if (
        className ===
        "Vector3Value"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "X" in value &&
            "Y" in value &&
            "Z" in value
        ) {
            return value;
        }

        return createVector3();
    }

    if (
        className ===
        "CFrameValue"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "X" in value &&
            "Y" in value &&
            "Z" in value
        ) {
            return value;
        }

        return createCFrame();
    }

    if (
        className ===
        "Color3Value"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "R" in value &&
            "G" in value &&
            "B" in value
        ) {
            return value;
        }

        return createColor3();
    }

    if (
        className ===
        "BrickColorValue"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            typeof value.Name ===
                "string" &&
            typeof value.Number ===
                "number"
        ) {
            return value;
        }

        return BrickColorApi.new(
            value ??
            "Medium stone grey"
        );
    }

    return value;
}

function cloneClassicValueObjectValue(
    className,
    value
) {
    switch (className) {
        case "Vector3Value":
            return createVector3(
                value?.X,
                value?.Y,
                value?.Z
            );

        case "CFrameValue":
            return makeCFrameFromQuaternion(
                Number(value?.X) || 0,
                Number(value?.Y) || 0,
                Number(value?.Z) || 0,
                quaternionFromCFrameValue(
                    value
                )
            );

        case "Color3Value":
            return createColor3(
                value?.R,
                value?.G,
                value?.B
            );

        case "BrickColorValue":
            return BrickColorApi.new(
                value?.Name ??
                value?.Number ??
                "Medium stone grey"
            );

        default:
            return value;
    }
}

function valueObjectSnapshot(
    className,
    value
) {
    if (
        className ===
        "Vector3Value"
    ) {
        return [
            Number(value?.X) || 0,
            Number(value?.Y) || 0,
            Number(value?.Z) || 0
        ].join("|");
    }

    if (
        className ===
        "CFrameValue"
    ) {
        const q =
            quaternionFromCFrameValue(
                value
            );

        return [
            Number(value?.X) || 0,
            Number(value?.Y) || 0,
            Number(value?.Z) || 0,
            q.x,
            q.y,
            q.z,
            q.w
        ].join("|");
    }

    if (
        className ===
        "Color3Value"
    ) {
        return [
            Number(value?.R) || 0,
            Number(value?.G) || 0,
            Number(value?.B) || 0
        ].join("|");
    }

    if (
        className ===
        "BrickColorValue"
    ) {
        return `${
            value?.Number ??
            ""
        }|${
            value?.Name ??
            ""
        }`;
    }

    return value;
}

function createLuaValue(className) {
    let initial =
        null;

    if (
        className ===
        "StringValue"
    ) {
        initial =
            "";
    } else if (
        className ===
        "BoolValue"
    ) {
        initial =
            false;
    } else if (
        className ===
            "IntValue" ||
        className ===
            "NumberValue"
    ) {
        initial =
            0;
    } else if (
        className ===
        "Vector3Value"
    ) {
        initial =
            createVector3();
    } else if (
        className ===
        "CFrameValue"
    ) {
        initial =
            createCFrame();
    } else if (
        className ===
        "Color3Value"
    ) {
        initial =
            createColor3();
    } else if (
        className ===
        "BrickColorValue"
    ) {
        initial =
            BrickColorApi.new(
                "Medium stone grey"
            );
    }

    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Value:
                    initial
            })
        );

    Object.defineProperty(
        instance,
        "__lastValue",
        {
            value:
                initial,

            writable:
                true,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        instance,
        "__lastValueSnapshot",
        {
            value:
                valueObjectSnapshot(
                    className,
                    initial
                ),

            writable:
                true,

            enumerable:
                false
        }
    );

    luaValueObjects.add(
        instance
    );

    return instance;
}
