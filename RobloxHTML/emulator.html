                humanoid
            ).find(child =>
                child &&
                !child.__destroyed &&
                child.ClassName ===
                    "HumanoidDescription"
            ) ||
            null;

    humanoid.getAppliedDescription =
        humanoid.GetAppliedDescription;

    humanoid.GetState =
        (...args) =>
            humanoid.__humanoidLast.State ||
            "Running";

    humanoid.ChangeState =
        (...args) => {
            const newState =
                getStringArg(
                    args,
                    humanoid.GetState()
                );

            const oldState =
                humanoid.__humanoidLast.State ||
                "Running";

            humanoid.__humanoidLast.State =
                newState;

            if (oldState !== newState) {
                fireLuaSignal(
                    humanoid.StateChanged,
                    oldState,
                    newState
                );
            }
        };

    humanoid.Move =
        (...args) => {
            const direction =
                args.find(v =>
                    v &&
                    typeof v === "object" &&
                    "X" in v &&
                    "Y" in v &&
                    "Z" in v
                );

            if (!direction)
                return;

            humanoid.__moveToActive =
                false;

            humanoid.MoveDirection =
                createVector3(
                    direction.X,
                    direction.Y,
                    direction.Z
                );
        };

    humanoid.MoveTo =
        (...args) => {
            const target =
                args.find(v =>
                    v &&
                    typeof v ===
                        "object" &&
                    "X" in v &&
                    "Y" in v &&
                    "Z" in v
                );

            if (!target)
                return;

            const relativePart =
                args.find(v =>
                    v &&
                    typeof v ===
                        "object" &&
                    v !== humanoid &&
                    v !== target &&
                    isA?.(
                        v,
                        "BasePart"
                    )
                ) ||
                null;

            humanoid.WalkToPoint =
                createVector3(
                    target.X,
                    target.Y,
                    target.Z
                );

            humanoid.WalkToPart =
                relativePart;

            humanoid.__moveToActive =
                true;

            humanoid.__moveToStartedAt =
                performance.now();
        };

    humanoid.moveTo =
        humanoid.MoveTo;

    humanoid.move =
        humanoid.Move;

    humanoid.getState =
        humanoid.GetState;

    humanoid.changeState =
        humanoid.ChangeState;

    luaHumanoids.add(
        humanoid
    );

    return humanoid;
}

// ─── Phase 3: classic JointInstance physics ─────────────────────────────────
//
// Relationship used by Weld/Snap/Glue/Motor/Rotate:
//     Part0.CFrame * C0 == Part1.CFrame * C1
//
// Identity C0/C1 are meaningful classic attachment transforms. Script-created
// joints therefore keep identity exactly as written; surface-created joints
// receive explicit face attachment frames in makeSurfaceJoints().

function isIdentityCFrame(cf, epsilon = 1e-6) {
    if (!cf)
        return true;

    return (
        Math.abs(Number(cf.X) || 0) < epsilon &&
        Math.abs(Number(cf.Y) || 0) < epsilon &&
        Math.abs(Number(cf.Z) || 0) < epsilon &&
        Math.abs(Number(cf._qx) || 0) < epsilon &&
        Math.abs(Number(cf._qy) || 0) < epsilon &&
        Math.abs(Number(cf._qz) || 0) < epsilon &&
        Math.abs((Number(cf._qw) || 1) - 1) < epsilon
    );
}

function frameToCFrame(frame) {
    return makeCFrameFromQuaternion(
        frame.p.x,
        frame.p.y,
        frame.p.z,
        frame.q
    );
}

function createLuaJoint(className) {
    const joint =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Part0:
                    null,

                Part1:
                    null,

                C0:
                    createCFrame(0, 0, 0),

                C1:
                    createCFrame(0, 0, 0),

                CurrentAngle:
                    0,

                DesiredAngle:
                    0,

                MaxVelocity:
                    (className === "Motor" || className === "Motor6D")
                        ? 0.1
                        : 0,

                Velocity:
                    className === "Rotate"
                        ? 1
                        : 0
            })
        );

    Object.defineProperty(
        joint,
        "__phase3Joint",
        {
            value: {
                captured:
                    false,

                lastPart0:
                    null,

                lastPart1:
                    null,

                lastC0:
                    joint.C0,

                lastC1:
                    joint.C1
            },
            writable: true,
            enumerable: false
        }
    );

    joint.SetDesiredAngle =
        (...args) => {
            joint.DesiredAngle =
                getNumberArg(
                    args,
                    0
                ) || 0;
        };

    luaJoints.add(
        joint
    );

    return joint;
}

function getBodyFrame(instance) {
    const body =
        instance?.__internal?.body;

    if (!body)
        return null;

    const t =
        body.translation();

    const r =
        body.rotation();

    return {
        p:
            new THREE.Vector3(
                t.x,
                t.y,
                t.z
            ),

        q:
            new THREE.Quaternion(
                r.x,
                r.y,
                r.z,
                r.w
            )
    };
}

function cfFrame(cf) {
    return {
        p:
            new THREE.Vector3(
                Number(cf?.X) || 0,
                Number(cf?.Y) || 0,
                Number(cf?.Z) || 0
            ),

        q:
            quaternionFromCFrameValue(
                cf
            )
    };
}

function mulFrame(a, b) {
    return {
        p:
            a.p.clone()
                .add(
                    b.p.clone()
                        .applyQuaternion(
                            a.q
                        )
                ),

        q:
            a.q.clone()
                .multiply(
                    b.q
                )
    };
}

function invFrame(a) {
    const q =
        a.q.clone()
            .invert();

    return {
        p:
            a.p.clone()
                .multiplyScalar(-1)
                .applyQuaternion(q),

        q
    };
}

function setLuaPartWorldFrame(instance, frame) {
    const internal =
        instance?.__internal;

    if (
        !internal?.body ||
        !internal?.mesh
    ) {
        return;
    }

    internal.body.setTranslation(
        {
            x: frame.p.x,
            y: frame.p.y,
            z: frame.p.z
        },
        true
    );

    internal.body.setRotation(
        {
            x: frame.q.x,
            y: frame.q.y,
            z: frame.q.z,
            w: frame.q.w
        },
        true
    );

    // A welded/motor-driven part should not keep stale velocity fighting the
    // joint solver.
    if (!instance.Anchored) {
        internal.body.setLinvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );

        internal.body.setAngvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );
    }

    internal.mesh.position.copy(
        frame.p
    );

    internal.mesh.quaternion.copy(
        frame.q
    );

    instance.Position.X =
        frame.p.x;

    instance.Position.Y =
        frame.p.y;

    instance.Position.Z =
        frame.p.z;

    const e =
        new THREE.Euler()
            .setFromQuaternion(
                frame.q,
                "XYZ"
            );

    instance.Orientation.X =
        THREE.MathUtils.radToDeg(
            e.x
        );

    instance.Orientation.Y =
        THREE.MathUtils.radToDeg(
            e.y
        );

    instance.Orientation.Z =
        THREE.MathUtils.radToDeg(
            e.z
        );

    instance.CFrame =
        makeCFrameFromQuaternion(
            frame.p.x,
            frame.p.y,
            frame.p.z,
            frame.q
        );

    if (instance.__last) {
        instance.__last.Position = [
            frame.p.x,
            frame.p.y,
            frame.p.z
        ];

        instance.__last.Orientation = [
            instance.Orientation.X,
            instance.Orientation.Y,
            instance.Orientation.Z
        ];
    }
}

function captureJointCurrentPose(joint) {
    const a =
        joint.Part0;

    const b =
        joint.Part1;

    const aFrame =
        getBodyFrame(a);

    const bFrame =
        getBodyFrame(b);

    if (
        !aFrame ||
        !bFrame
    ) {
        return false;
    }

    // Classic JointInstance semantics:
    //
    // C0/C1 are real attachment transforms. Identity is NOT a signal to
    // preserve the parts' current relative placement. With both at identity,
    // a Weld/Snap/Motor genuinely joins the two part origins.
    //
    // Surface-created joints explicitly receive C0/C1 attachment frames in
    // makeSurfaceJoints(), so they still preserve the touching geometry.
    joint.__phase3Joint.captured =
        true;

    joint.__phase3Joint.lastPart0 =
        a;

    joint.__phase3Joint.lastPart1 =
        b;

    return true;
}

function resetJointCaptureIfChanged(joint) {
    const state =
        joint.__phase3Joint;

    if (!state)
        return;

    if (
        state.lastPart0 !== joint.Part0 ||
        state.lastPart1 !== joint.Part1
    ) {
        state.captured =
            false;
    }
}

function syncLuaJoints(delta) {
    for (
        const joint of
        [...luaJoints]
    ) {
        if (
            !joint ||
            joint.__destroyed ||
            !joint.Parent
        ) {
            continue;
        }

        const a =
            joint.Part0;

        const b =
            joint.Part1;

        if (
            !a?.__internal?.body ||
            !b?.__internal?.body ||
            a === b
        ) {
            continue;
        }

        resetJointCaptureIfChanged(
            joint
        );

        if (
            !joint.__phase3Joint?.captured &&
            !captureJointCurrentPose(joint)
        ) {
            continue;
        }

        if (
            joint.ClassName === "Motor" ||
            joint.ClassName === "Motor6D"
        ) {
            const cur =
                Number(
                    joint.CurrentAngle
                ) || 0;

            const dst =
                Number(
                    joint.DesiredAngle
                ) || 0;

            const maxVel =
                Math.abs(
                    Number(
                        joint.MaxVelocity
                    ) || 0
                );

            const step =
                maxVel *
                delta *
                60;

            joint.CurrentAngle =
                step <= 0
                    ? cur
                    : (
                        Math.abs(
                            dst - cur
                        ) <= step
                            ? dst
                            : cur +
                              Math.sign(
                                  dst - cur
                              ) *
                              step
                    );
        } else if (
            joint.ClassName === "Rotate"
        ) {
            joint.CurrentAngle =
                (
                    Number(
                        joint.CurrentAngle
                    ) || 0
                ) +
                (
                    Number(
                        joint.Velocity
                    ) || 0
                ) *
                delta;
        }

        let target =
            mulFrame(
                getBodyFrame(a),
                cfFrame(
                    joint.C0
                )
            );

        if (
            joint.ClassName === "Motor" ||
            joint.ClassName === "Motor6D" ||
            joint.ClassName === "Rotate"
        ) {
            // Classic hinge-style joint axis.
            target =
                mulFrame(
                    target,
                    {
                        p:
                            new THREE.Vector3(),

                        q:
                            new THREE.Quaternion()
                                .setFromAxisAngle(
                                    new THREE.Vector3(
                                        0,
                                        0,
                                        1
                                    ),
                                    Number(
                                        joint.CurrentAngle
                                    ) || 0
                                )
                    }
                );
        }

        target =
            mulFrame(
                target,
                invFrame(
                    cfFrame(
                        joint.C1
                    )
                )
            );

        if (b.Anchored && !a.Anchored) {
            // Solve the inverse relation so an anchored Part1 correctly drives Part0.
            let inverseTarget = mulFrame(
                getBodyFrame(b),
                cfFrame(joint.C1)
            );

            if (joint.ClassName === "Motor" || joint.ClassName === "Motor6D" || joint.ClassName === "Rotate") {
                inverseTarget = mulFrame(
                    inverseTarget,
                    {
                        p:new THREE.Vector3(),
                        q:new THREE.Quaternion().setFromAxisAngle(
                            new THREE.Vector3(0,0,1),
                            -(Number(joint.CurrentAngle)||0)
                        )
                    }
                );
            }

            inverseTarget = mulFrame(
                inverseTarget,
                invFrame(cfFrame(joint.C0))
            );
            setLuaPartWorldFrame(a,inverseTarget);
        } else if (!b.Anchored) {
            setLuaPartWorldFrame(b,target);

            // Dynamic welded parts inherit the DRIVER'S VELOCITY AT THE
            // CHILD'S POSITION, not merely the driver's center velocity.
            //
            // The old copy-only behavior failed whenever Part0 rotated: Part1
            // was visually moved around the assembly but its linear velocity
            // did not include omega x radius, so rotating Weld/Snap assemblies
            // could feel loose or jitter against physics.
            if (!a.Anchored) {
                const driverBody =
                    a.__internal.body;

                const childBody =
                    b.__internal.body;

                const childPoint = {
                    x: target.p.x,
                    y: target.p.y,
                    z: target.p.z
                };

                const inheritedLinear =
                    driverBody.velocityAtPoint?.(
                        childPoint
                    ) ||
                    driverBody.linvel();

                const inheritedAngular =
                    driverBody.angvel();

                childBody.setLinvel(
                    {
                        x: inheritedLinear.x,
                        y: inheritedLinear.y,
                        z: inheritedLinear.z
                    },
                    true
                );

                childBody.setAngvel(
                    {
                        x: inheritedAngular.x,
                        y: inheritedAngular.y,
                        z: inheritedAngular.z
                    },
                    true
                );
            }
        }
    }
}

const CLASSIC_SURFACE_FACE_ORDER = [
    "TopSurface",
    "BottomSurface",
    "RightSurface",
    "LeftSurface",
    "BackSurface",
    "FrontSurface"
];

const CLASSIC_SURFACE_FACE_DESCRIPTORS = {
    TopSurface: {
        normal: new THREE.Vector3(0, 1, 0),
        tangentU: new THREE.Vector3(1, 0, 0),
        tangentV: new THREE.Vector3(0, 0, 1),
        normalHalf: "y",
        uHalf: "x",
        vHalf: "z"
    },

    BottomSurface: {
        normal: new THREE.Vector3(0, -1, 0),
        tangentU: new THREE.Vector3(1, 0, 0),
        tangentV: new THREE.Vector3(0, 0, -1),
        normalHalf: "y",
        uHalf: "x",
        vHalf: "z"
    },

    RightSurface: {
        normal: new THREE.Vector3(1, 0, 0),
        tangentU: new THREE.Vector3(0, 1, 0),
        tangentV: new THREE.Vector3(0, 0, 1),
        normalHalf: "x",
        uHalf: "y",
        vHalf: "z"
    },

    LeftSurface: {
        normal: new THREE.Vector3(-1, 0, 0),
        tangentU: new THREE.Vector3(0, 1, 0),
        tangentV: new THREE.Vector3(0, 0, -1),
        normalHalf: "x",
        uHalf: "y",
        vHalf: "z"
    },

    BackSurface: {
        normal: new THREE.Vector3(0, 0, 1),
        tangentU: new THREE.Vector3(1, 0, 0),
        tangentV: new THREE.Vector3(0, 1, 0),
        normalHalf: "z",
        uHalf: "x",
        vHalf: "y"
    },

    FrontSurface: {
        normal: new THREE.Vector3(0, 0, -1),
        tangentU: new THREE.Vector3(-1, 0, 0),
        tangentV: new THREE.Vector3(0, 1, 0),
        normalHalf: "z",
        uHalf: "x",
        vHalf: "y"
    }
};

function getClassicSurfaceFaceWorld(
    part,
    surfaceName
) {
    const obb =
        getCurrentPartObb(
            part
        );

    const descriptor =
        CLASSIC_SURFACE_FACE_DESCRIPTORS[
            surfaceName
        ];

    if (
        !obb ||
        !descriptor
    ) {
        return null;
    }

    const normal =
        descriptor.normal.clone()
            .applyQuaternion(
                obb.quaternion
            )
            .normalize();

    const tangentU =
        descriptor.tangentU.clone()
            .applyQuaternion(
                obb.quaternion
            )
            .normalize();

    const tangentV =
        descriptor.tangentV.clone()
            .applyQuaternion(
                obb.quaternion
            )
            .normalize();

    const halfNormal =
        Number(
            obb.half[
                descriptor.normalHalf
            ]
        ) || 0;

    return {
        name:
            surfaceName,

        center:
            obb.center.clone()
                .addScaledVector(
                    normal,
                    halfNormal
                ),

        normal,
        tangentU,
        tangentV,

        halfU:
            Number(
                obb.half[
                    descriptor.uHalf
                ]
            ) || 0,

        halfV:
            Number(
                obb.half[
                    descriptor.vHalf
                ]
            ) || 0
    };
}

function classicSurfaceRectanglesOverlap(
    aFace,
    bFace,
    epsilon
) {
    const delta =
        bFace.center.clone()
            .sub(
                aFace.center
            );

    const axes = [
        aFace.tangentU,
        aFace.tangentV,
        bFace.tangentU,
        bFace.tangentV
    ];

    for (
        const axisValue of
        axes
    ) {
        const axis =
            axisValue.clone()
                .normalize();

        const distance =
            Math.abs(
                delta.dot(
                    axis
                )
            );

        const radiusA =
            Math.abs(
                axis.dot(
                    aFace.tangentU
                )
            ) *
                aFace.halfU +
            Math.abs(
                axis.dot(
                    aFace.tangentV
                )
            ) *
                aFace.halfV;

        const radiusB =
            Math.abs(
                axis.dot(
                    bFace.tangentU
                )
            ) *
                bFace.halfU +
            Math.abs(
                axis.dot(
                    bFace.tangentV
                )
            ) *
                bFace.halfV;

        if (
            distance >
            radiusA +
                radiusB +
                epsilon
        ) {
            return false;
        }
    }

    return true;
}

function touchingFacePair(
    a,
    b,
    epsilon = 0.08
) {
    let bestPair =
        null;

    let bestGap =
        Infinity;

    for (
        const aName of
        CLASSIC_SURFACE_FACE_ORDER
    ) {
        const aFace =
            getClassicSurfaceFaceWorld(
                a,
                aName
            );

        if (!aFace)
            continue;

        for (
            const bName of
            CLASSIC_SURFACE_FACE_ORDER
        ) {
            const bFace =
                getClassicSurfaceFaceWorld(
                    b,
                    bName
                );

            if (!bFace)
                continue;

            // Surface joints require two opposing faces. This test uses each
            // Part's LOCAL face normals after its full CFrame rotation.
            const opposing =
                aFace.normal.dot(
                    bFace.normal
                );

            if (
                opposing >
                -0.995
            ) {
                continue;
            }

            const faceDelta =
                bFace.center.clone()
                    .sub(
                        aFace.center
                    );

            const planeGap =
                Math.abs(
                    faceDelta.dot(
                        aFace.normal
                    )
                );

            if (
                planeGap >
                epsilon
            ) {
                continue;
            }

            if (
                !classicSurfaceRectanglesOverlap(
                    aFace,
                    bFace,
                    epsilon
                )
            ) {
                continue;
            }

            if (
                planeGap <
                bestGap
            ) {
                bestGap =
                    planeGap;

                bestPair = [
                    aName,
                    bName
                ];
            }
        }
    }

    return bestPair;
}

function configureClassicSurfaceJointFrames(
    joint,
    part0,
    part1,
    surface0,
    surface1
) {
    const face0 =
        getClassicSurfaceFaceWorld(
            part0,
            surface0
        );

    const face1 =
        getClassicSurfaceFaceWorld(
            part1,
            surface1
        );

    const part0Frame =
        getBodyFrame(
            part0
        );

    const part1Frame =
        getBodyFrame(
            part1
        );

    if (
        !face0 ||
        !face1 ||
        !part0Frame ||
        !part1Frame
    ) {
        return false;
    }

    // Classic Motor/Rotate angle is around the joint frame's local Z axis.
    // Put local Z along the surface normal so Motor/Hinge surfaces rotate
    // around the correct face even when the Parts themselves are tilted.
    const zAxis =
        face0.normal.clone()
            .normalize();

    let xAxis =
        face0.tangentU.clone()
            .addScaledVector(
                zAxis,
                -face0.tangentU.dot(
                    zAxis
                )
            );

    if (
        xAxis.lengthSq() <
        1e-8
    ) {
        xAxis =
            face0.tangentV.clone()
                .addScaledVector(
                    zAxis,
                    -face0.tangentV.dot(
                        zAxis
                    )
                );
    }

    xAxis.normalize();

    const yAxis =
        zAxis.clone()
            .cross(
                xAxis
            )
            .normalize();

    // Average the two face centers. For exactly touching Parts these are on
    // the same contact plane; averaging is more stable with tiny solver error.
    const jointPosition =
        face0.center.clone()
            .add(
                face1.center
            )
            .multiplyScalar(
                0.5
            );

    const basis =
        new THREE.Matrix4()
            .makeBasis(
                xAxis,
                yAxis,
                zAxis
            );

    const jointRotation =
        new THREE.Quaternion()
            .setFromRotationMatrix(
                basis
            )
            .normalize();

    const worldJointFrame = {
        p:
            jointPosition,

        q:
            jointRotation
    };

    const c0Frame =
        mulFrame(
            invFrame(
                part0Frame
            ),
            worldJointFrame
        );

    const c1Frame =
        mulFrame(
            invFrame(
                part1Frame
            ),
            worldJointFrame
        );

    joint.C0 =
        frameToCFrame(
            c0Frame
        );

    joint.C1 =
        frameToCFrame(
            c1Frame
        );

    return true;
}

function makeSurfaceJoints(part) {
    if (
        !part?.IsA?.("BasePart")
    ) {
        return;
    }

    for (
        const other of
        luaInstances
    ) {
        if (
            other === part ||
            !other?.IsA?.("BasePart") ||
            !isInWorkspace(other)
        ) {
            continue;
        }

        const faces =
            touchingFacePair(
                part,
                other
            );

        if (!faces)
            continue;

        const s0 =
            part[
                faces[0]
            ] ||
            "Smooth";

        const s1 =
            other[
                faces[1]
            ] ||
            "Smooth";

        let className =
            null;

        if (
            s0 === "Motor" || s1 === "Motor" ||
            s0 === "SteppingMotor" || s1 === "SteppingMotor"
        ) {
            className = "Motor";
        } else if (
            s0 === "Hinge" || s1 === "Hinge"
        ) {
            className = "Rotate";
        } else if (
            s0 === "Glue" ||
            s1 === "Glue"
        ) {
            className = "Glue";
        } else if (
            s0 === "Weld" ||
            s1 === "Weld"
        ) {
            className = "Weld";
        } else {
            const studPair =
                (s0 === "Studs" && (s1 === "Inlet" || s1 === "Universal")) ||
                (s1 === "Studs" && (s0 === "Inlet" || s0 === "Universal")) ||
                (s0 === "Universal" && s1 === "Universal");
            if (studPair) className = "Snap";
        }

        if (!className)
            continue;

        const exists =
            [...luaJoints]
                .some(joint =>
                    !joint.__destroyed &&
                    (
                        (
                            joint.Part0 === part &&
                            joint.Part1 === other
                        ) ||
                        (
                            joint.Part0 === other &&
                            joint.Part1 === part
                        )
                    )
                );

        if (exists)
            continue;

        const joint =
            createLuaJoint(
                className
            );

        joint.Part0 =
            part;

        joint.Part1 =
            other;

        joint.Parent =
            part;

        // Surface-generated classic joints need actual attachment frames at the
        // touching faces. This preserves the current placement for Snap/Weld,
        // and gives Motor/Rotate the correct local rotation axis.
        configureClassicSurfaceJointFrames(
            joint,
            part,
            other,
            faces[0],
            faces[1]
        );

        captureJointCurrentPose(
            joint
        );
    }
}

// ─── Phase 3: classic BodyMovers ─────────────────────────────────────────────
//
// Implemented:
//   BodyVelocity
//   BodyPosition
//   BodyGyro
//   BodyForce
//   BodyAngularVelocity
//   BodyThrust
//
// These operate on the BasePart they are parented to.

function vectorMagnitude(v) {
    const x =
        Number(v?.X) || 0;

    const y =
        Number(v?.Y) || 0;

    const z =
        Number(v?.Z) || 0;

    return Math.hypot(
        x,
        y,
        z
    );
}

function vector3ToThree(v) {
    return new THREE.Vector3(
        Number(v?.X) || 0,
        Number(v?.Y) || 0,
        Number(v?.Z) || 0
    );
}

function clampVectorComponents(v, max) {
    return new THREE.Vector3(
        THREE.MathUtils.clamp(
            v.x,
            -Math.abs(Number(max?.X) || 0),
            Math.abs(Number(max?.X) || 0)
        ),
        THREE.MathUtils.clamp(
            v.y,
            -Math.abs(Number(max?.Y) || 0),
            Math.abs(Number(max?.Y) || 0)
        ),
        THREE.MathUtils.clamp(
            v.z,
            -Math.abs(Number(max?.Z) || 0),
            Math.abs(Number(max?.Z) || 0)
        )
    );
}

function createLuaBodyMover(className) {
    const common = {
        Name:
            className,

        ClassName:
            className,

        Parent:
            null,

        Archivable:
            true
    };

    if (
        className === "BodyVelocity"
    ) {
        Object.assign(
            common,
            {
                Velocity:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyPosition"
    ) {
        Object.assign(
            common,
            {
                Position:
                    createVector3(),

                MaxForce:
                    createVector3(
                        4000,
                        4000,
                        4000
                    ),

                P:
                    10000,

                D:
                    1250
            }
        );
    } else if (
        className === "BodyGyro"
    ) {
        Object.assign(
            common,
            {
                CFrame:
                    createCFrame(),

                MaxTorque:
                    createVector3(
                        400000,
                        0,
                        400000
                    ),

                P:
                    3000,

                D:
                    500
            }
        );
    } else if (
        className === "BodyForce"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3()
            }
        );
    } else if (
        className ===
        "BodyAngularVelocity"
    ) {
        Object.assign(
            common,
            {
                AngularVelocity:
                    createVector3(),

                MaxTorque:
                    createVector3(
                        400000,
                        400000,
                        400000
                    ),

                P:
                    1250
            }
        );
    } else if (
        className === "BodyThrust"
    ) {
        Object.assign(
            common,
            {
                Force:
                    createVector3(),

                Location:
                    createVector3()
            }
        );
    } else if (
        className === "RocketPropulsion"
    ) {
        Object.assign(
            common,
            {
                CartoonFactor:0.7,
                MaxSpeed:30,
                MaxThrust:4000,
                MaxTorque:createVector3(400000,400000,0),
                Target:null,
                TargetOffset:createVector3(),
                TargetRadius:4,
                ThrustD:0.001,
                ThrustP:5,
                TurnD:500,
                TurnP:3000,
                ReachedTarget:createLuaSignal("RocketPropulsion.ReachedTarget"),
                __rocketFired:false,
                __rocketReached:false
            }
        );
    }

    const mover =
        finalizeLuaInstance(
            Mutable(
                common
            )
        );

    if (className === "RocketPropulsion") {
        mover.Fire=(...args)=>{mover.__rocketFired=true;mover.__rocketReached=false;};
        mover.fire=mover.Fire;
        mover.Abort=(...args)=>{mover.__rocketFired=false;};
        mover.abort=mover.Abort;
    }

    luaBodyMovers.add(
        mover
    );

    return mover;
}

function getBodyMoverPart(mover) {
    const parent =
        mover?.Parent;

    if (
        parent &&
        isA(
            parent,
            "BasePart"
        ) &&
        parent.__internal?.body &&
        !parent.Anchored
    ) {
        return parent;
    }

    return null;
}

function getMoverBodyMass(body) {
    try {
        const mass=typeof body.mass==="function"?Number(body.mass()):1;
        return Number.isFinite(mass)&&mass>1e-6?mass:1;
    } catch { return 1; }
}

function bodyMoverForceStep(body,force,delta) {
    const mass=getMoverBodyMass(body);
    const vel=body.linvel();
    body.setLinvel({
        x:vel.x+(force.x/mass)*delta,
        y:vel.y+(force.y/mass)*delta,
        z:vel.z+(force.z/mass)*delta
    },true);
}

function applyBodyVelocity(mover,part,delta) {
    const body=part.__internal.body;
    const current=body.linvel();
    const target=vector3ToThree(mover.Velocity);
    const error=target.sub(new THREE.Vector3(current.x,current.y,current.z));
    const p=Math.max(0,Number(mover.P)||0);
    let force=error.multiplyScalar(p);
    force=clampVectorComponents(force,mover.MaxForce);
    bodyMoverForceStep(body,force,delta);
}

function applyBodyPosition(mover,part,delta) {
    const body=part.__internal.body;
    const posRaw=body.translation();
    const velRaw=body.linvel();
    const pos=new THREE.Vector3(posRaw.x,posRaw.y,posRaw.z);
    const vel=new THREE.Vector3(velRaw.x,velRaw.y,velRaw.z);
    const target=vector3ToThree(mover.Position);
    const error=target.sub(pos);
    const p=Math.max(0,Number(mover.P)||0);
    const d=Math.max(0,Number(mover.D)||0);
    let force=error.multiplyScalar(p).sub(vel.multiplyScalar(d));
    force=clampVectorComponents(force,mover.MaxForce);
    bodyMoverForceStep(body,force,delta);
}

function applyBodyForce(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const force =
        vector3ToThree(
            mover.Force
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: force.x,
                y: force.y,
                z: force.z
            },
            true
        );
    } else {
        // Fallback for Rapier builds without addForce exposed.
        const vel =
            body.linvel();

        body.setLinvel(
            {
                x:
                    vel.x +
                    force.x * 0.001,

                y:
                    vel.y +
                    force.y * 0.001,

                z:
                    vel.z +
                    force.z * 0.001
            },
            true
        );
    }
}

function applyBodyAngularVelocity(
    mover,
    part,
    delta
) {
    const body =
        part.__internal.body;

    const currentRaw =
        body.angvel();

    const current =
        new THREE.Vector3(
            currentRaw.x,
            currentRaw.y,
            currentRaw.z
        );

    const target =
        vector3ToThree(
            mover.AngularVelocity
        );

    const response =
        1 -
        Math.exp(
            -Math.max(
                0,
                Number(mover.P) || 0
            ) *
            delta /
            1250
        );

    let change =
        target.clone()
            .sub(current)
            .multiplyScalar(
                response
            );

    change =
        clampVectorComponents(
            change,
            createVector3(
                (Number(mover.MaxTorque?.X) || 0) * delta,
                (Number(mover.MaxTorque?.Y) || 0) * delta,
                (Number(mover.MaxTorque?.Z) || 0) * delta
            )
        );

    current.add(
        change
    );

    body.setAngvel(
        {
            x: current.x,
            y: current.y,
            z: current.z
        },
        true
    );
}

function applyBodyGyro(mover,part,delta) {
    const body=part.__internal.body;
    const raw=body.rotation();
    const current=new THREE.Quaternion(raw.x,raw.y,raw.z,raw.w).normalize();
    const target=quaternionFromCFrameValue(mover.CFrame).normalize();
    const errorQ=target.clone().multiply(current.clone().invert()).normalize();
    if(errorQ.w<0){errorQ.x*=-1;errorQ.y*=-1;errorQ.z*=-1;errorQ.w*=-1;}
    const angle=2*Math.acos(THREE.MathUtils.clamp(errorQ.w,-1,1));
    const sinHalf=Math.sqrt(Math.max(1e-12,1-errorQ.w*errorQ.w));
    const axis=sinHalf<1e-5?new THREE.Vector3():new THREE.Vector3(errorQ.x/sinHalf,errorQ.y/sinHalf,errorQ.z/sinHalf);
    const avRaw=body.angvel();
    const av=new THREE.Vector3(avRaw.x,avRaw.y,avRaw.z);
    const p=Math.max(0,Number(mover.P)||0);
    const d=Math.max(0,Number(mover.D)||0);
    let torque=axis.multiplyScalar(angle*p).sub(av.clone().multiplyScalar(d));
    torque=clampVectorComponents(torque,mover.MaxTorque);
    const mass=getMoverBodyMass(body);
    // Legacy BodyGyro P/D values are large Roblox-space controller gains, not
    // raw radians-per-second impulses. Scale the torque integration so the
    // controller converges without instantly saturating Rapier angular speed.
    av.addScaledVector(torque,delta/(Math.max(0.25,mass)*1000));
    av.clampLength(0,80);
    body.setAngvel({x:av.x,y:av.y,z:av.z},true);
}

function applyBodyThrust(
    mover,
    part
) {
    const body =
        part.__internal.body;

    const localForce =
        vector3ToThree(
            mover.Force
        );

    const rawRotation =
        body.rotation();

    const q =
        new THREE.Quaternion(
            rawRotation.x,
            rawRotation.y,
            rawRotation.z,
            rawRotation.w
        );

    const worldForce =
        localForce.applyQuaternion(
            q
        );

    if (
        typeof body.addForce ===
        "function"
    ) {
        body.addForce(
            {
                x: worldForce.x,
                y: worldForce.y,
                z: worldForce.z
            },
            true
        );
    }
}

function applyRocketPropulsion(mover,part,delta) {
    if(!mover.__rocketFired)return;
    const target=mover.Target;
    if(!target||target.__destroyed||!isA(target,"BasePart"))return;

    const body=part.__internal.body;
    const p=body.translation();
    const v=body.linvel();
    const offset=vector3ToThree(mover.TargetOffset);
    const tp=getBasePartWorldPosition(target);
    if(!tp)return;
    tp.add(offset);

    const position=new THREE.Vector3(p.x,p.y,p.z);
    const velocity=new THREE.Vector3(v.x,v.y,v.z);
    const deltaPos=tp.clone().sub(position);
    const distance=deltaPos.length();
    const radius=Math.max(0,Number(mover.TargetRadius)||0);

    if(distance<=radius) {
        if(!mover.__rocketReached) {
            mover.__rocketReached=true;
            fireLuaSignal(mover.ReachedTarget);
        }
    } else mover.__rocketReached=false;

    if(distance>1e-6) {
        const desiredVelocity=deltaPos.clone().normalize().multiplyScalar(Math.min(Math.max(0,Number(mover.MaxSpeed)||0),distance*Math.max(0,Number(mover.ThrustP)||0)));
        let force=desiredVelocity.sub(velocity).multiplyScalar(Math.max(0,Number(mover.ThrustP)||0)*getMoverBodyMass(body));
        force.addScaledVector(velocity,-Math.max(0,Number(mover.ThrustD)||0));
        const maxThrust=Math.max(0,Number(mover.MaxThrust)||0);
        if(force.length()>maxThrust&&maxThrust>0)force.setLength(maxThrust);
        bodyMoverForceStep(body,force,delta);

        // RocketPropulsion.MaxSpeed is a hard speed ceiling. Clamp after the
        // thrust step as well as using it to build the desired velocity.
        const maxSpeed=Math.max(0,Number(mover.MaxSpeed)||0);
        if(maxSpeed>0) {
            const after=body.linvel();
            const afterVelocity=new THREE.Vector3(after.x,after.y,after.z);
            if(afterVelocity.length()>maxSpeed) {
                afterVelocity.setLength(maxSpeed);
                body.setLinvel({x:afterVelocity.x,y:afterVelocity.y,z:afterVelocity.z},true);
            }
        }

        const cartoon=THREE.MathUtils.clamp(Number(mover.CartoonFactor)||0,0,1);
        if(cartoon>0) {
            const forward=new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion(body.rotation().x,body.rotation().y,body.rotation().z,body.rotation().w));
            const desired=deltaPos.clone().normalize();
            const axis=forward.clone().cross(desired);
            const axisLen=axis.length();
            if(axisLen>1e-6) {
                axis.multiplyScalar(1/axisLen);
                const angle=Math.acos(THREE.MathUtils.clamp(forward.dot(desired),-1,1));
                const avRaw=body.angvel();
                const av=new THREE.Vector3(avRaw.x,avRaw.y,avRaw.z);
                let torque=axis.multiplyScalar(angle*Math.max(0,Number(mover.TurnP)||0)*cartoon).sub(av.clone().multiplyScalar(Math.max(0,Number(mover.TurnD)||0)));
                torque=clampVectorComponents(torque,mover.MaxTorque);
                av.addScaledVector(
                    torque,
                    delta/(Math.max(0.25,getMoverBodyMass(body))*1000)
                );
                av.clampLength(0,60);
                body.setAngvel({x:av.x,y:av.y,z:av.z},true);
            }
        }
    }
}

function syncLuaBodyMovers(delta) {
    for (
        const mover of
        [...luaBodyMovers]
    ) {
        if (
            !mover ||
            mover.__destroyed
        ) {
            continue;
        }

        const part =
            getBodyMoverPart(
                mover
            );

        if (!part)
            continue;

        switch (
            mover.ClassName
        ) {
            case "BodyVelocity":
                applyBodyVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyPosition":
                applyBodyPosition(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyGyro":
                applyBodyGyro(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyForce":
                applyBodyForce(
                    mover,
                    part
                );
                break;

            case "BodyAngularVelocity":
                applyBodyAngularVelocity(
                    mover,
                    part,
                    delta
                );
                break;

            case "BodyThrust":
                applyBodyThrust(
                    mover,
                    part
                );
                break;

            case "RocketPropulsion":
                applyRocketPropulsion(
                    mover,
                    part,
                    delta
                );
                break;
        }
    }
}

function cloneLuaInstance(source) {
    if (
        !source ||
        source.__destroyed ||
        source.Archivable === false
    ) {
        return null;
    }

    const c =
        InstanceApi.new(
            source.ClassName
        );

    c.Name =
        source.Name;

    c.Archivable =
        source.Archivable;

    if (
        isA(
            source,
            "BasePart"
        )
    ) {
        c.Size =
            createVector3(
                source.Size.X,
                source.Size.Y,
                source.Size.Z
            );

        c.Position =
            createVector3(
                source.Position.X,
                source.Position.Y,
                source.Position.Z
            );

        c.Orientation =
            createVector3(
                source.Orientation.X,
                source.Orientation.Y,
                source.Orientation.Z
            );

        c.CFrame =
            source.CFrame;

        c.Color =
            createColor3(
                source.Color.R,
                source.Color.G,
                source.Color.B
            );

        c.BrickColor =
            BrickColorApi.new(
                source.BrickColor?.Name ||
                "Medium stone grey"
            );

        c.Anchored =
            source.Anchored;

        c.CanCollide =
            source.CanCollide;

        c.Transparency =
            source.Transparency;

        c.Reflectance =
            source.Reflectance || 0;

        if (
            source.ClassName ===
            "Part"
        ) {
            c.Shape =
                normalizeClassicPartShape(
                    source.Shape
                );
        }

        if (
            source.ClassName ===
            "Seat"
        ) {
            c.Disabled =
                Boolean(
                    source.Disabled
                );

            // Occupant/SeatWeld are runtime state and are intentionally not cloned.
            c.Occupant =
                null;
        }

        if (
            source.ClassName ===
            "SpawnLocation"
        ) {
            c.Enabled =
                source.Enabled;

            c.Neutral =
                source.Neutral;

            c.TeamColor =
                BrickColorApi.new(
                    source.TeamColor?.Name ||
                    "Medium stone grey"
                );

            c.AllowTeamChangeOnTouch =
                source.AllowTeamChangeOnTouch;

            c.Duration =
                source.Duration;
        }

        for (
            const key of
            [
                "TopSurface",
                "BottomSurface",
                "LeftSurface",
                "RightSurface",
                "FrontSurface",
                "BackSurface"
            ]
        ) {
            c[key] =
                source[key];
        }
    } else if (
        source.ClassName ===
        "Tool"
    ) {
        c.TextureId =
            source.TextureId || "";
        c.Enabled =
            source.Enabled !== false;
        c.CanBeDropped =
            source.CanBeDropped !== false;
        c.ToolTip =
            source.ToolTip || "";
        c.Grip =
            source.Grip || createCFrame();
        c.GripPos =
            createVector3(
                Number(source.GripPos?.X) || 0,
                Number(source.GripPos?.Y) || 0,
                Number(source.GripPos?.Z) || 0
            );
        c.GripForward =
            createVector3(
                Number(source.GripForward?.X) || 0,
                Number(source.GripForward?.Y) || 0,
                Number(source.GripForward?.Z) || -1
            );
        c.GripRight =
            createVector3(
                Number(source.GripRight?.X) || 1,
                Number(source.GripRight?.Y) || 0,
                Number(source.GripRight?.Z) || 0
            );
        c.GripUp =
            createVector3(
                Number(source.GripUp?.X) || 0,
                Number(source.GripUp?.Y) || 1,
                Number(source.GripUp?.Z) || 0
            );
    } else if (
        source.ClassName ===
        "HopperBin"
    ) {
        c.TextureId =
            source.TextureId || "";
        c.BinType =
            source.BinType || "Script";
        c.Active =
            false;
    } else if (
        source.ClassName ===
        "Sound"
    ) {
        c.SoundId =
            source.SoundId;

        c.Volume =
            source.Volume;

        c.Pitch =
            source.Pitch;

        c.Looped =
            source.Looped;

        c.TimePosition =
            source.TimePosition;

        c.PlayOnRemove =
            source.PlayOnRemove;

        c.MinDistance =
            source.MinDistance;

        c.MaxDistance =
            source.MaxDistance;

        c.EmitterSize =
            source.EmitterSize;

        // Roblox Clone() should not automatically start a sound merely because
        // the original is currently playing.
        c.Playing =
            false;
    } else if (
        source.ClassName ===
        "Decal"
    ) {
        c.Texture =
            source.Texture;

        c.Face =
            source.Face;

        c.Transparency =
            source.Transparency;

        c.Color3 =
            source.Color3;
    } else if (
        source.ClassName ===
        "ParticleEmitter"
    ) {
        for (
            const propertyName of
            [
                "Texture",
                "Enabled",
                "Rate",
                "Lifetime",
                "Speed",
                "SpreadAngle",
                "Rotation",
                "RotSpeed",
                "Size",
                "Transparency",
                "Color",
                "LightEmission",
                "Acceleration",
                "Drag",
                "VelocityInheritance",
                "ZOffset"
            ]
        ) {
            c[propertyName] =
                source[propertyName];
        }
    } else if (
        source.ClassName ===
        "ScreenGui"
    ) {
        c.Enabled =
            source.Enabled;
    } else if (
        isA(
            source,
            "GuiObject"
        )
    ) {
        for (
            const propertyName of
            [
                "Visible","Position","Size",
                "BackgroundColor3","BackgroundTransparency",
                "BorderColor3","BorderSizePixel",
                "ZIndex","Active","Draggable","ClipDescendants","Modal","SizeConstraint","Style",
                "AutoButtonColor","Selected",
                "Text","TextColor3","TextTransparency",
                "TextStrokeColor3","TextStrokeTransparency",
                "Font","FontSize","TextXAlignment","TextYAlignment",
                "TextWrap","TextWrapped","TextScaled",
                "ClearTextOnFocus","MultiLine",
                "Image","ImageColor3","ImageTransparency"
            ]
        ) {
            if (
                propertyName in source &&
                propertyName in c
            ) {
                c[propertyName] =
                    source[propertyName];
            }
        }
    } else if (
        source.ClassName ===
        "BillboardGui"
    ) {
        c.Adornee =
            source.Adornee;

        c.Size =
            source.Size;

        c.StudsOffset =
            source.StudsOffset;

        c.Enabled =
            source.Enabled;

        c.AlwaysOnTop =
            source.AlwaysOnTop;
    } else if (
        source.ClassName ===
        "ImageLabel"
    ) {
        c.Image =
            source.Image;

        c.ImageColor3 =
            source.ImageColor3;

        c.ImageTransparency =
            source.ImageTransparency;

        c.BackgroundTransparency =
            source.BackgroundTransparency;

        c.Visible =
            source.Visible;

        c.Size =
            source.Size;

        c.Position =
            source.Position;
    } else if (
        source.ClassName ===
        "Explosion"
    ) {
        c.Position =
            source.Position;

        c.BlastRadius =
            source.BlastRadius;

        c.BlastPressure =
            source.BlastPressure;

        c.DestroyJointRadiusPercent =
            source.DestroyJointRadiusPercent;

        c.ExplosionType =
            source.ExplosionType;

        c.Visible =
            source.Visible;
    } else if (
        source.ClassName ===
        "ForceField"
    ) {
        // ForceField has no script-facing state in this classic implementation.
    } else if (
        source.ClassName ===
        "ClickDetector"
    ) {
        c.MaxActivationDistance =
            source.MaxActivationDistance;
    } else if (
        source.ClassName ===
        "Sparkles"
    ) {
        c.Enabled =
            source.Enabled;

        c.SparkleColor =
            createColor3(
                source.SparkleColor?.R,
                source.SparkleColor?.G,
                source.SparkleColor?.B
            );
    } else if (
        source.ClassName ===
            "Message" ||
        source.ClassName ===
            "Hint"
    ) {
        c.Text =
            source.Text;
    } else if (
        source.ClassName === "Sky"
    ) {
        for (const propertyName of [
            "SkyboxBk","SkyboxDn","SkyboxFt","SkyboxLf","SkyboxRt","SkyboxUp",
            "CelestialBodiesShown","StarCount","SunAngularSize","MoonAngularSize"
        ]) c[propertyName]=source[propertyName];
    } else if (
        source.ClassName ===
        "Team"
    ) {
        c.TeamColor =
            BrickColorApi.new(
                source.TeamColor?.Name ||
                "Medium stone grey"
            );

        c.AutoAssignable =
            source.AutoAssignable;

        c.Score =
            source.Score;
    } else if (
        source.ClassName ===
        "HumanoidDescription"
    ) {
        for (
            const propertyName of
            [
                "Shirt",
                "Pants",
                "ShirtGraphic",
                "HeadColor",
                "TorsoColor",
                "LeftArmColor",
                "RightArmColor",
                "LeftLegColor",
                "RightLegColor"
            ]
        ) {
            c[propertyName] =
                source[propertyName];
        }
    } else if (
        source.ClassName ===
        "BodyColors"
    ) {
        for (
            const propertyName of
            [
                "HeadColor",
                "TorsoColor",
                "LeftArmColor",
                "RightArmColor",
                "LeftLegColor",
                "RightLegColor"
            ]
        ) {
            const value =
                source[propertyName];

            c[propertyName] =
                BrickColorApi.new(
                    value?.Name ??
                    value?.Number ??
                    "Medium stone grey"
                );
        }
    } else if (
        source.ClassName ===
        "Shirt"
    ) {
        c.ShirtTemplate =
            source.ShirtTemplate;
    } else if (
        source.ClassName ===
        "Pants"
    ) {
        c.PantsTemplate =
            source.PantsTemplate;
    } else if (
        source.ClassName ===
        "ShirtGraphic"
    ) {
        c.Graphic =
            source.Graphic;
    } else if (
        source.ClassName ===
        "Humanoid"
    ) {
        c.Health =
            source.Health;

        c.MaxHealth =
            source.MaxHealth;

        c.WalkSpeed =
            source.WalkSpeed;

        c.JumpPower =
            source.JumpPower;

        c.Sit =
            source.Sit;

        c.PlatformStand =
            source.PlatformStand;

        c.AutoRotate =
            source.AutoRotate;
    } else if (
        luaBodyMovers.has(source)
    ) {
        for (
            const propertyName of
            [
                "Velocity",
                "MaxForce",
                "Position",
                "P",
                "D",
                "CFrame",
                "MaxTorque",
                "Force",
                "AngularVelocity",
                "Location",
                "CartoonFactor","MaxSpeed","MaxThrust","Target",
                "TargetOffset","TargetRadius","ThrustD","ThrustP","TurnD","TurnP"
            ]
        ) {
            if (
                propertyName in source
            ) {
                c[propertyName] =
                    source[propertyName];
            }
        }
    } else if (
        "Value" in source
    ) {
        c.Value =
            cloneClassicValueObjectValue(
                source.ClassName,
                source.Value
            );
    }

    if (
        source.ClassName ===
        "Model"
    ) {
        // PrimaryPart is re-linked by name after descendants are cloned.
        c.PrimaryPart = null;
    }

    if (
        luaJoints.has(source)
    ) {
        c.Part0 =
            source.Part0;

        c.Part1 =
            source.Part1;

        c.C0 =
            source.C0;

        c.C1 =
            source.C1;

        c.CurrentAngle =
            source.CurrentAngle;

        c.DesiredAngle =
            source.DesiredAngle;

        c.MaxVelocity =
            source.MaxVelocity;

        c.Velocity =
            source.Velocity;
    }

    // Engine-side cloning uses the raw hierarchy array. The public GetChildren()
    // returns a Luau-compatible 1-based collection object, which is intentionally
    // not a JavaScript iterable.
    for (
        const child of
        getLuaChildren(
            source
        )
    ) {
        const cc =
            cloneLuaInstance(
                child
            );

        if (cc)
            cc.Parent = c;
    }

    if (
        source.ClassName ===
        "Humanoid"
    ) {
        c.Description =
            c.FindFirstChildOfClass?.(
                "HumanoidDescription"
            ) ||
            null;
    }

    if (
        source.ClassName === "Model" &&
        source.PrimaryPart
    ) {
        c.PrimaryPart =
            c.FindFirstChild(
                source.PrimaryPart.Name,
                true
            );
    }

    refreshChildAliases(c);

    return c;
}

function createLuaPart(className = "Part") {

    const initialShape =
        className === "WedgePart"
            ? "Wedge"
            : "Block";

    const internal = createPart(
        4,
        1,
        2,
        0,
        0.5,
        0,
        {
            color: 0xaaaaaa,
            anchored: false,
            canCollide: true,
            shape: initialShape
        }
    );

    // Don't display it until Parent = workspace.
    scene.remove(internal.mesh);

    const instance = Mutable({

        Name: className,
        ClassName: className,
        Archivable: true,

        Parent: null,

        Touched: createLuaSignal(`${className}.Touched`),
        TouchEnded: createLuaSignal(`${className}.TouchEnded`),

        Size: createVector3(
            4,
            1,
            2
        ),

        Position: createVector3(
            0,
            0.5,
            0
        ),

        Orientation: createVector3(
            0,
            0,
            0
        ),

        CFrame: createCFrame(
            0,
            0.5,
            0
        ),

        Color: createColor3(
            170 / 255,
            170 / 255,
            170 / 255
        ),

        BrickColor: BrickColorApi.new("Medium stone grey"),

        Anchored: false,

        CanCollide: true,

        Transparency: 0,

        CastShadow: true,
        Reflectance: 0,

        // Phase 3.5 classic physics properties.
        Velocity: createVector3(0,0,0),
        RotVelocity: createVector3(0,0,0),
        AssemblyMass: 1,
        Massless: false,
        CollisionGroup: "Default",
        CustomPhysicalProperties: null,

        // Classic 2010-style surfaces
        TopSurface: "Studs",
        BottomSurface: "Inlet",
        LeftSurface: "Smooth",
        RightSurface: "Smooth",
        FrontSurface: "Smooth",
        BackSurface: "Smooth",

        MakeJoints() { makeSurfaceJoints(this); },
        BreakJoints() {
            const connected =
                [...luaJoints]
                    .filter(joint =>
                        joint.Part0 === this ||
                        joint.Part1 === this
                    );

            for (
                const joint of
                connected
            ) {
                destroyLuaInstance(
                    joint
                );
            }

            return connected.length;
        },

        Destroy() {
            destroyLuaInstance(this);
        }

    });

    // Part.Shape existed for the classic Block/Ball/Cylinder primitive set.
    // WedgePart is its own class and therefore keeps its Wedge shape internally.
    if (className === "Part") {
        instance.Shape =
            "Block";
    }

    Object.defineProperty(
        instance,
        "__internal",
        {
            value: internal,
            writable: true,
            enumerable: false
        }
    );

    // Link this scripted Part to its one Rapier collider. The mapping lets
    // camera rays and touch broad-phase queries avoid full-map scans.
    internal.luaInstance =
        instance;

    registerRapierColliderOwner(
        instance,
        internal.collider
    );

    Object.defineProperty(
        instance,
        "__last",
        {
            value: {
                Size: [4, 1, 2],
                Shape: initialShape,
                Position: [0, 0.5, 0],
                Orientation: [0, 0, 0],
                Parent: null,
                Color: 0xaaaaaa,
                BrickColorName: "Medium stone grey",
                Anchored: false,
                CanCollide: true,
                Transparency: 0,
                Reflectance: 0,
                CastShadow: true,
                Velocity: [0,0,0],
                RotVelocity: [0,0,0],
                Massless: false,
                CollisionGroup: "Default"
            },
            writable: true,
            enumerable: false
        }
    );

    instance.GetConnectedParts =
        (...args) => {
            const recursive =
                getBooleanArg(
                    args,
                    false
                );

            const found =
                new Set();

            const visit =
                current => {
                    for (
                        const joint of
                        luaJoints
                    ) {
                        if (
                            joint.__destroyed
                        ) {
                            continue;
                        }

                        let other =
                            null;

                        if (
                            joint.Part0 ===
                            current
                        ) {
                            other =
                                joint.Part1;
                        } else if (
                            joint.Part1 ===
                            current
                        ) {
                            other =
                                joint.Part0;
                        }

                        if (
                            !other ||
                            found.has(other)
                        ) {
                            continue;
                        }

                        found.add(
                            other
                        );

                        if (recursive)
                            visit(other);
                    }
                };

            visit(instance);

            return makeLuaCollection(
                [...found]
            );
        };

    instance.GetMass =
        (...args) => {
            const body =
                instance.__internal?.body;

            const bodyMass =
                Number(
                    body?.mass?.()
                );

            if (
                Number.isFinite(
                    bodyMass
                ) &&
                bodyMass >
                    0
            ) {
                return bodyMass;
            }

            return Math.max(
                0,
                Number(
                    instance.AssemblyMass
                ) || 1
            );
        };

    instance.GetRootPart =
        (...args) => {
            const found =
                new Set([
                    instance
                ]);

            const visit =
                current => {
                    for (
                        const joint of
                        luaJoints
                    ) {
                        if (
                            !joint ||
                            joint.__destroyed
                        ) {
                            continue;
                        }

                        let other =
                            null;

                        if (
                            joint.Part0 ===
                            current
                        ) {
                            other =
                                joint.Part1;
                        } else if (
                            joint.Part1 ===
                            current
                        ) {
                            other =
                                joint.Part0;
                        }

                        if (
                            !other ||
                            !isA(
                                other,
                                "BasePart"
                            ) ||
                            found.has(
                                other
                            )
                        ) {
                            continue;
                        }

                        found.add(
                            other
                        );

                        visit(
                            other
                        );
                    }
                };

            visit(
                instance
            );

            const parts =
                [...found];

            const anchored =
                parts.filter(part =>
                    Boolean(
                        part.Anchored
                    )
                );

            const candidates =
                anchored.length
                    ? anchored
                    : parts;

            candidates.sort(
                (a, b) =>
                    Number(
                        getLuaInstanceId(
                            a
                        )
                    ) -
                    Number(
                        getLuaInstanceId(
                            b
                        )
                    )
            );

            return (
                candidates[0] ||
                instance
            );
        };

    instance.Resize =
        (...args) => {
            const face =
                getStringArg(
                    args,
                    ""
                );

            const amount =
                Math.trunc(
                    getNumberArg(
                        args,
                        0
                    ) || 0
                );

            if (
                amount ===
                0
            ) {
                return false;
            }

            const size =
                new THREE.Vector3(
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.X
                            ) || 1
                        )
                    ),
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.Y
                            ) || 1
                        )
                    ),
                    Math.max(
                        1,
                        Math.floor(
                            Number(
                                instance.Size?.Z
                            ) || 1
                        )
                    )
                );

            const localNormal =
                new THREE.Vector3();

            let axis =
                "y";

            switch (face) {
                case "Right":
                    axis = "x";
                    localNormal.set(
                        1,
                        0,
                        0
                    );
                    break;

                case "Left":
                    axis = "x";
                    localNormal.set(
                        -1,
                        0,
                        0
                    );
                    break;

                case "Top":
                    axis = "y";
                    localNormal.set(
                        0,
                        1,
                        0
                    );
                    break;

                case "Bottom":
                    axis = "y";
                    localNormal.set(
                        0,
                        -1,
                        0
                    );
                    break;

                case "Back":
                    axis = "z";
                    localNormal.set(
                        0,
                        0,
                        1
                    );
                    break;

                case "Front":
                    axis = "z";
                    localNormal.set(
                        0,
                        0,
                        -1
                    );
                    break;

                default:
                    return false;
            }

            const newAxisSize =
                size[axis] +
                amount;

            if (
                newAxisSize <
                1
            ) {
                return false;
            }

            size[axis] =
                newAxisSize;

            const rotation =
                new THREE.Quaternion()
                    .setFromEuler(
                        new THREE.Euler(
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.X
                                ) || 0
                            ),
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.Y
                                ) || 0
                            ),
                            THREE.MathUtils.degToRad(
                                Number(
                                    instance.Orientation?.Z
                                ) || 0
                            ),
                            "XYZ"
                        )
                    );

            const worldNormal =
                localNormal
                    .clone()
                    .applyQuaternion(
                        rotation
                    );

            const position =
                new THREE.Vector3(
                    Number(
                        instance.Position?.X
                    ) || 0,
                    Number(
                        instance.Position?.Y
                    ) || 0,
                    Number(
                        instance.Position?.Z
                    ) || 0
                )
                    .addScaledVector(
                        worldNormal,
                        amount /
                            2
                    );

            instance.Size =
                createVector3(
                    size.x,
                    size.y,
                    size.z
                );

            instance.Position =
                createVector3(
                    position.x,
                    position.y,
                    position.z
                );

            instance.CFrame =
                makeCFrameFromQuaternion(
                    position.x,
                    position.y,
                    position.z,
                    rotation
                );

            return true;
        };

    instance.getMass =
        instance.GetMass;

    instance.getRootPart =
        instance.GetRootPart;

    instance.resize =
        instance.Resize;

    addCommonInstanceApi(instance);
    Object.defineProperty(instance, "__destroyed", { value: false, writable: true, enumerable: false });

    // IMPORTANT: Parts must be registered so syncLuaInstances(), parenting,
    // Workspace:GetChildren(), joints, and the void system can see them.
    luaInstances.add(instance);

    return instance;
}


// ─── Classic 2010 SpawnLocation ───────────────────────────────────────────────
//
// SpawnLocation is rendered/physicalized exactly like a normal Part, but adds
// the classic spawn-specific properties used by old Roblox places.
function createLuaSpawnLocation() {
    const spawn =
        createLuaPart(
            "SpawnLocation"
        );

    spawn.Name =
        "SpawnLocation";

    // Classic SpawnLocation-specific properties.
    spawn.Enabled =
        true;

    spawn.Neutral =
        true;

    spawn.TeamColor =
        BrickColorApi.new(
            "Medium stone grey"
        );

    spawn.AllowTeamChangeOnTouch =
        false;

    // Classic SpawnLocation force-field duration property (seconds).

function createLuaSeat() {
    const seat =
        createLuaPart(
            "Seat"
        );

    seat.Name =
        "Seat";

    // Classic Seat state. Occupant is the Humanoid currently attached.
    seat.Disabled =
        false;

    seat.Occupant =
        null;

    // Supports the classic Seat:Sit(humanoid) API as well as automatic touch seating.
    seat.Sit =
        (...args) => {
            const humanoid =
                args.find(value =>
                    value &&
                    typeof value === "object" &&
                    value.ClassName === "Humanoid"
                ) ||
                currentPlayerHumanoid;

            if (
                humanoid ===
                currentPlayerHumanoid
            ) {
                seatPlayerOnSeat(
                    seat,
                    humanoid
                );
            }
        };

    return seat;
}

// ─── Classic 2010-style Sound ────────────────────────────────────────────────
//
// Security / asset rule for Blox Emulation:
// SoundId is ALWAYS resolved inside the local Sounds/ directory.
// Example:
//     sound.SoundId = "victory.wav"
// becomes:
//     Sounds/victory.wav
//
// URLs, drive paths, and ".." path traversal are rejected.
function normalizeLocalSoundId(value) {
    let id =
        String(
            value ?? ""
        ).trim();

    if (!id)
        return "";

    id =
        id.replace(
            /\\/g,
            "/"
        );

    // Accept users writing "Sounds/foo.wav" too, but normalize it back to
    // the relative SoundId Roblox-facing property.
    if (
        id.toLowerCase().startsWith(
            "sounds/"
        )
    ) {
        id =
            id.slice(7);
    }

    // Never allow external URLs, protocols, absolute paths, query strings,
    // fragments, or directory traversal outside the Sounds folder.
    if (
        /^[a-z][a-z0-9+.-]*:/i.test(id) ||
        id.startsWith("/") ||
        id.includes("..") ||
        id.includes("?") ||
        id.includes("#")
    ) {
        return "";
    }

    const pieces =
        id.split("/")
            .filter(piece =>
                piece &&
                piece !== "."
            );

    if (
        pieces.length === 0
    ) {
        return "";
    }

    return pieces.join("/");
}

function getLocalSoundPath(soundId) {
    const clean =
        normalizeLocalSoundId(
            soundId
        );

    return clean
        ? `Sounds/${clean}`
        : "";
}


// ─── Shared local Sound preloader/cache ───────────────────────────────────────
//
// Every Sound still owns its own HTMLAudioElement for independent playback,
// seeking, looping, pitch, and 3D positioning. These warm elements only start
// loading local files as early as possible so later playback usually hits the
// browser's already-warm media/HTTP cache.
const localSoundWarmCache =
    new Map();

function warmLocalSoundPath(path) {
    const cleanPath =
        String(
            path ??
            ""
        ).trim();

    if (
        !cleanPath ||
        !cleanPath.startsWith(
            "Sounds/"
        )
    ) {
        return null;
    }

    const existing =
        localSoundWarmCache.get(
            cleanPath
        );

    if (existing)
        return existing;

    const audio =
        new Audio();

    audio.preload =
        "auto";

    const entry = {
        audio,
        path:
            cleanPath,
        ready:
            false,
        failed:
            false
    };

    const markReady =
        () => {
            entry.ready =
                true;
        };

    audio.addEventListener(
        "loadedmetadata",
        markReady,
        {
            once:
                true
        }
    );

    audio.addEventListener(
        "canplay",
        markReady,
        {
            once:
                true
        }
    );

    audio.addEventListener(
        "error",
        () => {
            entry.failed =
                true;
        },
        {
            once:
                true
        }
    );

    localSoundWarmCache.set(
        cleanPath,
        entry
    );

    audio.src =
        cleanPath;

    try {
        audio.load();
    } catch {}

    return entry;
}

function warmLocalSoundId(soundId) {
    const path =
        getLocalSoundPath(
            soundId
        );

    return path
        ? warmLocalSoundPath(
            path
        )
        : null;
}

function prewarmLiteralSoundsFromLuauSource(
    source
) {
    const code =
        String(
            source ??
            ""
        );

    if (!code)
        return 0;

    const found =
        new Set();

    // Covers normal scripts and exporter output such as:
    // sound.SoundId = "engine.wav"
    // SoundId = 'alarm.mp3'
    const pattern =
        /\bSoundId\s*=\s*(["'])(.*?)\1/g;

    let match =
        null;

    while (
        (
            match =
                pattern.exec(
                    code
                )
        )
    ) {
        const id =
            normalizeLocalSoundId(
                match[2]
            );

        if (!id)
            continue;

        found.add(
            id
        );
    }

    for (
        const id of
        found
    ) {
        warmLocalSoundId(
            id
        );
    }

    return found.size;
}
