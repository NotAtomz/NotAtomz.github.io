            );

    const idleTarget =
        sittingPose ||
        climbingPose
            ? 0
            : ((!isWalking && playerState.grounded) ? 1 : 0);

    const jumpTarget =
        sittingPose
            ? 0
            : (
                climbingPose
                    ? 0.58
                    : (playerState.grounded ? 0 : 1)
            );

    const approach = (current, target, speed) => {
        const step = 1 - Math.exp(-speed * animDelta);
        return THREE.MathUtils.lerp(current, target, step);
    };

    anim.walkBlend = approach(anim.walkBlend, walkTarget, WALK_BLEND_SPEED);
    anim.idleBlend = approach(anim.idleBlend, idleTarget, IDLE_BLEND_SPEED);
    anim.jumpBlend = approach(anim.jumpBlend, jumpTarget, JUMP_BLEND_SPEED);

    // Preserve your tiny downward arm offset during the raised jump pose.
    const ARM_DOWN_STUDS = 0.01;
    const armDownLocal = ARM_DOWN_STUDS;

    limbs.leftArm.position.y =
        limbs.leftArmBaseY - (armDownLocal * anim.jumpBlend);

    limbs.rightArm.position.y =
        limbs.rightArmBaseY - (armDownLocal * anim.jumpBlend);

    // ─── ARM MOMENTUM / FLAIL ────────────────────────────────────────────────
    // This is separate from the walk/jump animation targets.
    // It behaves like loose motor inertia, so sudden body movement can make
    // both arms lag/flail a little before settling back.

    // How much the arms kick backward when beginning a stair climb.
    const STEP_ARM_KICK = THREE.MathUtils.degToRad(22);

    // How much starting/stopping horizontal movement affects the arms.
    const MOVE_ARM_MOMENTUM = THREE.MathUtils.degToRad(2.0);

    // Arm inertia spring.
    // Higher stiffness = arms recover faster.
    // Higher damping = less flailing/overshoot.
    const ARM_INERTIA_STIFFNESS = 24.0;
    const ARM_INERTIA_DAMPING = 5.0;

    // Clamp so momentum never sends the arms completely wild.
    const MAX_ARM_INERTIA =
        THREE.MathUtils.degToRad(38);

    // Give the arms a backward impulse only when a stair climb STARTS.
    // That prevents a constant force while walking up the whole step.
    if (steppingUp && !anim.wasStepping) {
        anim.armInertiaVelocity += STEP_ARM_KICK * 6.0;
    }

    anim.wasStepping = steppingUp;

    // Small inertia from sudden changes in horizontal movement speed.
    const horizontalSpeed =
        Math.sqrt(
            curVel.x * curVel.x +
            curVel.z * curVel.z
        );

    const speedChange =
        horizontalSpeed -
        anim.lastHorizontalSpeed;

    anim.armInertiaVelocity +=
        speedChange *
        MOVE_ARM_MOMENTUM;

    anim.lastHorizontalSpeed =
        horizontalSpeed;

    // Spring the extra arm angle back toward zero.
    anim.armInertiaVelocity +=
        (
            -anim.armInertiaAngle * ARM_INERTIA_STIFFNESS -
            anim.armInertiaVelocity * ARM_INERTIA_DAMPING
        ) * animDelta;

    anim.armInertiaAngle +=
        anim.armInertiaVelocity * animDelta;

    anim.armInertiaAngle =
        THREE.MathUtils.clamp(
            anim.armInertiaAngle,
            -MAX_ARM_INERTIA,
            MAX_ARM_INERTIA
        );

    // Only refresh the desired angles on the lower-rate animation tick.
    // This is what gives the motion a slightly stepped 2008 look while the
    // motors themselves remain smooth between target changes.
    anim.accumulator += animDelta;

    while (anim.accumulator >= anim.tickRate) {
        anim.accumulator -= anim.tickRate;

        const walkAngle = THREE.MathUtils.degToRad(25);
        const idleAngle = THREE.MathUtils.degToRad(3);

        const walkSwing =
            Math.sin(anim.walkPhase) * walkAngle;

        const idleSwing =
            Math.sin(anim.idlePhase) * idleAngle;

        // Jump arms use a fixed raised target. The jump weight overlaps with
        // the walk/idle weights instead of replacing them instantly.
        const jumpArm =
            THREE.MathUtils.degToRad(-180) * anim.jumpBlend;

        const climbArmFlail =
            climbingPose
                ? (
                    Math.sin(
                        anim.walkPhase *
                        1.35
                    ) *
                    THREE.MathUtils.degToRad(
                        34
                    )
                )
                : 0;

        const groundArmSwing =
            (walkSwing * anim.walkBlend) +
            (idleSwing * anim.idleBlend);

        const groundLegSwing =
            (walkSwing * anim.walkBlend) +
            (idleSwing * anim.idleBlend);

        if (sittingPose) {
            // User-requested classic seated pose: both arms and both legs point
            // straight forward while Humanoid.Sit is true.
            const seatedForward =
                THREE.MathUtils.degToRad(
                    -90
                );

            anim.armInertiaAngle =
                0;

            anim.armInertiaVelocity =
                0;

            anim.target.leftArm =
                seatedForward;

            anim.target.rightArm =
                seatedForward;

            anim.target.leftLeg =
                seatedForward;

            anim.target.rightLeg =
                seatedForward;
        } else {
            anim.target.leftArm =
                baseLA +
                groundArmSwing +
                jumpArm +
                climbArmFlail +
                anim.armInertiaAngle;

            anim.target.rightArm =
                baseRA -
                groundArmSwing +
                jumpArm -
                climbArmFlail +
                anim.armInertiaAngle;

            anim.target.leftLeg =
                baseLL -
                groundLegSwing;

            anim.target.rightLeg =
                baseRL +
                groundLegSwing;
        }

        // 2008 Tool holding pose: while a Tool is equipped, the right arm
        // smoothly points forward. Releasing/dropping the Tool removes this
        // override and the normal walk/idle motor target takes over again.
        if (
            !sittingPose &&
            equippedBackpackItem &&
            !equippedBackpackItem.__destroyed &&
            equippedBackpackItem.ClassName === "Tool" &&
            equippedBackpackItem.Parent === currentCharacterModel
        ) {
            anim.target.rightArm =
                THREE.MathUtils.degToRad(
                    -90
                );
        }
    }

    // ---------------------------------------------------------------------
    // Classic motor response
    // ---------------------------------------------------------------------
    // Instead of directly lerping rotations, each limb has angular velocity.
    // A spring-like pull moves it toward DesiredAngle and damping removes
    // energy. This allows jump -> walk and walk -> idle to overlap naturally.
    // ─── MOTOR SMOOTHNESS ────────────────────────────────────────────────────
    // MOTOR_STIFFNESS:
    //   higher = limbs chase targets faster / more responsive
    //   lower  = softer / floatier
    //
    // MOTOR_DAMPING:
    //   higher = smoother with less overshoot
    //   lower  = looser, more old-Roblox flailing
    //
    // MAX_ANGULAR_SPEED:
    //   absolute maximum limb rotation speed.
    const MOTOR_STIFFNESS = 55.0;
    const MOTOR_DAMPING = 3.5;
    const MAX_ANGULAR_SPEED = THREE.MathUtils.degToRad(520);

    function stepMotor(limb, key) {
        let current = limb.rotation.x;
        const target = anim.target[key];

        // Shortest angular path.
        let error = target - current;
        error = Math.atan2(Math.sin(error), Math.cos(error));

        let velocity = anim.velocity[key];

        velocity +=
            (error * MOTOR_STIFFNESS -
             velocity * MOTOR_DAMPING) * animDelta;

        velocity = THREE.MathUtils.clamp(
            velocity,
            -MAX_ANGULAR_SPEED,
            MAX_ANGULAR_SPEED
        );

        current += velocity * animDelta;

        anim.velocity[key] = velocity;
        limb.rotation.x = current;
    }

    stepMotor(limbs.leftArm,  "leftArm");
    stepMotor(limbs.rightArm, "rightArm");
    stepMotor(limbs.leftLeg,  "leftLeg");
    stepMotor(limbs.rightLeg, "rightLeg");
}
}

// Sync dynamic parts (non-player physics objects) to Three.js
function syncPhysObjects() {
    for (
        const part of
        physObjects
    ) {
        const body =
            part?.body;

        const mesh =
            part?.mesh;

        if (
            !body ||
            !mesh
        ) {
            continue;
        }

        const sleeping =
            typeof body.isSleeping ===
                "function"
                ? body.isSleeping()
                : false;

        // Rapier explicitly stops simulating sleeping bodies. Mirror that on
        // the JS/render side: sync once when entering sleep, then stop making
        // repeated WASM translation/rotation calls until it wakes.
        if (
            sleeping &&
            part.__bloxWasSleeping ===
                true
        ) {
            continue;
        }

        const t =
            body.translation();

        const r =
            body.rotation();

        mesh.position.set(
            t.x,
            t.y,
            t.z
        );

        mesh.quaternion.set(
            r.x,
            r.y,
            r.z,
            r.w
        );

        // Keep the Lua-facing BasePart transform authoritative with Rapier.
        // Previously only the Three.js mesh followed the rigid body, leaving
        // instance.Position/CFrame at the Part's original spawn transform.
        // That made scripts such as `Explosion.Position = meteor.Position` use
        // a stale position after the Part had moved under physics.
        const instance =
            part.luaInstance;

        if (
            instance &&
            !instance.__destroyed
        ) {
            if (instance.Position) {
                instance.Position.X = t.x;
                instance.Position.Y = t.y;
                instance.Position.Z = t.z;
            } else {
                instance.Position =
                    createVector3(
                        t.x,
                        t.y,
                        t.z
                    );
            }

            const q =
                new THREE.Quaternion(
                    r.x,
                    r.y,
                    r.z,
                    r.w
                ).normalize();

            instance.CFrame =
                makeCFrameFromQuaternion(
                    t.x,
                    t.y,
                    t.z,
                    q
                );

            const euler =
                new THREE.Euler()
                    .setFromQuaternion(
                        q,
                        "XYZ"
                    );

            const ox =
                THREE.MathUtils.radToDeg(
                    euler.x
                );

            const oy =
                THREE.MathUtils.radToDeg(
                    euler.y
                );

            const oz =
                THREE.MathUtils.radToDeg(
                    euler.z
                );

            if (instance.Orientation) {
                instance.Orientation.X = ox;
                instance.Orientation.Y = oy;
                instance.Orientation.Z = oz;
            } else {
                instance.Orientation =
                    createVector3(
                        ox,
                        oy,
                        oz
                    );
            }

            const linearVelocity =
                typeof body.linvel === "function"
                    ? body.linvel()
                    : null;

            if (linearVelocity) {
                if (instance.Velocity) {
                    instance.Velocity.X = linearVelocity.x;
                    instance.Velocity.Y = linearVelocity.y;
                    instance.Velocity.Z = linearVelocity.z;
                } else {
                    instance.Velocity =
                        createVector3(
                            linearVelocity.x,
                            linearVelocity.y,
                            linearVelocity.z
                        );
                }
            }

            const angularVelocity =
                typeof body.angvel === "function"
                    ? body.angvel()
                    : null;

            if (angularVelocity) {
                if (instance.RotVelocity) {
                    instance.RotVelocity.X = angularVelocity.x;
                    instance.RotVelocity.Y = angularVelocity.y;
                    instance.RotVelocity.Z = angularVelocity.z;
                } else {
                    instance.RotVelocity =
                        createVector3(
                            angularVelocity.x,
                            angularVelocity.y,
                            angularVelocity.z
                        );
                }
            }

            // syncLuaInstances() treats __last as the last transform Lua wrote.
            // Advance these caches with physics-owned movement so the next frame
            // does not mistake this live Rapier transform for a new Lua teleport
            // and write it back into the rigid body.
            if (instance.__last) {
                instance.__last.Position = [
                    t.x,
                    t.y,
                    t.z
                ];

                instance.__last.Orientation = [
                    ox,
                    oy,
                    oz
                ];

                if (linearVelocity) {
                    instance.__last.Velocity = [
                        linearVelocity.x,
                        linearVelocity.y,
                        linearVelocity.z
                    ];
                }

                if (angularVelocity) {
                    instance.__last.RotVelocity = [
                        angularVelocity.x,
                        angularVelocity.y,
                        angularVelocity.z
                    ];
                }
            }
        }

        part.__bloxWasSleeping =
            sleeping;
    }
}

// ─── Classic camera wall / object collision ─────────────────────────────────
//
// The camera's requested position is tested against world Parts from the
// character's camera focus point. If a wall/object is between the player and
// camera, the camera is pulled in front of that obstacle.
//
// Several parallel rays are used instead of one center ray. This approximates
// the camera having a small radius, which helps prevent clipping through
// corners and thin edges.
const CAMERA_COLLISION_PADDING = 0.35;
const CAMERA_COLLISION_RADIUS = 0.30;
const CAMERA_MIN_COLLISION_DISTANCE = 0.20;

// When an obstruction disappears the camera eases back outward instead of
// instantly popping to the full zoom distance.
const CAMERA_COLLISION_RELEASE_SPEED = 14.0;

function resolveCameraCollision(
    focus,
    requestedPosition
) {
    const offset =
        requestedPosition.clone()
            .sub(focus);

    const requestedDistance =
        offset.length();

    if (
        requestedDistance <=
        CAMERA_MIN_COLLISION_DISTANCE
    ) {
        return {
            position:
                requestedPosition.clone(),

            obstructed:
                false,

            distance:
                requestedDistance
        };
    }

    const direction =
        offset.clone()
            .normalize();

    // Build a stable basis perpendicular to the camera ray.
    let right =
        new THREE.Vector3()
            .crossVectors(
                direction,
                new THREE.Vector3(
                    0,
                    1,
                    0
                )
            );

    if (
        right.lengthSq() <
        0.000001
    ) {
        right.set(
            1,
            0,
            0
        );
    } else {
        right.normalize();
    }

    const up =
        new THREE.Vector3()
            .crossVectors(
                right,
                direction
            )
            .normalize();

    // Center + side/top samples approximate the physical camera volume.
    // We deliberately do not cast a lower ray because it can make the floor
    // unnecessarily force the camera toward the character.
    const rayOffsets = [
        new THREE.Vector3(),

        right.clone()
            .multiplyScalar(
                CAMERA_COLLISION_RADIUS
            ),

        right.clone()
            .multiplyScalar(
                -CAMERA_COLLISION_RADIUS
            ),

        up.clone()
            .multiplyScalar(
                CAMERA_COLLISION_RADIUS
            ),

        right.clone()
            .add(up)
            .normalize()
            .multiplyScalar(
                CAMERA_COLLISION_RADIUS
            ),

        right.clone()
            .negate()
            .add(up)
            .normalize()
            .multiplyScalar(
                CAMERA_COLLISION_RADIUS
            )
    ];

    let nearestDistance =
        requestedDistance;

    let obstructed =
        false;

    for (
        const sampleOffset of
        rayOffsets
    ) {
        const rayOrigin =
            focus.clone()
                .add(
                    sampleOffset
                );

        const rayDestination =
            requestedPosition.clone()
                .add(
                    sampleOffset
                );

        const rayDirection =
            rayDestination.clone()
                .sub(
                    rayOrigin
                );

        const hit =
            raycastLuaParts(
                createVector3(
                    rayOrigin.x,
                    rayOrigin.y,
                    rayOrigin.z
                ),

                createVector3(
                    rayDirection.x,
                    rayDirection.y,
                    rayDirection.z
                ),

                // Never let the player's own R6 body block its camera.
                currentCharacterModel
            );

        if (!hit)
            continue;

        obstructed =
            true;

        nearestDistance =
            Math.min(
                nearestDistance,
                hit.distance
            );
    }

    if (!obstructed) {
        return {
            position:
                requestedPosition.clone(),

            obstructed:
                false,

            distance:
                requestedDistance
        };
    }

    const safeDistance =
        THREE.MathUtils.clamp(
            nearestDistance -
            CAMERA_COLLISION_PADDING,

            CAMERA_MIN_COLLISION_DISTANCE,

            requestedDistance
        );

    return {
        position:
            focus.clone()
                .add(
                    direction.multiplyScalar(
                        safeDistance
                    )
                ),

        obstructed:
            true,

        distance:
            safeDistance
    };
}

function getCameraSubjectWorldPosition() {
    const subject =
        CameraApi.CameraSubject;

    if (
        !subject ||
        subject ===
            currentPlayerHumanoid
    ) {
        return getCameraFollowWorldPosition();
    }

    if (
        isA?.(
            subject,
            "BasePart"
        )
    ) {
        return getBasePartWorldPosition(
            subject
        );
    }

    if (
        subject.ClassName ===
        "Humanoid"
    ) {
        const anchor =
            getHumanoidNameplateAnchorPart(
                subject
            );

        return anchor
            ? getBasePartWorldPosition(
                anchor
            )
            : null;
    }

    if (
        subject.ClassName ===
        "Model"
    ) {
        const anchor =
            subject.PrimaryPart ||
            subject.FindFirstChild?.(
                "Head",
                true
            ) ||
            subject.FindFirstChild?.(
                "Torso",
                true
            ) ||
            getLuaDescendants(
                subject
            ).find(item =>
                isA(
                    item,
                    "BasePart"
                )
            );

        return anchor
            ? getBasePartWorldPosition(
                anchor
            )
            : null;
    }

    return getCameraFollowWorldPosition();
}

function updateCamera(delta) {
    if (!player) return;

    camera.fov =
        THREE.MathUtils.clamp(
            Number(
                CameraApi.FieldOfView
            ) || 75,
            1,
            120
        );

    camera.updateProjectionMatrix();

    syncCameraFrameAliases();

    const cameraType =
        String(
            CameraApi.CameraType ||
            "Custom"
        );

    const directCameraMode =
        (
            cameraType ===
                "Scriptable" ||
            cameraType ===
                "Fixed"
        );

    const previousCameraType =
        String(
            CameraApi
                .__cameraFrameState
                ?.CameraType ||
            "Custom"
        );

    if (
        (
            previousCameraType ===
                "Scriptable" ||
            previousCameraType ===
                "Fixed"
        ) &&
        !directCameraMode
    ) {
        // Resume the normal camera from the exact scripted position rather than
        // snapping from an old pre-scriptable CAM.currentPos.
        CAM.currentPos.copy(
            camera.position
        );
    }

    if (
        CameraApi.__cameraFrameState
    ) {
        CameraApi.__cameraFrameState.CameraType =
            cameraType;
    }

    const trackedCharacterPosition =
        getCameraSubjectWorldPosition();

    // If both Head and Torso are gone, intentionally keep the last valid
    // camera focus. This is preferable to snapping to the disabled capsule.
    const headWorldPosition =
        trackedCharacterPosition ||
        CAM.targetOffset.clone();

    // Scriptable uses the exact CFrame/CoordinateFrame supplied by the script.
    // Fixed keeps the scripted position but points toward Focus.
    if (
        directCameraMode
    ) {
        const cf =
            CameraApi.CFrame;

        camera.position.set(
            Number(cf?.X)||0,
            Number(cf?.Y)||0,
            Number(cf?.Z)||0
        );

        camera.quaternion.copy(
            quaternionFromCFrameValue(
                cf
            )
        );

        CameraApi.CoordinateFrame =
            CameraApi.CFrame;

        if (
            cameraType ===
            "Fixed"
        ) {
            const focus =
                CameraApi.Focus;

            camera.lookAt(
                new THREE.Vector3(
                    Number(focus?.X) || 0,
                    Number(focus?.Y) || 0,
                    Number(focus?.Z) || 0
                )
            );
        }

        markCameraFrameAliasesSynced();

        // Still use camera distance for the Roblox-like local-character fade.
        const scriptableDistance =
            camera.position.distanceTo(
                headWorldPosition
            );

        applyCameraCharacterTransparency(
            cameraFadeForDistance(
                scriptableDistance
            ),
            delta
        );

        return;
    }

    // Keep first-person state tied to the closest zoom step.
    CAM.firstPerson =
        CAM.zoomCurrent <=
        FIRST_PERSON_ZOOM_DISTANCE +
        0.001;

    const vOffset =
        zoomVerticalOffset(
            CAM.zoomCurrent
        );

    // IMPORTANT:
    // Follow the ACTUAL world-space Head position rather than reconstructing
    // a Y value from playerRoot. This includes the visual rig's 0.5 stud
    // offset and any future head/neck motion.
    const lookTarget =
        headWorldPosition
            .clone();

    if (
        trackedCharacterPosition
    ) {
        if (!CAM.firstPerson) {
            lookTarget.y +=
                vOffset;

            CAM.targetOffset.lerp(
                lookTarget,
                1 -
                Math.pow(
                    0.001,
                    delta
                )
            );
        } else {
            // First person stays attached to whichever valid character target
            // exists. Normally this is the Head; Torso is the fallback.
            CAM.targetOffset.copy(
                trackedCharacterPosition
            );
        }
    }
    // No Head and no Torso: CAM.targetOffset is intentionally left unchanged.

    const dist =
        CAM.zoomCurrent;

    // Camera look vector matching the emulator's existing yaw/pitch convention.
    const viewDirection =
        new THREE.Vector3(
            Math.sin(
                CAM.yaw
            ),
            Math.sin(
                CAM.pitch
            ),
            -Math.cos(
                CAM.yaw
            )
        )
            .normalize();

    let focusPoint =
        CAM.targetOffset;

    const desiredFirstPersonBlend =
        CAM.firstPerson
            ? 1
            : 0;

    firstPersonBlend =
        THREE.MathUtils.lerp(
            firstPersonBlend,
            desiredFirstPersonBlend,
            1 -
            Math.exp(
                -FIRST_PERSON_BLEND_SPEED *
                delta
            )
        );

    if (CAM.firstPerson) {
        // Blend the final few inches into first person instead of snapping
        // immediately from the close third-person camera to the Head center.
        const closeThirdPersonPosition =
            new THREE.Vector3(
                CAM.targetOffset.x -
                dist *
                Math.sin(
                    CAM.yaw
                ),

                CAM.targetOffset.y -
                dist *
                Math.sin(
                    CAM.pitch
                ),

                CAM.targetOffset.z +
                dist *
                Math.cos(
                    CAM.yaw
                )
            );

        CAM.currentPos
            .copy(
                closeThirdPersonPosition
            )
            .lerp(
                headWorldPosition,
                firstPersonBlend
            );

        camera.position.copy(
            CAM.currentPos
        );

        focusPoint =
            headWorldPosition
                .clone()
                .add(
                    viewDirection
                        .clone()
                        .multiplyScalar(
                            10
                        )
                );

        camera.lookAt(
            focusPoint
        );
    } else {
        const requestedCameraPosition =
            new THREE.Vector3(
                CAM.targetOffset.x -
                dist *
                Math.sin(
                    CAM.yaw
                ),

                CAM.targetOffset.y -
                dist *
                Math.sin(
                    CAM.pitch
                ),

                CAM.targetOffset.z +
                dist *
                Math.cos(
                    CAM.yaw
                )
            );

        const collision =
            resolveCameraCollision(
                CAM.targetOffset,
                requestedCameraPosition
            );

        if (
            collision.obstructed
        ) {
            // Pull inward immediately so the camera never remains behind a wall.
            CAM.currentPos.copy(
                collision.position
            );
        } else {
            // Smoothly return to the requested third-person distance.
            CAM.currentPos.lerp(
                collision.position,
                1 -
                Math.exp(
                    -CAMERA_COLLISION_RELEASE_SPEED *
                    delta
                )
            );
        }

        camera.position.copy(
            CAM.currentPos
        );

        camera.lookAt(
            CAM.targetOffset
        );

        focusPoint =
            CAM.targetOffset;
    }

    // Roblox-like character fading based on ACTUAL camera distance.
    // This also reacts when camera collision pushes the view closer to the R6.
    const cameraToHeadDistance =
        camera.position.distanceTo(
            headWorldPosition
        );

    const fadeTarget =
        CAM.firstPerson
            ? Math.max(
                firstPersonBlend,
                cameraFadeForDistance(
                    cameraToHeadDistance
                )
            )
            : cameraFadeForDistance(
                cameraToHeadDistance
            );

    applyCameraCharacterTransparency(
        fadeTarget,
        delta
    );

    CameraApi.CFrame =
        makeCFrameFromQuaternion(
            camera.position.x,
            camera.position.y,
            camera.position.z,
            camera.quaternion
        );

    CameraApi.CoordinateFrame =
        CameraApi.CFrame;

    CameraApi.Focus =
        createCFrame(
            focusPoint.x,
            focusPoint.y,
            focusPoint.z
        );

    if (!CameraApi.CameraSubject)
        CameraApi.CameraSubject =
            currentPlayerHumanoid;

    markCameraFrameAliasesSynced();
}

let scriptRuntimeSeconds = 0;
let lastAppliedRapierGravity = 50;

function getBloxPhysicsDiagnostics() {
    const velocity =
        playerBody?.linvel?.() ||
        {
            x: 0,
            y: 0,
            z: 0
        };

    return {
        fixedTimestep:
            PHYSICS_FIXED_TIMESTEP,

        maxSubsteps:
            PHYSICS_MAX_SUBSTEPS,

        accumulator:
            physicsAccumulator,

        playerVisualLead:
            THREE.MathUtils.clamp(
                physicsAccumulator,
                0,
                PHYSICS_FIXED_TIMESTEP
            ),

        playerWalkSpeed:
            playerState.moveSpeed,

        humanoidWalkSpeed:
            Number(
                currentPlayerHumanoid?.WalkSpeed
            ) || 0,

        playerGravityScale:
            playerBody?.gravityScale?.() ??
            PLAYER_GRAVITY_SCALE,

        effectivePlayerGravity:
            (
                Number(
                    workspaceApi.Gravity
                ) || 0
            ) *
            (
                playerBody?.gravityScale?.() ??
                PLAYER_GRAVITY_SCALE
            ),

        playerJumpVelocity:
            playerState.jumpPower,

        playerVelocity: {
            x:
                velocity.x,
            y:
                velocity.y,
            z:
                velocity.z
        },

        workspaceGravity:
            Number(
                workspaceApi.Gravity
            ) || 0
    };
}

window.getBloxPhysicsDiagnostics =
    getBloxPhysicsDiagnostics;

window.getBloxLuaSchedulerStats = async function() {
    const stats = LuaSchedulerBridge.Stats;

    if (typeof stats !== "function")
        return null;

    try {
        const result = await runLuaVmSerialized(
            "Luau scheduler stats",
            () => stats()
        );

        return result;
    } catch (error) {
        console.error("[Lua Scheduler Stats]", error);
        return null;
    }
};

function animate() {
    requestAnimationFrame(animate);

    // Keep two deltas:
    // - rawDelta drives the fixed-step Rapier accumulator so a heavy frame does
    //   not make gravity/player motion enter slow motion.
    // - delta stays clamped for animation/camera smoothing and script-facing
    //   frame work, preventing one hitch from producing a huge visual jump.
    const rawDelta =
        Math.min(
            Math.max(
                clock.getDelta(),
                0
            ),
            0.10
        );

    const delta =
        Math.min(
            rawDelta,
            0.05
        );

    scriptRuntimeSeconds +=
        rawDelta;

    // Workspace.Gravity controls Rapier globally.
    const gravityValue =
        Math.max(
            0,
            Number(
                workspaceApi.Gravity
            ) || 0
        );

    if (
        gravityValue !==
        lastAppliedRapierGravity
    ) {
        world.gravity = {
            x: 0,
            y: -gravityValue,
            z: 0
        };

        lastAppliedRapierGravity =
            gravityValue;
    }

    // Classic RunService ordering:
    // Stepped -> physics/update -> Heartbeat -> camera -> RenderStepped -> render

    // Historical-style Stepped arguments: elapsed runtime, delta.
    // Frame callbacks are fired by the pure-Luau scheduler, not JS signal wrappers.
    queueManagedRunServicePhase(
        "Stepped",
        scriptRuntimeSeconds,
        delta
    );

    const physicsSteps =
        stepRapierPhysics(
            rawDelta
        );

    // Inspect the raw post-physics result before updatePlayer() writes the next
    // controlled movement velocity. Do not resample an unchanged physics state
    // on high-refresh render frames where no 60 Hz physics tick was required.
    if (
        physicsSteps >
        0
    ) {
        detectPhysicsInstability(
            delta
        );
    }

    updateVoid();

    syncLuaValueObjects();
    syncLuaSounds();

    // Scripted visual effects.
    syncLuaDecals();
    syncLuaScreenGuis();
    syncLuaBillboardGuis();
    syncLuaParticleEmitters(delta);
    syncLuaSparkles(delta);
    syncLuaMessages();
    syncLightingService();
    syncLuaExplosions();
    syncLuaForceFields();
    syncLocalPlayerTeamState();
    syncVisualParticles(delta);
    syncExplosionSpatialAudio();

    updateClassicHealthRegeneration(
        delta
    );

    syncHumanoids();
    updateClassicHealthHud();

    updatePlayer(delta);

    syncLuaInstances();
    syncLuaHierarchyEvents();
    syncClassicCoreUi();

    // BodyMovers apply velocity/force/orientation to dynamic BaseParts.
    syncLuaBodyMovers(delta);

    // Joint solver then maintains welded/motor-connected assemblies.
    syncLuaJoints(delta);

    syncPhysObjects();

    // Tool Handles are removed from ordinary physics sync while held and are
    // attached to the animated right-arm pivot instead.
    syncClassicEquippedToolGrip();

    // Character proxies mirror the actual animated R6 visual pieces.
    syncCharacterVisualInstances();

    // Body colors/clothing are resolved from each Humanoid's description. NPCs
    // only wear templates when they have the complete classic Torso/arms/legs.
    syncHumanoidAppearances();

    // Classic overhead Humanoid names + health bars for every non-local Humanoid.
    syncHumanoidNameplates();

    updateTouchedEvents();

    // Pickup is evaluated after Touched fires, so legacy Handle.Touched scripts
    // still see the contact before the core backpack moves the Tool.
    updateClassicToolPickup();

    updateSpawnSelectionEffect();
    syncSelectionBoxes();
    updateClassicClickMoveMarkers();

    // Keep Mouse.Hit/Target live even while the cursor is stationary and
    // objects move beneath it.
    updateMouseRay();

    // Resume any Luau coroutines whose wait()/delay() has expired.
    // The scheduler itself completes synchronously; no suspended JS Promise
    // remains inside the LuauState.
    tickLuaCoroutineScheduler();

    // Heartbeat runs after physics/update and receives delta time.
    queueManagedRunServicePhase(
        "Heartbeat",
        delta
    );

    updateCamera(delta);

    // Keep the directional-light shadow map centered on the player.
    // This prevents the player's shadow from being clipped by the old fixed
    // +/-80 world-space shadow-camera bounds on maps far from the origin.
    updateShadowCameraTarget();

    // Client-side visual callback immediately before rendering.
    queueManagedRunServicePhase(
        "RenderStepped",
        delta
    );

    renderer.render(
        scene,
        camera
    );
}

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__bloxClassic2008 = {
    getInventory: () => getClassicInventoryItems(),
    equip: item => equipClassicBackpackItem(item),
    unequip: () => releaseClassicBackpackItem(),
    drop: () => dropClassicEquippedTool(),
    refresh: () => syncClassicCoreUi(),
    chat: message => dispatchClassicPlayerChat(localPlayerApi, message, "All", null)
};

animate();

executeLuauScript();
</script>
