function getPartAABB(instance) {
    if (
        !instance ||
        !isA(instance, "BasePart") ||
        !instance.Position ||
        !instance.Size
    ) {
        return null;
    }

    const center = new THREE.Vector3(
        Number(instance.Position.X)||0,
        Number(instance.Position.Y)||0,
        Number(instance.Position.Z)||0
    );

    const half = new THREE.Vector3(
        Math.max(0.001, Number(instance.Size.X)||1) / 2,
        Math.max(0.001, Number(instance.Size.Y)||1) / 2,
        Math.max(0.001, Number(instance.Size.Z)||1) / 2
    );

    return new THREE.Box3(
        center.clone().sub(half),
        center.clone().add(half)
    );
}

function shouldIgnoreInstance(instance, ignore) {
    if (!ignore)
        return false;

    const ignored =
        Array.isArray(ignore)
            ? ignore
            : [ignore];

    for (const item of ignored) {
        if (!item)
            continue;

        if (instance === item)
            return true;

        let p = instance.Parent;

        while (p) {
            if (p === item)
                return true;

            p = p.Parent;
        }
    }

    return false;
}

function raycastLuaPartsLegacy(
    origin,
    direction,
    ignore = null,
    maxDistance = null
) {
    const o =
        new THREE.Vector3(
            Number(origin?.X)||0,
            Number(origin?.Y)||0,
            Number(origin?.Z)||0
        );

    const rawDir =
        new THREE.Vector3(
            Number(direction?.X)||0,
            Number(direction?.Y)||0,
            Number(direction?.Z)||0
        );

    const rawLength =
        rawDir.length();

    if (rawLength <= 1e-9)
        return null;

    const distance =
        maxDistance === null
            ? rawLength
            : Math.max(0, Number(maxDistance)||0);

    const dir =
        rawDir.clone().normalize();

    const ray =
        new THREE.Ray(
            o,
            dir
        );

    let best = null;

    for (const instance of luaInstances) {
        if (
            !instance ||
            instance.__destroyed ||
            !isA(instance, "BasePart") ||
            !isInWorkspace(instance) ||
            shouldIgnoreInstance(
                instance,
                ignore
            )
        ) {
            continue;
        }

        const box =
            getPartAABB(
                instance
            );

        if (!box)
            continue;

        const hitPoint =
            ray.intersectBox(
                box,
                new THREE.Vector3()
            );

        if (!hitPoint)
            continue;

        const hitDistance =
            hitPoint.distanceTo(o);

        if (
            hitDistance >
            distance + 1e-6
        ) {
            continue;
        }

        if (
            !best ||
            hitDistance <
            best.distance
        ) {
            const epsilon =
                1e-4;

            const normal =
                new THREE.Vector3();

            if (
                Math.abs(
                    hitPoint.x -
                    box.min.x
                ) < epsilon
            ) {
                normal.set(-1,0,0);
            } else if (
                Math.abs(
                    hitPoint.x -
                    box.max.x
                ) < epsilon
            ) {
                normal.set(1,0,0);
            } else if (
                Math.abs(
                    hitPoint.y -
                    box.min.y
                ) < epsilon
            ) {
                normal.set(0,-1,0);
            } else if (
                Math.abs(
                    hitPoint.y -
                    box.max.y
                ) < epsilon
            ) {
                normal.set(0,1,0);
            } else if (
                Math.abs(
                    hitPoint.z -
                    box.min.z
                ) < epsilon
            ) {
                normal.set(0,0,-1);
            } else {
                normal.set(0,0,1);
            }

            best = {
                instance,
                point:
                    hitPoint.clone(),
                normal,
                distance:
                    hitDistance
            };
        }
    }

    return best;
}


function raycastLuaParts(
    origin,
    direction,
    ignore = null,
    maxDistance = null
) {
    const o = {
        x:
            Number(
                origin?.X
            ) || 0,

        y:
            Number(
                origin?.Y
            ) || 0,

        z:
            Number(
                origin?.Z
            ) || 0
    };

    const dx =
        Number(
            direction?.X
        ) || 0;

    const dy =
        Number(
            direction?.Y
        ) || 0;

    const dz =
        Number(
            direction?.Z
        ) || 0;

    const rawLength =
        Math.hypot(
            dx,
            dy,
            dz
        );

    if (
        rawLength <=
        1e-9
    ) {
        return null;
    }

    const distance =
        maxDistance ===
            null
            ? rawLength
            : Math.max(
                0,
                Number(
                    maxDistance
                ) || 0
            );

    if (
        distance <=
        0
    ) {
        return null;
    }

    // Rapier's query pipeline is spatially accelerated. This replaces the old
    // O(number-of-Parts) JavaScript scan for every camera/mouse/workspace ray.
    if (
        typeof world.castRayAndGetNormal ===
        "function" &&
        rapierColliderOwners.size >
            0
    ) {
        const invLength =
            1 /
            rawLength;

        const dir = {
            x:
                dx *
                invLength,

            y:
                dy *
                invLength,

            z:
                dz *
                invLength
        };

        const ray =
            new RAPIER.Ray(
                o,
                dir
            );

        try {
            const hit =
                world.castRayAndGetNormal(
                    ray,
                    distance,
                    true,
                    undefined,
                    undefined,
                    undefined,
                    undefined,
                    collider => {
                        const instance =
                            getRapierColliderOwner(
                                collider
                            );

                        return Boolean(
                            instance &&
                            !instance.__destroyed &&
                            isA(
                                instance,
                                "BasePart"
                            ) &&
                            isInWorkspace(
                                instance
                            ) &&
                            !shouldIgnoreInstance(
                                instance,
                                ignore
                            )
                        );
                    }
                );

            if (hit) {
                const instance =
                    getRapierColliderOwner(
                        hit.collider
                    );

                if (instance) {
                    const toi =
                        Math.max(
                            0,
                            Number(
                                hit.toi
                            ) || 0
                        );

                    const normal =
                        hit.normal ||
                        {
                            x: 0,
                            y: 1,
                            z: 0
                        };

                    return {
                        instance,

                        point:
                            new THREE.Vector3(
                                o.x +
                                    dir.x *
                                    toi,

                                o.y +
                                    dir.y *
                                    toi,

                                o.z +
                                    dir.z *
                                    toi
                            ),

                        normal:
                            new THREE.Vector3(
                                Number(
                                    normal.x
                                ) || 0,

                                Number(
                                    normal.y
                                ) || 0,

                                Number(
                                    normal.z
                                ) || 0
                            ),

                        distance:
                            toi
                    };
                }
            }

            return null;
        } catch (error) {
            // Keep old behavior as a compatibility fallback if a CDN build has
            // a different scene-query signature.
            console.warn(
                "[Physics] Rapier ray query fallback:",
                error
            );
        }
    }

    return raycastLuaPartsLegacy(
        origin,
        direction,
        ignore,
        maxDistance
    );
}


// ─── Luau host collection compatibility ─────────────────────────────────────
//
// Raw JavaScript arrays exposed through luau-web don't behave exactly like
// native Luau arrays with #/ipairs. Query APIs therefore expose a small
// compatibility object:
//     result.Count
//     result.Length
//     result:Get(1)
//     result[1] ... result[n]
//
// This is an API compatibility fix, NOT one of the reverted performance
// optimizations.
function makeLuaCollection(items = []) {
    const values =
        Array.from(
            items || []
        );

    const table = {
        Count:
            values.length,

        Length:
            values.length,

        Get(...args) {
            const index =
                Math.trunc(
                    getNumberArg(
                        args,
                        1
                    ) || 1
                );

            if (
                index < 1 ||
                index > values.length
            ) {
                return null;
            }

            return values[
                index - 1
            ];
        },

        ToArray(...args) {
            return values.slice();
        }
    };

    for (
        let i = 0;
        i < values.length;
        i++
    ) {
        table[
            i + 1
        ] = values[i];
    }

    return Mutable(table);
}

workspaceApi.FindPartsInRegion3 =
    (...args) => {
        const region =
            args.find(v =>
                v &&
                typeof v === "object" &&
                v.CFrame &&
                v.Size
            );

        const ignore =
            args.find(v =>
                v &&
                typeof v === "object" &&
                v !== region &&
                v.ClassName
            );

        const maxParts =
            getNumberArg(
                args,
                20
            );

        if (!region)
            return makeLuaCollection();

        const center =
            new THREE.Vector3(
                Number(region.CFrame?.X) || 0,
                Number(region.CFrame?.Y) || 0,
                Number(region.CFrame?.Z) || 0
            );

        const half =
            new THREE.Vector3(
                Math.abs(
                    Number(region.Size?.X) || 0
                ) / 2,

                Math.abs(
                    Number(region.Size?.Y) || 0
                ) / 2,

                Math.abs(
                    Number(region.Size?.Z) || 0
                ) / 2
            );

        const query =
            new THREE.Box3(
                center.clone().sub(half),
                center.clone().add(half)
            );

        const results = [];

        for (
            const instance of
            luaInstances
        ) {
            if (
                !isA(instance, "BasePart") ||
                !isInWorkspace(instance) ||
                shouldIgnoreInstance(
                    instance,
                    ignore
                )
            ) {
                continue;
            }

            const box =
                getPartAABB(
                    instance
                );

            if (
                box &&
                query.intersectsBox(box)
            ) {
                results.push(instance);

                if (
                    maxParts > 0 &&
                    results.length >= maxParts
                ) {
                    break;
                }
            }
        }

        return makeLuaCollection(
            results
        );
    };

// ─── Phase 1: classic Roblox scripting runtime ────────────────────────────────
//
// The Luau VM already supplies the language itself:
//   if / elseif / else
//   while / repeat / for
//   functions / closures
//   coroutine
//   math / string / table
//
// This section supplies the Roblox host/runtime pieces those scripts expect:
//   wait(), spawn(), delay(), tick(), time()
//   task.wait/spawn/delay/defer
//   RunService.Stepped / Heartbeat / RenderStepped
//   Signal:Wait()
//
// Default legacy wait quantum. Old Roblox wait() generally yielded rather than
// busy-spinning the VM; keeping a small floor also prevents accidental
// `while true do wait() end` loops from monopolizing the browser.
const CLASSIC_WAIT_QUANTUM = 1 / 30;

// Timestamp used by time()/elapsedTime().
const SCRIPT_RUNTIME_START_MS = performance.now();

function normalizeWaitSeconds(value, defaultSeconds = CLASSIC_WAIT_QUANTUM) {
    const n = Number(value);

    if (!Number.isFinite(n))
        return defaultSeconds;

    return Math.max(0, n);
}

function sleepSeconds(seconds = CLASSIC_WAIT_QUANTUM) {
    const duration =
        normalizeWaitSeconds(
            seconds,
            CLASSIC_WAIT_QUANTUM
        );

    const started =
        performance.now();

    return new Promise(resolve => {
        // Even wait(0) yields to the browser instead of becoming a busy loop.
        const ms =
            Math.max(
                0,
                duration * 1000
            );

        setTimeout(
            () => {
                resolve(
                    (performance.now() - started) /
                    1000
                );
            },
            ms
        );
    });
}

// Legacy global wait(seconds).
// Returns actual elapsed seconds, matching classic Roblox's useful behavior.
async function classicWait(seconds = CLASSIC_WAIT_QUANTUM) {
    return await sleepSeconds(seconds);
}

function getLastCallableArgument(args) {
    for (let i = args.length - 1; i >= 0; i--) {
        if (typeof args[i] === "function")
            return args[i];
    }

    return null;
}
function getLastStringArgument(args, fallback = "") {
    for (let i = args.length - 1; i >= 0; i--) {
        if (typeof args[i] === "string")
            return args[i];
    }

    return fallback;
}


function getFirstNumericArgument(args, fallback = 0) {
    for (const arg of args) {
        if (typeof arg === "number" && Number.isFinite(arg))
            return arg;
    }

    return fallback;
}

function reportScheduledLuaError(label, error) {
    console.error(
        `[Lua] ${label}:`,
        error
    );
}

// Stable host-side scheduler guard. This does not attempt to re-enter the Luau
// WASM VM concurrently; it only bounds pending browser callbacks.
const MAX_PENDING_LUA_SCHEDULED_CALLBACKS = 1024;
let pendingLuaScheduledCallbacks = 0;
let scheduledLuaDropWarningAt = 0;

function reserveScheduledLuaCallback() {
    if (
        pendingLuaScheduledCallbacks >=
        MAX_PENDING_LUA_SCHEDULED_CALLBACKS
    ) {
        const now = performance.now();

        if (
            now -
            scheduledLuaDropWarningAt >
            1500
        ) {
            scheduledLuaDropWarningAt = now;

            console.warn(
                `[Lua] Scheduled callback limit (${MAX_PENDING_LUA_SCHEDULED_CALLBACKS}) reached; ` +
                "dropping new spawn/delay/defer work to keep memory bounded."
            );
        }

        return false;
    }

    pendingLuaScheduledCallbacks++;
    return true;
}

function releaseScheduledLuaCallback() {
    pendingLuaScheduledCallbacks =
        Math.max(
            0,
            pendingLuaScheduledCallbacks - 1
        );
}

function invokeScheduledLuaFunction(callback, label, ...args) {
    const result =
        runLuaVmSerialized(
            label,
            () =>
                callback(
                    ...args
                )
        );

    result
        .catch(error =>
            reportScheduledLuaError(
                label,
                error
            )
        )
        .finally(
            releaseScheduledLuaCallback
        );

    return result;
}

// Classic spawn(function).
// Schedules instead of running inline so the caller can continue.
function classicSpawn(...args) {
    const callback =
        getLastCallableArgument(args);

    if (!callback)
        throw new Error(
            "spawn expected a function"
        );

    if (
        !reserveScheduledLuaCallback()
    ) {
        return;
    }

    setTimeout(
        () =>
            invokeScheduledLuaFunction(
                callback,
                "spawn callback"
            ),
        0
    );
}

// Classic delay(seconds, function).
function classicDelay(...args) {
    const callback =
        getLastCallableArgument(args);

    if (!callback)
        throw new Error(
            "delay expected a function"
        );

    const seconds =
        getFirstNumericArgument(
            args,
            0
        );

    if (
        !reserveScheduledLuaCallback()
    ) {
        return;
    }

    setTimeout(
        () =>
            invokeScheduledLuaFunction(
                callback,
                "delay callback"
            ),
        Math.max(
            0,
            seconds * 1000
        )
    );
}

// Modern-style task table is included as a convenience while keeping the
// classic globals above. It is useful for emulator scripts even though the
// legacy globals remain the 2010-oriented API.
const TaskApi = Mutable({
    wait: classicWait,

    spawn(...args) {
        return classicSpawn(...args);
    },

    defer(...args) {
        const callback =
            getLastCallableArgument(args);

        if (!callback)
            throw new Error(
                "task.defer expected a function"
            );

        if (
            !reserveScheduledLuaCallback()
        ) {
            return;
        }

        queueMicrotask(
            () =>
                invokeScheduledLuaFunction(
                    callback,
                    "task.defer callback"
                )
        );
    },

    delay(...args) {
        return classicDelay(...args);
    }
});

function updateMouseRay() {
    const rect =
        canvas.getBoundingClientRect();

    const ndc =
        new THREE.Vector2(
            (
                (
                    MouseApi.X -
                    rect.left
                ) /
                Math.max(
                    1,
                    rect.width
                )
            ) *
            2 -
            1,
            -(
                (
                    MouseApi.Y -
                    rect.top
                ) /
                Math.max(
                    1,
                    rect.height
                )
            ) *
            2 +
            1
        );

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        ndc,
        camera
    );

    const origin =
        createVector3(
            raycaster.ray.origin.x,
            raycaster.ray.origin.y,
            raycaster.ray.origin.z
        );

    const direction =
        createVector3(
            raycaster.ray.direction.x * 1000,
            raycaster.ray.direction.y * 1000,
            raycaster.ray.direction.z * 1000
        );

    const hit =
        raycastLuaParts(
            origin,
            direction,
            currentCharacterModel
        );

    if (hit) {
        currentMouseWorldHit = {
            instance: hit.instance,
            point: {
                x: hit.point.x,
                y: hit.point.y,
                z: hit.point.z
            },
            normal: {
                x: hit.normal.x,
                y: hit.normal.y,
                z: hit.normal.z
            }
        };

        MouseApi.Target =
            hit.instance;

        MouseApi.Hit =
            createCFrame(
                hit.point.x,
                hit.point.y,
                hit.point.z
            );

        if (Math.abs(hit.normal.y) > 0.5) {
            MouseApi.TargetSurface =
                hit.normal.y > 0
                    ? "Top"
                    : "Bottom";
        } else if (
            Math.abs(hit.normal.x) > 0.5
        ) {
            MouseApi.TargetSurface =
                hit.normal.x > 0
                    ? "Right"
                    : "Left";
        } else {
            MouseApi.TargetSurface =
                hit.normal.z > 0
                    ? "Back"
                    : "Front";
        }
    } else {
        currentMouseWorldHit = null;

        MouseApi.Target = null;

        const p =
            raycaster.ray.origin
                .clone()
                .add(
                    raycaster.ray.direction
                        .clone()
                        .multiplyScalar(
                            1000
                        )
                );

        MouseApi.Hit =
            createCFrame(
                p.x,
                p.y,
                p.z
            );
    }
}

function fireContextActions(
    keyCode,
    state,
    inputObject
) {
    for (
        const [name, binding] of
        contextBindings
    ) {
        if (
            !binding.keyCodes.length ||
            binding.keyCodes.includes(
                keyCode
            )
        ) {
            runLuaVmSerialized(
                `ContextActionService.${name}`,
                () =>
                    binding.callback(
                        name,
                        state,
                        inputObject
                    )
            ).catch(error => {
                console.error(
                    "[ContextActionService]",
                    error
                );
            });
        }
    }
}

function syncCameraFrameAliases() {
    const state =
        CameraApi.__cameraFrameState;

    if (!state)
        return;

    const cframeChanged =
        CameraApi.CFrame !==
        state.CFrame;

    const coordinateChanged =
        CameraApi.CoordinateFrame !==
        state.CoordinateFrame;

    // CoordinateFrame is the name many old camera scripts use. If only that
    // alias changed, promote it to CFrame. Otherwise CFrame wins.
    if (
        coordinateChanged &&
        !cframeChanged
    ) {
        CameraApi.CFrame =
            CameraApi.CoordinateFrame;
    } else if (
        cframeChanged
    ) {
        CameraApi.CoordinateFrame =
            CameraApi.CFrame;
    }

    state.CFrame =
        CameraApi.CFrame;

    state.CoordinateFrame =
        CameraApi.CoordinateFrame;
}

function markCameraFrameAliasesSynced() {
    const state =
        CameraApi.__cameraFrameState;

    if (!state)
        return;

    state.CFrame =
        CameraApi.CFrame;

    state.CoordinateFrame =
        CameraApi.CoordinateFrame;

    state.CameraType =
        CameraApi.CameraType;
}

const CLASSIC_BRICK_COLOR_BY_NAME =
    new Map(
        CLASSIC_BRICK_COLOR_LIST.map(
            entry => [
                entry.Name.toLowerCase(),
                entry
            ]
        )
    );

const CLASSIC_BRICK_COLOR_BY_NUMBER =
    new Map(
        CLASSIC_BRICK_COLOR_LIST.map(
            entry => [
                entry.Number,
                entry
            ]
        )
    );

function makeBrickColor(entry) {
    return Mutable({
        Name:
            entry.Name,

        Number:
            entry.Number,

        Color:
            createColor3(
                entry.RGB[0] / 255,
                entry.RGB[1] / 255,
                entry.RGB[2] / 255
            ),

        r:
            entry.RGB[0] / 255,

        g:
            entry.RGB[1] / 255,

        b:
            entry.RGB[2] / 255
    });
}

function nearestBrickColorFromColor3(color) {
    const r =
        THREE.MathUtils.clamp(
            Number(color?.R) || 0,
            0,
            1
        ) * 255;

    const g =
        THREE.MathUtils.clamp(
            Number(color?.G) || 0,
            0,
            1
        ) * 255;

    const b =
        THREE.MathUtils.clamp(
            Number(color?.B) || 0,
            0,
            1
        ) * 255;

    let best =
        CLASSIC_BRICK_COLOR_BY_NAME.get(
            "medium stone grey"
        );

    let bestDistance =
        Infinity;

    for (
        const entry of
        CLASSIC_BRICK_COLOR_LIST
    ) {
        const dr =
            entry.RGB[0] - r;

        const dg =
            entry.RGB[1] - g;

        const db =
            entry.RGB[2] - b;

        const distance =
            dr * dr +
            dg * dg +
            db * db;

        if (
            distance <
            bestDistance
        ) {
            bestDistance =
                distance;

            best =
                entry;
        }
    }

    return best;
}

const BrickColorApi = Mutable({
    new(...args) {
        const values =
            args.filter(arg =>
                arg !== BrickColorApi
            );

        const value =
            values.length
                ? values[
                    values.length - 1
                ]
                : "Medium stone grey";

        let entry = null;

        if (
            typeof value === "string"
        ) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NAME.get(
                    value.toLowerCase()
                );
        } else if (
            typeof value === "number"
        ) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NUMBER.get(
                    Math.trunc(value)
                );
        } else if (
            value &&
            typeof value === "object"
        ) {
            if (
                typeof value.Number ===
                "number"
            ) {
                entry =
                    CLASSIC_BRICK_COLOR_BY_NUMBER.get(
                        Math.trunc(
                            value.Number
                        )
                    );
            }

            if (
                !entry &&
                typeof value.Name ===
                "string"
            ) {
                entry =
                    CLASSIC_BRICK_COLOR_BY_NAME.get(
                        value.Name.toLowerCase()
                    );
            }

            if (
                !entry &&
                "R" in value &&
                "G" in value &&
                "B" in value
            ) {
                entry =
                    nearestBrickColorFromColor3(
                        value
                    );
            }
        }

        if (!entry) {
            entry =
                CLASSIC_BRICK_COLOR_BY_NAME.get(
                    "medium stone grey"
                );
        }

        return makeBrickColor(
            entry
        );
    },

    palette(...args) {
        const index =
            Math.abs(
                Math.trunc(
                    getNumberArg(
                        args,
                        0
                    ) || 0
                )
            );

        const entry =
            CLASSIC_BRICK_COLOR_LIST[
                index %
                CLASSIC_BRICK_COLOR_LIST.length
            ];

        return makeBrickColor(
            entry
        );
    },

    random(...args) {
        const entry =
            CLASSIC_BRICK_COLOR_LIST[
                Math.floor(
                    Math.random() *
                    CLASSIC_BRICK_COLOR_LIST.length
                )
            ];

        return makeBrickColor(
            entry
        );
    }
});

function verifyPhase1Runtime() {
    const failures = [];

    if (gameApi.GetService("RunService") !== RunServiceApi)
        failures.push("game.GetService('RunService')");

    if (gameApi.GetService(gameApi, "RunService") !== RunServiceApi)
        failures.push("game:GetService('RunService') colon-style handling");

    if (gameApi.GetService("Players") !== PlayersApi)
        failures.push("game:GetService('Players')");

    if (gameApi.GetService("Workspace") !== workspaceApi)
        failures.push("game:GetService('Workspace')");

    for (const [name, signal] of [
        ["Stepped", RunServiceApi.Stepped],
        ["Heartbeat", RunServiceApi.Heartbeat],
        ["RenderStepped", RunServiceApi.RenderStepped]
    ]) {
        if (!luaSignalInternals.get(signal))
            failures.push(`RunService.${name}`);
    }

    if (failures.length) {
        console.error("[Phase 1] Runtime verification FAILED:", failures);
        return false;
    }

    console.log("[Phase 1] Runtime verification passed.");
    return true;
}

    if (

    ) {

            "NumberValue"

        !testHumanoid.IsA(

        )
    ) {
        failures.push(
            "Humanoid"
        );
    }

    const bc =
        BrickColorApi.new(

        );

    if (
        bc.Name !== "Bright red" ||
        bc.Number !== 21
    ) {
        failures.push(
            "BrickColor"
        );
    }

    const cf =
        CFrameApi.new(
            1,
            2,
            3
        );

    const rotated =
        CFrameApi.Angles(
            0,
            Math.PI / 2,
            0
        );

    const combined =
        cf.Multiply(
            rotated
        );

    if (
        Math.abs(
            combined.X - 1
        ) > 0.0001 ||
        Math.abs(
            combined.Y - 2
        ) > 0.0001 ||
        Math.abs(
            combined.Z - 3
        ) > 0.0001
    ) {
        failures.push(
            "CFrame multiply"
        );
    }

    if (failures.length) {
        console.error(
            "[Phase 2] Object verification FAILED:",

const CLASSIC_DATATYPE_BOOTSTRAP = `
-- Blox Emulation classic datatype / host-interop compatibility layer.
--
-- IMPORTANT: these locals intentionally live at CHUNK scope. The user's source
-- is concatenated directly after this prelude, so the locals below shadow the
-- readonly host globals without trying to overwrite the Luau environment.

local HostVector3 = Vector3
local HostCFrame = CFrame
local HostColor3 = Color3
local HostInstance = Instance
local HostGame = game
local HostIpairs = ipairs
local HostPairs = pairs

-- Yieldable protected-call compatibility used by many old Roblox scripts.
-- luau-web already supplies pcall; for this emulator ypcall is the classic alias.
local ypcall = pcall

-- ---------------------------------------------------------------------------
-- Host collection iteration
-- ---------------------------------------------------------------------------
-- luau-web JavaScript objects can report type(value) == "table" while still not
-- being native Luau tables. Blox collection objects expose Count/Length/Get, so
-- classic for _, value in ipairs(instance:GetChildren()) do ... end can still
-- work normally.
local function hostCollectionCount(value)
    if type(value) ~= "table" then
        return nil
    end

    local ok, count = pcall(function()
        return value.Count
    end)

    if ok and type(count) == "number" then
        return math.max(0, math.floor(count))
    end

    ok, count = pcall(function()
        return value.Length
    end)

    if ok and type(count) == "number" then
        return math.max(0, math.floor(count))
    end

    return nil
end

local function compatIpairs(value)
    local ok, iter, state, initial = pcall(HostIpairs, value)

    if ok then
        return iter, state, initial
    end

    local count = hostCollectionCount(value)

    if count ~= nil then
        local index = 0

        return function()
            index = index + 1

            if index <= count then
                local getOk, item = pcall(function()
                    return value:Get(index)
                end)

                if getOk then
                    return index, item
                end
            end
        end, nil, nil
    end

    error("invalid argument #1 to 'ipairs' (table expected)", 2)
end

local function compatPairs(value)
    local ok, iter, state, initial = pcall(HostPairs, value)

    if ok then
        return iter, state, initial
    end

    local count = hostCollectionCount(value)

    if count ~= nil then
        return compatIpairs(value)
    end

    error("invalid argument #1 to 'pairs' (table expected)", 2)
end

local ipairs = compatIpairs
local pairs = compatPairs

-- ---------------------------------------------------------------------------
-- Vector3
-- ---------------------------------------------------------------------------
-- JS Mutable objects cannot reliably receive a Lua metatable. Use a genuine
-- Luau table for script-facing Vector3 values. luau-web exposes native Lua
-- tables back to JavaScript through a property Proxy, so engine code can still
-- read/write value.X, value.Y and value.Z normally.
local vectorMeta = {}

local function isVector(value)
    if type(value) ~= "table" then
        return false
    end

    local ok, x, y, z = pcall(function()
        return value.X, value.Y, value.Z
    end)

    return ok
        and type(x) == "number"
        and type(y) == "number"
        and type(z) == "number"
end

local function makeVector3(x, y, z)
    local value = {
        X = tonumber(x) or 0,
        Y = tonumber(y) or 0,
        Z = tonumber(z) or 0
    }

    return setmetatable(value, vectorMeta)
end

local function copyVector3(value)
    if not isVector(value) then
        return value
    end

    local ok, mt = pcall(getmetatable, value)

    if ok and mt == vectorMeta then
        return value
    end

    return makeVector3(
        value.X,
        value.Y,
        value.Z
    )
end

vectorMeta.__index = function(value, key)
    if key == "Magnitude" or key == "magnitude" then
        return math.sqrt(
            value.X * value.X
            + value.Y * value.Y
            + value.Z * value.Z
        )
    end

    if key == "Unit" or key == "unit" then
        local magnitude = math.sqrt(
            value.X * value.X
            + value.Y * value.Y
            + value.Z * value.Z
        )

        if magnitude <= 1e-12 then
            return makeVector3(0, 0, 0)
        end

        return makeVector3(
            value.X / magnitude,
            value.Y / magnitude,
            value.Z / magnitude
        )
    end

    if key == "Dot" or key == "dot" then
        return function(a, b)
            if not isVector(b) then
                error("Vector3:Dot expected a Vector3", 2)
            end

            return a.X * b.X
                + a.Y * b.Y
                + a.Z * b.Z
        end
    end

    if key == "Cross" or key == "cross" then
        return function(a, b)
            if not isVector(b) then
                error("Vector3:Cross expected a Vector3", 2)
            end

            return makeVector3(
                a.Y * b.Z - a.Z * b.Y,
                a.Z * b.X - a.X * b.Z,
                a.X * b.Y - a.Y * b.X
            )
        end
    end

    if key == "Lerp" or key == "lerp" then
        return function(a, b, alpha)
            if not isVector(b) then
                error("Vector3:Lerp expected a Vector3", 2)
            end

            alpha = tonumber(alpha) or 0

            return makeVector3(
                a.X + (b.X - a.X) * alpha,
                a.Y + (b.Y - a.Y) * alpha,
                a.Z + (b.Z - a.Z) * alpha
            )
        end
    end

    return nil
end

vectorMeta.__add = function(a, b)
    if not isVector(a) or not isVector(b) then
        error("attempt to add Vector3 with non-Vector3 value", 2)
    end

    return makeVector3(
        a.X + b.X,
        a.Y + b.Y,
        a.Z + b.Z
    )
end

vectorMeta.__sub = function(a, b)
    if not isVector(a) or not isVector(b) then
        error("attempt to subtract Vector3 with non-Vector3 value", 2)
    end

    return makeVector3(
        a.X - b.X,
        a.Y - b.Y,
        a.Z - b.Z
    )
end

vectorMeta.__unm = function(a)
    return makeVector3(
        -a.X,
        -a.Y,
        -a.Z
    )
end

vectorMeta.__mul = function(a, b)
    if type(a) == "number" and isVector(b) then
        return makeVector3(
            a * b.X,
            a * b.Y,
            a * b.Z
        )
    end

    if isVector(a) and type(b) == "number" then
        return makeVector3(
            a.X * b,
            a.Y * b,
            a.Z * b
        )
    end

    if isVector(a) and isVector(b) then
        return makeVector3(
            a.X * b.X,
            a.Y * b.Y,
            a.Z * b.Z
        )
    end

    error("attempt to multiply incompatible Vector3 value", 2)
end

vectorMeta.__div = function(a, b)
    if isVector(a) and type(b) == "number" then
        return makeVector3(
            a.X / b,
            a.Y / b,
            a.Z / b
        )
    end

    if isVector(a) and isVector(b) then
        return makeVector3(
            a.X / b.X,
            a.Y / b.Y,
            a.Z / b.Z
        )
    end

    error("attempt to divide incompatible Vector3 value", 2)
end

vectorMeta.__eq = function(a, b)
    return isVector(a)
        and isVector(b)
        and a.X == b.X
        and a.Y == b.Y
        and a.Z == b.Z
end

vectorMeta.__tostring = function(value)
    return tostring(value.X)
        .. ", "
        .. tostring(value.Y)
        .. ", "
        .. tostring(value.Z)
end

local Vector3 = {
    new = makeVector3,
    zero = makeVector3(0, 0, 0),
    one = makeVector3(1, 1, 1)
}

-- Replace known JS-backed vector-valued Instance properties with genuine Luau
-- Vector3 tables. This is what makes hit.Position + Vector3.new(...) reliable.
local function decorateInstanceVectors(instance)
    if type(instance) ~= "table" then
        return instance
    end

    local vectorProperties = {
        "Position",
        "Size",
        "Orientation",
        "Velocity",
        "RotVelocity",
        "MoveDirection",
        "WalkToPoint",
        "TargetPoint",
        "StudsOffset",
        "Acceleration",
        "SpreadAngle",
        "MaxForce",
        "MaxTorque",
        "Force",
        "Location",
        "AngularVelocity"
    }

    for i = 1, #vectorProperties do
        local propertyName = vectorProperties[i]

        local ok, value = pcall(function()
            return instance[propertyName]
        end)

        if ok and isVector(value) then
            local converted = copyVector3(value)

            pcall(function()
                instance[propertyName] = converted
            end)
        end
    end

    -- ValueBase uses a generic property name, so only Vector3Value.Value should
    -- be converted into the native Luau Vector3 table used by script math.
    pcall(function()
        if instance.ClassName == "Vector3Value"
            and isVector(instance.Value) then

            instance.Value =
                copyVector3(
                    instance.Value
                )
        end
    end)

    return instance
end

-- JS host are converted before user code sees the new object.
local Instance = {
    new = function(...)
        local object = HostInstance.new(...)
        decorateInstanceVectors(object)
        return object
    end
}

        "Humanoid"

    for i = 1, #names do
        local ok, object = pcall(function()
            return character:FindFirstChild(names[i])

        if ok and object then
            decorateInstanceVectors(object)
        end
    end
end

-- CFrame math methods remain host-backed. Their vector arguments can be the

local CFrame = {

local Color3 = {

}

async function executeLuauScript() {

    const source =
        sessionStorage.getItem(
            "bloxScriptSource"
        );

        sessionStorage.getItem(
            "bloxScriptName"

    if (!source) {

        console.warn(
            "No Luau script was supplied."
        );

        return;

    }

    const prewarmedSoundCount =
        prewarmLiteralSoundsFromLuauSource(

        );

    if (
        prewarmedSoundCount >

    ) {
        console.log(
            `[Sound] Preloading ${prewarmedSoundCount} local sound asset(s).`
        );
    }

    try {

        activeLuauState =
    await LuauState.createAsync({

                game: gameApi,

                workspace: workspaceApi,

                Instance: InstanceApi,

                Vector3: Vector3Api,

                CFrame: CFrameApi,

                Color3: Color3Api,
                BrickColor: BrickColorApi,
                Enum: EnumApi,

                UDim: UDimApi,
                UDim2: UDim2Api,
                Rect: RectApi,
                Ray: RayApi,
                Region3: Region3Api,
                Axes: AxesApi,
                Faces: FacesApi,
                NumberRange: NumberRangeApi,
                NumberSequence: NumberSequenceApi,
                NumberSequenceKeypoint: NumberSequenceKeypointApi,
                ColorSequence: ColorSequenceApi,
                ColorSequenceKeypoint: ColorSequenceKeypointApi,

                // Classic services / aliases.
                RunService: RunServiceApi,
                UserInputService: UserInputServiceApi,
                ContextActionService: ContextActionServiceApi,

                // Yielding + scheduling.
                wait: classicWait,
                spawn: classicSpawn,
                delay: classicDelay,
                task: TaskApi,

                // Classic time helpers.
                tick: classicTick,
                time: classicTime,
                elapsedTime: classicTime,
                settings: classicSettings,

                print(...messages) {
                    console.log("[Lua]", ...messages);
                },

                warn(...messages) {
                    console.warn(
                        "[Luau]",
                        ...messages
                    );
                }

            });

        activeLuauChunk =
            activeLuauState.loadstring(
                CLASSIC_DATATYPE_BOOTSTRAP +
                    "\n" +
                    source,
                scriptName,
                true
            );

        await runLuaVmSerialized(
            `main chunk: ${scriptName}`,

                activeLuauChunk()

        // The Character exists before the uploaded map script runs. Once the

            "native Luau control flow/functions/coroutines/math/string/table;",
            "stable serialized wait/spawn/delay/task + bounded/coalesced RunService frame events."
        );

    } catch (error) {

        console.error(
            `[Luau] Error in ${scriptName}:`,
            error
        );

        if (error?.stack) {
            console.error(
                "[Luau] Stack:",
                error.stack
            );
        }

    }

}

function syncLuaValueObjects() {
    for (
        const instance of
        [...luaValueObjects]
    ) {
        if (
            !instance ||
            instance.__destroyed
        ) {
            continue;
        }

        const coerced =
            coerceValueObjectValue(
                instance.ClassName,
                instance.Value
            );

        if (
            coerced !==
            instance.Value
        ) {
            instance.Value =
                coerced;
        }

        const snapshot =
            valueObjectSnapshot(
                instance.ClassName,
                instance.Value
            );

        if (
            snapshot !==
            instance.__lastValueSnapshot
        ) {
            instance.__lastValue =
                instance.Value;

            instance.__lastValueSnapshot =
                snapshot;

            // ValueBase.Changed historically passes the new value.
            fireLuaSignal(
                instance.Changed,
                instance.Value
            );
        }
    }
}

// ─── Automatic classic Humanoid name + health display ───────────────────────

// Any non-local Humanoid gets a camera-facing name using its Parent.Name plus
// the classic green-over-red health bar directly underneath it.
// Examples:
//     Part > Humanoid       -> "Part"
//     Model "Zombie" > ...  -> "Zombie"
// The LocalPlayer Humanoid is deliberately excluded because its health is shown

//
// This deliberately uses only the era-appropriate Humanoid.Health / MaxHealth
// values. Modern HealthDisplayDistance / HealthDisplayType / DisplayDistanceType
// properties are not added to the classic-facing scripting API.
function removeHumanoidNameplate(
    humanoid
) {
    const record =
        humanoidNameplates.get(
            humanoid
        );

    if (!record)
        return;

    if (
        record.sprite?.parent
    ) {
        record.sprite.parent.remove(
            record.sprite
        );
    }

    record.texture?.dispose?.();
    record.material?.dispose?.();

    humanoidNameplates.delete(
        humanoid
    );
}

function getHumanoidNameplateAnchorPart(
    humanoid
) {
    const parent =
        humanoid?.Parent;

    if (
        !parent ||
        parent.__destroyed
    ) {
        return null;
    }

    if (
        isA?.(
            parent,
            "BasePart"
        )
    ) {
        return parent;
    }

    const preferred =
        [
            "Head",
            "Torso"
        ];

    for (
        const name of
        preferred
    ) {
        const part =
            parent.FindFirstChild?.(
                name,
                true
            );

        if (
            part &&
            isA(
                part,
                "BasePart"
            )
        ) {
            return part;
        }
    }

    if (
        parent.PrimaryPart &&
        isA(
            parent.PrimaryPart,
            "BasePart"
        )
    ) {
        return parent.PrimaryPart;
    }

    return (
        getLuaDescendants(
            parent
        ).find(item =>
            isA(
                item,
                "BasePart"
            )
        ) ||
        null
    );
}

function createHumanoidNameplate(

            maxHealthRaw >

        )
            ? maxHealthRaw

    // ─── Classic overhead health bar ─────────────────────────────────────────
    //
    // Red is always behind the green fill. As Health decreases, the green
    // shrinks from its RIGHT edge toward the left, revealing red behind it.
    const barWidth =
        200;

    const barHeight =
        20;

    const barX =
        (
            record.canvas.width -
            barWidth
        ) /
        2;

    const barY =
        106;

    // Thin dark outline keeps the bar readable against bright maps.
    ctx.fillStyle =
        "rgba(0,0,0,0.85)";

    ctx.fillRect(
        barX - 2,
        barY - 2,
        barWidth + 4,
        barHeight + 4
    );

    // Missing health.
    ctx.fillStyle =
        "#b51e1e";

    ctx.fillRect(
        barX,
        barY,
        barWidth,
        barHeight
    );

    // Current health.
    ctx.fillStyle =
        "#54d900";

    ctx.fillRect(
        barX,
        barY,
        barWidth *
            healthRatio,
        barHeight
    );

    record.texture.needsUpdate =
        true;
}

function syncHumanoidNameplates() {
    const alive =
        new Set();

    for (
        const humanoid of
        luaHumanoids
    ) {
        if (
            !humanoid ||
            humanoid.__destroyed ||
            humanoid ===
                currentPlayerHumanoid
        ) {
            removeHumanoidNameplate(
                humanoid
            );

            continue;
        }

        const parent =
            humanoid.Parent;

        const anchor =
            getHumanoidNameplateAnchorPart(
                humanoid
            );

        if (
            !parent ||
            !anchor ||
            anchor.__destroyed ||
            !isInWorkspace(
                anchor
            )
        ) {
            removeHumanoidNameplate(
                humanoid
            );

            continue;
        }

        alive.add(
            humanoid
        );

        const record =
            humanoidNameplates.get(
                humanoid
            ) ||
            createHumanoidNameplate(
                humanoid
            );

        redrawHumanoidNameplate(
            record,
            parent.Name,
            humanoid.Health,
            humanoid.MaxHealth
        );

        const mesh =
            getPartVisualMesh(
                anchor
            );

        if (!mesh) {
            record.sprite.visible =
                false;

            continue;
        }

        mesh.updateWorldMatrix(
            true,
            false
        );

        const position =
            mesh.getWorldPosition(
                new THREE.Vector3()
            );

        const height =
            Math.max(
                0.5,
                Number(
                    anchor.Size?.Y
                ) || 1
            );

        record.sprite.visible =
            true;

        record.sprite.position.set(
            position.x,
            position.y +
                height /
                    2 +
                1.2,
            position.z
        );
    }

    for (
        const humanoid of
        [...humanoidNameplates.keys()]
    ) {
        if (
            !alive.has(
                humanoid
            )
        ) {
            removeHumanoidNameplate(
                humanoid
            );
        }
    }
}


// ─── Classic Health HUD + regeneration ───────────────────────────────────────
//
// Classic-style regeneration: 1% of MaxHealth per second.
// At the normal 100 MaxHealth, this restores about 1 health per second.
const CLASSIC_HEALTH_REGEN_RATE = 0.01;

function updateClassicHealthHud() {
    if (!classicHealthFill)
        return;

    const humanoid =
        currentPlayerHumanoid;

    if (
        !humanoid ||
        humanoid.__destroyed
    ) {
        classicHealthFill.style.height =
            "0%";
        return;
    }

    const maxHealth =
        Math.max(
            0,
            Number(humanoid.MaxHealth) || 0
        );

    const health =
        THREE.MathUtils.clamp(
            Number(humanoid.Health) || 0,
            0,
            maxHealth
        );

    const percent =
        maxHealth > 0
            ? (health / maxHealth) * 100
            : 0;

    // Bottom anchored: losing health removes green from the TOP downward,
    // leaving the red damaged section visible above it like the 2010 HUD.
    classicHealthFill.style.height =
        `${percent}%`;
}

function updateClassicHealthRegeneration(delta) {
    const humanoid =
        currentPlayerHumanoid;

    if (
        !humanoid ||
        humanoid.__destroyed ||
        humanoid.__dead ||
        characterJointsBroken
    ) {
        return;
    }

    const maxHealth =
        Math.max(
            0,
            Number(humanoid.MaxHealth) || 0
        );

    const health =
        THREE.MathUtils.clamp(
            Number(humanoid.Health) || 0,
            0,
            maxHealth
        );

    if (
        maxHealth <= 0 ||
        health <= 0 ||
        health >= maxHealth
    ) {
        return;
    }

    humanoid.Health =
        Math.min(
            maxHealth,
            health +
                maxHealth *
                CLASSIC_HEALTH_REGEN_RATE *
                delta
        );
}


function syncHumanoids() {
    for (
        const humanoid of
        [...luaHumanoids]
    ) {
        if (
            !humanoid ||
            humanoid.__destroyed
        ) {
            continue;
        }

        const last =
            humanoid.__humanoidLast;

        const maxHealth =
            Math.max(
                0,
                Number(
                    humanoid.MaxHealth
                ) || 0
            );

        humanoid.MaxHealth =
            maxHealth;

        const health =
            THREE.MathUtils.clamp(
                Number(
                    humanoid.Health
                ) || 0,
                0,
                maxHealth
            );

        if (
            humanoid.Health !==
            health
        ) {
            humanoid.Health =
                health;
        }

        if (
            last.MaxHealth !==
            maxHealth
        ) {
            last.MaxHealth =
                maxHealth;

            fireChanged(
                humanoid,
                "MaxHealth"
            );
        }

        if (
            last.Health !==
            health
        ) {
            last.Health =
                health;

            fireChanged(
                humanoid,
                "Health"
            );

            fireLuaSignal(
                humanoid.HealthChanged,
                health
            );
        }

        for (
            const propertyName of
            [
                "WalkSpeed",
                "JumpPower",
                "Jump",
                "Sit",
                "PlatformStand",
                "AutoRotate"
            ]
        ) {
            if (
                last[propertyName] !==
                humanoid[propertyName]
            ) {
                last[propertyName] =
                    humanoid[propertyName];

                fireChanged(
                    humanoid,
                    propertyName
                );
            }
        }

        const walkPoint =
            humanoid.WalkToPoint ||
            createVector3();

        const walkPointSnapshot = [
            Number(
                walkPoint.X
            ) || 0,
            Number(
                walkPoint.Y
            ) || 0,
            Number(
                walkPoint.Z
            ) || 0
        ];

        const oldWalkPoint =
            last.WalkToPoint ||
            [0,0,0];

        if (
            walkPointSnapshot[0] !==
                oldWalkPoint[0] ||
            walkPointSnapshot[1] !==
                oldWalkPoint[1] ||
            walkPointSnapshot[2] !==
                oldWalkPoint[2]
        ) {
            last.WalkToPoint =
                walkPointSnapshot;

            fireChanged(
                humanoid,
                "WalkToPoint"
            );

            if (
                humanoid ===
                currentPlayerHumanoid
            ) {
                humanoid.__moveToActive =
                    true;

                humanoid.__moveToStartedAt =
                    performance.now();
            }
        }

        if (
            humanoid.WalkToPart !==
            last.WalkToPart
        ) {
            last.WalkToPart =
                humanoid.WalkToPart;

            fireChanged(
                humanoid,
                "WalkToPart"
            );

            if (
                humanoid ===
                currentPlayerHumanoid
            ) {
                humanoid.__moveToActive =
                    true;

                humanoid.__moveToStartedAt =
                    performance.now();
            }
        }

        const targetPoint =
            humanoid.TargetPoint ||
            createVector3();

        const targetSnapshot = [
            Number(
                targetPoint.X
            ) || 0,
            Number(
                targetPoint.Y
            ) || 0,
            Number(
                targetPoint.Z
            ) || 0
        ];

        const oldTarget =
            last.TargetPoint ||
            [0,0,0];

        if (
            targetSnapshot[0] !==
                oldTarget[0] ||
            targetSnapshot[1] !==
                oldTarget[1] ||
            targetSnapshot[2] !==
                oldTarget[2]
        ) {
            last.TargetPoint =
                targetSnapshot;

            fireChanged(
                humanoid,
                "TargetPoint"
            );
        }

        if (
            health <= 0 &&
            !humanoid.__dead
        ) {
            humanoid.__dead =
                true;

            fireLuaSignal(
                humanoid.Died
            );

            if (
                humanoid ===
                currentPlayerHumanoid
            ) {
                breakCharacterJoints();
            }

            console.log(
                "[Humanoid] Died"
            );
        }

        if (
            health > 0 &&
            humanoid.__dead &&
            !(
                humanoid === currentPlayerHumanoid &&
                characterJointsBroken
            )
        ) {
            humanoid.__dead =
                false;
        }
    }

    if (
        currentPlayerHumanoid &&
        !currentPlayerHumanoid.__destroyed
    ) {
        const h =
            currentPlayerHumanoid;

        const bodyVel =
            playerBody.linvel();

        const horizontalSpeed =
            Math.hypot(
                bodyVel.x,
                bodyVel.z
            );

        let state =
            "Running";

        if (h.__dead) {
            state = "Dead";
        } else if (h.PlatformStand) {
            state = "PlatformStanding";
        } else if (h.Sit) {
            state = "Seated";
        } else if (playerState.climbing) {
            state = "Climbing";
        } else if (!playerState.grounded) {
            state =
                bodyVel.y > 1
                    ? "Jumping"
                    : "Freefall";
        }

        const oldState =
            h.__humanoidLast.State ||
            "Running";

        if (state !== oldState) {
            h.__humanoidLast.State =
                state;

            fireLuaSignal(
                h.StateChanged,
                oldState,
                state
            );

            if (
                oldState ===
                    "Jumping" &&
                state !==
                    "Jumping"
            ) {
                fireLuaSignal(
                    h.Jumping,
                    false
                );
            }

            if (
                oldState ===
                    "Freefall" &&
                state !==
                    "Freefall"
            ) {
                fireLuaSignal(
                    h.FreeFalling,
                    false
                );
            }

            if (
                oldState ===
                    "Seated" &&
                state !==
                    "Seated"
            ) {
                fireLuaSignal(
                    h.Seated,
                    false,
                    null
                );
            }

            if (state === "Jumping") {
                fireLuaSignal(
                    h.Jumping,
                    true
                );
            }

            if (state === "Freefall") {
                fireLuaSignal(
                    h.FreeFalling,
                    true
                );
            }

            if (
                state ===
                "Seated"
            ) {
                fireLuaSignal(
                    h.Seated,
                    true,
                    currentSeat
                );
            }
        }

        if (
            Math.abs(
                horizontalSpeed -
                (
                    h.__humanoidLast.RunningSpeed ||
                    0
                )
            ) > 0.05
        ) {
            h.__humanoidLast.RunningSpeed =
                horizontalSpeed;

            fireLuaSignal(
                h.Running,
                horizontalSpeed
            );
        }

        const climbingSpeed =
            playerState.climbing
                ? (
                    playerState.moveSpeed *
                    PLAYER_CLIMB_SPEED_SCALE
                )
                : 0;

        if (
            Math.abs(
                climbingSpeed -
                (
                    h.__humanoidLast.ClimbingSpeed ||
                    0
                )
            ) >
                0.05
        ) {
            h.__humanoidLast.ClimbingSpeed =
                climbingSpeed;

            fireLuaSignal(
                h.Climbing,
                climbingSpeed
            );
        }

        h.FloorMaterial =
            playerState.grounded
                ? "Plastic"
                : "Air";

        if (
            h.__moveToActive
        ) {
            let target =
                new THREE.Vector3(
                    Number(
                        h.WalkToPoint?.X
                    ) || 0,
                    Number(
                        h.WalkToPoint?.Y
                    ) || 0,
                    Number(
                        h.WalkToPoint?.Z
                    ) || 0
                );

            const relativePart =
                h.WalkToPart;

            if (
                relativePart &&
                !relativePart.__destroyed &&
                isA(
                    relativePart,
                    "BasePart"
                )
            ) {
                const relativePosition =
                    getBasePartWorldPosition(
                        relativePart
                    );

                if (relativePosition) {
                    target.add(
                        relativePosition
                    );
                }
            }

            const pos =
                playerBody.translation();

            const deltaTo =
                target.sub(
                    new THREE.Vector3(
                        pos.x,
                        pos.y,
                        pos.z
                    )
                );

            deltaTo.y =
                0;

            const reached =
                deltaTo.length() <
                0.75;

            const timedOut =
                (
                    performance.now() -
                    Number(
                        h.__moveToStartedAt
                    )
                ) >=
                8000;

            if (
                reached ||
                timedOut
            ) {
                h.__moveToActive =
                    false;

                h.MoveDirection =
                    createVector3();

                fireLuaSignal(
                    h.MoveToFinished,
                    reached
                );
            } else {
                deltaTo.normalize();

                h.MoveDirection =
                    createVector3(
                        deltaTo.x,
                        0,
                        deltaTo.z
                    );
            }
        }

        // Keep the public Humanoid.WalkSpeed value intact while applying a
        // small visual/controller calibration. Default WalkSpeed 16 becomes
        // 14.4 studs/s instead of the slightly-too-fast previous 16.
        playerState.moveSpeed =
            Math.max(
                0,
                Number(
                    currentPlayerHumanoid.WalkSpeed
                ) || 0
            ) *
            PLAYER_WALK_SPEED_SCALE;

        // Preserve roughly the SAME jump height as the old gravity-50 setup,
        // while letting the stronger classic gravity make ascent/fall timing
        // appropriately snappier.
        playerState.jumpPower =
            Math.max(
                0,
                Number(
                    currentPlayerHumanoid.JumpPower
                ) || 0
            ) *
            PLAYER_CLASSIC_JUMP_SCALE;
    }
}

function color3ToHex(color) {
    const r =
        Math.round(
            THREE.MathUtils.clamp(
                Number(color?.R) || 0,
                0,
                1
            ) * 255
        );

    const g =
        Math.round(
            THREE.MathUtils.clamp(
                Number(color?.G) || 0,
                0,
                1
            ) * 255
        );

    const b =
        Math.round(
            THREE.MathUtils.clamp(
                Number(color?.B) || 0,
                0,
                1
            ) * 255
        );

    return (
        (r << 16) |
        (g << 8) |
        b
    );
}

function setVisualObjectColor(
    object,
    hex
) {
    if (!object)
        return;

    object.traverse?.(
        child => {
            if (!child.isMesh)
                return;

            const materials =
                Array.isArray(
                    child.material
                )
                    ? child.material
                    : [child.material];

            for (
                const material of
                materials
            ) {
                if (material?.color)
                    material.color.setHex(
                        hex
                    );
            }
        }
    );

    if (
        object.isMesh
    ) {
        const materials =
            Array.isArray(
                object.material
            )
                ? object.material
                : [object.material];

        for (
            const material of
            materials
        ) {
            if (material?.color)
                material.color.setHex(
                    hex
                );
        }
    }
}

function setVisualObjectTransparency(
    object,
    transparency
) {
    if (!object)
        return;

    const opacity =
        1 -
        THREE.MathUtils.clamp(
            Number(transparency) || 0,
            0,
            1
        );

    const apply =
        child => {
            if (!child?.isMesh)
                return;

            const materials =
                Array.isArray(
                    child.material
                )
                    ? child.material
                    : [child.material];

            for (
                const material of
                materials
            ) {
                if (!material)
                    continue;

                material.transparent =
                    opacity < 1;

                material.opacity =
                    opacity;

                material.needsUpdate =
                    true;
            }
        };

    object.traverse?.(
        apply
    );

    apply(object);
}

function getCharacterPartWorldPosition(
    partName
) {
    // Prefer the Lua Character proxy. During death its __internal.body points
    // at the detached ragdoll rigid body, so this follows the ACTUAL falling
    // body part instead of the old playerRoot.
    const proxy =
        currentCharacterModel &&
        !currentCharacterModel.__destroyed
            ? currentCharacterModel
                .FindFirstChild?.(
                    partName
                )
            : null;

    if (
        proxy &&
        !proxy.__destroyed
    ) {
        const body =
            proxy.__internal?.body;

        if (
            body &&
            typeof body.translation ===
                "function"
        ) {
            const t =
                body.translation();

            return new THREE.Vector3(
                t.x,
                t.y,
                t.z
            );
        }

        // Alive character Parts do not have their own rigid bodies, so use
        // their bound visual object.
        const binding =
            characterVisualBindings.find(
                entry =>
                    entry?.instance === proxy &&
                    entry.visualObject
            );

        if (binding?.visualObject) {
            binding.visualObject
                .updateWorldMatrix(
                    true,
                    false
                );

            return binding.visualObject
                .getWorldPosition(
                    new THREE.Vector3()
                );
        }
    }

    // The stable live Head root exists before the Lua proxy bindings finish.
    if (
        partName ===
        "Head"
    ) {
        const liveHead =
            playerRoot.getObjectByName(
                "head"
            );

        if (liveHead) {
            liveHead.updateWorldMatrix(
                true,
                false
            );

            return liveHead.getWorldPosition(
                new THREE.Vector3()
            );
        }
    }

    return null;
}

function getCameraFollowWorldPosition() {
    // Roblox-style death camera priority:
    //   1. Head
    //   2. Torso
    //   3. Nothing -> leave the camera target where it already was
    //
    // This works both while alive and while the R6 pieces are independent
    // Rapier rigid bodies after BreakJoints().
    return (
        getCharacterPartWorldPosition(
            "Head"
        ) ||
        getCharacterPartWorldPosition(
            "Torso"
        ) ||
        null
    );
}

function getPlayerHeadWorldPosition() {
    // Preserve this helper for existing code, but make it aware of ragdolls.
    // If the Head is gone, use the Torso. If both are gone, retain the most
    // recent camera focus rather than snapping back to playerRoot.
    return (
        getCameraFollowWorldPosition() ||
        CAM?.targetOffset?.clone?.() ||
        new THREE.Vector3(
            playerRoot.position.x,
            playerRoot.position.y +
                playerState.height *
                0.9,
            playerRoot.position.z
        )
    );
}

function applyCameraCharacterTransparency(
    targetTransparency,
    delta
) {
    const target =
        THREE.MathUtils.clamp(
            Number(
                targetTransparency
            ) || 0,
            0,
            1
        );

    const alpha =
        1 -
        Math.exp(
            -CHARACTER_FADE_SPEED *
            Math.max(
                0,
                delta
            )
        );

    cameraCharacterTransparency =
        THREE.MathUtils.lerp(
            cameraCharacterTransparency,
            target,
            alpha
        );

    // Camera fading is visual-only. It does NOT overwrite the Lua-facing
    // Part.Transparency value. Instead it is combined with each part's
    // existing transparency like Roblox's local character fade.
    for (
        const binding of
        characterVisualBindings
    ) {
        if (
            !binding?.instance ||
            binding.instance.__destroyed ||
            !binding.visualObject
        ) {
            continue;
        }

        const baseTransparency =
            THREE.MathUtils.clamp(
                Number(
                    binding.instance
                        .Transparency
                ) || 0,
                0,
                1
            );

        const combinedTransparency =
            1 -
            (
                1 -
                baseTransparency
            ) *
            (
                1 -
                cameraCharacterTransparency
            );

        setVisualObjectTransparency(
            binding.visualObject,
            combinedTransparency
        );
    }
}

function cameraFadeForDistance(
    distance
) {
    if (
        distance <=
        CHARACTER_FADE_FULL_DISTANCE
    ) {
        return 1;
    }

    if (
        distance >=
        CHARACTER_FADE_START_DISTANCE
    ) {
        return 0;
    }

    const visibleFactor =
        THREE.MathUtils.smoothstep(
            distance,
            CHARACTER_FADE_FULL_DISTANCE,
            CHARACTER_FADE_START_DISTANCE
        );

    return 1 -
        visibleFactor;
}

function makeCharacterPartInstance(
    name,
    visualObject,
    size,
    defaultColor,
    parentModel
) {
    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    name,

                ClassName:
                    "Part",

                Parent:
                    parentModel,

                Archivable:
                    true,

                Size:
                    createVector3(
                        size.x,
                        size.y,
                        size.z
                    ),

                Position:
                    createVector3(),

                Orientation:
                    createVector3(),

                CFrame:
                    createCFrame(),

                Color:
                    createColor3(
                        ((defaultColor >> 16) & 255) / 255,
                        ((defaultColor >> 8) & 255) / 255,
                        (defaultColor & 255) / 255
                    ),

                BrickColor:
                    BrickColorApi.new(
                        createColor3(
                            ((defaultColor >> 16) & 255) / 255,
                            ((defaultColor >> 8) & 255) / 255,
                            (defaultColor & 255) / 255
                        )
                    ),

                Transparency:
                    0,

                Reflectance:
                    0,

                Anchored:
                    false,

                CanCollide:
                    false,

                TopSurface:
                    "Studs",

                BottomSurface:
                    "Inlet",

                LeftSurface:
                    "Smooth",

                RightSurface:
                    "Smooth",

                FrontSurface:
                    "Smooth",

                BackSurface:
                    "Smooth",

                Touched:
                    createLuaSignal(
                        `${name}.Touched`
                    ),

                TouchEnded:
                    createLuaSignal(
                        `${name}.TouchEnded`
                    )
            }),
            {
                mesh:
                    visualObject,
                body:
                    null,
                isCharacterVisual:
                    true
            }
        );

    instance.MakeJoints =
        (...args) => {};

    instance.BreakJoints =
        (...args) => {
            // In a classic R6, losing the Head/Torso connection kills the Humanoid.
            // Character Part:BreakJoints() therefore enters the same no-joints death
            // lifecycle used by Health <= 0.
            if (
                currentPlayerHumanoid &&
                !currentPlayerHumanoid.__dead
            ) {
                currentPlayerHumanoid.Health =
                    0;
            }

            return breakCharacterJoints();
        };

    const binding = {
        instance,
        visualObject,
        lastColor:
            color3ToHex(
                instance.Color
            ),
        lastTransparency:
            0
    };

    characterVisualBindings.push(
        binding
    );

    refreshChildAliases(
        parentModel
    );

    return instance;
}

let characterJointsBroken = false;
const characterRagdollBodies = [];

function detachObjectPreserveWorld(object) {
    if (!object)
        return;

    object.updateWorldMatrix(
        true,
        false
    );

    const worldPos =
        new THREE.Vector3();

    const worldQuat =
        new THREE.Quaternion();

    const worldScale =
        new THREE.Vector3();

    object.matrixWorld.decompose(
        worldPos,
        worldQuat,
        worldScale
    );

    object.parent?.remove(
        object
    );

    scene.add(
        object
    );

    object.position.copy(
        worldPos
    );

    object.quaternion.copy(
        worldQuat
    );

    object.scale.copy(
        worldScale
    );
}

function makeCharacterRagdollBody(
    proxy,
    visual,
    size
) {
    detachObjectPreserveWorld(
        visual
    );

    const worldPos =
        new THREE.Vector3();

    const worldQuat =
        new THREE.Quaternion();

    visual.getWorldPosition(
        worldPos
    );

    visual.getWorldQuaternion(
        worldQuat
    );

    const bodyDesc =
        RAPIER.RigidBodyDesc
            .dynamic()
            .setTranslation(
                worldPos.x,
                worldPos.y,
                worldPos.z
            )
            // Death pieces belong to the player character, so preserve the same
            // classic 196.2-stud/s² gravity feel as the living capsule instead
            // of falling at the map world's intentionally lower gravity of 50.
            .setGravityScale(
                PLAYER_GRAVITY_SCALE
            )
            // Only six character pieces exist during death; CCD here keeps the
            // faster classic-gravity fall reliable against thin Parts.
            .setCcdEnabled(
                true
            );

    const body =
        world.createRigidBody(
            bodyDesc
        );

    body.setAdditionalSolverIterations?.(
        1
    );

    body.setRotation(
        {
            x: worldQuat.x,
            y: worldQuat.y,
            z: worldQuat.z,
            w: worldQuat.w
        },
        true
    );

    // Preserve the character's motion at the instant the joints break.
    const inheritedVelocity =
        playerBody?.linvel?.() ||
        { x: 0, y: 0, z: 0 };

    body.setLinvel(
        {
            x: inheritedVelocity.x,
            y: inheritedVelocity.y,
            z: inheritedVelocity.z
        },
        true
    );

    const collider =
        RAPIER.ColliderDesc
            .cuboid(
                size.x / 2,
                size.y / 2,
                size.z / 2
            )
            .setFriction(0.5)
            .setRestitution(0.05);

    const rapierCollider =
        world.createCollider(
            collider,
            body
        );

    const ragdollPart = {
        mesh:
            visual,
        body,
        collider:
            rapierCollider,
        w:
            size.x,
        h:
            size.y,
        d:
            size.z,
        anchored:
            false,
        canCollide:
            true,
        isCharacterVisual:
            false,

        // Detached R6 body pieces are driven by Rapier + syncPhysObjects().
        // They must NOT pass through syncLuaInstances(), because character
        // proxy Parts do not use the normal scripted-Part __last tracker.
        isCharacterRagdoll:
            true
    };

    physObjects.push(
        ragdollPart
    );

    characterRagdollBodies.push(
        ragdollPart
    );

    if (
        proxy?.__internal
    ) {
        // Point the proxy at the SAME object stored in physObjects so normal
        // Instance destruction removes the ragdoll body from every sync list.
        proxy.__internal =
            ragdollPart;
    }

    ragdollPart.luaInstance =
        proxy;

    registerRapierColliderOwner(
        proxy,
        rapierCollider
    );

    proxy.CanCollide =
        true;

    return ragdollPart;
}

function breakCharacterJoints() {
    if (
        characterJointsBroken ||
        !currentCharacterModel ||
        !player?.userData
            ?.characterParts
    ) {
        return 0;
    }

    characterJointsBroken =
        true;

    // Classic "oof/uuhhh" death sound. This is after the one-shot guard above,
    // so repeated Health sync / BreakJoints calls cannot spam the sound.
    playDeathSound();

    // Seats never survive character death. Remove SeatWeld/Occupant first.
    unseatPlayer(
        true
    );
