let classicSoundAudioContext =
    null;

function getClassicSoundAudioContext() {
    if (
        classicSoundAudioContext
    ) {
        return classicSoundAudioContext;
    }

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass)
        return null;

    try {
        classicSoundAudioContext =
            new AudioContextClass();

        return classicSoundAudioContext;
    } catch (error) {
        console.warn(
            "[Sound] Could not create positional audio context:",
            error
        );

        return null;
    }
}

function setClassicSoundAudioParam(
    param,
    value,
    now
) {
    if (!param)
        return;

    if (
        typeof param.setValueAtTime ===
        "function"
    ) {
        param.setValueAtTime(
            value,
            now
        );
    } else {
        param.value =
            value;
    }
}

function updateClassicSoundAudioListener() {
    const context =
        classicSoundAudioContext;

    if (
        !context ||
        !camera
    ) {
        return;
    }

    const listener =
        context.listener;

    if (!listener)
        return;

    const now =
        context.currentTime;

    const position =
        camera.getWorldPosition(
            new THREE.Vector3()
        );

    const forward =
        camera.getWorldDirection(
            new THREE.Vector3()
        );

    const up =
        camera.up
            .clone()
            .applyQuaternion(
                camera.quaternion
            )
            .normalize();

    setClassicSoundAudioParam(
        listener.positionX,
        position.x,
        now
    );

    setClassicSoundAudioParam(
        listener.positionY,
        position.y,
        now
    );

    setClassicSoundAudioParam(
        listener.positionZ,
        position.z,
        now
    );

    setClassicSoundAudioParam(
        listener.forwardX,
        forward.x,
        now
    );

    setClassicSoundAudioParam(
        listener.forwardY,
        forward.y,
        now
    );

    setClassicSoundAudioParam(
        listener.forwardZ,
        forward.z,
        now
    );

    setClassicSoundAudioParam(
        listener.upX,
        up.x,
        now
    );

    setClassicSoundAudioParam(
        listener.upY,
        up.y,
        now
    );

    setClassicSoundAudioParam(
        listener.upZ,
        up.z,
        now
    );

    // Older Web Audio implementations use the legacy listener setters.
    listener.setPosition?.(
        position.x,
        position.y,
        position.z
    );

    listener.setOrientation?.(
        forward.x,
        forward.y,
        forward.z,
        up.x,
        up.y,
        up.z
    );
}

function getLuaSoundEmitterPart(
    sound
) {
    let parent =
        sound?.Parent;

    while (parent) {
        if (
            isA?.(
                parent,
                "BasePart"
            )
        ) {
            return parent;
        }

        parent =
            parent.Parent;
    }

    return null;
}

function ensureLuaSoundSpatialAudio(
    sound
) {
    if (
        sound.__spatialAudio
    ) {
        return sound.__spatialAudio;
    }

    const context =
        getClassicSoundAudioContext();

    const audio =
        sound.__audio;

    if (
        !context ||
        !audio
    ) {
        return null;
    }

    try {
        const source =
            context.createMediaElementSource(
                audio
            );

        const gain =
            context.createGain();

        const panner =
            context.createPanner();

        panner.panningModel =
            "HRTF";

        panner.distanceModel =
            "linear";

        panner.refDistance =
            10;

        panner.maxDistance =
            10000;

        panner.rolloffFactor =
            1;

        source.connect(
            gain
        );

        gain.connect(
            panner
        );

        panner.connect(
            context.destination
        );

        const graph = {
            context,
            source,
            gain,
            panner
        };

        Object.defineProperty(
            sound,
            "__spatialAudio",
            {
                value:
                    graph,

                writable:
                    true,

                enumerable:
                    false,

                configurable:
                    true
            }
        );

        // Volume is now controlled by GainNode, not twice by HTMLAudioElement.
        audio.volume =
            1;

        return graph;
    } catch (error) {
        console.warn(
            "[Sound] Positional audio unavailable; falling back to global playback:",
            error
        );

        return null;
    }
}

function cleanupLuaSoundSpatialAudio(
    sound
) {
    const graph =
        sound?.__spatialAudio;

    if (!graph)
        return;

    try {
        graph.source?.disconnect?.();
    } catch {}

    try {
        graph.gain?.disconnect?.();
    } catch {}

    try {
        graph.panner?.disconnect?.();
    } catch {}

    try {
        sound.__spatialAudio =
            null;
    } catch {}
}

function syncLuaSoundSpatialAudio(
    sound,
    volume,
    wantsPlaying
) {
    let graph =
        sound.__spatialAudio ||
        null;

    if (
        !graph &&
        wantsPlaying
    ) {
        graph =
            ensureLuaSoundSpatialAudio(
                sound
            );
    }

    const audio =
        sound.__audio;

    if (!graph) {
        if (audio)
            audio.volume =
                volume;

        return;
    }

    audio.volume =
        1;

    const {
        context,
        gain,
        panner
    } = graph;

    const now =
        context.currentTime;

    setClassicSoundAudioParam(
        gain.gain,
        volume,
        now
    );

    const emitter =
        getLuaSoundEmitterPart(
            sound
        );

    let position =
        null;

    if (
        emitter &&
        !emitter.__destroyed &&
        isInWorkspace(
            emitter
        )
    ) {
        position =
            getBasePartWorldPosition(
                emitter
            );

        const emitterSize =
            Math.max(
                0.1,
                Number(
                    sound.EmitterSize
                ) || 0.1
            );

        const minDistance =
            Math.max(
                0.1,
                Number(
                    sound.MinDistance
                ) || emitterSize
            );

        const maxDistance =
            Math.max(
                minDistance,
                Number(
                    sound.MaxDistance
                ) || 10000
            );

        panner.refDistance =
            Math.max(
                emitterSize,
                minDistance
            );

        panner.maxDistance =
            maxDistance;

        panner.rolloffFactor =
            1;
    } else {
        // A Sound not attached beneath a BasePart remains global. Keep the
        // emitter exactly on the listener so it has no direction/attenuation.
        position =
            camera.getWorldPosition(
                new THREE.Vector3()
            );

        panner.refDistance =
            1;

        panner.maxDistance =
            1000000000;

        panner.rolloffFactor =
            0;
    }

    if (position) {
        setClassicSoundAudioParam(
            panner.positionX,
            position.x,
            now
        );

        setClassicSoundAudioParam(
            panner.positionY,
            position.y,
            now
        );

        setClassicSoundAudioParam(
            panner.positionZ,
            position.z,
            now
        );

        panner.setPosition?.(
            position.x,
            position.y,
            position.z
        );
    }

    if (
        wantsPlaying &&
        context.state ===
            "suspended"
    ) {
        context.resume?.()
            .catch?.(
                () => {}
            );
    }
}


function createLuaSound() {
    const audio =
        new Audio();

    audio.preload =
        "auto";

    const sound =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "Sound",

                ClassName:
                    "Sound",

                Parent:
                    null,

                Archivable:
                    true,

                // Classic-style Sound properties.
                SoundId:
                    "",

                Volume:
                    0.5,

                Pitch:
                    1,

                Looped:
                    false,

                Playing:
                    false,

                TimePosition:
                    0,

                TimeLength:
                    0,

                IsLoaded:
                    false,

                PlayOnRemove:
                    false,

                // Classic 3D-distance fields. Sounds parented beneath a Part
                // use Web Audio spatialization; non-Part sounds stay global.
                MinDistance:
                    10,

                MaxDistance:
                    10000,

                EmitterSize:
                    10,

                Ended:
                    createLuaSignal(
                        "Sound.Ended"
                    ),

                Stopped:
                    createLuaSignal(
                        "Sound.Stopped"
                    ),

                Loaded:
                    createLuaSignal(
                        "Sound.Loaded"
                    )
            })
        );

    Object.defineProperty(
        sound,
        "__audio",
        {
            value:
                audio,

            writable:
                false,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        sound,
        "__lastSound",
        {
            value: {
                SoundId:
                    "",

                Volume:
                    0.5,

                Pitch:
                    1,

                Looped:
                    false,

                Playing:
                    false,

                TimePosition:
                    0
            },

            writable:
                true,

            enumerable:
                false
        }
    );

    audio.addEventListener(
        "loadedmetadata",
        () => {
            if (
                sound.__destroyed
            ) {
                return;
            }

            sound.IsLoaded =
                true;

            sound.TimeLength =
                Number.isFinite(
                    audio.duration
                )
                    ? audio.duration
                    : 0;

            fireLuaSignal(
                sound.Loaded
            );
        }
    );

    audio.addEventListener(
        "ended",
        () => {
            if (
                sound.__destroyed ||
                sound.Looped
            ) {
                return;
            }

            sound.Playing =
                false;

            sound.__lastSound.Playing =
                false;

            fireLuaSignal(
                sound.Ended
            );

            fireChanged(
                sound,
                "Playing"
            );
        }
    );

    audio.addEventListener(
        "error",
        () => {
            if (
                sound.__destroyed
            ) {
                return;
            }

            sound.IsLoaded =
                false;

            sound.TimeLength =
                0;

            console.warn(
                `[Sound] Could not load "${sound.SoundId}". Sounds must exist inside the Sounds folder.`
            );
        }
    );

    sound.Play =
        (...args) => {
            sound.Playing =
                true;

            syncLuaSound(
                sound,
                true
            );
        };

    sound.play =
        sound.Play;

    sound.Stop =
        (...args) => {
            const wasPlaying =
                !audio.paused ||
                sound.Playing;

            audio.pause();

            try {
                audio.currentTime =
                    0;
            } catch {}

            sound.Playing =
                false;

            sound.TimePosition =
                0;

            sound.__lastSound.Playing =
                false;

            sound.__lastSound.TimePosition =
                0;

            if (wasPlaying) {
                fireLuaSignal(
                    sound.Stopped
                );
            }
        };

    sound.stop =
        sound.Stop;

    sound.Pause =
        (...args) => {
            audio.pause();

            sound.Playing =
                false;

            sound.__lastSound.Playing =
                false;
        };

    sound.pause =
        sound.Pause;

    sound.Resume =
        (...args) => {
            sound.Playing =
                true;

            syncLuaSound(
                sound,
                true
            );
        };

    sound.resume =
        sound.Resume;

    luaSounds.add(
        sound
    );

    return sound;
}

function syncLuaSound(
    sound,
    forcePlay = false
) {
    if (
        !sound ||
        sound.__destroyed
    ) {
        return;
    }

    const audio =
        sound.__audio;

    const last =
        sound.__lastSound;

    if (
        !audio ||
        !last
    ) {
        return;
    }

    // SoundId -> ONLY Sounds/<SoundId>
    const normalizedId =
        normalizeLocalSoundId(
            sound.SoundId
        );

    if (
        normalizedId !==
        sound.SoundId
    ) {
        sound.SoundId =
            normalizedId;
    }

    if (
        normalizedId !==
        last.SoundId
    ) {
        audio.pause();

        const path =
            getLocalSoundPath(
                normalizedId
            );

        if (path) {
            // Start a shared warm request first. This lets multiple Sound
            // instances reuse the browser's media/network cache.
            warmLocalSoundPath(
                path
            );

            audio.preload =
                "auto";

            audio.src =
                path;

            try {
                audio.load();
            } catch {}
        } else {
            audio.removeAttribute(
                "src"
            );

            audio.load();
        }

        sound.IsLoaded =
            false;

        sound.TimeLength =
            0;

        sound.TimePosition =
            0;

        last.SoundId =
            normalizedId;

        last.TimePosition =
            0;

        fireChanged(
            sound,
            "SoundId"
        );
    }

    const volume =
        THREE.MathUtils.clamp(
            Number(
                sound.Volume
            ) || 0,
            0,
            1
        );

    if (
        volume !==
        last.Volume
    ) {
        sound.Volume =
            volume;

        audio.volume =
            volume;

        last.Volume =
            volume;

        fireChanged(
            sound,
            "Volume"
        );
    } else {
        audio.volume =
            volume;
    }

    const pitch =
        THREE.MathUtils.clamp(
            Number(
                sound.Pitch
            ) || 0,
            0.1,
            4
        );

    if (
        pitch !==
        last.Pitch
    ) {
        sound.Pitch =
            pitch;

        audio.playbackRate =
            pitch;

        last.Pitch =
            pitch;

        fireChanged(
            sound,
            "Pitch"
        );
    } else {
        audio.playbackRate =
            pitch;
    }

    const looped =
        Boolean(
            sound.Looped
        );

    if (
        looped !==
        last.Looped
    ) {
        audio.loop =
            looped;

        last.Looped =
            looped;

        fireChanged(
            sound,
            "Looped"
        );
    } else {
        audio.loop =
            looped;
    }

    // A script may assign TimePosition directly.
    const requestedTime =
        Math.max(
            0,
            Number(
                sound.TimePosition
            ) || 0
        );

    if (
        Math.abs(
            requestedTime -
            last.TimePosition
        ) >
        0.05
    ) {
        try {
            audio.currentTime =
                requestedTime;
        } catch {}

        last.TimePosition =
            requestedTime;
    }

    const wantsPlaying =
        forcePlay ||
        Boolean(
            sound.Playing
        );

    syncLuaSoundSpatialAudio(
        sound,
        volume,
        wantsPlaying
    );

    if (
        wantsPlaying &&
        (
            forcePlay ||
            !last.Playing ||
            audio.paused
        )
    ) {
        if (
            audio.src &&
            normalizeLocalSoundId(
                sound.SoundId
            )
        ) {
            audio.play()
                .catch(error => {
                    // Browsers can temporarily block playback before the first
                    // user gesture. Keep Playing=true so a later sync can retry.
                    if (
                        error?.name !==
                        "NotAllowedError"
                    ) {
                        console.warn(
                            "[Sound] Play failed:",
                            error
                        );
                    }
                });
        }

        sound.Playing =
            true;

        last.Playing =
            true;
    } else if (
        !wantsPlaying &&
        last.Playing
    ) {
        audio.pause();

        last.Playing =
            false;

        fireLuaSignal(
            sound.Stopped
        );
    }

    if (
        !audio.paused &&
        Number.isFinite(
            audio.currentTime
        )
    ) {
        sound.TimePosition =
            audio.currentTime;

        last.TimePosition =
            audio.currentTime;
    }

    if (
        Number.isFinite(
            audio.duration
        )
    ) {
        sound.TimeLength =
            audio.duration;
    }
}

function syncLuaSounds() {
    updateClassicSoundAudioListener();

    for (
        const sound of
        [...luaSounds]
    ) {
        syncLuaSound(
            sound
        );
    }
}



// ─── Classic local texture / decal / billboard / particle / explosion system ─
//
// All script-supplied textures are restricted to Textures/ and may use nested
// subdirectories. Examples:
//      "explosion.png"           -> Textures/explosion.png
//      "Materials/brick.png"     -> Textures/Materials/brick.png
//      "Textures/UI/icon.png"    -> Textures/UI/icon.png
//
// External URLs, absolute paths, query strings, fragments, and ".." traversal
// are rejected.
const localTextureCache = new Map();

function normalizeLocalTextureId(value) {
    let id =
        String(
            value ?? ""
        ).trim();

    if (!id)
        return "";

    id =
        id.replace(
            /\\/g,
            "/"
        );

    if (
        id.toLowerCase().startsWith(
            "textures/"
        )
    ) {
        id =
            id.slice(9);
    }

    if (
        /^[a-z][a-z0-9+.-]*:/i.test(id) ||
        id.startsWith("/") ||
        id.includes("..") ||
        id.includes("?") ||
        id.includes("#")
    ) {
        return "";
    }

    const pieces =
        id.split("/")
            .filter(piece =>
                piece &&
                piece !== "."
            );

    if (
        pieces.length === 0
    ) {
        return "";
    }

    return pieces.join("/");
}

function getLocalTexturePath(textureId) {
    const clean =
        normalizeLocalTextureId(
            textureId
        );

    return clean
        ? `Textures/${clean}`
        : "";
}

function getLocalTexture(textureId) {
    const path =
        getLocalTexturePath(
            textureId
        );

    if (!path)
        return null;

    if (
        localTextureCache.has(
            path
        )
    ) {
        return localTextureCache.get(
            path
        );
    }

    const texture =
        texLoader.load(
            path,
            undefined,
            undefined,
            error => {
                console.warn(
                    `[Texture] Could not load "${path}".`,
                    error
                );
            }
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    localTextureCache.set(
        path,
        texture
    );

    return texture;
}

function color3ToThree(
    color,
    fallback = 0xffffff
) {
    if (
        !color ||
        typeof color !== "object"
    ) {
        return new THREE.Color(
            fallback
        );
    }

    return new THREE.Color(
        THREE.MathUtils.clamp(
            Number(color.R) || 0,
            0,
            1
        ),
        THREE.MathUtils.clamp(
            Number(color.G) || 0,
            0,
            1
        ),
        THREE.MathUtils.clamp(
            Number(color.B) || 0,
            0,
            1
        )
    );
}

function getPartVisualMesh(instance) {
    if (
        !instance ||
        !isA(
            instance,
            "BasePart"
        )
    ) {
        return null;
    }

    return instance.__internal?.mesh ||
        null;
}


// ─── Classic R6 clothing / HumanoidDescription renderer ─────────────────────
// Uploaded avatar images are registered by index.html in sessionStorage. Lua
// scripts cannot inject arbitrary data: they can use local Textures/... paths.
const uploadedAvatarAssets =
    new Map();

const DEFAULT_LOCAL_AVATAR_PROFILE = {
    colors: {
        HeadColor: "#ffff82",
        TorsoColor: "#ff8282",
        LeftArmColor: "#ffff82",
        RightArmColor: "#ffff82",
        LeftLegColor: "#ffff82",
        RightLegColor: "#ffff82"
    },
    shirtDataUrl: "",
    pantsDataUrl: ""
};

function sanitizeAvatarHexColor(
    value,
    fallback
) {
    const text =
        String(
            value ??
            ""
        ).trim();

    return /^#[0-9a-f]{6}$/i.test(
        text
    )
        ? text.toLowerCase()
        : fallback;
}

function readLocalAvatarProfile() {
    let raw =
        null;

    try {
        const serialized =
            sessionStorage.getItem(
                "bloxAvatarDescription"
            ) ||
            localStorage.getItem(
                "bloxAvatarDescription"
            ) ||
            "null";

        raw =
            JSON.parse(
                serialized
            );
    } catch (error) {
        console.warn(
            "[Avatar] Could not parse saved avatar description:",
            error
        );
    }

    const profile = {
        colors: {},
        shirtDataUrl: "",
        pantsDataUrl: ""
    };

    for (
        const [key, fallback] of
        Object.entries(
            DEFAULT_LOCAL_AVATAR_PROFILE.colors
        )
    ) {
        profile.colors[key] =
            sanitizeAvatarHexColor(
                raw?.colors?.[key],
                fallback
            );
    }

    const shirtDataUrl =
        String(
            raw?.shirtDataUrl ??
            ""
        );

    const pantsDataUrl =
        String(
            raw?.pantsDataUrl ??
            ""
        );

    if (
        shirtDataUrl.startsWith(
            "data:image/"
        )
    ) {
        uploadedAvatarAssets.set(
            "avatar://shirt",
            shirtDataUrl
        );

        profile.shirtDataUrl =
            shirtDataUrl;
    }

    if (
        pantsDataUrl.startsWith(
            "data:image/"
        )
    ) {
        uploadedAvatarAssets.set(
            "avatar://pants",
            pantsDataUrl
        );

        profile.pantsDataUrl =
            pantsDataUrl;
    }

    return profile;
}

const localAvatarProfile =
    readLocalAvatarProfile();

function avatarProfileColorNumber(
    propertyName,
    fallback
) {
    const hex =
        sanitizeAvatarHexColor(
            localAvatarProfile
                ?.colors
                ?.[propertyName],
            `#${
                Number(fallback)
                    .toString(16)
                    .padStart(6, "0")
            }`
        );

    const parsed =
        Number.parseInt(
            hex.slice(1),
            16
        );

    return Number.isFinite(parsed)
        ? parsed
        : fallback;
}

// Seed the actual local R6 meshes with the selected colors at construction time.
// The HumanoidDescription synchronizer still owns later script-driven changes.
// This also fixes the asynchronous FBX head case: the face texture is created
// with the correct color before head.fbx finishes loading.

const LOCAL_AVATAR_LEFT_LEG_COLOR =

    );

const LOCAL_AVATAR_RIGHT_LEG_COLOR =

    );

function color3FromHexString(
    value,
    fallback = "#ffffff"
) {
    const clean =
        sanitizeAvatarHexColor(
            value,
            fallback
        ).slice(1);

    const number =
        Number.parseInt(
            clean,
            16
        );

    return createColor3(
        (
            number >> 16 & 255
        ) / 255,
        (
            number >> 8 & 255
        ) / 255,
        (
            number & 255
        ) / 255
    );
}

function createLocalPlayerAvatarDescription(
    humanoid
) {
    const description =
        createLuaHumanoidDescription();

    description.Name =
        "HumanoidDescription";

    for (
        const [propertyName, hex] of
        Object.entries(
            localAvatarProfile.colors
        )
    ) {
        description[propertyName] =
            color3FromHexString(
                hex
            );
    }

    description.Shirt =
        localAvatarProfile.shirtDataUrl
            ? "avatar://shirt"
            : "";

    description.Pants =
        localAvatarProfile.pantsDataUrl
            ? "avatar://pants"
            : "";

    description.Parent =
        humanoid;

    humanoid.Description =
        description;

    refreshChildAliases(
        humanoid
    );

    return description;
}

    "right",

const clothingSourceCache =
    new Map();

const clothingFaceTextureCache =
    new Map();

const characterAppearanceMeshState =
    new WeakMap();

const humanoidAppearanceState =
    new WeakMap();

let appearanceAssetRevision =
    0;

function resolveClothingAssetSource(
    value
) {
    const id =
        String(
            value ??
            ""
        ).trim();

    if (!id)
        return "";

    if (
        uploadedAvatarAssets.has(
            id
        )
    ) {
        return uploadedAvatarAssets.get(
            id
        );
    }

    // Lua-facing clothing remains restricted to the emulator's Textures folder.
    return getLocalTexturePath(
        id
    );
}

function getClothingSourceRecord(
    assetId,
    requireTemplate = true
) {
    const resolved =
        resolveClothingAssetSource(
            assetId
        );

    if (!resolved)
        return null;

    const key =
        `${requireTemplate ? "template" : "image"}|${resolved}`;

    if (
        clothingSourceCache.has(
            key
        )
    ) {
        return clothingSourceCache.get(
            key
        );
    }

    const record = {
        key,
        resolved,
        image: null,
        loaded: false,
        valid: false,
        error: false
    };

    clothingSourceCache.set(
        key,
        record
    );

    const image =
        new Image();

    image.onload =
        () => {
            record.image =
                image;

            record.loaded =
                true;

            record.valid =
                !requireTemplate ||
                (
                    image.naturalWidth ===
                        CLASSIC_R6_TEMPLATE_WIDTH &&
                    image.naturalHeight ===
                        CLASSIC_R6_TEMPLATE_HEIGHT
                );

            if (
                requireTemplate &&
                !record.valid
            ) {
                console.warn(
                    `[Clothing] Classic R6 templates must be ${CLASSIC_R6_TEMPLATE_WIDTH}x${CLASSIC_R6_TEMPLATE_HEIGHT}; got ${image.naturalWidth}x${image.naturalHeight}.`
                );
            }

            appearanceAssetRevision++;
        };

    image.onerror =
        error => {
            record.loaded =
                true;

            record.error =
                true;

            record.valid =
                false;

            appearanceAssetRevision++;

            console.warn(
                `[Clothing] Could not load "${assetId}".`,
                error
            );
        };

    image.src =
        resolved;

    return record;
}

function colorValueToColor3(
    value
) {
    if (!value)
        return null;

    if (
        typeof value ===
            "object" &&
        "R" in value &&
        "G" in value &&
        "B" in value
    ) {
        return createColor3(
            value.R,
            value.G,
            value.B
        );
    }

    if (
        typeof value ===
            "object" &&
        value.Color &&
        "R" in value.Color
    ) {
        return createColor3(
            value.Color.R,
            value.Color.G,
            value.Color.B
        );
    }

    return null;
}

function findDirectChildOfClass(
    parent,
    className
) {
    return getLuaChildren(
        parent
    ).find(child =>
        child &&
        !child.__destroyed &&
        child.ClassName ===
            className
    ) ||
    null;
}

function findClassicR6Part(
    character,
    names
) {
    for (
        const name of
        names
    ) {
        const part =
            character.FindFirstChild?.(
                name
            );

        if (
            part &&
            isA(
                part,
                "BasePart"
            )
        ) {
            return part;
        }
    }

    return null;
}

function getHumanoidClassicR6Parts(
    humanoid
) {
    const character =
        humanoid?.Parent;

    if (
        !character ||
        character.__destroyed
    ) {
        return null;
    }

    const parts = {
        Head:
            findClassicR6Part(
                character,
                ["Head"]
            ),

        Torso:
            findClassicR6Part(
                character,
                ["Torso"]
            ),

        "Left Arm":
            findClassicR6Part(
                character,
                ["Left Arm", "LeftArm"]
            ),

        "Right Arm":
            findClassicR6Part(
                character,
                ["Right Arm", "RightArm"]
            ),

        "Left Leg":
            findClassicR6Part(
                character,
                ["Left Leg", "LeftLeg"]
            ),

        "Right Leg":
            findClassicR6Part(
                character,
                ["Right Leg", "RightLeg"]
            )
    };

    // Clothing is only valid on a recognisable classic R6 body. The Head is
    // optional for clothing, matching the user's requested NPC requirement.
    parts.__canWearClothing =
        Boolean(
            parts.Torso &&
            parts["Left Arm"] &&
            parts["Right Arm"] &&
            parts["Left Leg"] &&
            parts["Right Leg"]
        );

    return parts;
}

function getResolvedHumanoidAppearance(
    humanoid
) {
    const character =
        humanoid?.Parent;

    if (!character)
        return null;

    const description =
        humanoid.Description ||
        findDirectChildOfClass(
            humanoid,
            "HumanoidDescription"
        );

    const bodyColors =
        findDirectChildOfClass(
            character,
            "BodyColors"
        );

    const shirt =
        findDirectChildOfClass(
            character,
            "Shirt"
        );

    const pants =
        findDirectChildOfClass(
            character,
            "Pants"
        );

    const shirtGraphic =
        findDirectChildOfClass(
            character,
            "ShirtGraphic"
        );

    const colorProperties = [
        "HeadColor",
        "TorsoColor",
        "LeftArmColor",
        "RightArmColor",
        "LeftLegColor",
        "RightLegColor"
    ];

    const colors = {};

    for (
        const propertyName of
        colorProperties
    ) {
        colors[propertyName] =
            colorValueToColor3(
                description?.[propertyName]
            ) ||
            colorValueToColor3(
                bodyColors?.[propertyName]
            ) ||
            null;
    }

    return {
        description,
        bodyColors,
        shirt,
        pants,
        shirtGraphic,
        colors,
        shirtAsset:
            String(
                description?.Shirt ||
                shirt?.ShirtTemplate ||
                ""
            ),
        pantsAsset:
            String(
                description?.Pants ||
                pants?.PantsTemplate ||
                ""
            ),
        shirtGraphicAsset:
            String(
                description?.ShirtGraphic ||
                shirtGraphic?.Graphic ||
                ""
            )
    };
}

function color3Snapshot(
    color
) {
    if (!color)
        return "";

    return [
        Number(color.R) || 0,
        Number(color.G) || 0,
        Number(color.B) || 0
    ].map(value =>
        value.toFixed(5)
    ).join(",");
}

function colorsApproximatelyEqual(
    a,
    b
) {
    if (!a || !b)
        return false;

    return (
        Math.abs(
            (Number(a.R) || 0) -
            (Number(b.R) || 0)
        ) < 0.0001 &&
        Math.abs(
            (Number(a.G) || 0) -
            (Number(b.G) || 0)
        ) < 0.0001 &&
        Math.abs(
            (Number(a.B) || 0) -
            (Number(b.B) || 0)
        ) < 0.0001
    );
}

function applyAppearanceColorToPart(
    part,
    color
) {
    if (!part || !color)
        return;

    if (
        colorsApproximatelyEqual(
            part.Color,
            color
        )
    ) {
        return;
    }

    part.Color =
        createColor3(
            color.R,
            color.G,
            color.B
        );

    part.BrickColor =
        BrickColorApi.new(
            part.Color
        );

    // Appearance owns the body color while a description/BodyColors supplies
    // one. Update the underlying un-clothed materials immediately and advance
    // the normal Part/character color caches so the next frame cannot tint a
    // composed shirt/pants texture by the body color.
    const mesh =
        getPartVisualMesh(
            part
        );

    const localHex =
        color3ToHex(
            part.Color
        );

    const normalSyncHex =
        new THREE.Color(
            Number(part.Color.R) || 0,
            Number(part.Color.G) || 0,
            Number(part.Color.B) || 0
        ).getHex();

    const meshState =
        mesh
            ? characterAppearanceMeshState.get(
                mesh
            )
            : null;

    const recolorMaterials =
        materials => {
            for (
                const material of
                materials || []
            ) {
                material?.color?.setHex(
                    localHex
                );
            }
        };

    if (meshState?.active) {
        recolorMaterials(
            meshState.originalMaterials
        );
    } else if (
        mesh?.userData
            ?.setSkinColor
    ) {
        mesh.userData.setSkinColor(
            localHex
        );
    } else if (mesh) {
        const materials =
            Array.isArray(mesh.material)
                ? mesh.material
                : [mesh.material];

        recolorMaterials(
            materials
        );
    }

    const binding =
        characterVisualBindings.find(entry =>
            entry?.instance === part
        );

    if (binding) {
        if (
            mesh?.userData
                ?.setSkinColor
        ) {
            mesh.userData.setSkinColor(
                localHex
            );
        }

        binding.lastColor =
            localHex;
    }

    if (part.__last) {
        part.__last.Color =
            normalSyncHex;

        part.__last.BrickColorName =
            part.BrickColor?.Name ||
            part.__last.BrickColorName;
    }

    fireChanged(
        part,
        "Color"
    );

    fireChanged(
        part,
        "BrickColor"
    );
}

function getAppearanceMeshState(
    mesh
) {
    let state =
        characterAppearanceMeshState.get(
            mesh
        );

    if (state)
        return state;

    const materials =
        Array.isArray(
            mesh.material
        )
            ? mesh.material.slice()
            : [mesh.material];

    state = {
        originalMaterials:
            materials,
        customMaterials:
            [],
        active:
            false
    };

    characterAppearanceMeshState.set(
        mesh,
        state
    );

    return state;
}

function releaseAppearanceTextureReference(
    material
) {
    const key =
        material?.userData
            ?.bloxAppearanceTextureKey;

    if (!key)
        return;

    const entry =
        clothingFaceTextureCache.get(
            key
        );

    if (entry) {
        entry.refs =
            Math.max(
                0,
                entry.refs -
                1
            );

        entry.lastUsed =
            performance.now();
    }
}

function disposeAppearanceCustomMaterials(
    state
) {
    for (
        const material of
        state.customMaterials
    ) {
        releaseAppearanceTextureReference(
            material
        );

        material?.dispose?.();
    }

    state.customMaterials.length =
        0;
}

function restoreAppearanceMesh(
    mesh
) {
    const state =
        characterAppearanceMeshState.get(
            mesh
        );

    if (
        !state ||
        !state.active
    ) {
        return;
    }

    disposeAppearanceCustomMaterials(
        state
    );

    mesh.material =
        state.originalMaterials.slice();

    state.active =
        false;
}

function cssHexFromColor3(
    color
) {
    return `#${color3ToHex(
        color ||
        createColor3(1,1,1)
    ).toString(16).padStart(6, "0")}`;
}

function getCachedCompositeClothingTexture(
    cacheKey,
    width,
    height,
    baseColor,
    layers
) {
    if (
        clothingFaceTextureCache.has(
            cacheKey
        )
    ) {
        const entry =
            clothingFaceTextureCache.get(
                cacheKey
            );

        entry.lastUsed =
            performance.now();

        return entry;
    }

    const resolvedLayers = [];

    for (
        const layer of
        layers
    ) {
        if (!layer.assetId)
            continue;

        const record =
            getClothingSourceRecord(
                layer.assetId,
                layer.requireTemplate !==
                    false
            );

        if (
            !record ||
            !record.loaded
        ) {
            return null;
        }

        if (
            !record.valid ||
            !record.image
        ) {
            continue;
        }

        resolvedLayers.push({
            ...layer,
            image:
                record.image
        });
    }

    if (
        resolvedLayers.length ===
        0
    ) {
        return null;
    }

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        Math.max(
            1,
            width
        );

    canvas.height =
        Math.max(
            1,
            height
        );

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        cssHexFromColor3(
            baseColor
        );

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (
        const layer of
        resolvedLayers
    ) {
        if (layer.crop) {
            ctx.drawImage(
                layer.image,
                layer.crop.x,
                layer.crop.y,
                layer.crop.w,
                layer.crop.h,
                0,
                0,
                canvas.width,
                canvas.height
            );
        } else {
            // ShirtGraphic: the whole uploaded/local image is placed on the
            // front torso face above pants and shirt.
            ctx.drawImage(
                layer.image,
                0,
                0,
                layer.image.naturalWidth,
                layer.image.naturalHeight,
                0,
                0,
                canvas.width,
                canvas.height
            );
        }
    }

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.minFilter =
        THREE.LinearFilter;

    texture.magFilter =
        THREE.LinearFilter;

    const entry = {
        texture,
        refs: 0,
        lastUsed:
            performance.now()
    };

    clothingFaceTextureCache.set(
        cacheKey,
        entry
    );

    return entry;
}

function makeAppearanceFaceMaterial(
    textureEntry,
    transparency
) {
    const opacity =
        1 -
        THREE.MathUtils.clamp(
            Number(
                transparency
            ) || 0,
            0,
            1
        );

    const material =
        new THREE.MeshStandardMaterial({
            map:
                textureEntry.texture,
            color:
                0xffffff,
            roughness:
                0.3,
            metalness:
                0.0,
            transparent:
                opacity < 1,
            opacity,
            alphaTest:
                0
        });

    material.userData =
        material.userData || {};

    return material;
}

function applyClothingToBodyPart(
    partName,
    part,
    appearance
) {
    const mesh =
        getPartVisualMesh(
            part
        );

    if (
        !mesh ||
        !mesh.isMesh
    ) {
        return;
    }

    const state =
        getAppearanceMeshState(
            mesh
        );

    const crops =
        CLASSIC_R6_TEMPLATE_CROPS[
            partName
        ];

    if (!crops) {
        restoreAppearanceMesh(
            mesh
        );
        return;
    }

    const isTorso =
        partName ===
        "Torso";

    const isArm =
        partName ===
            "Left Arm" ||
        partName ===
            "Right Arm";

    const isLeg =
        partName ===
            "Left Leg" ||
        partName ===
            "Right Leg";

    const hasShirt =
        Boolean(
            appearance.shirtAsset
        );

    const hasPants =
        Boolean(
            appearance.pantsAsset
        );

    const hasGraphic =
        Boolean(
            appearance.shirtGraphicAsset
        ) &&
        isTorso;

    const shouldClothe =
        (
            isTorso &&
            (
                hasPants ||
                hasShirt ||
                hasGraphic
            )
        ) ||
        (
            isArm &&
            hasShirt
        ) ||
        (
            isLeg &&
            hasPants
        );

    if (!shouldClothe) {
        restoreAppearanceMesh(
            mesh
        );
        return;
    }

    disposeAppearanceCustomMaterials(
        state
    );

    const materials =
        state.originalMaterials.slice();

    const baseColor =
        part.Color ||
        createColor3(1,1,1);

    for (
        let faceIndex = 0;
        faceIndex <
            CLASSIC_R6_FACE_ORDER.length;
        faceIndex++
    ) {
        const faceName =
            CLASSIC_R6_FACE_ORDER[
                faceIndex
            ];

        const crop =
            crops[faceName];

        if (!crop)
            continue;

        const layers = [];

        // Torso layering: base body -> pants -> shirt -> ShirtGraphic.
        if (
            isTorso &&
            hasPants
        ) {
            layers.push({
                assetId:
                    appearance.pantsAsset,
                crop,
                requireTemplate:
                    true
            });
        }

        if (
            (
                isTorso ||
                isArm
            ) &&
            hasShirt
        ) {
            layers.push({
                assetId:
                    appearance.shirtAsset,
                crop,
                requireTemplate:
                    true
            });
        }

        if (
            hasGraphic &&
            faceName ===
                "front"
        ) {
            layers.push({
                assetId:
                    appearance.shirtGraphicAsset,
                crop:
                    null,
                requireTemplate:
                    false
            });
        }

        if (
            isLeg &&
            hasPants
        ) {
            layers.push({
                assetId:
                    appearance.pantsAsset,
                crop,
                requireTemplate:
                    true
            });
        }

        if (
            layers.length ===
            0
        ) {
            continue;
        }

        const cacheKey = [
            partName,
            faceName,
            cssHexFromColor3(
                baseColor
            ),
            ...layers.map(layer =>
                `${layer.assetId}|${
                    layer.crop
                        ? `${layer.crop.x},${layer.crop.y},${layer.crop.w},${layer.crop.h}`
                        : "full"
                }`
            )
        ].join("::");

        const textureEntry =
            getCachedCompositeClothingTexture(
                cacheKey,
                crop.w,
                crop.h,
                baseColor,
                layers
            );

        if (!textureEntry)
            continue;

        textureEntry.refs++;
        textureEntry.lastUsed =
            performance.now();

        const material =
            makeAppearanceFaceMaterial(
                textureEntry,
                part.Transparency
            );

        material.userData
            .bloxAppearanceTextureKey =
                cacheKey;

        materials[faceIndex] =
            material;

        state.customMaterials.push(
            material
        );
    }

    if (
        state.customMaterials.length ===
        0
    ) {
        mesh.material =
            state.originalMaterials.slice();

        state.active =
            false;

        return;
    }

    mesh.material =
        materials;

    state.active =
        true;
}

function cleanupUnusedClothingTextures() {
    // Keep the cache bounded but never dispose a texture still referenced by a
    // live character material.
    if (
        clothingFaceTextureCache.size <=
        256
    ) {
        return;
    }

    const unused =
        [...clothingFaceTextureCache.entries()]
            .filter(([, entry]) =>
                entry.refs <=
                0
            )
            .sort((a, b) =>
                a[1].lastUsed -
                b[1].lastUsed
            );

    for (
        const [key, entry] of
        unused
    ) {
        if (
            clothingFaceTextureCache.size <=
            192
        ) {
            break;
        }

        entry.texture?.dispose?.();

        clothingFaceTextureCache.delete(
            key
        );
    }
}

function makeHumanoidAppearanceKey(
    humanoid,
    parts,
    appearance
) {
    return [
        appearanceAssetRevision,
        getLuaInstanceId(
            humanoid
        ),
        parts.__canWearClothing
            ? 1
            : 0,
        ...[
            "Head",
            "Torso",
            "Left Arm",
            "Right Arm",
            "Left Leg",
            "Right Leg"
        ].map(name =>
            parts[name]
                ? getLuaInstanceId(
                    parts[name]
                )
                : 0
        ),
        ...Object.values(
            appearance.colors
        ).map(
            color3Snapshot
        ),
        ...[
            "Head",
            "Torso",
            "Left Arm",
            "Right Arm",
            "Left Leg",
            "Right Leg"
        ].map(name =>
            color3Snapshot(
                parts[name]?.Color
            )
        ),
        appearance.shirtAsset,
        appearance.pantsAsset,
        appearance.shirtGraphicAsset
    ].join("|");
}

function syncHumanoidAppearances() {
    for (
        const humanoid of
        luaHumanoids
    ) {
        if (
            !humanoid ||
            humanoid.__destroyed
        ) {
            continue;
        }

        const parts =
            getHumanoidClassicR6Parts(
                humanoid
            );

        if (!parts)
            continue;

        const appearance =
            getResolvedHumanoidAppearance(
                humanoid
            );

        if (!appearance)
            continue;

        const colorMap = {
            Head:
                appearance.colors.HeadColor,
            Torso:
                appearance.colors.TorsoColor,
            "Left Arm":
                appearance.colors.LeftArmColor,
            "Right Arm":
                appearance.colors.RightArmColor,
            "Left Leg":
                appearance.colors.LeftLegColor,
            "Right Leg":
                appearance.colors.RightLegColor
        };

        for (
            const [partName, color] of
            Object.entries(
                colorMap
            )
        ) {
            if (
                parts[partName] &&
                color
            ) {
                applyAppearanceColorToPart(
                    parts[partName],
                    color
                );
            }
        }

        // If the required Torso/arms/legs are incomplete, body colors can still
        // apply to existing pieces but clothing is deliberately skipped.
        if (
            !parts.__canWearClothing
        ) {
            // If an R6 body becomes incomplete after previously wearing an
            // outfit, restore the remaining body meshes to their normal Part
            // materials. Clothing never stays active on a partial NPC rig.
            for (
                const partName of
                [
                    "Torso",
                    "Left Arm",
                    "Right Arm",
                    "Left Leg",
                    "Right Leg"
                ]
            ) {
                const mesh =
                    parts[partName]
                        ? getPartVisualMesh(
                            parts[partName]
                        )
                        : null;

                if (mesh?.isMesh) {
                    restoreAppearanceMesh(
                        mesh
                    );
                }
            }

            humanoidAppearanceState.delete(
                humanoid
            );

            continue;
        }

        const key =
            makeHumanoidAppearanceKey(
                humanoid,
                parts,
                appearance
            );

        const previous =
            humanoidAppearanceState.get(
                humanoid
            );

        if (
            previous?.key ===
            key
        ) {
            continue;
        }

        humanoidAppearanceState.set(
            humanoid,
            { key }
        );

        applyClothingToBodyPart(
            "Torso",
            parts.Torso,
            appearance
        );

        applyClothingToBodyPart(
            "Left Arm",
            parts["Left Arm"],
            appearance
        );

        applyClothingToBodyPart(
            "Right Arm",
            parts["Right Arm"],
            appearance
        );

        applyClothingToBodyPart(
            "Left Leg",
            parts["Left Leg"],
            appearance
        );

        applyClothingToBodyPart(
            "Right Leg",
            parts["Right Leg"],
            appearance
        );

        cleanupUnusedClothingTextures();
    }
}

// ─── Decal ───────────────────────────────────────────────────────────────────
function createLuaDecal() {
    const decal =
        finalizeLuaInstance(
            Mutable({
                Name:
                    "Decal",

                ClassName:
                    "Decal",

                Parent:
                    null,

                Archivable:
                    true,

                Texture:
                    "",

                Face:
                    "Front",

                Transparency:
                    0,

                Color3:
                    createColor3(
                        1,
                        1,
                        1
                    )
            })
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:
                0xffffff,

            transparent:
                true,

            opacity:
                1,

            side:
                THREE.DoubleSide,

            depthWrite:
                false,

            polygonOffset:
                true,

            polygonOffsetFactor:
                -2,

            polygonOffsetUnits:
                -2
        });

    const visual =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1,
                1
            ),
            material
        );

    visual.visible =
        false;

    visual.renderOrder =
        3;

    Object.defineProperty(
        decal,
        "__decalVisual",
        {
            value:
                visual,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        decal,
        "__decalMaterial",
        {
            value:
                material,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        decal,
        "__lastDecal",
        {
            value: {
                Parent:
                    null,

                Texture:
                    "",

                Face:
                    "",

                Transparency:
                    NaN,

                Color:
                    ""
            },

            writable:
                true,

            enumerable:
                false
        }
    );

    luaDecals.add(
        decal
    );

    return decal;
}

function syncLuaDecals() {
    for (
        const decal of
        [...luaDecals]
    ) {
        if (
            !decal ||
            decal.__destroyed
        ) {
            continue;
        }

        const parent =
            decal.Parent;

        const mesh =
            getPartVisualMesh(
                parent
            );

        const visual =
            decal.__decalVisual;

        const material =
            decal.__decalMaterial;

        const last =
            decal.__lastDecal;

        if (
            !visual ||
            !material ||
            !last
        ) {
            continue;
        }

        if (
            last.Parent !==
            parent
        ) {
            if (
                visual.parent
            ) {
                visual.parent.remove(
                    visual
                );
            }

            if (mesh) {
                mesh.add(
                    visual
                );
            }

            last.Parent =
                parent;
        }

        if (
            !mesh ||
            !isInWorkspace(
                parent
            )
        ) {
            visual.visible =
                false;

            continue;
        }

        const normalizedTexture =
            normalizeLocalTextureId(
                decal.Texture
            );

        if (
            normalizedTexture !==
            decal.Texture
        ) {
            decal.Texture =
                normalizedTexture;
        }

        if (
            normalizedTexture !==
            last.Texture
        ) {
            material.map =
                normalizedTexture
                    ? getLocalTexture(
                        normalizedTexture
                    )
                    : null;

            material.needsUpdate =
                true;

            last.Texture =
                normalizedTexture;

            fireChanged(
                decal,
                "Texture"
            );
        }

        const transparency =
            THREE.MathUtils.clamp(
                Number(
                    decal.Transparency
                ) || 0,
                0,
                1
            );

        if (
            transparency !==
            last.Transparency
        ) {
            decal.Transparency =
                transparency;

            material.opacity =
                1 -
                transparency;

            last.Transparency =
                transparency;

            fireChanged(
                decal,
                "Transparency"
            );
        }

        const color =
            color3ToThree(
                decal.Color3
            );

        const colorKey =
            color.getHexString();

        if (
            colorKey !==
            last.Color
        ) {
            material.color.copy(
                color
            );

            last.Color =
                colorKey;

            fireChanged(
                decal,
                "Color3"
            );
        }

        const face =
            String(
                decal.Face ||
                "Front"
            );

        const size =
            parent.Size ||
            createVector3(
                1,
                1,
                1
            );

        const w =
            Math.max(
                0.001,
                Number(size.X) || 1
            );

        const h =
            Math.max(
                0.001,
                Number(size.Y) || 1
            );

        const d =
            Math.max(
                0.001,
                Number(size.Z) || 1
            );

        const epsilon =
            0.008;

        visual.position.set(
            0,
            0,
            0
        );

        visual.rotation.set(
            0,
            0,
            0
        );

        switch (face) {
            case "Back":
                visual.position.z =
                    d * 0.5 +
                    epsilon;

                visual.scale.set(
                    w,
                    h,
                    1
                );
                break;

            case "Right":
                visual.position.x =
                    w * 0.5 +
                    epsilon;

                visual.rotation.y =
                    Math.PI * 0.5;

                visual.scale.set(
                    d,
                    h,
                    1
                );
                break;

            case "Left":
                visual.position.x =
                    -w * 0.5 -
                    epsilon;

                visual.rotation.y =
                    -Math.PI * 0.5;

                visual.scale.set(
                    d,
                    h,
                    1
                );
                break;

            case "Top":
                visual.position.y =
                    h * 0.5 +
                    epsilon;

                visual.rotation.x =
                    -Math.PI * 0.5;

                visual.scale.set(
                    w,
                    d,
                    1
                );
                break;

            case "Bottom":
                visual.position.y =
                    -h * 0.5 -
                    epsilon;

                visual.rotation.x =
                    Math.PI * 0.5;

                visual.scale.set(
                    w,
                    d,
                    1
                );
                break;

            case "Front":
            default:
                visual.position.z =
                    -d * 0.5 -
                    epsilon;

                visual.rotation.y =
                    Math.PI;

                visual.scale.set(
                    w,
                    h,
                    1
                );
                break;
        }

        if (
            face !==
            last.Face
        ) {
            last.Face =
                face;

            fireChanged(
                decal,
                "Face"
            );
        }

        visual.visible =
            Boolean(
                normalizedTexture
            ) &&
            transparency <
                1;
    }
}
