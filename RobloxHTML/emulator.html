function initializeClassicCoreUi() {
    classicChatPrompt?.addEventListener(
        "mousedown",
        event => {
            event.preventDefault();
            openClassicChatInput();
        }
    );

    classicChatBar?.addEventListener(
        "mousedown",
        event => {
            if (
                event.target === classicChatBar
            ) {
                event.preventDefault();
                openClassicChatInput();
            }
        }
    );

    classicChatInput?.addEventListener(
        "keydown",
        event => {
            event.stopPropagation();

            if (event.key === "Enter") {
                event.preventDefault();
                submitClassicChatInput();
            } else if (event.key === "Escape") {
                event.preventDefault();
                closeClassicChatInput();
            }
        }
    );

    classicChatInput?.addEventListener(
        "keyup",
        event =>
            event.stopPropagation()
    );

    toolsButton?.addEventListener(
        "click",
        event => {
            event.stopPropagation();
            const open =
                classicToolsMenu.style.display ===
                "block";
            closeClassicTopMenus();
            if (!open) {
                renderClassicToolsMenu();
                classicToolsMenu.style.display =
                    "block";
            }
        }
    );

    insertButton?.addEventListener(
        "click",
        event => {
            event.stopPropagation();
            const open =
                classicInsertMenu.style.display ===
                "block";
            closeClassicTopMenus();
            if (!open) {
                renderClassicInsertMenu();
                classicInsertMenu.style.display =
                    "block";
            }
        }
    );

    document.addEventListener(
        "mousedown",
        event => {
            if (
                !classicToolsMenu?.contains(event.target) &&
                !classicInsertMenu?.contains(event.target) &&
                event.target !== toolsButton &&
                event.target !== insertButton
            ) {
                closeClassicTopMenus();
            }
        }
    );

    renderClassicHotbar();
    renderClassicLeaderboard();
}

function syncClassicCoreUi() {
    syncStarterPackToBackpack();
    syncClassicBackpackItemStorage();

    const hotbarSignature =
        getClassicHotbarSignature();

    if (
        hotbarSignature !==
        classicHotbarSignature
    ) {
        renderClassicHotbar();
    }

    // ValueObjects can change every frame, but rebuilding DOM at render rate is
    // unnecessary. Ten updates per second keeps the 2008 list responsive without
    // adding measurable layout churn to the game loop.
    const now =
        performance.now();

    if (
        now - classicLeaderboardLastRender >=
        100
    ) {
        classicLeaderboardLastRender =
            now;
        renderClassicLeaderboard();
    }
}

function coerceValueObjectValue(
    className,
    value
) {
    if (className === "StringValue")
        return String(
            value ?? ""
        );

    if (className === "BoolValue")
        return Boolean(value);

    if (className === "IntValue")
        return Math.trunc(
            Number(value) || 0
        );

    if (className === "NumberValue")
        return Number(value) || 0;

    if (className === "ObjectValue")
        return value ?? null;

    if (
        className ===
        "Vector3Value"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "X" in value &&
            "Y" in value &&
            "Z" in value
        ) {
            return value;
        }

        return createVector3();
    }

    if (
        className ===
        "CFrameValue"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "X" in value &&
            "Y" in value &&
            "Z" in value
        ) {
            return value;
        }

        return createCFrame();
    }

    if (
        className ===
        "Color3Value"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            "R" in value &&
            "G" in value &&
            "B" in value
        ) {
            return value;
        }

        return createColor3();
    }

    if (
        className ===
        "BrickColorValue"
    ) {
        if (
            value &&
            typeof value ===
                "object" &&
            typeof value.Name ===
                "string" &&
            typeof value.Number ===
                "number"
        ) {
            return value;
        }

        return BrickColorApi.new(
            value ??
            "Medium stone grey"
        );
    }

    return value;
}

function cloneClassicValueObjectValue(
    className,
    value
) {
    switch (className) {
        case "Vector3Value":
            return createVector3(
                value?.X,
                value?.Y,
                value?.Z
            );

        case "CFrameValue":
            return makeCFrameFromQuaternion(
                Number(value?.X) || 0,
                Number(value?.Y) || 0,
                Number(value?.Z) || 0,
                quaternionFromCFrameValue(
                    value
                )
            );

        case "Color3Value":
            return createColor3(
                value?.R,
                value?.G,
                value?.B
            );

        case "BrickColorValue":
            return BrickColorApi.new(
                value?.Name ??
                value?.Number ??
                "Medium stone grey"
            );

        default:
            return value;
    }
}

function valueObjectSnapshot(
    className,
    value
) {
    if (
        className ===
        "Vector3Value"
    ) {
        return [
            Number(value?.X) || 0,
            Number(value?.Y) || 0,
            Number(value?.Z) || 0
        ].join("|");
    }

    if (
        className ===
        "CFrameValue"
    ) {
        const q =
            quaternionFromCFrameValue(
                value
            );

        return [
            Number(value?.X) || 0,
            Number(value?.Y) || 0,
            Number(value?.Z) || 0,
            q.x,
            q.y,
            q.z,
            q.w
        ].join("|");
    }

    if (
        className ===
        "Color3Value"
    ) {
        return [
            Number(value?.R) || 0,
            Number(value?.G) || 0,
            Number(value?.B) || 0
        ].join("|");
    }

    if (
        className ===
        "BrickColorValue"
    ) {
        return `${
            value?.Number ??
            ""
        }|${
            value?.Name ??
            ""
        }`;
    }

    return value;
}

function createLuaValue(className) {
    let initial =
        null;

    if (
        className ===
        "StringValue"
    ) {
        initial =
            "";
    } else if (
        className ===
        "BoolValue"
    ) {
        initial =
            false;
    } else if (
        className ===
            "IntValue" ||
        className ===
            "NumberValue"
    ) {
        initial =
            0;
    } else if (
        className ===
        "Vector3Value"
    ) {
        initial =
            createVector3();
    } else if (
        className ===
        "CFrameValue"
    ) {
        initial =
            createCFrame();
    } else if (
        className ===
        "Color3Value"
    ) {
        initial =
            createColor3();
    } else if (
        className ===
        "BrickColorValue"
    ) {
        initial =
            BrickColorApi.new(
                "Medium stone grey"
            );
    }

    const instance =
        finalizeLuaInstance(
            Mutable({
                Name:
                    className,

                ClassName:
                    className,

                Parent:
                    null,

                Archivable:
                    true,

                Value:
                    initial
            })
        );

    Object.defineProperty(
        instance,
        "__lastValue",
        {
            value:
                initial,

            writable:
                true,

            enumerable:
                false
        }
    );

    Object.defineProperty(
        instance,
        "__lastValueSnapshot",
        {
            value:
                valueObjectSnapshot(
                    className,
                    initial
                ),

            writable:
                true,

            enumerable:
                false
        }
    );

    luaValueObjects.add(
        instance
    );

    return instance;
}

        }

        humanoid,

            writable:
                true,

            enumerable:
                false
        }
    );

    humanoid.TakeDamage =
        (...args) => {
            const amount =
                getNumberArg(
                    args,
                    0
                ) || 0;

            if (
                humanoid.__dead ||
                amount <= 0
            ) {
                return;
            }

            // Classic ForceField protection. Direct Health assignment remains
            // script-controlled; TakeDamage() is the protected API.
            if (
                isForceFieldProtectedInstance(
                    humanoid

            ) {
                return;
            }

            humanoid.Health =
                Math.max(
                    0,

    humanoid.takeDamage =
        humanoid.TakeDamage;

    humanoid.ApplyDescription =

                    value !==
                        humanoid &&
                    value.ClassName ===
                        "HumanoidDescription"
                ) ||
                null;

            if (!description)

            humanoid.Description =
                description;

            if (
                !description.Parent
            ) {

                    humanoid;

                refreshChildAliases(
                    humanoid
                );

    humanoid.applyDescription =
        humanoid.ApplyDescription;

    humanoid.GetAppliedDescription =
        (...args) =>
