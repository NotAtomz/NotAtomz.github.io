<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="Textures/E-logo.png">
    <title>Blox Emulation</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-image: url("Textures/UI/background.png");
            background-repeat: repeat;
            background-size: 150px 150px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #333;
        }

        /* =========================
           MAIN ROBLOX-STYLE WINDOW
           ========================= */

        .window {
            width: 430px;

            background: #eeeeee;

            border: 1px solid #777777;

            box-shadow:
                0 0 0 1px #ffffff inset,
                0 2px 6px rgba(0, 0, 0, 0.45);

            border-radius: 3px;
        }

        /* Classic blue/gray header bar */
        .window-header {
            height: 28px;

            display: flex;
            align-items: center;

            padding: 0 9px;

            color: white;

            font-weight: bold;
            font-size: 11px;

            text-shadow:
                0 -1px 0 rgba(0,0,0,0.7);

            background:
                linear-gradient(
                    to bottom,
                    #8798aa 0%,
                    #6d7f91 48%,
                    #596b7d 52%,
                    #687a8c 100%
                );

            border-bottom: 1px solid #3f4d5a;

            border-radius: 2px 2px 0 0;
        }

        .window-body {
            padding: 25px 30px 30px 30px;
            text-align: center;

            background:
                linear-gradient(
                    to bottom,
                    #f5f5f5,
                    #dddddd
                );
        }

        /* =========================
           LOGO
           ========================= */

        .titleimg {
            width: 300px;
            max-width: 100%;
            margin-bottom: 18px;
        }

        .desc {
            margin: 0 0 20px 0;

            color: #222222;

            font-size: 11px;
        }

        /* =========================
           FORM AREA
           ========================= */

        .form-box {
            text-align: left;

            background: #ffffff;

            border: 1px solid #aaaaaa;

            padding: 13px;

            box-shadow:
                0 1px 0 #ffffff,
                inset 0 1px 2px rgba(0,0,0,0.08);
        }

        .field-label {
            display: block;

            margin-bottom: 5px;

            font-weight: bold;
            font-size: 11px;

            color: #444444;
        }

        /* Hide default ugly browser chooser */
        .file-input {
            display: none;
        }

        .file-row {
            display: flex;
            width: 100%;
        }

        /* =========================
           CLASSIC ROBLOX BUTTON
           ========================= */

        .classic-button {
            height: 26px;

            padding: 0 12px;

            font-family: Verdana, Arial, sans-serif;

            font-size: 11px;
            font-weight: bold;

            color: #333333;

            cursor: pointer;

            border: 1px solid #777777;

            border-radius: 3px;

            text-shadow: 0 1px 0 #ffffff;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #eeeeee 45%,
                    #d6d6d6 55%,
                    #eeeeee 100%
                );

            box-shadow:
                inset 0 1px 0 #ffffff,
                0 1px 1px rgba(0,0,0,0.2);
        }

        .classic-button:hover {
            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #f5f5f5 45%,
                    #dddddd 55%,
                    #f4f4f4 100%
                );
        }

        .classic-button:active {
            background:
                linear-gradient(
                    to bottom,
                    #cccccc,
                    #eeeeee
                );

            box-shadow:
                inset 0 1px 2px rgba(0,0,0,0.35);

            padding-top: 1px;
        }

        /* =========================
           FILE NAME FIELD
           ========================= */

        .selected-file {
            flex: 1;

            height: 24px;

            line-height: 24px;

            margin-left: 6px;

            padding: 0 7px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            color: #555555;

            background: white;

            border: 1px solid #999999;

            box-shadow:
                inset 1px 1px 2px rgba(0,0,0,0.15);

            font-size: 11px;
        }

        .selected-file.empty {
            color: #999999;
        }

        /* =========================
           ENTER BUTTON
           ========================= */

        .enter-area {
            margin-top: 15px;
            text-align: right;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .help-button {
            min-width: 72px;
        }

        .enter-button {
            min-width: 100px;
        }

        /*
            Old Roblox-style blue action button.
        */
        .enter-button:not(:disabled) {
            color: white;

            text-shadow:
                0 -1px 0 rgba(0,0,0,0.8);

            border-color: #35536d;

            background:
                linear-gradient(
                    to bottom,
                    #7fa6c7 0%,
                    #5f88ab 48%,
                    #416b8f 52%,
                    #5681a5 100%
                );

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.45),
                0 1px 1px rgba(0,0,0,0.25);
        }

        .enter-button:not(:disabled):hover {
            background:
                linear-gradient(
                    to bottom,
                    #91b6d4 0%,
                    #719abb 48%,
                    #507da0 52%,
                    #6994b5 100%
                );
        }

        .enter-button:not(:disabled):active {
            background:
                linear-gradient(
                    to bottom,
                    #416b8f,
                    #6d97b8
                );

            box-shadow:
                inset 0 1px 3px rgba(0,0,0,0.5);

            padding-top: 1px;
        }

        .enter-button:disabled {
            color: #999999;

            cursor: default;

            text-shadow: 0 1px 0 white;

            background:
                linear-gradient(
                    to bottom,
                    #eeeeee,
                    #cccccc
                );

            border-color: #999999;
        }

        /* =========================
           LITTLE OLD-WEBSITE FOOTER
           ========================= */

        .hint {
            margin-top: 12px;

            color: #777777;

            font-size: 10px;

            text-align: left;
        }

        .hint strong {
            color: #4c6f91;
        }

        /* Prevent giant stretching on small screens */
        @media (max-width: 500px) {
            .window {
                width: calc(100% - 30px);
            }

            .window-body {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="window">

        <div class="window-header">
            Blox Emulation
        </div>

        <div class="window-body">

            <img
                class="titleimg"
                src="Textures/UI/title.png"
                alt="Blox Emulator"
            >

            <p class="desc">
                Select a Lua or Luau file to create a classic Roblox world.
            </p>

            <div class="form-box">

                <label class="field-label">
                    Place Script:
                </label>

                <div class="file-row">

                    <label
                        for="fileInput"
                        class="classic-button"
                    >
                        Choose File
                    </label>

                    <input
                        type="file"
                        class="file-input"
                        id="fileInput"
                        accept=".lua,.luau,text/x-lua,text/plain"
                    >

                    <div
                        class="selected-file empty"
                        id="selectedFile"
                    >
                        No file selected
                    </div>

                </div>

                <div class="enter-area action-row">

                    <button
                        class="classic-button help-button"
                        id="helpButton"
                        type="button"
                    >
                        Help
                    </button>

                    <button
                        class="classic-button enter-button"
                        id="enterButton"
                        disabled
                    >
                        Enter
                    </button>

                </div>

                <div class="hint">
                    Supported formats:
                    <strong>.lua</strong>
                    and
                    <strong>.luau</strong>
                </div>

            </div>

        </div>

    </div>


    <script>

        const fileInput =
            document.getElementById("fileInput");

        const enterButton =
            document.getElementById("enterButton");

        const selectedFile =
            document.getElementById("selectedFile");

        const helpButton =
            document.getElementById("helpButton");


        let selectedLuaFile = null;


        helpButton.addEventListener(
            "click",
            () => {
                window.location.href =
                    "help.html";
            }
        );


        fileInput.addEventListener(
            "change",
            () => {

                selectedLuaFile =
                    fileInput.files[0] || null;


                if (!selectedLuaFile) {

                    selectedFile.textContent =
                        "No file selected";

                    selectedFile.classList.add(
                        "empty"
                    );

                    enterButton.disabled = true;

                    return;
                }


                if (
                    !/\.(lua|luau)$/i.test(
                        selectedLuaFile.name
                    )
                ) {

                    alert(
                        "Please select a .lua or .luau file."
                    );

                    fileInput.value = "";

                    selectedLuaFile = null;

                    selectedFile.textContent =
                        "No file selected";

                    selectedFile.classList.add(
                        "empty"
                    );

                    enterButton.disabled = true;

                    return;
                }


                selectedFile.textContent =
                    selectedLuaFile.name;

                selectedFile.classList.remove(
                    "empty"
                );

                enterButton.disabled = false;

            }
        );


        enterButton.addEventListener(
            "click",
            async () => {

                if (!selectedLuaFile) {

                    alert(
                        "Please select a Lua file first."
                    );

                    return;
                }


                enterButton.disabled = true;

                enterButton.textContent =
                    "Loading...";


                try {

                    const source =
                        await selectedLuaFile.text();


                    sessionStorage.setItem(
                        "bloxScriptSource",
                        source
                    );


                    sessionStorage.setItem(
                        "bloxScriptName",
                        selectedLuaFile.name
                    );


                    window.location.href =
                        "emulator.html";

                }
                catch (error) {

                    console.error(error);

                    alert(
                        "Failed to read the selected Lua file."
                    );


                    enterButton.disabled = false;

                    enterButton.textContent =
                        "Enter";

                }

            }
        );

    </script>

</body>
</html>>>
