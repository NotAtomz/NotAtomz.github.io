// ── Skybox — inverted box, 6 MeshBasicMaterial faces, always works ────────────
// ── Skybox — manually selected pixel region ─────────────────────────────────
function makeSkyFaceMat(
    img,
    point1,
    point2,
    point3,
    point4,
    rotation = 0
) {
    // Calculate crop bounds from the four points
    const left   = Math.min(point1.x, point2.x, point3.x, point4.x);
    const right  = Math.max(point1.x, point2.x, point3.x, point4.x);
    const top    = Math.min(point1.y, point2.y, point3.y, point4.y);
    const bottom = Math.max(point1.y, point2.y, point3.y, point4.y);

    const width = right - left;
    const height = bottom - top;

    const c = document.createElement("canvas");

    // Swap canvas dimensions for 90 / 270 rotations
    if (rotation === 90 || rotation === 270) {
        c.width = height;
        c.height = width;
    } else {
        c.width = width;
        c.height = height;
    }

    const ctx = c.getContext("2d");

    ctx.save();

    // Move origin to center
    ctx.translate(c.width / 2, c.height / 2);

    // Rotation
    ctx.rotate(THREE.MathUtils.degToRad(rotation));

    // Draw selected region
    ctx.drawImage(
        img,

        // Source rectangle
        left,
        top,
        width,
        height,

        // Destination rectangle
        -width / 2,
        -height / 2,
        width,
        height
    );

    ctx.restore();

    const tex = new THREE.CanvasTexture(c);

    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    return new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        fog: false
    });
}

const texLoader = new THREE.TextureLoader();
function loadTex(path, repeatX, repeatY) {
    const t = texLoader.load(path);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
    return t;
}

/**
 * createPart(w, h, d, x, y, z, color, dynamic)
 *   w, h, d — full dimensions
 *   x, y, z   — world centre
 *   options   — property object (see defaults below)
 *
 * Options:
 *   color        hex        0x4d7845   base colour
 *   anchored     bool       true       anchored = never moves (like Roblox Anchored)
 *   canCollide   bool       true       whether other bodies collide with it
 *   friction     number     0.7
 *   restitution  number     0.1        bounciness
 *   mass         number     1.0        only used when anchored=false
 *   castShadow   bool       true
 *   visible      bool       true
 */
function createPart(w, h, d, x, y, z, options = {}) {
    const {
        color       = 0xc8a97a,
        anchored    = true,
        canCollide  = true,
        friction    = 0.7,
        restitution = 0.1,
        mass        = 1.0,
        castShadow  = true,
        visible     = true,
    } = options;

    const sideMat = new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
    const topMat  = new THREE.MeshStandardMaterial({
        map: loadTex("Textures/top-stud.jpg", w, d),
        color, roughness: 0.7, transparent: false, alphaTest: 0,
    });
    const botMat  = new THREE.MeshStandardMaterial({
        map: loadTex("Textures/bottom-stud.jpeg", w, d),
        color, roughness: 0.8, transparent: false, alphaTest: 0,
    });

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        [sideMat, sideMat, topMat, botMat, sideMat, sideMat]
    );
    mesh.position.set(x, y, z);
    mesh.castShadow  = castShadow;
    mesh.receiveShadow = true;
    mesh.visible     = visible;
    scene.add(mesh);

    // Rapier rigid body
    const bodyDesc = anchored
    ? RAPIER.RigidBodyDesc.fixed()
    : RAPIER.RigidBodyDesc.dynamic();
bodyDesc.setTranslation(x, y, z);
    const body = world.createRigidBody(bodyDesc);

    const colDesc = RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2)
    .setMass(mass) // <-- Change this line
    .setFriction(friction)
    .setRestitution(restitution)
    .setSensor(!canCollide);
    world.createCollider(colDesc, body);

    const part = { mesh, body, w, h, d, anchored, canCollide };
    if (!anchored) physObjects.push(part);
    return part;
}

/**
 * editPart(part, options)
 *   part     — the object returned by createPart
 *   options  — any subset of the properties you want to change:
 *     color, anchored, canCollide, friction, restitution, visible, castShadow
 *
 * Example:
 *   const brick = createPart(4,4,4, 10,2,0, { anchored: false, color: 0xff0000 });
 *   editPart(brick, { anchored: true, color: 0x00ff00, canCollide: false });
 */
function editPart(part, options = {}) {
    const { mesh, body, w, h, d } = part;

    // Color
    if (options.color !== undefined) {
        mesh.material.forEach(m => {
            if (m.color) m.color.setHex(options.color);
        });
    }

    // Visible
    if (options.visible !== undefined) mesh.visible = options.visible;

    // Cast shadow
    if (options.castShadow !== undefined) mesh.castShadow = options.castShadow;

    // Anchored — swap body type
    if (options.anchored !== undefined && options.anchored !== part.anchored) {
        const pos = body.translation();
        const newDesc = options.anchored
            ? RAPIER.RigidBodyDesc.fixed()
            : RAPIER.RigidBodyDesc.dynamic().setAdditionalMass(1.0);
        newDesc.setTranslation(pos.x, pos.y, pos.z);
        if (!options.anchored) newDesc.lockRotations();

        // Remove old body and recreate
        const oldColliders = [];
        for (let i = 0; i < body.numColliders(); i++) oldColliders.push(body.collider(i));
        world.removeRigidBody(body);

        part.body = world.createRigidBody(newDesc);

        // Re-add collider with existing or new settings
        const colDesc = RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2)
            .setFriction(options.friction  ?? 0.7)
            .setRestitution(options.restitution ?? 0.1)
            .setSensor(options.canCollide !== undefined ? !options.canCollide : !part.canCollide);
        world.createCollider(colDesc, part.body);

        part.anchored = options.anchored;

        // Add to / remove from sync list
        const idx = physObjects.indexOf(part);
        if (!options.anchored && idx === -1) physObjects.push(part);
        if (options.anchored  && idx !== -1) physObjects.splice(idx, 1);
    }

    // CanCollide (sensor toggle) — only if body wasn't just recreated
    if (options.canCollide !== undefined && options.canCollide !== part.canCollide
        && options.anchored === undefined) {
        for (let i = 0; i < part.body.numColliders(); i++) {
            part.body.collider(i).setSensor(!options.canCollide);
        }
        part.canCollide = options.canCollide;
    }

    // Friction / restitution on existing colliders
    if ((options.friction !== undefined || options.restitution !== undefined)
        && options.anchored === undefined) {
        for (let i = 0; i < part.body.numColliders(); i++) {
            const c = part.body.collider(i);
            if (options.friction    !== undefined) c.setFriction(options.friction);
            if (options.restitution !== undefined) c.setRestitution(options.restitution);
        }
    }

    return part;
}

    pitch:  0.42,          // radians, clamped below

    // Zoom

    zoomSteps: [2, 5, 9, 14, 20, 28, 38, 50, 65, 80, 100, 125, 155, 190, 230, 275, 330, 400], // distances like classic Roblox
    zoomCurrent: 20,       // smoothly interpolated distance

    // At max zoom-in the look target is near head, at max zoom-out it rises
    targetOffset: new THREE.Vector3(),       // smoothed look-at offset
    currentPos:   new THREE.Vector3(),       // smoothed camera position

    // Whether RMB is held for orbiting
    orbiting: false,
};

// Precompute per-step vertical offsets (head-level at 0, higher when far)
function zoomVerticalOffset(dist) {
    // map [2, 38] → [0, 4]
    const minD = 2, maxD = 400;
    const t = (dist - minD) / (maxD - minD);
    return THREE.MathUtils.lerp(0, 4, t);
}

    if (!zoomSoundBuffer) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    const src = audioCtx.createBufferSource();
    src.buffer = zoomSoundBuffer;
    src.connect(audioCtx.destination);
    src.start(0);
}

// Right-mouse to orbit (classic Roblox behaviour)
canvas.addEventListener("mousedown", e => {
    if (e.button === 2) {
        CAM.orbiting = true;
        canvas.requestPointerLock();
        e.preventDefault();
    }
});
canvas.addEventListener("mouseup", e => {
    if (e.button === 2) {
        CAM.orbiting = false;
        document.exitPointerLock();
    }
});
canvas.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("mousemove", e => {
    if (!CAM.orbiting) return;
    if (document.pointerLockElement !== canvas) return;

    const sensitivity = 0.0025;
    CAM.yaw   += e.movementX * sensitivity;
    CAM.pitch  -= e.movementY * sensitivity;

    // Classic Roblox pitch limits
    const maxPitch = Math.PI / 2 - 0.08;
    const minPitch = -1;   // can't go far below the horizon
    CAM.pitch = THREE.MathUtils.clamp(CAM.pitch, minPitch, maxPitch);
});

// Scroll to zoom
window.addEventListener("wheel", e => {
    const dir = e.deltaY > 0 ? 5 : -5;
    const prev = CAM.zoomCurrent;
    CAM.zoomCurrent = THREE.MathUtils.clamp(CAM.zoomCurrent + dir, 2, 60);
    if (CAM.zoomCurrent !== prev) playZoomSound();
    e.preventDefault();
}, { passive: false });

// ─── Player setup ────────────────────────────────────────────────────────────
function normalizeR6Model(object) {
    object.traverse(child => {
        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) child.material.needsUpdate = true;
        }
    });
    const headTex = new THREE.TextureLoader().load("Textures/Head.png");
    headTex.colorSpace = THREE.SRGBColorSpace;
    const headMat = new THREE.MeshStandardMaterial({ map: headTex });

    object.traverse(child => {
        if (child.isMesh && Array.isArray(child.material)) {
            child.material[1] = headMat;
            child.material[1].needsUpdate = true;
        }
    });
    const box  = new THREE.Box3().setFromObject(object);
    const size = box.getSize(new THREE.Vector3());

    if (size.y > 0) {
        const scale = 5 / size.y;
        object.scale.multiplyScalar(scale);
        const scaledBox = new THREE.Box3().setFromObject(object);
        object.position.y -= scaledBox.min.y;
    }
    return object;
}

                return mesh;
            }

// Ground check via ray cast downward from player centre
// Ground check via a short ray starting just below the player's feet
// Ground check — ignores the player's own capsule
function checkGrounded() {
    const pos = playerBody.translation();

    // Bottom of the player's capsule
    const feetY = pos.y - PLAYER_HALF_H - PLAYER_RADIUS;

    const ray = new RAPIER.Ray(
        {
            x: pos.x,
            y: feetY + 0.05,
            z: pos.z
        },
        {
            x: 0,
            y: -1,
            z: 0
        }
    );

    // Check only slightly below the feet.
    // The final argument excludes the player's rigid body.
    const hit = world.castRay(
        ray,
        0.15,
        true,
        undefined,   // filterFlags
        undefined,   // filterGroups
        undefined,   // excludeCollider
        playerBody   // excludeRigidBody
    );

    return hit !== null;
}

function updatePlayer() {
    if (!player) return;

    playerState.grounded = checkGrounded();

    const forward = new THREE.Vector3(-Math.sin(CAM.yaw), 0, Math.cos(CAM.yaw));
    const right   = new THREE.Vector3(Math.cos(CAM.yaw), 0, Math.sin(CAM.yaw));

    const dir = new THREE.Vector3();
    if (keys.w) dir.sub(forward);
    if (keys.s) dir.add(forward);
    if (keys.d) dir.add(right);
    if (keys.a) dir.sub(right);

    const curVel = playerBody.linvel();

    let vx = 0, vz = 0;
    if (dir.lengthSq() > 0) {
        dir.normalize();
        vx = dir.x * playerState.moveSpeed;
        vz = dir.z * playerState.moveSpeed;

        // Face movement direction
        // Face movement direction using the shortest rotation path
const targetRot = Math.atan2(dir.x, dir.z);

let angleDifference = targetRot - player.rotation.y;

// Normalize angle difference to [-PI, PI]
angleDifference = Math.atan2(
    Math.sin(angleDifference),
    Math.cos(angleDifference)
);

// Smoothly rotate toward target
player.rotation.y += angleDifference * 0.18;
    }
    // --- Add this block for the walking sound ---
    const isWalking = dir.lengthSq() > 0 && playerState.grounded;
    if (isWalking) {
        if (walkSound.paused) walkSound.play().catch(() => {}); // catch prevents autoplay errors before user interacts
    } else {
        if (!walkSound.paused) walkSound.pause();
    }

    // Apply horizontal velocity, preserve vertical (gravity handled by Rapier)
    playerBody.setLinvel({ x: vx, y: curVel.y, z: vz }, true);

    // Jump
    if (keys.space && playerState.grounded) {
        playerBody.setLinvel({ x: vx, y: playerState.jumpPower, z: vz }, true);
        playJumpSound();
        keys.space = false; // consume so it doesn't multi-jump
    }

    // Sync Three.js root to Rapier body
    const t = playerBody.translation();
    // Body centre is at capsule centre; player feet = centre - PLAYER_HALF_H - PLAYER_RADIUS
    playerRoot.position.set(t.x, t.y - PLAYER_HALF_H - PLAYER_RADIUS, t.z);
// --- 2008 Animations ---
if (limbs.leftArm && limbs.rightArm && limbs.leftLeg && limbs.rightLeg) {

    // Correct base idle rotations
    const baseLA = THREE.MathUtils.degToRad(-225);
    const baseRA = THREE.MathUtils.degToRad(-45);
    const baseLL = THREE.MathUtils.degToRad(180);
    const baseRL = THREE.MathUtils.degToRad(180);

    // Persistent jump blend
    if (typeof window.jumpBlend === "undefined") {
        window.jumpBlend = 0;
    }

    // Persistent limb momentum
    if (typeof window.animVelocity === "undefined") {
        window.animVelocity = {
            leftArm: 0,
            rightArm: 0,
            leftLeg: 0,
            rightLeg: 0
        };
    }

    // Jump transition
    const blendSpeed = 0.15;

    const targetBlend = playerState.grounded ? 0 : 1;

    window.jumpBlend = THREE.MathUtils.lerp(
        window.jumpBlend,
        targetBlend,
        blendSpeed
    );

    // --------------------------------
    // WALK / IDLE SWING
    // --------------------------------

    // Normal walking
    const walkAngle = THREE.MathUtils.degToRad(25);
    const walkSpeed = 9;

    // Very subtle idle movement
    const idleAngle = THREE.MathUtils.degToRad(3);
    const idleSpeed = 1.5;

    const walkSwing =
        Math.sin(clock.getElapsedTime() * walkSpeed) * walkAngle;

    const idleSwing =
        Math.sin(clock.getElapsedTime() * idleSpeed) * idleAngle;

    // Walking uses 25 degrees, idle uses 3 degrees
    const swing = isWalking ? walkSwing : idleSwing;

    // Walking only contributes while grounded
    const walkAmount =
        isWalking ? (1 - window.jumpBlend) : 0;

    // Idle only contributes while grounded and not walking
    const idleAmount =
        !isWalking ? (1 - window.jumpBlend) : 0;

    // Jump pose
    const jumpLA =
        THREE.MathUtils.degToRad(-180) * window.jumpBlend;

    const jumpRA =
        THREE.MathUtils.degToRad(-180) * window.jumpBlend;

    // Target rotations
    const targetLA =
        baseLA +
        (swing * (walkAmount + idleAmount)) +
        jumpLA;

    const targetRA =
        baseRA -
        (swing * (walkAmount + idleAmount)) +
        jumpRA;

    const targetLL =
        baseLL -
        (swing * (walkAmount + idleAmount));

    const targetRL =
        baseRL +
        (swing * (walkAmount + idleAmount));

    // --------------------------------
    // MOMENTUM
    // --------------------------------

    const acceleration = 10;
    const damping = 0.01;

    // Left arm
    window.animVelocity.leftArm +=
        (targetLA - limbs.leftArm.rotation.x) * acceleration;

    window.animVelocity.leftArm *= damping;

    limbs.leftArm.rotation.x +=
        window.animVelocity.leftArm;

    // Right arm
    window.animVelocity.rightArm +=
        (targetRA - limbs.rightArm.rotation.x) * acceleration;

    window.animVelocity.rightArm *= damping;

    limbs.rightArm.rotation.x +=
        window.animVelocity.rightArm;

    // Left leg
    window.animVelocity.leftLeg +=
        (targetLL - limbs.leftLeg.rotation.x) * acceleration;

    window.animVelocity.leftLeg *= damping;

    limbs.leftLeg.rotation.x +=
        window.animVelocity.leftLeg;

    // Right leg
    window.animVelocity.rightLeg +=
        (targetRL - limbs.rightLeg.rotation.x) * acceleration;

    window.animVelocity.rightLeg *= damping;

    limbs.rightLeg.rotation.x +=
        window.animVelocity.rightLeg;
}
}

// Sync dynamic parts (non-player physics objects) to Three.js
function syncPhysObjects() {
    for (const { body, mesh } of physObjects) {
        const t = body.translation();
        const r = body.rotation();
        mesh.position.set(t.x, t.y, t.z);
        mesh.quaternion.set(r.x, r.y, r.z, r.w);
    }
}

function updateCamera(delta) {
    if (!player) return;

    const vOffset = zoomVerticalOffset(CAM.zoomCurrent);

    const headCollider = playerRoot.getObjectByName("head");
    const trackY = headCollider
        ? playerRoot.position.y + headCollider.position.y
        : playerRoot.position.y + playerState.height * 0.55;

    const lookTarget = new THREE.Vector3(
        playerRoot.position.x,
        trackY + vOffset,
        playerRoot.position.z
    );

    CAM.targetOffset.lerp(lookTarget, 1 - Math.pow(0.001, delta));

    const dist = CAM.zoomCurrent;
    const camX = CAM.targetOffset.x - dist * Math.sin(CAM.yaw);
    const camY = CAM.targetOffset.y - dist * Math.sin(CAM.pitch);
    const camZ = CAM.targetOffset.z + dist * Math.cos(CAM.yaw);

    CAM.currentPos.lerp(new THREE.Vector3(camX, camY, camZ), 1 - Math.pow(0.0001, delta));
    camera.position.copy(CAM.currentPos);
    camera.lookAt(CAM.targetOffset);
}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);

    // Step Rapier physics
    world.step();

    updatePlayer();
    syncPhysObjects();
    updateCamera(delta);
    renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
